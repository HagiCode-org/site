localesRoot: src/i18n/locales
repoRoot: .
baseLocale: en-US
targetLocales:
  - fr-FR
  - it-IT
  - de-DE
  - es-ES
  - bg-BG
  - cs-CZ
  - da-DK
  - nl-NL
  - fi-FI
  - el-GR
  - hu-HU
  - id-ID
  - ja-JP
  - ko-KR
  - nb-NO
  - pl-PL
  - pt-BR
  - pt-PT
  - ro-RO
  - ru-RU
  - zh-CN
  - zh-Hant
  - es-419
  - sv-SE
  - th-TH
  - tr-TR
  - uk-UA
  - vi-VN
doctor:
  excludedDirectories:
    - .astro
    - .git
    - dist
    - node_modules
  textFileExtensions:
    - .astro
    - .css
    - .js
    - .json
    - .md
    - .mjs
    - .ts
    - .tsx
    - .yaml
    - .yml
  allowlist:
    legacy-language-change-call: []
    legacy-locale-path:
      - src/pages/en/index.astro
      - src/pages/en/about/index.astro
      - src/pages/en/container/index.astro
      - src/pages/en/desktop/index.astro
    legacy-ui-language-literal: []
    legacy-ui-language-union: []
