showcase:
  title: 最新產品介面
  description: 從提案執行、工作階段看板、Token 分析到工作區與成就進度，首頁現在直接展示與 docs 網站同步維護的最新精選產品截圖。
  controls:
    previous: 上一張
    next: 下一張
    current: 目前主圖
    railLabel: 產品截圖導覽
    selectPrefix: 切換到：
    activeState: 目前顯示
    previewState: 點擊預覽
    imageUnavailable: 圖片暫時無法顯示
    openFullscreen: 全螢幕檢視：
    openFullscreenHint: 點擊查看大圖
    closeFullscreen: 關閉全螢幕
  screenshots:
    proposalWorkflow:
      title: 提案執行總覽
      description: 把 OpenSpec 提案從工作流程階段、執行結果到工作階段側欄放在同一個畫面中，方便快速理解目前變更已推進到哪一步。
      alt: HagiCode 提案執行完成畫面截圖，展示工作流程階段、執行結果與工作階段側欄
    sessionBoard:
      title: 工作階段看板與場景編排
      description: 待處理、進行中與已封存的工作階段並排呈現，搭配右側場景任務卡，讓多 Agent 推進狀態一眼可見。
      alt: HagiCode 工作階段看板畫面截圖，展示待處理、進行中、已封存欄位與場景任務卡
    tokenAnalytics:
      title: 即時 Token 分析
      description: 在同一塊面板中追蹤吞吐速率、呼叫歷史與累計用量，方便在平行執行時掌握成本與節奏。
      alt: HagiCode Token 分析面板截圖，展示吞吐速率、呼叫歷史與累計用量
    workspaceManagement:
      title: 工作區與 Vault 管理
      description: 集中管理使用者 Vault、系統 Vault 與 code-server 入口，讓多人環境下的工作區維護更清楚。
      alt: HagiCode Vault 工作區管理畫面截圖，展示使用者 Vault、系統 Vault 與 code-server 操作
    achievementProgress:
      title: 成就與成長進度
      description: 把每日與全域成長、生命週期指標和線上趨勢整合到同一個儀表板中，讓長期使用回饋更具持續性。
      alt: HagiCode 成就進度儀表板截圖，展示每日與全域成長指標和趨勢
