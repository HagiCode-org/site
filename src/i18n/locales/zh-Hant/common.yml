showcase:
  title: "看看 HagiCode 如何運作"
  description: "十個產品區域，全部採用英文暗色介面，涵蓋五套暗色主題：工作階段看板、提案、Agent、技能、Vault、用量、成就、Git 與排程計畫。"
  controls:
    previous: 上一張
    next: 下一張
    current: 目前主圖
    railLabel: 產品截圖導覽
    selectPrefix: 切換到：
    activeState: 目前顯示
    previewState: 點擊預覽
    imageUnavailable: 圖片暫時無法顯示
    openFullscreen: 全螢幕檢視：
    openFullscreenHint: 點擊查看大圖
    closeFullscreen: 關閉全螢幕
  screenshots:
    sessionBoard:
      title: "工作階段看板"
      description: "提案、執行中的 Agent 與已封存的工作放在同一塊看板上，等待、執行、完成一目了然。"
      alt: "HagiCode 工作階段看板，包含提案與審閱、執行、已封存三欄，右側是專案快速操作面板"
    proposalWorkflow:
      title: "提案工作流程"
      description: "每個變更都從提案開始：規格增量、有序任務與階段進度，在程式碼執行之前先由你審閱。"
      alt: "HagiCode 提案對話，顯示規格增量表格、任務清單與提案階段進度"
    agentRoster:
      title: "Agent 陣容"
      description: "為每個 Agent 配上頭像與職責，依背後的 Agent CLI 分組，再決定由誰接下一個任務。"
      alt: "HagiCode Agents 工作區，十二個 Agent 依 Claude Code、Codex、OpenCode、Gemini、Hermes 分組"
    agentCli:
      title: "Agent CLI 管理"
      description: "Claude Code、Codex、GitHub Copilot、OpenCode 等並排列出，附上版本號與健康檢查結果。"
      alt: "HagiCode AgentCLI 管理表格，列出各個支援的 Agent CLI 及其版本與健康狀態"
    skillsGallery:
      title: "技能圖庫"
      description: "瀏覽可信的技能來源，比較安裝量，並一眼看出哪些技能已安裝在本機。"
      alt: "HagiCode 技能圖庫，列出技能的來源、安裝量與「已在本機安裝」標記"
    vault:
      title: "Vault"
      description: "把團隊手冊、契約與參考資料放進 Vault，直接在應用程式內瀏覽檔案並預覽內容。"
      alt: "HagiCode Vault 瀏覽器，包含 Vault 清單、檔案樹與一份審閱規範的 Markdown 預覽"
    tokenUsage:
      title: "Token 用量"
      description: "今日 Token 與費用常駐狀態列，等級階梯標示這一天用得有多滿。"
      alt: "HagiCode 狀態列顯示今日 Token 總量與費用，彈出層列出從 Breath 到 Radiance 的用量等級"
    achievements:
      title: "成就大廳"
      description: "每日目標、線上成長與終身成就，把穩定的推進變成看得見的進度。"
      alt: "HagiCode 成就大廳，顯示每日完成率、今日收益與線上成長欄"
    gitManagement:
      title: "Git 管理"
      description: "在同一個面板檢視專案各儲存庫的分支、同步狀態與未提交變更，並完成提交、推送或拉取。"
      alt: "HagiCode 專案 Git 分頁，列出四個儲存庫的分支與同步狀態以及儲存庫簡報"
    scheduledPlans:
      title: "排程計畫"
      description: "用日曆安排提案與 HagiTask：夜間稽核、每週草稿、一次性的發布準備。"
      alt: "HagiCode 排程計畫十月日曆，包含每晚、每週與一次性計畫"
