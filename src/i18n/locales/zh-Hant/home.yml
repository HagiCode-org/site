features:
  showcase:
    title: "為真實開發工作而生"
    subtitle: "提案讓每次改動可審閱，多 Agent 並行讓工作持續推進"
  smart:
    title: 智慧
    subtitle: "先提案、再執行：每次改動都有據可查"
    artifactsTitle: "每次改動留下的東西"
    description: "HagiCode 不只是對著程式碼聊天：先審閱專案的真實現況，寫下提案與 Spec 變更，嚴格驗證後再依任務執行，最後歸檔，把這次的經驗留給下一次改動。"
    workflow:
      review:
        label: "審閱"
        desc: "對照專案現況、現有 spec 與相關程式碼，先確認真實脈絡。"
      scaffold:
        label: "腳手架"
        desc: "選定 change-id，並產生 proposal.md、tasks.md、design.md 草稿。"
      spec:
        label: "Spec"
        desc: "把變更拆成 capability 與 spec delta，明確新增或修改的要求。"
      design:
        label: "設計"
        desc: "跨系統或有取捨時補充 design.md，提前寫清結構與權衡。"
      tasks:
        label: "任務"
        desc: "將實作切成有順序、可驗證、可並行的任務清單。"
      validate:
        label: "驗證"
        desc: "以 strict 模式執行 openspec validate，先讓提案驗證通過。"
      apply:
        label: "執行"
        desc: "讀取 proposal、design、tasks，依序實作並持續勾選完成項。"
      archive:
        label: "歸檔"
        desc: "變更完成後歸檔 proposal 資產，把經驗沉澱回長期規範。"
    paused: 已暫停 - 點擊節點切換
  convenient:
    title: 高效
    subtitle: "多 Agent、多實例並行，讓額度不再空等"
    traditional: "一個接一個排隊"
    multiThread: "並排推進，互不等待"
    description: "Claude Code、Codex、GitHub Copilot、OpenCode、Hermes 等受支援的 Agent CLI 都能同時執行多個實例。提案、修復、審查各占一條車道，某個結果慢了，也不會拖住其餘工作。"
    agentMatrix:
      title: 並行執行矩陣
      badge: "示例編排"
      status: "示意：每條車道都在推進，互不阻塞"
      agents:
        claude:
          name: Claude Code
          role: 提案 / 評審
          instances:
            - Spec 起草
            - 設計校對
            - 歸檔檢查
        codex:
          name: Codex
          role: 實作 / 修復
          instances:
            - 實作功能 A
            - 實作功能 B
            - 回歸修復
        router:
          name: Qwen · GLM
          role: 分析 / 補充
          instances:
            - 問題排查
            - 文案優化
            - 知識提煉
    cliBay:
      title: "可裝備的 Agent CLI"
      hint: "點選一個，看它如何接入"
      chain:
        agent: "Agent"
        model: "相容模型"
      labels:
        whatItIs: "它是什麼"
        models: "模型與登入"
        runsOn: "執行位置"
        start: "上手方式"
        questions: "在 HagiCode 裡提問"
        strengths: "擅長"
        compare: "閱讀完整對比"
  interesting:
    title: 有趣
    subtitle: "每個 Agent 都有臉、有個性，還有一個屬於它的世界"
    description: "為每個 Agent 配上頭像、Trait 與 Soul，再選一套團隊習慣的說法：同一支陣容，可以是英雄與副本，也可以是牧場、朝堂或蜂巢；等級與獎盃會隨工作即時回饋。"
