workflowSteps:
  eyebrow: "運作方式"
  title: "每次改動，都走同樣三步"
  description: "沒有漫無邊際的聊天紀錄。每次改動都會變成可審閱的提案、可追溯的執行，以及可重複使用的知識。"
  loopLabel: "歸檔沉澱為下一次提案的起點"
  steps:
    proposal:
      label: "提案"
      description: "描述你想做的改動。Hagicode 先查看儲存庫，起草附規格與任務清單的提案，你可以在動程式碼之前閱讀並修正。"
    execution:
      label: "執行"
      description: "確認方案後，Agent 依任務逐項執行，可在 Claude Code、Codex、GitHub Copilot 等之間並行，完成一項勾選一項。"
    archive:
      label: "歸檔"
      description: "完成的改動會歸檔回你的規範裡，下一次提案會先讀取這些規範，從團隊已累積的經驗出發。"
