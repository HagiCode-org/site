features:
  showcase:
    title: 三大核心特性
    subtitle: 重新定義你的 AI 程式設計體驗
  smart:
    badge: 智慧
    title: 智慧
    subtitle: OpenSpec 工作流程，提升 AI 程式設計效率
    efficiency: 效率提升
    traditional: 傳統方式
    hagicode: Hagicode
    description: 從想法到歸檔共 9 個階段的完整提案流程，全程都有 AI 協助，讓你的程式設計效率提升 3 倍。
    workflow:
      review:
        label: 評審
        desc: 自動評審
      scaffold:
        label: Scaffold
        desc: Choose a change-id and create proposal.md, tasks.md, and design.md when needed.
      spec:
        label: Spec
        desc: Translate the change into capability-level spec deltas with explicit requirements.
      design:
        label: Design
        desc: Capture architecture and trade-offs in design.md when the change spans systems.
      tasks:
        label: 任務
        desc: 任務拆解
      validate:
        label: Validate
        desc: Run openspec validate in strict mode and clear every issue before execution.
      apply:
        label: Apply
        desc: Read proposal, design, and tasks, then implement in order while checking items off.
      archive:
        label: 歸檔
        desc: 知識歸檔
    paused: 已暫停 - 點擊節點切換
  convenient:
    badge: 高效
    title: 高效
    subtitle: 多 Agent、多實例並行，真正把額度跑滿
    traditional: 傳統單 Agent / 單實例
    multiThread: 多 Agent 並行矩陣
    boost: 吞吐提升
    boostValue: 並行 10x+
    description: Claude Code、Codex、GitHub Copilot、OpenCode、Hermes 等目前活躍支援的 Agent CLI，可以同時處理多個實例與任務，讓提案、修復與評審並行推進，不再卡在串行等待。
    agentMatrix:
      title: 並行執行矩陣
      badge: 多個 Agent / 多個實例
      status: 多個 Agent 正在同時驅動多個實例
      agents:
        claude:
          name: Claude Code
          role: 提案 / 評審
          instances:
            - Spec 起草
            - 設計校對
            - 歸檔檢查
        codex:
          name: Codex
          role: 實作 / 修復
          instances:
            - 實作功能 A
            - 實作功能 B
            - 回歸修復
        router:
          name: Qwen · GLM
          role: 分析 / 補充
          instances:
            - 問題排查
            - 文案優化
            - 知識提煉
      supportedNames:
        title: 目前活躍支援的 11 個 Agent CLI
        names:
          - Claude Code
          - Codex
          - GitHub Copilot
          - OpenCode
          - Hermes
          - QoderCLI
          - Kiro
          - Kimi
          - Gemini
          - DeepAgents
          - Codebuddy
    supportedProvidersNote: OpenCode 現在可以把共享的 OmniRoute 目錄投影到 Hero 的模型預設項中，同時保留可編輯原始模型識別子的能力，以支援分支級工作流程。
  interesting:
    badge: 有趣
    title: 有趣
    subtitle: Hero Dungeon 讓校園協作與實作訓練更有生命力
    features:
      dungeons:
        label: 英雄副本
        desc: 把生成、執行與 Prompt 工作台編成副本流程
      captains:
        label: 隊長編組
        desc: 為不同副本指定最合適的 Hero 隊長
      battle:
        label: 戰報回饋
        desc: 用 XP、等級與執行資料回看推進結果
    description: 趣味不再只靠成就徽章堆疊，而是把 Hero Dungeon、隊長編組、Prompt 視覺與戰報回饋融進日常流程，讓校園場景中的 AI 程式設計訓練更像一場能持續推進的冒險。
    dungeonCards:
      proposal:
        title: 提案副本
        desc: OpenSpec generate / apply / archive
        status: 隊長就緒
      autotask:
        title: AutoTask 副本
        desc: 並行修復與批次自動任務
        status: 2 個實例運作中
      prompt:
        title: Prompt 副本
        desc: Prompt 預覽與風格工作台
        status: 視覺預覽已同步
    roster:
      title: 目前隊長編組
      heroes:
        strategist:
          name: Spec Strategist
          role: 提案隊長
        runner:
          name: Patch Runner
          role: 執行隊長
        artist:
          name: Prompt Artist
          role: 視覺支援
    battleReport:
      title: 今日副本戰報
      badge: Hero Battle
      metrics:
        dungeons:
          value: '4'
          label: 副本推進
        level:
          value: Lv.27
          label: 隊長等級
        xp:
          value: 12.8M
          label: 今日 XP
      note: 多個副本並行推進時，戰報會把經驗、等級與執行結果整合成單一視圖。
    gallery:
      dungeons:
        title: 副本地圖輪播
        subtitle: 從目前前端副本與 Prompt 地圖集合中隨機選出 10 張畫面。
      heroes:
        title: 英雄圖鑑輪播
        subtitle: 從目前前端英雄集合中隨機選出 10 張視覺圖。
