desktop:
  title: Hagicode Máy tính - Tải xuống
  description: Tải xuống Hagicode Máy tính, trợ lý mã AI cục bộ. Hỗ trợ Windows, macOS và Linux. Bảo vệ quyền riêng tư, phản hồi nhanh.
  features:
    title: Tính năng Chính
    local:
      title: Thực thi Cục bộ
      description: Tất cả dữ liệu được xử lý cục bộ mà không cần tải lên đám mây, đảm bảo quyền riêng tư và bảo mật mã
    privacy:
      title: Bảo vệ Quyền riêng tư
      description: Mã không bao giờ được tải lên, hỗ trợ sử dụng ngoại tuyến, bảo vệ sở hữu trí tuệ của bạn
    fast:
      title: Phản hồi Nhanh
      description: Thời gian phản hồi tính bằng mili-giây, không cần yêu cầu mạng, tăng cường hiệu suất phát triển
    crossPlatform:
      title: Hỗ trợ Đa nền tảng
      description: Hỗ trợ Windows, macOS và Linux để đáp ứng các nhu cầu môi trường phát triển khác nhau
    autoUpdate:
      title: Tự động Cập nhật
      description: Tự động kiểm tra cập nhật và nâng cấp lên phiên bản mới nhất chỉ với một cú nhấp
    multiLanguage:
      title: Hỗ trợ Đa ngôn ngữ
      description: Giao diện tiếng Trung và tiếng Anh tích hợp sẵn, hỗ trợ cộng tác nhóm quốc tế
  systemRequirements:
    title: Yêu cầu Hệ thống
    windows: Windows
    macos: macOS
    linux: Linux
    os: Hệ điều hành
    processor: Bộ vi xử lý
    memory: Bộ nhớ
    diskSpace: Không gian Đĩa
    network: Mạng
    windowsOs: Windows 10/11 (64-bit)
    macosOs: macOS 12+ (Monterey trở lên)
    linuxOs: Ubuntu 20.04+ / Debian 11+ / Các bản phân phối phổ biến khác
    windowsProcessor: Intel Core i3 hoặc bộ vi xử lý tương đương
    macosProcessor: Apple Silicon (M1/M2/M3) hoặc Intel Core i3+
    linuxProcessor: Intel Core i3 hoặc bộ vi xử lý tương đương
    memoryRec: 4GB RAM (khuyến nghị 8GB)
    disk: 2GB không gian trống
    networkDesc: Cần kết nối mạng cho lần tải xuống đầu tiên (sau đó có thể sử dụng ngoại tuyến)
  download:
    title: Gói Tải xuống
    windowsDesc: Trình cài đặt ổn định cho Windows 10/11, bao gồm bản cài đặt và bản di động.
    macosDesc: Bản dựng gốc cho Apple Silicon và Intel Mac.
    linuxDesc: Gói AppImage và tarball cho các bản phân phối Linux x64 và ARM64 phổ biến.
    note: Nếu danh sách gói tại đây không tải được, hãy sử dụng liên kết lịch sử phiên bản trong khu vực hero để truy cập chỉ mục chuẩn.
    features:
      signed: Gói đã ký
      autoUpdate: Phát hiện cập nhật tự động
      multiLanguage: Giao diện đa ngôn ngữ
  installation:
    title: Cài đặt Nhanh chóng
    step1:
      number: '1'
      title: Tải xuống Trình cài đặt
      description: Chọn trình cài đặt phù hợp cho hệ điều hành của bạn
    step2:
      number: '2'
      title: Chạy Trình cài đặt
      description: Nhấp đúp vào trình cài đặt đã tải xuống và làm theo hướng dẫn để hoàn tất cài đặt
    step3:
      number: '3'
      title: Khởi động Ứng dụng
      description: Trong lần khởi động đầu tiên, ứng dụng sẽ hướng dẫn bạn qua cấu hình ban đầu
    step4:
      number: '4'
      title: Bắt đầu Sử dụng
      description: Sau khi cấu hình, bạn có thể bắt đầu sử dụng Hagicode Máy tính
  faq:
    title: Câu hỏi Thường gặp
    q1:
      question: Sự khác biệt giữa phiên bản Máy tính và Máy chủ là gì?
      intro: 'Hagicode cung cấp hai tùy chọn triển khai: phiên bản Máy tính và phiên bản Máy chủ. Mỗi phiên bản đều có ưu điểm riêng, nhưng cả hai đều áp dụng phương pháp máy chủ và dữ liệu do người dùng kiểm soát, cung cấp khả năng bảo vệ dữ liệu tốt hơn.'
      desktopTitle: Phiên bản Máy tính
      desktop1: Chạy cục bộ trên máy tính của bạn, nhẹ hơn
      desktop2: Không cần cấu hình máy chủ, sẵn sàng sử dụng ngay
      desktop3: Phù hợp cho nhà phát triển cá nhân và kịch bản sử dụng nhẹ
      desktop4: Tất cả dữ liệu hoàn toàn cục bộ
      serverTitle: Phiên bản Máy chủ
      server1: Có thể triển khai trên máy chủ từ xa
      server2: Hỗ trợ truy cập từ xa đa người dùng
      server3: Phù hợp hơn cho cộng tác nhóm và mở rộng
      server4: Chuẩn bị cho các tính năng doanh nghiệp và đồng bộ hóa đa thiết bị trong tương lai
      conclusion: Dù bạn chọn phiên bản nào, bạn cũng có toàn quyền kiểm soát máy chủ và dữ liệu của mình, tận hưởng bảo vệ quyền riêng tư và bảo mật dữ liệu tốt hơn.
    q2:
      question: Tôi cần làm gì sau khi cài đặt?
      intro: 'Hagicode Máy tính về bản chất là một trình khởi chạy. Trong lần khởi động đầu tiên sau khi cài đặt, nó sẽ hướng dẫn bạn qua các bước sau:'
      step1: '<strong>Tải xuống Hagicode Core:</strong> Ứng dụng Máy tính sẽ tự động phát hiện và nhắc bạn tải xuống các thành phần cốt lõi của Hagicode'
      step2: '<strong>Cài đặt Thành phần Cốt lõi:</strong> Làm theo hướng dẫn trên màn hình để hoàn tất cài đặt thành phần cốt lõi'
      step3: '<strong>Cấu hình Agent CLI mặc định của bạn:</strong> Chọn một Agent CLI hiện được hỗ trợ và hoàn tất các bước đăng nhập, ủy quyền hoặc cài đặt cục bộ cần thiết.'
      note: Giao diện Máy tính hướng dẫn toàn bộ quy trình. Giữ mạng khả dụng trong lần khởi động đầu tiên để Hagicode Core có thể tải xuống; một số Agent CLI vẫn yêu cầu cài đặt hoặc xác thực thủ công, nhưng chúng vẫn nằm trong phạm vi hỗ trợ hiện tại.
      done: Sau khi hoàn tất các bước này, bạn có thể sử dụng tất cả các tính năng của Hagicode Máy tính bình thường.
    q3:
      question: Tôi kiểm tra cập nhật như thế nào?
      answer: Máy tính tự động kiểm tra cập nhật. Khi có phiên bản mới, thông báo sẽ xuất hiện ở góc trên bên phải của giao diện. Bạn cũng có thể kiểm tra cập nhật thủ công trong "Cài đặt".
    q4:
      question: Agent CLI AI nào được hỗ trợ?
      intro: 'Hagicode Máy tính hiện hỗ trợ các Agent CLI sau:'
      active: '<strong>Hiện được hỗ trợ:</strong> Claude Code, Codex, GitHub Copilot, OpenCode, Hermes, QoderCLI, Kiro, Kimi, Gemini, DeepAgents và Codebuddy'
      manual: '<strong>Cài đặt hoặc xác thực thủ công:</strong> Hermes, Gemini và DeepAgents yêu cầu cài đặt cục bộ hoặc bước xác thực trước; các CLI khác cung cấp điểm vào cài đặt một chạm hoặc quy trình cài đặt có hướng dẫn.'
      legacy: '<strong>Chỉ tương thích cũ:</strong> IFlowCli chỉ còn lại cho khả năng tương thích dữ liệu lịch sử và không thuộc phạm vi hỗ trợ hoạt động hiện tại.'
      closing: Phạm vi hỗ trợ và chế độ thiết lập là các vấn đề riêng biệt. Một CLI cần cài đặt thủ công vẫn được hỗ trợ.
    q5:
      question: Có hỗ trợ sử dụng ngoại tuyến không?
      intro: 'Có! Hagicode Máy tính hỗ trợ sử dụng ngoại tuyến hoàn toàn:'
      point1: Cần kết nối mạng cho cài đặt và cấu hình ban đầu (tải xuống thành phần cốt lõi và mô hình AI)
      point2: Tất cả tính năng có thể sử dụng ngoại tuyến sau khi cấu hình
      point3: Mã và dữ liệu của bạn không bao giờ được tải lên đám mây
      point4: Tất cả xử lý AI được hoàn tất cục bộ
    q6:
      question: macOS báo Hagicode.app bị hỏng hoặc không thể mở. Tôi phải làm gì?
      intro: Nếu Hagicode Máy tính được cài đặt tại đường dẫn mặc định /Applications/Hagicode.app và macOS Gatekeeper chặn lần khởi động đầu tiên, hãy sử dụng lệnh sau để xóa thuộc tính cách ly khỏi ứng dụng.
      cause: Điều này xảy ra vì macOS thêm thuộc tính com.apple.quarantine vào các ứng dụng được tải xuống từ internet. Đây là vấn đề cách ly bảo mật của macOS, không phải lỗi trong trình cài đặt Hagicode.
      command: sudo xattr -dr com.apple.quarantine /Applications/Hagicode.app
      note: Chạy lệnh trong Terminal với quyền quản trị viên, sau đó khởi động lại Hagicode Máy tính.
    q7:
      question: Cách nhận trợ giúp khi gặp sự cố?
      intro: 'Nếu bạn gặp sự cố khi sử dụng Hagicode Máy tính, bạn có thể nhận trợ giúp qua:'
      point1: '<strong>Nhóm Hỗ trợ Kỹ thuật:</strong> Tham gia Nhóm QQ 610394020'
      point2: '<strong>Tài liệu Trực tuyến:</strong> Xem tài liệu sử dụng hoàn chỉnh và hướng dẫn'
      point3: '<strong>GitHub Issues:</strong> Gửi báo cáo sự cố trong kho lưu trữ dự án'
