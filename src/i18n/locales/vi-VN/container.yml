container:
  title: Hagicode Container - Triển khai Container
  description: Triển khai Hagicode qua Docker Compose Builder. Cấu hình đơn giản, sẵn sàng sử dụng. Hỗ trợ nhiều nguồn hình ảnh và tự động cập nhật.
  hero:
    badge: Container
    title: Hagicode Container
    tagline: Triển khai nhanh chóng với Docker Compose Builder, cấu hình đơn giản, sẵn sàng sử dụng
    value1: Cấu hình trực quan, không cần lập trình
    value2: Cô lập môi trường, bảo mật dữ liệu
    value3: Triển khai một chạm, khởi động nhanh chóng
    ctaButton: Triển khai với Docker Compose Builder
    features:
      isolation: Cô lập Môi trường
      oneClick: Triển khai Một Chạm
      fastStart: Khởi động Nhanh
  features:
    title: Tại sao nên chọn Triển khai Container?
    isolation:
      title: Cô lập Môi trường
      description: Triển khai bằng container tránh xung đột phụ thuộc, không ảnh hưởng đến môi trường hệ thống, giữ hệ thống sạch sẽ
    simple:
      title: Cấu hình Đơn giản
      description: Sử dụng Docker Compose Builder để cấu hình trực quan, không cần viết script phức tạp
    crossPlatform:
      title: Hỗ trợ Đa nền tảng
      description: Hỗ trợ kiến trúc x86_64, phù hợp với nhiều máy chủ và nền tảng đám mây
    persistent:
      title: Duy trì Dữ liệu
      description: Hỗ trợ gắn Volume, dữ liệu an toàn và đáng tin cậy, không mất dữ liệu khi khởi động lại container
    autoUpdate:
      title: Tự động Cập nhật
      description: Hỗ trợ watchtower để tự động cập nhật, dễ dàng nhận phiên bản mới nhất
    productionReady:
      title: Sẵn sàng cho Sản xuất
      description: Được thiết kế cho môi trường sản xuất, hỗ trợ tính sẵn sàng cao và mở rộng theo chiều ngang
  builder:
    title: Docker Compose Builder
    subtitle: Phương thức triển khai container đơn giản và được đề xuất nhất
    visual:
      title: Cấu hình Trực quan
      description: Cấu hình tất cả các tham số qua giao diện Web thân thiện, không cần chỉnh sửa file YAML thủ công
    generate:
      title: Tạo Cấu hình Một Chạm
      description: Tự động tạo file docker-compose.yml hoàn chỉnh với cấu hình theo thực hành tốt nhất
    deploy:
      title: Triển khai Nhanh chóng
      description: Tải xuống file cấu hình và khởi động dịch vụ một chạm, hoàn tất triển khai trong vài phút
    secure:
      title: An toàn và Đáng tin cậy
      description: Thực hành bảo mật tốt nhất được tích hợp sẵn, tự động cấu hình volume dữ liệu và chính sách khởi động lại
    ctaButton: Đi đến Docker Compose Builder
  mirrors:
    title: Chọn Nguồn Hình ảnh
    description: Chọn nguồn hình ảnh phù hợp nhất dựa trên môi trường mạng và vị trí của bạn
    dockerHub: Docker Hub
    dockerHubDesc: Sổ đăng ký hình ảnh container lớn nhất thế giới, phù hợp cho người dùng mạng quốc tế
    dockerHubCmd: newbe36524/hagicode:0
    azure: Azure ACR
    azureDesc: Dịch vụ hình ảnh của Microsoft Azure, truy cập nhanh hơn từ Trung Quốc
    azureCmd: hagicode.azurecr.io/hagicode:0
    aliyun: Aliyun ACR
    aliyunDesc: Tăng tốc hình ảnh trong nước của Aliyun, được đề xuất cho người dùng ở đại lục Trung Quốc
    aliyunCmd: registry.cn-hangzhou.aliyuncs.com/hagicode/hagicode:0
  faq:
    title: Câu hỏi Thường gặp
    q1:
      question: Sự khác biệt giữa phiên bản Container và Máy tính là gì?
      intro: 'Cả hai phiên bản đều có ưu điểm riêng. Bạn có thể chọn dựa trên kịch bản sử dụng của mình:'
      desktopTitle: Phiên bản Máy tính
      desktop1: Chạy cục bộ trên máy tính của bạn, nhẹ hơn
      desktop2: Không cần cấu hình máy chủ, sẵn sàng sử dụng ngay
      desktop3: Phù hợp cho nhà phát triển cá nhân và kịch bản sử dụng nhẹ
      desktop4: Tất cả dữ liệu hoàn toàn cục bộ
      containerTitle: Phiên bản Container
      container1: Có thể triển khai trên máy chủ, hỗ trợ truy cập từ xa
      container2: Cô lập môi trường, không ảnh hưởng đến môi trường hệ thống
      container3: Phù hợp hơn cho cộng tác nhóm và môi trường sản xuất
      container4: Hỗ trợ triển khai tự động và mở rộng theo chiều ngang
    q2:
      question: Docker Compose Builder là gì?
      intro: 'Docker Compose Builder là công cụ cấu hình trực quan của chúng tôi giúp bạn:'
      point1: Cấu hình tất cả tham số container qua giao diện Web
      point2: Tự động tạo file docker-compose.yml
      point3: Thực hành tốt nhất và cấu hình bảo mật được tích hợp sẵn
      point4: Tải xuống và khởi động dịch vụ một chạm
      note: Không cần viết cấu hình YAML phức tạp thủ công. Ngay cả người mới bắt đầu Docker cũng có thể triển khai dễ dàng.
    q3:
      question: Phiên bản container hỗ trợ kiến trúc hệ thống nào?
      answer: Hình ảnh container Hagicode hiện hỗ trợ kiến trúc <strong>x86_64 (amd64)</strong>, phù hợp với hầu hết máy chủ và PC.
      note: Docker sẽ tự động chọn kiến trúc phù hợp cho hệ thống của bạn khi kéo hình ảnh.
    q4:
      question: Cách cập nhật container?
      intro: 'Khi sử dụng triển khai Docker Compose, việc cập nhật rất đơn giản:'
      code: |-
        docker-compose pull
        docker-compose up -d
      watchtower: Hoặc sử dụng Watchtower để tự động cập nhật.
    q5:
      question: Cách cấu hình duy trì dữ liệu?
      intro: 'Docker Compose Builder tự động cấu hình volume dữ liệu. Mặc định, dữ liệu của bạn sẽ được lưu trữ trong Docker Volumes, đảm bảo:'
      point1: Dữ liệu không bị mất khi xóa container
      point2: Dữ liệu được giữ lại khi nâng cấp container
      point3: Dễ dàng sao lưu và khôi phục
    q6:
      question: Phải làm gì nếu container không khởi động được?
      intro: 'Các bước khắc phục sự cố khởi động container:'
      step1:
        title: 'Kiểm tra trạng thái container:'
        code: docker-compose ps
      step2:
        title: 'Kiểm tra nhật ký container:'
        code: docker-compose logs hagicode
      step3:
        title: 'Kiểm tra việc sử dụng cổng:'
        desc: 'Nếu cổng dịch vụ của bạn là 3000, sử dụng lệnh này để kiểm tra:'
        code: netstat -tlnp | grep 3000
        solution: 'Nếu cổng đã được sử dụng, bạn có thể:'
        solution1: Dừng tiến trình đang sử dụng cổng
        solution2: Hoặc cấu hình cổng khác trong Docker Compose Builder
      help: Nếu vấn đề vẫn tiếp diễn, vui lòng kiểm tra tài liệu chi tiết hoặc liên hệ với bộ phận hỗ trợ kỹ thuật.
  cta:
    title: Bắt đầu Sử dụng Docker Compose Builder
    subtitle: Phương thức triển khai container đơn giản và được đề xuất nhất
    button: Đi đến Hướng dẫn Triển khai
    github: Kho lưu trữ GitHub
