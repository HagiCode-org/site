      title: Tổng quan thực thi đề xuất
      description: Giữ giai đoạn quy trình, kết quả thực thi và ngữ cảnh phiên trên một màn hình để các nhóm có thể thấy chính xác nơi một thay đổi đang ở trước khi tiếp tục.
      alt: Ảnh chụp màn hình thực thi đề xuất HagiCode hiển thị các giai đoạn quy trình, kết quả thực thi và thanh bên phiên
    sessionBoard:
      title: Bảng phiên và lập kế hoạch hầm ngục
      description: Các phiên đang chờ, đang thực hiện và đã lưu trữ hiển thị bên cạnh bảng nhiệm vụ giả tưởng để dễ dàng xem công việc agent song song chỉ trong một cái nhìn.
      alt: Ảnh chụp màn hình bảng phiên HagiCode hiển thị các cột đang chờ, đang thực hiện và đã lưu trữ bên cạnh bảng nhiệm vụ giả tưởng
    tokenAnalytics:
      title: Phân tích token theo thời gian thực
      description: Theo dõi thông lượng, hoạt động API gần đây và tổng mức sử dụng trên một bảng chỉ số để chi phí và tiến độ có thể kiểm soát được trong quá trình thực thi song song.
      alt: Ảnh chụp màn hình phân tích token HagiCode hiển thị thông lượng, hoạt động API gần đây và tổng mức sử dụng
    workspaceManagement:
      title: Quản lý không gian làm việc và kho lưu trữ
      description: Quản lý kho lưu trữ người dùng, kho lưu trữ hệ thống và điểm vào code-server từ một bảng điều khiển được thiết kế cho môi trường dùng chung và bảo trì nhanh chóng.
      alt: Ảnh chụp màn hình quản lý không gian làm việc HagiCode hiển thị kho lưu trữ người dùng, kho lưu trữ hệ thống và hành động code-server
    achievementProgress:
      title: Tiến trình thành tựu và tăng trưởng
      description: Tiến trình hàng ngày, tăng trưởng toàn cầu và chỉ số vòng đời được tổng hợp trong một bảng điều khiển để việc áp dụng lâu dài trở nên có thể đo lường thay vì trừu tượng.
      alt: Ảnh chụp màn hình bảng thành tựu HagiCode hiển thị tiến trình hàng ngày, tăng trưởng toàn cầu và chỉ số vòng đời
