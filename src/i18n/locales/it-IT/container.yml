container:
  title: Hagicode Container - Distribuzione Container
  description: Distribuisci Hagicode tramite Docker Compose Builder. Configurazione semplice, pronto all'uso. Supporta multiple fonti immagini e aggiornamenti automatici.
  hero:
    badge: Container
    title: Hagicode Container
    tagline: Distribuisci rapidamente con Docker Compose Builder, configurazione semplice, pronto all'uso
    value1: Configurazione visuale, nessuna programmazione richiesta
    value2: Isolamento dell'ambiente, sicurezza dei dati
    value3: Distribuzione con un clic, avvio rapido
    ctaButton: Distribuisci con Docker Compose Builder
    features:
      isolation: Isolamento ambiente
      oneClick: Distribuzione con un clic
      fastStart: Avvio rapido
  features:
    title: Perché scegliere la distribuzione Container?
    isolation:
      title: Isolamento ambiente
      description: La distribuzione containerizzata evita conflitti di dipendenze, non influisce sull'ambiente di sistema, mantiene il sistema pulito
    simple:
      title: Configurazione semplice
      description: Utilizza Docker Compose Builder per la configurazione visuale, senza dover scrivere script complessi
    crossPlatform:
      title: Supporto multipiattaforma
      description: Supporta architettura x86_64, adatta a vari server e piattaforme cloud
    persistent:
      title: Persistenza dei dati
      description: Supporta montaggio Volume, dati sicuri e affidabili, nessuna perdita di dati al riavvio del container
    autoUpdate:
      title: Aggiornamenti automatici
      description: Supporta watchtower per aggiornamenti automatici, ottieni facilmente l'ultima versione
    productionReady:
      title: Pronto per la produzione
      description: Progettato per ambienti di produzione, supporta alta disponibilità e scalabilità orizzontale
  builder:
    title: Docker Compose Builder
    subtitle: Il metodo di distribuzione container più semplice e consigliato
    visual:
      title: Configurazione visuale
      description: Configura tutti i parametri attraverso un'interfaccia Web intuitiva, senza dover modificare manualmente i file YAML
    generate:
      title: Generazione configurazione con un clic
      description: Genera automaticamente file docker-compose.yml completi con configurazioni di best practice
    deploy:
      title: Distribuzione rapida
      description: Scarica con un clic i file di configurazione e avvia i servizi, completa la distribuzione in pochi minuti
    secure:
      title: Sicuro e affidabile
      description: Procedure di sicurezza integrate, configura automaticamente volumi dati e politiche di riavvio
    ctaButton: Vai a Docker Compose Builder
  mirrors:
    title: Selezione fonte immagine
    description: Scegli la fonte immagine più adatta in base al tuo ambiente di rete e posizione
    dockerHub: Docker Hub
    dockerHubDesc: Il registro di immagini container più grande al mondo, adatto a utenti con rete internazionale
    dockerHubCmd: newbe36524/hagicode:0
    azure: Azure ACR
    azureDesc: Servizio immagini di Microsoft Azure, accesso più veloce dalla Cina
    azureCmd: hagicode.azurecr.io/hagicode:0
    aliyun: Aliyun ACR
    aliyunDesc: Accelerazione immagini nazionale di Aliyun, consigliata per utenti nella Cina continentale
    aliyunCmd: registry.cn-hangzhou.aliyuncs.com/hagicode/hagicode:0
  faq:
    title: FAQ
    q1:
      question: Qual è la differenza tra le versioni Container e Desktop?
      intro: 'Entrambe le versioni hanno i loro vantaggi. Puoi scegliere in base al tuo scenario d''uso:'
      desktopTitle: Versione Desktop
      desktop1: Eseguita localmente sul tuo computer, più leggera
      desktop2: Nessuna configurazione server necessaria, pronta all'uso subito
      desktop3: Adatta a sviluppatori individuali e scenari di utilizzo leggero
      desktop4: Tutti i dati completamente localizzati
      containerTitle: Versione Container
      container1: Può essere distribuita su server, supporta accesso remoto
      container2: Isolamento dell'ambiente, non influisce sull'ambiente di sistema
      container3: Più adatta alla collaborazione di team e ambienti di produzione
      container4: Supporta distribuzione automatizzata e scalabilità orizzontale
    q2:
      question: Cos'è Docker Compose Builder?
      intro: 'Docker Compose Builder è il nostro strumento di configurazione visuale che ti aiuta a:'
      point1: Configurare tutti i parametri container attraverso un'interfaccia Web
      point2: Generare automaticamente file docker-compose.yml
      point3: Procedure di sicurezza e configurazioni integrate
      point4: Scaricare e avviare i servizi con un clic
      note: Non è necessario scrivere manualmente configurazioni YAML complesse. Anche i principianti di Docker possono distribuire facilmente.
    q3:
      question: Quali architetture di sistema supporta la versione container?
      answer: Le immagini container di Hagicode supportano attualmente l'architettura <strong>x86_64 (amd64)</strong>, adatta alla maggior parte dei server e PC.
      note: Docker selezionerà automaticamente l'architettura appropriata per il tuo sistema durante il pull delle immagini.
    q4:
      question: Come aggiornare il container?
      intro: 'Quando si utilizza la distribuzione Docker Compose, l''aggiornamento è molto semplice:'
      code: |-
        docker-compose pull
        docker-compose up -d
      watchtower: Oppure utilizza Watchtower per aggiornamenti automatici.
    q5:
      question: Come configurare la persistenza dei dati?
      intro: 'Docker Compose Builder configura automaticamente i volumi dati. Per impostazione predefinita, i tuoi dati verranno memorizzati in Docker Volumes, garantendo:'
      point1: I dati non vengono persi quando i container vengono eliminati
      point2: I dati vengono preservati durante gli aggiornamenti dei container
      point3: Facile backup e ripristino
    q6:
      question: Cosa fare se l'avvio del container fallisce?
      intro: 'Passaggi per risolvere il problema di avvio del container:'
      step1:
        title: 'Verifica lo stato del container:'
        code: docker-compose ps
      step2:
        title: 'Verifica i log del container:'
        code: docker-compose logs hagicode
      step3:
        title: 'Verifica l''occupazione della porta:'
        desc: 'Se la porta del tuo servizio è 3000, usa questo comando per verificare:'
        code: netstat -tlnp | grep 3000
        solution: 'Se la porta è occupata, puoi:'
        solution1: Fermare il processo che occupa la porta
        solution2: Oppure configurare una porta diversa in Docker Compose Builder
      help: Se il problema persiste, consulta la documentazione dettagliata o contatta il supporto tecnico.
  cta:
    title: Inizia a utilizzare Docker Compose Builder
    subtitle: Il metodo di distribuzione container più semplice e consigliato
    button: Vai alla guida di distribuzione
    github: Repository GitHub
