showcase:
  title: Ultime viste del prodotto
  description: Dall'esecuzione delle proposte e dalle bacheche delle sessioni all'analisi dei token, alla gestione degli spazi di lavoro e ai progressi degli obiettivi, la homepage ora utilizza le ultime screenshot curate mantenute con il sito della documentazione.
  controls:
    previous: Precedente
    next: Successivo
    current: Vista in evidenza
    railLabel: Navigazione screenshot prodotto
    selectPrefix: 'Passa a: '
    activeState: In mostra
    previewState: Anteprima
    imageUnavailable: Immagine non disponibile
    openFullscreen: 'Apri schermo intero: '
    openFullscreenHint: Clicca per ingrandire
    closeFullscreen: Chiudi schermo intero
  screenshots:
    proposalWorkflow:
      title: Panoramica esecuzione proposta
      description: Mantieni la fase del flusso di lavoro, il risultato dell'esecuzione e il contesto della sessione in una sola schermata, così i team possono vedere esattamente dove si trova una modifica prima di procedere.
      alt: Screenshot esecuzione proposta HagiCode che mostra fasi del flusso di lavoro, risultato dell'esecuzione e barra laterale della sessione
    sessionBoard:
      title: Bacheca sessioni e pianificazione dungeon
      description: Sessioni in sospeso, in corso e archiviate restano visibili accanto a un pannello attività fantasy, così il lavoro parallelo degli agenti è facile da scansionare a colpo d'occhio.
      alt: Screenshot bacheca sessioni HagiCode che mostra colonne in sospeso, in corso e archiviate accanto a un pannello attività fantasy
    tokenAnalytics:
      title: Analisi token in tempo reale
      description: Osserva throughput, attività API recente e utilizzo totale in una singola superficie di metriche, così costi e ritmo restano controllabili durante l'esecuzione parallela.
      alt: Screenshot analisi token HagiCode che mostra throughput, attività API recente e utilizzo totale
    workspaceManagement:
      title: Gestione spazio di lavoro e vault
      description: Gestisci vault utente, vault di sistema e punti di ingresso code-server da un'unica superficie di controllo progettata per ambienti condivisi e manutenzione rapida.
      alt: Screenshot gestione spazio di lavoro HagiCode che mostra vault utente, vault di sistema e azioni code-server
    achievementProgress:
      title: Progressi obiettivi e crescita
      description: Progressi giornalieri, crescita globale e metriche del ciclo di vita convergono in un'unica dashboard, così l'adozione a lungo termine risulta misurabile invece che astratta.
      alt: Screenshot dashboard obiettivi HagiCode che mostra progressi giornalieri, crescita globale e metriche del ciclo di vita
