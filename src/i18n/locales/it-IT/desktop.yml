desktop:
  title: Hagicode Desktop - Download
  description: Scarica Hagicode Desktop, un assistente codice AI localizzato. Supporta Windows, macOS e Linux. Protezione della privacy, risposta rapida.
  features:
    title: Funzionalità principali
    local:
      title: Esecuzione locale
      description: Tutti i dati vengono elaborati localmente senza caricamento nel cloud, garantendo privacy e sicurezza del codice
    privacy:
      title: Protezione della privacy
      description: Il codice non viene mai caricato, supporta l'utilizzo offline, proteggendo la tua proprietà intellettuale
    fast:
      title: Risposta rapida
      description: Tempo di risposta a livello di millisecondi, nessuna richiesta di rete necessaria, aumentando l'efficienza di sviluppo
    crossPlatform:
      title: Supporto multipiattaforma
      description: Supporta Windows, macOS e Linux per soddisfare diverse esigenze di ambiente di sviluppo
    autoUpdate:
      title: Aggiornamenti automatici
      description: Verifica automaticamente gli aggiornamenti e passa all'ultima versione con un clic
    multiLanguage:
      title: Supporto multilingua
      description: Interfaccia integrata in cinese e inglese, a supporto della collaborazione internazionale dei team
  systemRequirements:
    title: Requisiti di sistema
    windows: Windows
    macos: macOS
    linux: Linux
    os: Sistema operativo
    processor: Processore
    memory: Memoria
    diskSpace: Spazio su disco
    network: Rete
    windowsOs: Windows 10/11 (64-bit)
    macosOs: macOS 12+ (Monterey o superiore)
    linuxOs: Ubuntu 20.04+ / Debian 11+ / Altre distribuzioni principali
    windowsProcessor: Intel Core i3 o processore equivalente
    macosProcessor: Apple Silicon (M1/M2/M3) o Intel Core i3+
    linuxProcessor: Intel Core i3 o processore equivalente
    memoryRec: 4GB RAM (8GB consigliati)
    disk: 2GB di spazio disponibile
    networkDesc: Connessione di rete richiesta per il download iniziale (utilizzabile offline successivamente)
  download:
    title: Pacchetti di download
    windowsDesc: Programmi di installazione stabili per Windows 10/11, inclusi setup e versioni portatili.
    macosDesc: Build native per Mac Apple Silicon e Intel.
    linuxDesc: Pacchetti AppImage e tarball per distribuzioni Linux x64 e ARM64 principali.
    note: Se l'elenco dei pacchetti qui non si carica, utilizza il link alla cronologia versioni nell'area hero per accedere all'indice canonico.
    features:
      signed: Pacchetti firmati
      autoUpdate: Rilevamento automatico aggiornamenti
      multiLanguage: Interfaccia multilingua
  installation:
    title: Installazione rapida
    step1:
      number: '1'
      title: Scarica il programma di installazione
      description: Seleziona il programma di installazione appropriato per il tuo sistema operativo
    step2:
      number: '2'
      title: Esegui il programma di installazione
      description: Fai doppio clic sul programma di installazione scaricato e segui le istruzioni per completare l'installazione
    step3:
      number: '3'
      title: Avvia l'app
      description: Al primo avvio, ti guiderà attraverso la configurazione iniziale
    step4:
      number: '4'
      title: Inizia a utilizzare
      description: Dopo la configurazione, puoi iniziare a utilizzare Hagicode Desktop
  faq:
    title: FAQ
    q1:
      question: Qual è la differenza tra le versioni Desktop e Server?
      intro: 'Hagicode offre due opzioni di distribuzione: versione Desktop e versione Server. Ognuna ha i suoi vantaggi, ma entrambe adottano un approccio di server e dati controllati dall''utente, fornendo una migliore protezione dei dati.'
      desktopTitle: Versione Desktop
      desktop1: Eseguita localmente sul tuo computer, più leggera
      desktop2: Nessuna configurazione server necessaria, pronta all'uso subito
      desktop3: Adatta a sviluppatori individuali e scenari di utilizzo leggero
      desktop4: Tutti i dati completamente localizzati
      serverTitle: Versione Server
      server1: Può essere distribuita su server remoti
      server2: Supporta accesso remoto multiutente
      server3: Più adatta alla collaborazione di team e alla scalabilità
      server4: Prepara le future funzionalità enterprise e sincronizzazione multi-dispositivo
      conclusion: Indipendentemente dalla versione scelta, hai il controllo completo del tuo server e dei tuoi dati, godendo di migliore protezione della privacy e sicurezza dei dati.
    q2:
      question: Cosa devo fare dopo l'installazione?
      intro: 'Hagicode Desktop è essenzialmente un launcher. Al primo avvio dopo l''installazione, ti guiderà attraverso questi passaggi:'
      step1: '<strong>Scarica Hagicode Core:</strong> Desktop rileverà automaticamente e ti chiederà di scaricare i componenti core di Hagicode'
      step2: '<strong>Installa i componenti core:</strong> Segui le istruzioni a schermo per completare l''installazione dei componenti core'
      step3: '<strong>Configura il tuo Agent CLI predefinito:</strong> Scegli un Agent CLI attualmente supportato e completare i passaggi di accesso, autorizzazione o installazione locale necessari.'
      note: L'interfaccia Desktop guida l'intero flusso. Mantieni la rete disponibile al primo avvio così Hagicode Core può essere scaricato; alcuni Agent CLI richiedono ancora installazione manuale o autenticazione, ma fanno ancora parte dell'intervallo di supporto corrente.
      done: Dopo aver completato questi passaggi, puoi utilizzare tutte le funzionalità di Hagicode Desktop normalmente.
    q3:
      question: Come verifico gli aggiornamenti?
      answer: Desktop verifica automaticamente gli aggiornamenti. Quando è disponibile una nuova versione, apparirà un avviso nell'angolo in alto a destra dell'interfaccia. Puoi anche verificare manualmente gli aggiornamenti nelle "Impostazioni".
    q4:
      question: Quali Agent CLI AI sono supportati?
      intro: 'Hagicode Desktop supporta attualmente i seguenti Agent CLI:'
      active: '<strong>Attualmente supportati:</strong> Claude Code, Codex, GitHub Copilot, OpenCode, Hermes, QoderCLI, Kiro, Kimi, Gemini, DeepAgents e Codebuddy'
      manual: '<strong>Installazione manuale o autenticazione:</strong> Hermes, Gemini e DeepAgents richiedono prima un''installazione locale o un passaggio di autenticazione; gli altri CLI forniscono punti di ingresso di installazione con un clic o flussi di installazione guidati.'
      legacy: '<strong>Solo compatibilità legacy:</strong> IFlowCli rimane solo per la compatibilità dei dati storici e non fa parte dell''intervallo di supporto attivo corrente.'
      closing: L'ambito di supporto e la modalità di configurazione sono aspetti separati. Un CLI che richiede installazione manuale è comunque supportato ora.
    q5:
      question: Supporta l'utilizzo offline?
      intro: 'Sì! Hagicode Desktop supporta l''utilizzo offline completo:'
      point1: Connessione di rete richiesta per l'installazione e configurazione iniziale (download dei componenti core e modelli AI)
      point2: Tutte le funzionalità possono essere utilizzate offline dopo la configurazione
      point3: Il tuo codice e i tuoi dati non vengono mai caricati nel cloud
      point4: Tutta l'elaborazione AI viene completata localmente
    q6:
      question: macOS dice che Hagicode.app è danneggiato o non può essere aperto. Cosa devo fare?
      intro: Se Hagicode Desktop è installato nel percorso predefinito /Applications/Hagicode.app e macOS Gatekeeper blocca il primo avvio, usa il seguente comando per rimuovere l'attributo di quarantena dall'app.
      cause: Questo accade perché macOS aggiunge l'attributo com.apple.quarantine alle app scaricate da internet. È un problema di isolamento di sicurezza di macOS, non un errore nel programma di installazione di Hagicode.
      command: sudo xattr -dr com.apple.quarantine /Applications/Hagicode.app
      note: Esegui il comando nel Terminale con privilegi di amministratore, quindi riavvia Hagicode Desktop.
    q7:
      question: Come ottenere aiuto in caso di problemi?
      intro: 'Se riscontri problemi durante l''utilizzo di Hagicode Desktop, puoi ottenere aiuto tramite:'
      point1: '<strong>Gruppo di supporto tecnico:</strong> Unisciti al Gruppo QQ 610394020'
      point2: '<strong>Documentazione online:</strong> Visualizza la documentazione completa e i tutorial'
      point3: '<strong>GitHub Issues:</strong> Invia segnalazioni di problemi nel repository del progetto'
