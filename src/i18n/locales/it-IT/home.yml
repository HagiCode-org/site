features:
  showcase:
    title: Tre funzionalità principali
    subtitle: Ridefinisci la tua esperienza di coding AI
  smart:
    badge: INTELLIGENTE
    title: Intelligente
    subtitle: Flusso di lavoro OpenSpec, aumenta l'efficienza di coding AI
    efficiency: Aumento dell'efficienza
    traditional: Tradizionale
    hagicode: Hagicode
    description: Un flusso di lavoro di proposta completo in 9 fasi dall'idea all'archivio, con assistenza AI in ogni fase. Aumenta la tua efficienza di coding di 3 volte.
    workflow:
      idea:
        label: Idea
        desc: Inizia dall'idea
      proposal:
        label: Proposta
        desc: L'AI genera la proposta
      review:
        label: Revisione
        desc: Revisione automatica
      tasks:
        label: Attività
        desc: scomposizione delle attività
      code:
        label: Codice
        desc: Coding intelligente
      test:
        label: Test
        desc: Test automatici
      refactor:
        label: Refactor
        desc: Rifattorizzazione del codice
      docs:
        label: Docs
        desc: Generazione docs
      archive:
        label: Archivio
        desc: Archivio conoscenza
    paused: In pausa - Clicca sul nodo per cambiare
  convenient:
    badge: EFFICIENTE
    title: Efficiente
    subtitle: Esecuzione multi-agente, multi-istanza che mantiene la tua quota in movimento
    traditional: Singolo agente / singola istanza tradizionale
    multiThread: Matrice parallela multi-agente
    boost: Aumento del throughput
    boostValue: 10x+ parallelo
    description: Gli Agent CLI attualmente supportati come Claude Code, Codex, GitHub Copilot, OpenCode e Hermes possono lavorare su più istanze contemporaneamente, così proposte, correzioni e revisioni procedono in parallelo invece di attendere in una coda seriale.
    agentMatrix:
      title: Matrice di esecuzione parallela
      badge: Agent multipli / istanze multiple
      status: Agent multipli stanno guidando più istanze in questo momento
      agents:
        claude:
          name: Claude Code
          role: Proposta / revisione
          instances:
            - Bozza specifica
            - Verifica design
            - Revisione archivio
        codex:
          name: Codex
          role: Implementazione / correzioni
          instances:
            - Sviluppa funzionalità A
            - Sviluppa funzionalità B
            - Correzione regressione
        router:
          name: Qwen · GLM
          role: Analisi / supporto
          instances:
            - Traccia problema
            - Migliora testo
            - Cattura insight
      supportedNames:
        title: 11 Agent CLI attualmente supportati
        names:
          - Claude Code
          - Codex
          - GitHub Copilot
          - OpenCode
          - Hermes
          - QoderCLI
          - Kiro
          - Kimi
          - Gemini
          - DeepAgents
          - Codebuddy
    supportedProvidersNote: OpenCode può caricare il catalogo condiviso OmniRoute nei valori predefiniti dei modelli eroe mantenendo gli identificatori di modello raw personalizzati modificabili per flussi di lavoro specifici per branch.
  interesting:
    badge: DIVERTENTE
    title: Divertente
    subtitle: Hero Dungeon rende vive la collaborazione e la pratica nel campus
    features:
      dungeons:
        label: Hero Dungeon
        desc: Trasforma generazione, esecuzione e workbench prompt in esplorazioni dungeon
      captains:
        label: Roster Capitani
        desc: Assegna il capitano eroe giusto a ogni dungeon
      battle:
        label: Report di Battaglia
        desc: Rivedi XP, livelli e risultati dell'esecuzione dopo ogni push
    description: Il divertimento non dipende più dai badge degli obiettivi. Hero Dungeon, roster dei capitani, visual prompt e report di battaglia trasformano la pratica quotidiana di coding AI in un flusso di lavoro che sembra più un'avventura coordinata per laboratori del campus e team studenteschi.
    dungeonCards:
      proposal:
        title: Dungeon Proposta
        desc: OpenSpec genera / applica / archivia
        status: Capitano pronto
      autotask:
        title: Dungeon AutoTask
        desc: Correzioni parallele e automazione batch
        status: 2 istanze attive
      prompt:
        title: Dungeon Prompt
        desc: Anteprima prompt e workbench stile
        status: Sincronizzazione visiva pronta
    roster:
      title: Roster capitani attuale
      heroes:
        strategist:
          name: Spec Strategist
          role: Capitano proposta
        runner:
          name: Patch Runner
          role: Capitano esecuzione
        artist:
          name: Prompt Artist
          role: Supporto visivo
    battleReport:
      title: Report dungeon di oggi
      badge: Battaglia Eroica
      metrics:
        dungeons:
          value: '4'
          label: Dungeon completati
        level:
          value: Lv.27
          label: Livello capitano
        xp:
          value: 12.8M
          label: XP oggi
      note: Quando diversi dungeon procedono in parallelo, il report aggrega esperienza, livelli e risultati dell'esecuzione in un'unica lettura.
    gallery:
      dungeons:
        title: Carosello mappa dungeon
        subtitle: 10 visual casual dall'attuale collezione frontend di dungeon e mappe prompt.
      heroes:
        title: Carosello galleria eroi
        subtitle: 10 visual eroe casual dall'attuale collezione eroi frontend.
