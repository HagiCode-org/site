        category: DLC Prestazioni
        title: 'Hagicode: Turbo Engine DLC'
        price: Steam
        description: Puoi acquistare questo DLC separatamente per espandere il limite di concorrenza delle proposte originale, sbloccare il cambio copia, aggiungere cinque pacchetti avatar con 10 avatar indipendenti ciascuno, abilitare il caricamento di avatar personalizzati, personalizzare il logo e il titolo in alto a sinistra e allineare i trailer dei commit generati dall'AI con le tue regole di denominazione Co-Authored-By. Di solito evidenzieremo un'opzione di acquisto in bundle chiamata Hagicode Plus in modo che il prezzo di acquisto complessivo rimanga inferiore. Controlla la nostra pagina del negozio per le ultime modifiche.
        bullets:
          - Supporta logo e titolo personalizzati in alto a sinistra
          - Include cinque pacchetti avatar con 10 avatar selezionabili in ogni pacchetto
          - Supporta il caricamento di avatar personalizzati
          - Permette ai team di personalizzare la firma AI Co-Authored-By per i flussi di lavoro dei commit
          - Sblocca il supporto per cambio copia e formulazione
          - Espande il limite massimo di proposte concorrenti a 32
      hagicodePlus:
        category: Bundle
        title: Hagicode Plus
        price: Steam
        description: Il bundle Steam ufficiale che combina l'edizione base di Hagicode con Turbo Engine DLC in un unico percorso di acquisto.
        bullets:
          - Raggruppa l'edizione Steam principale e Turbo Engine DLC insieme
          - Mantiene l'aggiornamento della concorrenza di 32 proposte superiore collegato al percorso del bundle
          - Funziona come il punto di acquisto più chiaro quando vuoi la configurazione Steam completa in una volta
      sponsor:
        category: DLC Sostenitore
        title: Hagicode - Sponsor Pack
        price: Steam
        description: Se pensi che Hagicode sia genuinamente eccellente e vuoi fornire supporto finanziario diretto, acquistare Sponsor Pack dà più carburante al progetto e ci aiuta a mantenerlo a lungo termine.
        bullets:
