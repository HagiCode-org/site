      ctaLabel: Apri su YouTube
    bilibili:
      title: Panoramica prodotto Hagicode su Bilibili
      description: Una versione ospitata su Bilibili dell'introduzione core del prodotto per visitatori i cui browser segnalano preferenza per la lingua cinese o che preferiscono il percorso di riproduzione nazionale.
