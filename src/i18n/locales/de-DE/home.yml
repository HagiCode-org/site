workflowBoard:
  title: "Viele Agenten, jede Phase, dauerhaft in Bewegung"
  description: "Jeder Agent führt seine eigene Aufgabe durch Idee, Vorschlag, Ausführung und Archivierung. Sobald ein Lauf archiviert ist, beginnt der nächste. So ist in jeder Phase gleichzeitig Arbeit im Gang."
  illustrative: "Beispielablauf"
  diagramLabel: "{agents} führen jeweils eine Aufgabe durch diese Phasen: {stages}."
  loopLabel: "Das Archiv speist den nächsten Vorschlag"
  pause: "Animation pausieren"
  play: "Animation abspielen"
  headerSummary: "Agent / Aufgabe"
  tasks:
    - "Neues CRUD-Modul"
    - "Umfassender Code-Review"
    - "API-Dokumentation"
    - "Testfall-Paket"
  steps:
    - "Idee entwickeln"
    - "Vorschlag erstellen"
    - "Ausführen"
    - "Archivieren"
  activeStates:
    - "Ideenphase"
    - "Vorschlag läuft"
    - "Ausführung läuft"
    - "Archivierung läuft"
  completedState: "Abgeschlossen"
workflowSteps:
  eyebrow: "So funktioniert es"
  title: "Jede Änderung folgt denselben drei Schritten"
  description: "Keine endlosen Chat-Verläufe. Jede Änderung wird zu einem prüfbaren Vorschlag, einem nachvollziehbaren Lauf und wiederverwendbarem Wissen."
  loopLabel: "Das Archiv speist den nächsten Vorschlag"
  steps:
    proposal:
      label: "Vorschlag"
      description: "Beschreiben Sie die Änderung. HagiCode prüft Ihr Repository und entwirft einen Vorschlag mit Spezifikationen und Aufgaben, die Sie lesen und korrigieren können, bevor Code angefasst wird."
    execution:
      label: "Umsetzung"
      description: "Genehmigen Sie den Plan, und Agenten arbeiten ihn Aufgabe für Aufgabe ab – parallel über Claude Code, Codex, GitHub Copilot und mehr, jede erledigte Aufgabe wird abgehakt."
    archive:
      label: "Archiv"
      description: "Abgeschlossene Änderungen werden in Ihre Spezifikationen zurückarchiviert. Der nächste Vorschlag liest sie zuerst und baut so auf dem auf, was das Team bereits gelernt hat."
