features:
  showcase:
    title: Drei Kernfunktionen
    subtitle: Definieren Sie Ihr KI-Coding-Erlebnis neu
  smart:
    badge: SMART
    title: Smart
    subtitle: OpenSpec-Workflow für mehr KI-Coding-Effizienz
    efficiency: Effizienzgewinn
    traditional: Traditionell
    hagicode: Hagicode
    description: Ein vollständiger 9-stufiger Proposal-Workflow von der Idee bis zum Archiv, durchgängig mit KI-Unterstützung. So wird Ihre Coding-Effizienz um das Dreifache gesteigert.
    workflow:
      review:
        label: Review
        desc: Automatisches Review
      scaffold:
        label: Scaffold
        desc: Choose a change-id and create proposal.md, tasks.md, and design.md when needed.
      spec:
        label: Spec
        desc: Translate the change into capability-level spec deltas with explicit requirements.
      design:
        label: Design
        desc: Capture architecture and trade-offs in design.md when the change spans systems.
      tasks:
        label: Aufgaben
        desc: Aufgaben zerlegen
      validate:
        label: Validate
        desc: Run openspec validate in strict mode and clear every issue before execution.
      apply:
        label: Apply
        desc: Read proposal, design, and tasks, then implement in order while checking items off.
      archive:
        label: Archiv
        desc: Wissen archivieren
    paused: Pausiert - Knoten anklicken, um zu wechseln
  convenient:
    badge: EFFIZIENT
    title: Effizient
    subtitle: Multi-Agent- und Multi-Instanz-Ausführung, die Ihr Kontingent in Bewegung hält
    traditional: Traditioneller Einzel-Agent / Einzel-Instanz
    multiThread: Multi-Agent-Parallelmatrix
    boost: Durchsatzgewinn
    boostValue: 10x+ parallel
    description: Aktuell unterstützte Agent CLI wie Claude Code, Codex, GitHub Copilot, OpenCode und Hermes können mehrere Instanzen gleichzeitig bedienen, sodass Vorschläge, Fixes und Reviews parallel laufen statt in einer seriellen Warteschlange zu warten.
    agentMatrix:
      title: Parallele Ausführungsmatrix
      badge: Mehrere Agenten / mehrere Instanzen
      status: Mehrere Agenten treiben gerade mehrere Instanzen gleichzeitig an
      agents:
        claude:
          name: Claude Code
          role: Vorschlag / Review
          instances:
            - Spec entwerfen
            - Design prüfen
            - Archiv-Review
        codex:
          name: Codex
          role: Umsetzung / Fixes
          instances:
            - Feature A bauen
            - Feature B bauen
            - Regression beheben
        router:
          name: Qwen · GLM
          role: Analyse / Support
          instances:
            - Problem verfolgen
            - Copy überarbeiten
            - Erkenntnisse festhalten
      supportedNames:
        title: 13 aktuell unterstützte Agent CLI
        names:
          - Claude Code
          - Codex
          - GitHub Copilot
          - OpenCode
          - Hermes
          - QoderCLI
          - Kiro
          - Kimi
          - Gemini
          - Pi
          - Reasonix
          - DeepAgents
          - Codebuddy
    supportedProvidersNote: OpenCode kann den geteilten OmniRoute-Katalog in die Hero-Modelleinstellungen laden und dabei weiterhin bearbeitbare rohe Modellkennungen für branchenspezifische Workflows beibehalten.
  interesting:
    badge: SPASS
    title: Mit Spaß
    subtitle: Hero Dungeon macht Campus-Zusammenarbeit und Praxis lebendig
    features:
      dungeons:
        label: Hero Dungeons
        desc: Macht aus Generierung, Ausführung und Prompt-Werkbänken echte Dungeon-Läufe
      captains:
        label: Captain-Roster
        desc: Weist jedem Dungeon den passenden Hero-Captain zu
      battle:
        label: Kampfberichte
        desc: Prüfen Sie XP, Level und Ausführungsergebnisse nach jedem Push
    description: Spaß hängt nicht mehr nur an Erfolgsabzeichen. Hero Dungeon, Captain-Roster, Prompt-Visuals und Kampfberichte verwandeln tägliche KI-Coding-Praxis in einen koordinierten Abenteuer-Workflow für Campus-Labore und Studierendenteams.
    dungeonCards:
      proposal:
        title: Vorschlags-Dungeon
        desc: OpenSpec generate / apply / archive
        status: Captain bereit
      autotask:
        title: AutoTask-Dungeon
        desc: Parallele Fixes und Batch-Automatisierung
        status: 2 Instanzen aktiv
      prompt:
        title: Prompt-Dungeon
        desc: Prompt-Vorschau und Stil-Werkbank
        status: Visuelle Synchronisierung bereit
    roster:
      title: Aktuelles Captain-Roster
      heroes:
        strategist:
          name: Spec Strategist
          role: Vorschlags-Captain
        runner:
          name: Patch Runner
          role: Ausführungs-Captain
        artist:
          name: Prompt Artist
          role: Visuelle Unterstützung
    battleReport:
      title: Heutiger Dungeon-Bericht
      badge: Hero Battle
      metrics:
        dungeons:
          value: '4'
          label: Vorangetriebene Dungeons
        level:
          value: Lv.27
          label: Captain-Level
        xp:
          value: 12.8M
          label: XP heute
      note: Wenn mehrere Dungeons parallel laufen, bündelt dieser Bericht Erfahrung, Level und Ausführungsergebnisse in einer einzigen Anzeige.
    gallery:
      dungeons:
        title: Dungeon-Karten-Karussell
        subtitle: 10 zufällige Visuals aus der aktuellen Frontend-Dungeon- und Prompt-Map-Sammlung.
      heroes:
        title: Hero-Galerie-Karussell
        subtitle: 10 zufällige Hero-Visuals aus der aktuellen Frontend-Hero-Sammlung.
