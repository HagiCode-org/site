features:
  showcase:
    title: "Gemacht für echte Entwicklungsarbeit"
    subtitle: "Vorschläge halten jede Änderung prüfbar, parallele Agenten halten die Arbeit in Bewegung"
  smart:
    title: Smart
    subtitle: "Erst vorschlagen, dann ausführen: Jede Änderung hinterlässt eine Spur"
    artifactsTitle: "Was jede Änderung hinterlässt"
    description: "HagiCode chattet nicht nur über Ihren Code. Es prüft den realen Projektstand, schreibt Vorschlag und Spec-Deltas, validiert streng, führt die Aufgaben der Reihe nach aus und archiviert zum Schluss, was es gelernt hat – für die nächste Änderung."
    workflow:
      review:
        label: "Review"
        desc: "Projektstand, bestehende Specs und zugehörigen Code prüfen, bevor etwas entworfen wird."
      scaffold:
        label: "Gerüst"
        desc: "Eine change-id wählen und proposal.md, tasks.md sowie bei Bedarf design.md anlegen."
      spec:
        label: "Spec"
        desc: "Die Änderung in Spec-Deltas pro Capability mit klaren Anforderungen übersetzen."
      design:
        label: "Design"
        desc: "Architektur und Abwägungen in design.md festhalten, wenn die Änderung mehrere Systeme berührt."
      tasks:
        label: "Aufgaben"
        desc: "Die Arbeit in kleine, prüfbare Punkte mit klarer Reihenfolge und Parallelität zerlegen."
      validate:
        label: "Validieren"
        desc: "openspec validate im strict-Modus ausführen und vor der Umsetzung alle Befunde beheben."
      apply:
        label: "Umsetzen"
        desc: "Proposal, Design und Tasks lesen und der Reihe nach umsetzen, erledigte Punkte abhaken."
      archive:
        label: "Archiv"
        desc: "Die fertige Änderung archivieren und das Ergebnis in die langfristige Spec-Historie zurückführen."
    paused: Pausiert - Knoten anklicken, um zu wechseln
  convenient:
    title: Effizient
    subtitle: "Viele Agents und Instanzen parallel – damit Ihr Kontingent nie brachliegt"
    traditional: "Eins nach dem anderen, in der Schlange"
    multiThread: "Nebeneinander, keiner wartet auf den anderen"
    description: "Claude Code, Codex, GitHub Copilot, OpenCode, Hermes und die übrigen unterstützten Agent-CLIs können jeweils mehrere Instanzen gleichzeitig ausführen. Vorschläge, Fixes und Reviews bekommen je eine eigene Spur, sodass ein langsames Ergebnis nicht den Rest aufhält."
    agentMatrix:
      title: Parallele Ausführungsmatrix
      badge: "Beispiel-Setup"
      status: "Illustration: jede Spur kommt voran, keine blockiert eine andere"
      agents:
        claude:
          name: Claude Code
          role: Vorschlag / Review
          instances:
            - Spec entwerfen
            - Design prüfen
            - Archiv-Review
        codex:
          name: Codex
          role: Umsetzung / Fixes
          instances:
            - Feature A bauen
            - Feature B bauen
            - Regression beheben
        router:
          name: Qwen · GLM
          role: Analyse / Support
          instances:
            - Problem verfolgen
            - Copy überarbeiten
            - Erkenntnisse festhalten
    cliBay:
      title: "Ausrüstbare Agent-CLIs"
      hint: "Eine auswählen und sehen, wie sie andockt"
      chain:
        agent: "Agent"
        model: "Kompatibles Modell"
      labels:
        whatItIs: "Was es ist"
        models: "Modelle und Anmeldung"
        runsOn: "Wo es läuft"
        start: "Einstieg"
        questions: "Rückfragen in HagiCode"
        strengths: "Bekannt für"
        compare: "Vollständigen Vergleich lesen"
  interesting:
    title: Interessant
    subtitle: "Jeder Agent bekommt ein Gesicht, eine Persönlichkeit und eine Welt"
    description: "Geben Sie jedem Agent Avatar, Trait und Soul und wählen Sie das Vokabular Ihres Teams. Dieselbe Besetzung liest sich als Helden und Dungeons, Ranch, Kaiserhof oder Bienenstock – und Level und Trophäen belohnen die Arbeit, während sie passiert."
    worlds:
