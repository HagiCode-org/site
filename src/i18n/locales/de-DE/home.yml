  overview:
    youtube:
      title: Hagicode-Produktüberblick auf YouTube
      description: Die wichtigste englischsprachige Einführung in Hagicodes Workflow, den Multi-Agent-Ausführungsstil und warum sich das Produkt größer anfühlt als ein generischer KI-Coding-Chat.
      ctaLabel: Auf YouTube öffnen
    bilibili:
      title: Hagicode-Produktüberblick auf Bilibili
      description: Eine auf Bilibili gehostete Version der zentralen Produkteinführung für Besucher, deren Browser eine chinesische Sprachpräferenz signalisiert oder die den chinesischen Wiedergabepfad bevorzugen.
      ctaLabel: Auf Bilibili öffnen
  supporting:
    first:
      title: KI spielt Spiele beim Coden
      description: Dieser spielerische Zusatzclip zeigt, dass der Assistent in echten Coding-Sessions lebendig und überraschend bleibt, statt wie ein trockener Codegenerator zu wirken.
      ctaLabel: Auf Bilibili öffnen
    second:
      title: 'GPT Codex in Hagicode: Live-Test'
      description: Diese fokussierte Validierung hilft Interessenten nach der lokalisierten Hauptvorstellung einzuschätzen, wie sich GPT Codex im realen Produkt verhält.
