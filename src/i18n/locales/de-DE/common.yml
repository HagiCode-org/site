showcase:
  title: "HagiCode bei der Arbeit"
  description: "Zehn Produktbereiche in der englischen dunklen Oberflaeche und fuenf dunklen Themes: Sitzungsboard, Vorschlaege, Agents, Skills, Vaults, Nutzung, Erfolge, Git und geplante Laeufe."
  controls:
    previous: Zurueck
    next: Weiter
    current: Hervorgehobene Ansicht
    railLabel: Navigation fuer Produkt-Screenshots
    selectPrefix: 'Wechseln zu: '
    activeState: Jetzt sichtbar
    previewState: Vorschau
    imageUnavailable: Bild nicht verfuegbar
    openFullscreen: 'Vollbild oeffnen: '
    openFullscreenHint: Zum Vergroessern klicken
    zoomIn: "In Originalgröße anzeigen"
    zoomOut: "An Bildschirm anpassen"
    closeFullscreen: Vollbild schliessen
  screenshots:
    sessionBoard:
      title: "Sitzungsboard"
      description: "Vorschlaege, laufende Agents und archivierte Arbeit teilen sich ein Board. So sehen Sie sofort, was wartet, was laeuft und was erledigt ist."
      alt: "HagiCode-Sitzungsboard mit den Spuren Vorschlag und Pruefung, Ausfuehrung und Archiv neben einem Schnellaktionen-Panel des Projekts"
    proposalWorkflow:
      title: "Vorschlags-Workflow"
      description: "Jede Aenderung beginnt als Vorschlag: Spezifikationsdelta, geordnete Aufgaben und Phasenanzeige, die Sie pruefen, bevor Code laeuft."
      alt: "HagiCode-Vorschlagsunterhaltung mit Spezifikationsdelta-Tabelle, Aufgabenliste und Phasenanzeige des Vorschlags"
    agentRoster:
      title: "Agent-Aufstellung"
      description: "Geben Sie jedem Agent ein Avatarbild und eine Aufgabe, gruppiert nach der dahinterliegenden Agent-CLI, und waehlen Sie, wer die naechste Aufgabe uebernimmt."
      alt: "HagiCode-Agent-Arbeitsbereich mit zwoelf Agents, gruppiert nach Claude Code, Codex, OpenCode, Gemini und Hermes"
    agentCli:
      title: "Agent-CLI-Verwaltung"
      description: "Claude Code, Codex, GitHub Copilot, OpenCode und weitere stehen nebeneinander, mit Version und Gesundheitspruefung."
      alt: "HagiCode-Tabelle zur AgentCLI-Verwaltung mit Version und Status jeder unterstuetzten Agent-CLI"
    skillsGallery:
      title: "Skill-Galerie"
      description: "Stoebern Sie in vertrauenswuerdigen Skill-Quellen, vergleichen Sie Installationszahlen und erkennen Sie sofort, welche Skills schon auf diesem Rechner sind."
      alt: "HagiCode-Skill-Galerie mit Skills, Quelle, Installationszahlen und dem Hinweis Lokal installiert"
    vault:
      title: "Vault"
      description: "Halten Sie Team-Playbooks, Vertraege und Referenzen in Vaults, durchsuchen Sie die Dateien und zeigen Sie sie an, ohne die App zu verlassen."
      alt: "HagiCode-Vault-Browser mit Vault-Liste, Dateibaum und Markdown-Vorschau einer Review-Richtlinie"
    tokenUsage:
      title: "Token-Nutzung"
      description: "Die Tokens und Kosten von heute stehen in der Statusleiste, und eine Stufenleiter zeigt, wie intensiv der Tag war."
      alt: "HagiCode-Statusleiste mit Token-Summe und Kosten von heute sowie ein Popover mit den Nutzungsstufen von Breath bis Radiance"
    achievements:
      title: "Erfolgshalle"
      description: "Tagesziele, Online-Wachstum und Langzeitreihen machen stetigen Fortschritt sichtbar."
      alt: "HagiCode-Erfolgshalle mit Tagesabschlussquote, heutiger Beute und der Spur fuer Online-Wachstum"
    gitManagement:
      title: "Git-Verwaltung"
      description: "Pruefen Sie Branch, Sync-Status und uncommittete Aenderungen aller Repositories eines Projekts und committen, pushen oder pullen Sie in einem Panel."
      alt: "HagiCode-Git-Tab eines Projekts mit vier Repositories samt Branch, Sync-Status und Repository-Kurzinfo"
    scheduledPlans:
      title: "Geplante Laeufe"
      description: "Starten Sie Vorschlaege und HagiTasks per Kalender: naechtliche Audits, woechentliche Entwuerfe und einmalige Release-Vorbereitung."
      alt: "HagiCode-Kalender fuer geplante Laeufe im Oktober mit naechtlichen, woechentlichen und einmaligen Plaenen"
