      alt: HagiCode-Screenshot zur Vorschlagsausfuehrung mit Workflow-Phasen, Ausfuehrungsergebnis und Sitzungsseitenleiste
    sessionBoard:
      title: Sitzungsboard und Dungeon-Planung
      description: Ausstehende, laufende und archivierte Sitzungen bleiben neben einem Fantasy-Aufgabenpanel sichtbar, damit parallele Agentenarbeit auf einen Blick erfassbar ist.
      alt: HagiCode-Screenshot des Sitzungsboards mit ausstehenden, laufenden und archivierten Spalten neben einem Fantasy-Aufgabenpanel
    tokenAnalytics:
      title: Token-Analysen in Echtzeit
      description: Durchsatz, aktuelle API-Aktivitaet und Gesamtverbrauch erscheinen in einer gemeinsamen Metrikansicht, damit Kosten und Tempo waehrend paralleler Ausfuehrung kontrollierbar bleiben.
      alt: HagiCode-Screenshot der Token-Analyse mit Durchsatz, aktueller API-Aktivitaet und Gesamtverbrauch
    workspaceManagement:
      title: Arbeitsbereichs- und Vault-Verwaltung
      description: Benutzer-Vaults, System-Vaults und code-server-Einstiegspunkte lassen sich ueber eine gemeinsame Steuerflaeche fuer geteilte Umgebungen und schnelle Wartung verwalten.
      alt: HagiCode-Screenshot der Arbeitsbereichsverwaltung mit Benutzer-Vaults, System-Vaults und code-server-Aktionen
    achievementProgress:
      title: Fortschritt bei Erfolgen und Wachstum
      description: Taeglicher Fortschritt, globales Wachstum und Lifecycle-Metriken laufen in einem Dashboard zusammen, damit langfristige Nutzung messbar statt abstrakt wirkt.
      alt: HagiCode-Screenshot des Erfolgs-Dashboards mit taeglichem Fortschritt, globalem Wachstum und Lifecycle-Metriken
