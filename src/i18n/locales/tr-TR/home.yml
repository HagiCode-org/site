        desc: Her zindana doğru kahraman kaptanı atayın
      battle:
        label: Savaş Raporları
        desc: Her push'tan sonra XP, seviye ve yürütme sonuçlarını inceleyin
    description: Eğlence artık başarı rozetlerine bağlı değil. Kahraman Zindanı, kaptan kadroları, prompt görselleri ve savaş raporları, günlük AI kodlama pratiğini kampüs laboratuvarları ve öğrenci ekipleri için koordine bir maceraya benzeyen bir iş akışına dönüştürür.
