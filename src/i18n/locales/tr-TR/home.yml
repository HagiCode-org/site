      badge: Kahraman Savaşı
      metrics:
        dungeons:
          value: '4'
          label: İlerlenen zindanlar
        level:
          value: Lv.27
          label: Kaptan seviyesi
        xp:
          value: 12.8M
          label: Bugünkü XP
      note: Birkaç zindan paralel ilerlediğinde, rapor deneyim, seviye ve yürütme sonuçlarını tek bir okumada birleştirir.
    gallery:
      dungeons:
        title: Zindan haritası carouseli
        subtitle: Mevcut frontend zindanından ve prompt haritası koleksiyonundan 10 rastgele görsel.
      heroes:
        title: Kahraman galeri carouseli
        subtitle: Mevcut frontend kahraman koleksiyonundan 10 rastgele kahraman görseli.
