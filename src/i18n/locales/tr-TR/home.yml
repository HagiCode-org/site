        desc: Paralel düzeltmeler ve toplu otomasyon
        status: 2 örnek aktif
      prompt:
        title: Prompt Zindanı
        desc: Prompt önizleme ve stil çalışma tezgahı
        status: Görsel senkronizasyon hazır
