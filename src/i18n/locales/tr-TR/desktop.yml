desktop:
  title: Hagicode Masaüstü - İndir
  description: Yerel bir AI kod asistanı olan Hagicode Masaüstü'nü indirin. Windows, macOS ve Linux desteği. Gizlilik koruması, hızlı yanıt.
  features:
    title: Temel Özellikler
    local:
      title: Yerel Yürütme
      description: Tüm veriler buluta yüklenmeden yerel olarak işlenir, kod gizliliğini ve güvenliğini sağlar
    privacy:
      title: Gizlilik Koruması
      description: Kod asla yüklenmez, çevrimdışı kullanımı destekler, fikri mülkiyetinizi korur
    fast:
      title: Hızlı Yanıt
      description: Milisaniye düzeyinde yanıt süresi, ağ isteği gerekmez, geliştirme verimliliğini artırır
    crossPlatform:
      title: Çapraz Platform Desteği
      description: Farklı geliştirme ortamı ihtiyaçlarını karşılamak için Windows, macOS ve Linux destekler
    autoUpdate:
      title: Otomatik Güncellemeler
      description: Güncellemeleri otomatik olarak kontrol eder ve tek tıkla en son sürüme yükseltir
    multiLanguage:
      title: Çoklu Dil Desteği
      description: Yerleşik Çince ve İngilizce arayüz, uluslararası ekip işbirliğini destekler
  systemRequirements:
    title: Sistem Gereksinimleri
    windows: Windows
    macos: macOS
    linux: Linux
    os: İşletim Sistemi
    processor: İşlemci
    memory: Bellek
    diskSpace: Disk Alanı
    network: Ağ
    windowsOs: Windows 10/11 (64-bit)
    macosOs: macOS 12+ (Monterey veya üzeri)
    linuxOs: Ubuntu 20.04+ / Debian 11+ / Diğer ana akım dağıtımlar
    windowsProcessor: Intel Core i3 veya eşdeğer işlemci
    macosProcessor: Apple Silicon (M1/M2/M3) veya Intel Core i3+
    linuxProcessor: Intel Core i3 veya eşdeğer işlemci
    memoryRec: 4GB RAM (8GB önerilir)
    disk: 2GB kullanılabilir alan
    networkDesc: İlk indirme için ağ bağlantısı gerekir (daha sonra çevrimdışı kullanılabilir)
  download:
    title: İndirme Paketleri
    windowsDesc: Windows 10/11 için kararlı yükleyiciler, kurulum ve taşınabilir sürümler dahil.
    macosDesc: Apple Silicon ve Intel Mac'ler için yerel sürümler.
    linuxDesc: Ana akım x64 ve ARM64 Linux dağıtımları için AppImage ve tarball paketleri.
    note: Buradaki paket listesi yüklenemezse, hero alanındaki sürüm geçmişi bağlantısını kullanarak standart dizine erişin.
    features:
      signed: İmzalanmış paketler
      autoUpdate: Otomatik güncelleme algılama
      multiLanguage: Çoklu dil arayüzü
  installation:
    title: Hızlı Kurulum
    step1:
      number: '1'
      title: Yükleyiciyi İndir
      description: İşletim sisteminiz için uygun yükleyiciyi seçin
    step2:
      number: '2'
      title: Yükleyiciyi Çalıştır
      description: İndirilen yükleyiciyi çift tıklayın ve kurulumu tamamlamak için yönergeleri izleyin
    step3:
      number: '3'
      title: Uygulamayı Başlat
      description: İlk başlatmada, sizi ilk yapılandırma süreçlerinde yönlendirecektir
    step4:
      number: '4'
      title: Kullanmaya Başlayın
      description: Yapılandırma tamamlandıktan sonra Hagicode Masaüstü'nü kullanmaya başlayabilirsiniz
  faq:
    title: SSS
    q1:
      question: Masaüstü ve Sunucu sürümleri arasındaki fark nedir?
      intro: 'Hagicode iki dağıtım seçeneği sunar: Masaüstü sürümü ve Sunucu sürümü. Her birinin avantajları vardır, ancak her ikisi de kullanıcı kontrollü sunucu ve veri yaklaşımını benimser ve daha iyi veri koruması sağlar.'
      desktopTitle: Masaüstü Sürümü
      desktop1: Bilgisayarınızda yerel olarak çalışır, daha hafiftir
      desktop2: Sunucu yapılandırması gerekmez, kutudan çıkarılmış halde kullanıma hazırdır
      desktop3: Bireysel geliştiriciler ve hafif kullanım senaryoları için uygundur
      desktop4: Tüm veriler tamamen yereldir
      serverTitle: Sunucu Sürümü
      server1: Uzak sunucularda dağıtılabilir
      server2: Çok kullanıcılı uzaktan erişimi destekler
      server3: Ekip işbirliği ve ölçeklendirme için daha uygundur
      server4: Gelecekteki kurumsal özellikler ve çoklu cihaz senkronizasyonu için hazırlık sağlar
      conclusion: Hangi sürümü seçerseniz seçin, sunucunuz ve verileriniz üzerinde tam kontrole sahipsiniz, daha iyi gizlilik koruması ve veri güvenliğinin tadını çıkarırsınız.
    q2:
      question: Kurulumdan sonra ne yapmalıyım?
      intro: 'Hagicode Masaüstü temelde bir başlatıcıdır. Kurulumdan sonraki ilk başlatmada, sizi şu adımlarda yönlendirecektir:'
      step1: '<strong>Hagicode Core''u İndir:</strong> Masaüstü, Hagicode çekirdek bileşenlerini otomatik olarak algılayacak ve indirmenizi isteyecektir'
      step2: '<strong>Çekirdek Bileşenleri Kur:</strong> Ekrandaki yönergeleri izleyerek çekirdek bileşen kurulumunu tamamlayın'
      step3: '<strong>Varsayılan Agent CLI''nizi Yapılandır:</strong> Şu anda desteklenen bir Agent CLI seçin ve gerekli oturum açma, yetkilendirme veya yerel kurulum adımlarını tamamlayın.'
      note: Masaüstü arayüzü tüm süreci yönlendirir. Hagicode Core'un indirebilmesi için ilk başlatmada ağ bağlantısını kullanılabilir tutun; bazı Agent CLI'ler hala manuel kurulum veya kimlik doğrulama gerektirebilir, ancak bunlar hala mevcut destek kapsamının bir parçasıdır.
      done: Bu adımları tamamladıktan sonra, tüm Hagicode Masaüstü özelliklerini normal olarak kullanabilirsiniz.
    q3:
      question: Güncellemeleri nasıl kontrol edebilirim?
      answer: Masaüstü güncellemeleri otomatik olarak kontrol eder. Yeni bir sürüm mevcut olduğunda, arayüzün sağ üst köşesinde bir bildirim görünecektir. "Ayarlar"dan da manuel olarak güncelleme kontrolü yapabilirsiniz.
    q4:
      question: Hangi AI Agent CLI'leri destekleniyor?
      intro: 'Hagicode Masaüstü şu anda şu Agent CLI''leri desteklemektedir:'
      active: '<strong>Şu anda desteklenen:</strong> Claude Code, Codex, GitHub Copilot, OpenCode, Hermes, QoderCLI, Kiro, Kimi, Gemini, DeepAgents ve Codebuddy'
      manual: '<strong>Manuel kurulum veya kimlik doğrulama:</strong> Hermes, Gemini ve DeepAgents önce yerel bir kurulum veya kimlik doğrulama adımı gerektirir; diğer CLI''ler tek tıkla kurulum giriş noktaları veya yönlendirmeli kurulum akışları sağlar.'
      legacy: '<strong>Yalnızca eski uyumluluk:</strong> IFlowCli yalnızca geçmiş veri uyumluluğu için kalmıştır ve mevcut aktif destek kapsamının bir parçası değildir.'
      closing: Destek kapsamı ve kurulum modu ayrı konulardır. Manuel kurulum gerektiren bir CLI hala desteklenmektedir.
    q5:
      question: Çevrimdışı kullanımı destekliyor mu?
      intro: 'Evet! Hagicode Masaüstü tam çevrimdışı kullanımı destekler:'
      point1: İlk kurulum ve yapılandırma için ağ bağlantısı gerekir (çekirdek bileşenler ve AI modellerinin indirilmesi)
      point2: Yapılandırma sonrasında tüm özellikler çevrimdışı kullanılabilir
      point3: Kodunuz ve verileriniz asla buluta yüklenmez
      point4: Tüm AI işleme yerel olarak tamamlanır
    q6:
      question: macOS, Hagicode.app hasarlı veya açılamıyor diyor. Ne yapmalıyım?
      intro: Hagicode Masaüstü varsayılan yola /Applications/Hagicode.app olarak yüklenmişse ve macOS Gatekeeper ilk başlatmayı engelliyorsa, uygulamadan karantina özniteliğini kaldırmak için şu komutu kullanın.
      cause: Bu, macOS'un internetten indirilen uygulamalara com.apple.quarantine özniteliği eklemesi nedeniyle oluşur. Bu bir macOS güvenlik yalıtımı sorunudur, Hagicode yükleyicisindeki bir hata değildir.
      command: sudo xattr -dr com.apple.quarantine /Applications/Hagicode.app
      note: Komutu yönetici ayrıcalıklarıyla Terminal'de çalıştırın, ardından Hagicode Masaüstü'nü yeniden başlatın.
    q7:
      question: Sorunlarla karşılaştığımda nasıl yardım alabilirim?
      intro: 'Hagicode Masaüstü''nü kullanırken sorunlarla karşılaşırsanız, şu yollarla yardım alabilirsiniz:'
      point1: '<strong>Teknik Destek Grubu:</strong> QQ Grubu 610394020''ye katılın'
      point2: '<strong>Çevrimiçi Belgeler:</strong> Kapsamlı kullanım belgelerini ve eğitimleri görüntüleyin'
      point3: '<strong>GitHub Sorunları:</strong> Proje deposunda sorun raporları gönderin'
