      title: Gerçek zamanlı token analitiği
      description: İş hacmini, son API etkinliğini ve toplam kullanımı tek bir metrik yüzeyinde izleyin, böylece paralel yürütme sırasında maliyet ve hız kontrol altında kalır.
      alt: İş hacmini, son API etkinliğini ve toplam kullanımı gösteren HagiCode token analitiği ekran görüntüsü
    workspaceManagement:
      title: Çalışma alanı ve kasa yönetimi
      description: Kullanıcı kasalarını, sistem kasalarını ve code-server giriş noktalarını, paylaşılan ortamlar ve hızlı bakım için tasarlanmış tek bir kontrol yüzeyinden yönetin.
      alt: Kullanıcı kasalarını, sistem kasalarını ve code-server eylemlerini gösteren HagiCode çalışma alanı yönetimi ekran görüntüsü
    achievementProgress:
      title: Başarı ve büyüme ilerlemesi
      description: Günlük ilerleme, küresel büyüme ve yaşam döngüsü metrikleri tek bir panoda toplanır, böylece uzun süreli benimseme soyut yerine ölçülebilir hissedilir.
      alt: Günlük ilerlemeyi, küresel büyümeyi ve yaşam döngüsü metriklerini gösteren HagiCode başarı panosu ekran görüntüsü
