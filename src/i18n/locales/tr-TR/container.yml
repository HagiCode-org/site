container:
  title: Hagicode Kapsayıcı - Kapsayıcı Dağıtımı
  description: Docker Compose Builder ile Hagicode'u dağıtın. Basit yapılandırma, kullanıma hazır. Birden fazla görüntü kaynağı ve otomatik güncellemeleri destekler.
  hero:
    badge: Kapsayıcı
    title: Hagicode Kapsayıcı
    tagline: Docker Compose Builder ile hızlı dağıtım, basit yapılandırma, kullanıma hazır
    value1: Görsel yapılandırma, kodlama gerekmez
    value2: Ortam yalıtımı, veri güvenliği
    value3: Tek tıkla dağıtım, hızlı başlangıç
    ctaButton: Docker Compose Builder ile Dağıt
    features:
      isolation: Ortam Yalıtımı
      oneClick: Tek Tıkla Dağıtım
      fastStart: Hızlı Başlangıç
  features:
    title: Neden Kapsayıcı Dağıtımı?
    isolation:
      title: Ortam Yalıtımı
      description: Kapsayıcılı dağıtım bağımlılık çakışmalarını önler, sistem ortamını etkilemez, sistemi temiz tutar
    simple:
      title: Basit Yapılandırma
      description: Görsel yapılandırma için Docker Compose Builder kullanın, karmaşık betikler yazmanıza gerek yok
    crossPlatform:
      title: Çapraz Platform Desteği
      description: x86_64 mimarisini destekler, çeşitli sunucular ve bulut platformları için uygundur
    persistent:
      title: Veri Kalıcılığı
      description: Volume bağlamayı destekler, güvenli ve güvenilir veri, kapsayıcı yeniden başlatıldığında veri kaybı olmaz
    autoUpdate:
      title: Otomatik Güncellemeler
      description: Otomatik güncellemeler için watchtower desteği, en son sürümü kolayca edinin
    productionReady:
      title: Üretime Hazır
      description: Üretim ortamları için tasarlanmıştır, yüksek kullanılabilirlik ve yatay ölçeklendirmeyi destekler
  builder:
    title: Docker Compose Builder
    subtitle: En basit ve önerilen kapsayıcı dağıtım yöntemi
    visual:
      title: Görsel Yapılandırma
      description: Tüm parametreleri kolay bir Web arayüzü üzerinden yapılandırın, YAML dosyalarını manuel olarak düzenlemenize gerek yok
    generate:
      title: Tek Tıkla Yapılandırma Oluşturma
      description: En iyi uygulama yapılandırmalarıyla eksiksiz docker-compose.yml dosyalarını otomatik olarak oluşturun
    deploy:
      title: Hızlı Dağıtım
      description: Tek tıkla yapılandırma dosyalarını indirin ve hizmetleri başlatın, dakikalar içinde dağıtımı tamamlayın
    secure:
      title: Güvenli ve Güvenilir
      description: Yerleşik güvenlik en iyi uygulamaları, veri birimlerini ve yeniden başlatma ilkelerini otomatik olarak yapılandırır
    ctaButton: Docker Compose Builder'a Git
  mirrors:
    title: Görüntü Kaynağı Seçimi
    description: Ağ ortamınıza ve konumunuza göre en uygun görüntü kaynağını seçin
    dockerHub: Docker Hub
    dockerHubDesc: Dünyanın en büyük kapsayıcı görüntü kayıt defteri, uluslararası ağ kullanıcıları için uygundur
    dockerHubCmd: newbe36524/hagicode:0
    azure: Azure ACR
    azureDesc: Microsoft Azure'ın görüntü hizmeti, Çin'den daha hızlı erişim
    azureCmd: hagicode.azurecr.io/hagicode:0
    aliyun: Aliyun ACR
    aliyunDesc: Aliyun'un yurtiçi görüntü hızlandırması, anakara Çin'deki kullanıcılar için önerilir
    aliyunCmd: registry.cn-hangzhou.aliyuncs.com/hagicode/hagicode:0
  faq:
    title: SSS
    q1:
      question: Kapsayıcı ve Masaüstü sürümleri arasındaki fark nedir?
      intro: 'Her iki sürümün de avantajları vardır. Kullanım senaryonuza göre seçebilirsiniz:'
      desktopTitle: Masaüstü Sürümü
      desktop1: Bilgisayarınızda yerel olarak çalışır, daha hafiftir
      desktop2: Sunucu yapılandırması gerekmez, kutudan çıkarılmış halde kullanıma hazırdır
      desktop3: Bireysel geliştiriciler ve hafif kullanım senaryoları için uygundur
      desktop4: Tüm veriler tamamen yereldir
      containerTitle: Kapsayıcı Sürümü
      container1: Sunucularda dağıtılabilir, uzaktan erişimi destekler
      container2: Ortam yalıtımı, sistem ortamını etkilemez
      container3: Ekip işbirliği ve üretim ortamları için daha uygundur
      container4: Otomatik dağıtım ve yatay ölçeklendirmeyi destekler
    q2:
      question: Docker Compose Builder nedir?
      intro: 'Docker Compose Builder, size yardımcı olan görsel yapılandırma aracımızdır:'
      point1: Tüm kapsayıcı parametrelerini bir Web arayüzü üzerinden yapılandırın
      point2: docker-compose.yml dosyalarını otomatik olarak oluşturun
      point3: Yerleşik en iyi uygulamalar ve güvenlik yapılandırmaları
      point4: Tek tıkla indirme ve hizmetleri başlatma
      note: Karmaşık YAML yapılandırmalarını manuel olarak yazmanıza gerek yok. Docker başlangıç seviyesindeki kullanıcılar bile kolayca dağıtım yapabilir.
    q3:
      question: Kapsayıcı sürümü hangi sistem mimarilerini destekler?
      answer: Hagicode kapsayıcı görüntüleri şu anda <strong>x86_64 (amd64)</strong> mimarisini desteklemektedir, çoğu sunucu ve PC için uygundur.
      note: Docker, görüntüleri çekerken sisteminiz için uygun mimariyi otomatik olarak seçecektir.
    q4:
      question: Kapsayıcı nasıl güncellenir?
      intro: 'Docker Compose dağıtımı kullanırken, güncelleme çok basittir:'
      code: |-
        docker-compose pull
        docker-compose up -d
      watchtower: Veya otomatik güncellemeler için Watchtower kullanın.
    q5:
      question: Veri kalıcılığı nasıl yapılandırılır?
      intro: 'Docker Compose Builder veri birimlerini otomatik olarak yapılandırır. Varsayılan olarak, verileriniz Docker Volumes içinde saklanır ve şunları sağlar:'
      point1: Kapsayıcılar silindiğinde veriler kaybolmaz
      point2: Kapsayıcı yükseltmeleri sırasında veriler korunur
      point3: Kolay yedekleme ve kurtarma
    q6:
      question: Kapsayıcı başlatılamadığında ne yapmalıyım?
      intro: 'Kapsayıcı başlatma hatasını giderme adımları:'
      step1:
        title: 'Kapsayıcı durumunu kontrol edin:'
        code: docker-compose ps
      step2:
        title: 'Kapsayıcı günlüklerini kontrol edin:'
        code: docker-compose logs hagicode
      step3:
        title: 'Port kullanımını kontrol edin:'
        desc: 'Hizmet portunuz 3000 ise, kontrol etmek için şu komutu kullanın:'
        code: netstat -tlnp | grep 3000
        solution: 'Port kullanılıyorsa, şunları yapabilirsiniz:'
        solution1: Portu kullanan işlemi durdurun
        solution2: Veya Docker Compose Builder'da farklı bir port yapılandırın
      help: Sorun devam ederse, lütfen ayrıntılı belgeleri kontrol edin veya teknik destekle iletişime geçin.
  cta:
    title: Docker Compose Builder'ı Kullanmaya Başlayın
    subtitle: En basit ve önerilen kapsayıcı dağıtım yöntemi
    button: Dağıtım Kılavuzuna Git
    github: GitHub Deposu
