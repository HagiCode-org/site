desktop:
  title: Hagicode Desktop - Nedlasting
  description: Last ned Hagicode Desktop, en lokalisert AI-kodeassistent. Støtter Windows, macOS og Linux. Personvern, rask respons.
  features:
    title: Nøkkelfunksjoner
    local:
      title: Lokal utførelse
      description: Alle data behandles lokalt uten opplasting til skyen, noe som sikrer kodepersonvern og sikkerhet
    privacy:
      title: Personvern
      description: Kode lastes aldri opp, støtter frakoblet bruk, beskytter din intellektuelle eiendom
    fast:
      title: Rask respons
      description: Millisekunders responstid, ingen nettverksforespørsler nødvendig, øker utviklingseffektiviteten
    crossPlatform:
      title: Kryssplattformstøtte
      description: Støtter Windows, macOS og Linux for å møte ulike utviklingsmiljøbehov
    autoUpdate:
      title: Automatiske oppdateringer
      description: Sjekker automatisk etter oppdateringer og oppgraderer til nyeste versjon med ett klikk
    multiLanguage:
      title: Flerspråklig støtte
      description: Innebygd kinesisk og engelsk grensesnitt, støtter internasjonalt teamssamarbeid
  systemRequirements:
    title: Systemkrav
    windows: Windows
    macos: macOS
    linux: Linux
    os: Operativsystem
    processor: Prosessor
    memory: Minne
    diskSpace: Diskplass
    network: Nettverk
    windowsOs: Windows 10/11 (64-bit)
    macosOs: macOS 12+ (Monterey eller nyere)
    linuxOs: Ubuntu 20.04+ / Debian 11+ / Andre hoveddistribusjoner
    windowsProcessor: Intel Core i3 eller tilsvarende prosessor
    macosProcessor: Apple Silicon (M1/M2/M3) eller Intel Core i3+
    linuxProcessor: Intel Core i3 eller tilsvarende prosessor
    memoryRec: 4GB RAM (8GB anbefalt)
    disk: 2GB tilgjengelig plass
    networkDesc: Nettverkstilkobling kreves for første nedlasting (kan brukes frakoblet etterpå)
  download:
    title: Nedlastingspakker
    windowsDesc: Stabile installasjonsprogrammer for Windows 10/11, inkludert setup og portable versjoner.
    macosDesc: Native bygg for Apple Silicon og Intel Mac-er.
    linuxDesc: AppImage- og tarball-pakker for hovedstrøms x64- og ARM64 Linux-distribusjoner.
    note: Hvis pakkelisten her ikke laster, bruk versjonshistorikk-lenken i hero-området for å få tilgang til den kanoniske indeksen.
    features:
      signed: Signerte pakker
      autoUpdate: Automatisk oppdateringsdeteksjon
      multiLanguage: Flerspråklig grensesnitt
  installation:
    title: Rask installasjon
    step1:
      number: '1'
      title: Last ned installasjonsprogram
      description: Velg passende installasjonsprogram for ditt operativsystem
    step2:
      number: '2'
      title: Kjør installasjonsprogram
      description: Dobbeltklikk det nedlastede installasjonsprogrammet og følg instruksjonene for å fullføre installasjonen
    step3:
      number: '3'
      title: Start appen
      description: Ved første oppstart vil den veilede deg gjennom første konfigurasjon
    step4:
      number: '4'
      title: Begynn å bruke
      description: Etter konfigurasjon kan du begynne å bruke Hagicode Desktop
  faq:
    title: Vanlige spørsmål
    q1:
      question: Hva er forskjellen mellom Desktop- og Server-versjonene?
      intro: 'Hagicode tilbyr to distribusjonsalternativer: Desktop-versjon og Server-versjon. Hver har sine fordeler, men begge bruker en brukerkontrollert server- og datatilnærming som gir bedre databeskyttelse.'
      desktopTitle: Desktop-versjon
      desktop1: Kjører lokalt på datamaskinen din, mer lettvektig
      desktop2: Ingen serverkonfigurasjon nødvendig, klar til bruk rett ut av esken
      desktop3: Egnet for individuelle utviklere og lette bruksscenarioer
      desktop4: Alle data fullstendig lokalisert
      serverTitle: Server-versjon
      server1: Kan distribueres på eksterne servere
      server2: Støtter flerbruker ekstern tilgang
      server3: Bedre egnet for teamssamarbeid og skalering
      server4: Forbereder fremtidige bedriftsfunksjoner og flerenhets-synkronisering
      conclusion: Uansett hvilken versjon du velger, har du full kontroll over serveren og dataene dine, og nyter bedre personvern og datasikkerhet.
    q2:
      question: Hva må jeg gjøre etter installasjonen?
      intro: 'Hagicode Desktop er i hovedsak en oppstarter. Ved første oppstart etter installasjon vil den veilede deg gjennom disse trinnene:'
      step1: '<strong>Last ned Hagicode Core:</strong> Desktop vil automatisk oppdage og be deg om å laste ned Hagicode-kjernekomponenter'
      step2: '<strong>Installer kjernekomponenter:</strong> Følg instruksjonene på skjermen for å fullføre installasjonen av kjernekomponentene'
      step3: '<strong>Konfigurer din standard Agent CLI:</strong> Velg en Agent CLI som for øyeblikket støttes og fullfør nødvendige innlogging-, autorisasjons- eller lokale installasjonstrinn.'
      note: Desktop-grensesnittet veileder hele flyten. Hold nettverket tilgjengelig ved første oppstart slik at Hagicode Core kan lastes ned; noen Agent CLI-er krever fortsatt manuell installasjon eller autentisering, men de er fortsatt en del av det nåværende støtteområdet.
      done: Etter å ha fullført disse trinnene kan du bruke alle Hagicode Desktop-funksjoner normalt.
    q3:
      question: Hvordan sjekker jeg etter oppdateringer?
      answer: Desktop sjekker automatisk etter oppdateringer. Når en ny versjon er tilgjengelig, vises en melding i øvre høyre hjørne av grensesnittet. Du kan også manuelt sjekke etter oppdateringer i "Innstillinger".
    q4:
      question: Hvilke AI Agent CLI-er støttes?
      intro: 'Hagicode Desktop støtter for øyeblikket følgende Agent CLI-er:'
      active: '<strong>For øyeblikket støttet:</strong> Claude Code, Codex, GitHub Copilot, OpenCode, Hermes, QoderCLI, Kiro, Kimi, Gemini, DeepAgents og Codebuddy'
      manual: '<strong>Manuell installasjon eller autentisering:</strong> Hermes, Gemini og DeepAgents krever en lokal installasjon eller autentiseringstrinn først; de andre CLI-ene tilbyr ett-klikks installasjonsinngangspunkter eller veiledede installasjonsflyter.'
      legacy: '<strong>Kun eldre kompatibilitet:</strong> IFlowCli gjenstår kun for historisk datakompatibilitet og er ikke en del av det nåværende aktive støtteområdet.'
      closing: Støtteområde og oppsettmodus er separate forhold. En CLI som krever manuell installasjon er fortsatt støttet nå.
    q5:
      question: Støttes frakoblet bruk?
      intro: 'Ja! Hagicode Desktop støtter komplett frakoblet bruk:'
      point1: Nettverkstilkobling kreves for første installasjon og konfigurasjon (nedlasting av kjernekomponenter og AI-modeller)
      point2: Alle funksjoner kan brukes frakoblet etter konfigurasjon
      point3: Koden og dataene dine lastes aldri opp til skyen
      point4: All AI-behandling fullføres lokalt
    q6:
      question: macOS sier at Hagicode.app er skadet eller ikke kan åpnes. Hva gjør jeg?
      intro: Hvis Hagicode Desktop er installert i standardstien /Applications/Hagicode.app og macOS Gatekeeper blokkerer første oppstart, bruk følgende kommando for å fjerne karanteneattributtet fra appen.
      cause: Dette skjer fordi macOS legger til com.apple.quarantine-attributtet til apper lastet ned fra internett. Det er et macOS-sikkerhetsisolasjonsproblem, ikke en feil i Hagicode-installasjonsprogrammet.
      command: sudo xattr -dr com.apple.quarantine /Applications/Hagicode.app
      note: Kjør kommandoen i Terminal med administratorrettigheter, og start deretter Hagicode Desktop på nytt.
    q7:
      question: Hvordan få hjelp ved problemer?
      intro: 'Hvis du opplever problemer mens du bruker Hagicode Desktop, kan du få hjude gjennom:'
      point1: '<strong>Teknisk støttegruppe:</strong> Bli med i QQ-gruppe 610394020'
      point2: '<strong>Nettdokumentasjon:</strong> Se komplett bruksdokumentasjon og opplæringsmateriell'
      point3: '<strong>GitHub Issues:</strong> Send inn problemrapporter i prosjektrepositoriet'
