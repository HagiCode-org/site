    workspaceManagement:
      title: Arbeidsområde og hvelvhåndtering
      description: Håndter brukerhvelv, systemhvelv og code-server inngangspunkter fra én kontrollflate bygget for delte miljøer og raskt vedlikehold.
      alt: HagiCode arbeidsområdehåndtering skjermbilde som viser brukerhvelv, systemhvelv og code-server-handlinger
    achievementProgress:
      title: Prestasjons- og vekstframgang
      description: Daglig framgang, global vekst og livssyklusmetrikker rulles inn i én dashboard, slik at langvarig adopsjon føles målbart i stedet for abstrakt.
