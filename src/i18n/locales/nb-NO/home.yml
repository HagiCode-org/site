        category: Ytelses-DLC
        title: 'Hagicode: Turbo Engine DLC'
        price: Steam
        description: Du kan kjøpe denne DLC-en separat for å utvide den opprinnelige forslagssamtidighetsgrensen, låse opp kopi-bytte, legge til fem avatar-pakker med 10 selvstendige avatarer hver, aktivere tilpassede avatar-opplastinger, tilpasse logo og tittel øverst til venstre, og tilpasse AI-genererte commit-trailere med dine egne Co-Authored-By-navneregler. Vi vil vanligvis fremheve en buntkjøpsopsjon kalt Hagicode Plus slik at den samlede kjøpesummen forblir lavere. Sjekk vår butikkside for de siste endringene.
        bullets:
          - Støtter tilpasset logo og tittel øverst til venstre
          - Inkluderer fem avatar-pakker med 10 valgbare avatarer i hver pakke
          - Støtter tilpassede avatar-opplastinger
          - Lar team tilpasse AI Co-Authored-By-signaturen for commit-arbeidsflyter
          - Låser opp støtte for kopi- og ordlydbytte
          - Utvider grensen for maksimum samtidige forslag til 32
      hagicodePlus:
        category: Bunt
        title: Hagicode Plus
        price: Steam
        description: Den offisielle Steam-bunten som kombinerer Hagicode-baseutgaven med Turbo Engine DLC i én kjøpsvei.
        bullets:
          - Samler hoved Steam-utgaven og Turbo Engine DLC sammen
          - Beholder den høyere 32-forslagssamtidighetsoppgraderingen knyttet til buntveien
          - Fungerer som det klarreste kjøpsinngangspunktet når du vil ha komplett Steam-oppsett på én gang
      sponsor:
        category: Støttespiller-DLC
        title: Hagicode - Sponsor Pack
        price: Steam
        description: Hvis du synes Hagicode er genuint utmerket og vil gi direkte finansiell støtte, gir kjøp av Sponsor Pack prosjektet mer drivkraft og hjelper oss med å holde det i gang langsiktig.
        bullets:
          - Ett eksklusivt mørkt tema
          - Ett eksklusivt lyst tema
          - Én eksklusiv Steam-prestasjon
