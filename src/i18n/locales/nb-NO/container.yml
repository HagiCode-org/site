container:
  title: Hagicode Container - Container-distribusjon
  description: Distribuer Hagicode via Docker Compose Builder. Enkel konfigurasjon, klar til bruk. Støtter flere bildekilder og automatiske oppdateringer.
  hero:
    badge: Container
    title: Hagicode Container
    tagline: Distribuer raskt med Docker Compose Builder, enkel konfigurasjon, klar til bruk
    value1: Visuell konfigurasjon, ingen koding nødvendig
    value2: Miljøisolasjon, datasikkerhet
    value3: Ett-klikks distribusjon, rask oppstart
    ctaButton: Distribuer med Docker Compose Builder
    features:
      isolation: Miljøisolasjon
      oneClick: Ett-klikks distribusjon
      fastStart: Rask oppstart
  features:
    title: Hvorfor velge container-distribusjon?
    isolation:
      title: Miljøisolasjon
      description: Containerisert distribusjon unngår avhengighetskonflikter, påvirker ikke systemmiljøet, holder systemet rent
    simple:
      title: Enkel konfigurasjon
      description: Bruk Docker Compose Builder for visuell konfigurasjon, ingen behov for å skrive komplekse skript
    crossPlatform:
      title: Kryssplattformstøtte
      description: Støtter x86_64-arkitektur, egnet for ulike servere og skylplattformer
    persistent:
      title: Datapersistens
      description: Støtter Volume-montering, sikre og pålitelige data, ingen datatap ved container-omstart
    autoUpdate:
      title: Automatiske oppdateringer
      description: Støtter watchtower for automatiske oppdateringer, få enkelt den nyeste versjonen
    productionReady:
      title: Klar for produksjon
      description: Designet for produksjonsmiljøer, støtter høy tilgjengelighet og horisontal skalering
  builder:
    title: Docker Compose Builder
    subtitle: Den enkleste og anbefalte container-distribusjonsmetoden
    visual:
      title: Visuell konfigurasjon
      description: Konfigurer alle parametere gjennom et brukervennlig webgrensesnitt, ingen behov for å manuelt redigere YAML-filer
    generate:
      title: Ett-klikks konfigurasjonsgenerering
      description: Generer automatisk komplette docker-compose.yml-filer med beste praksis-konfigurasjoner
    deploy:
      title: Rask distribusjon
      description: Ett-klikks nedlasting av konfigurasjonsfiler og start av tjenester, fullfør distribusjon på minutter
    secure:
      title: Sikkert og pålitelig
      description: Innebygde sikkerhetsbestepraksiser, konfigurerer automatisk datavolumer og omstartspolicyer
    ctaButton: Gå til Docker Compose Builder
  mirrors:
    title: Bildekildevalg
    description: Velg den mest passende bildekilden basert på ditt nettverksmiljø og plassering
    dockerHub: Docker Hub
    dockerHubDesc: Verdens største container-bilderegister, egnet for internasjonale nettverksbrukere
    dockerHubCmd: newbe36524/hagicode:0
    azure: Azure ACR
    azureDesc: Microsoft Azures bildetjeneste, raskere tilgang fra Kina
    azureCmd: hagicode.azurecr.io/hagicode:0
    aliyun: Aliyun ACR
    aliyunDesc: Aliyuns innenlandske bildeakselerasjon, anbefalt for brukere i Fastlands-Kina
    aliyunCmd: registry.cn-hangzhou.aliyuncs.com/hagicode/hagicode:0
  faq:
    title: Vanlige spørsmål
    q1:
      question: Hva er forskjellen mellom Container- og Desktop-versjonene?
      intro: 'Begge versjonene har sine fordeler. Du kan velge basert på ditt bruksscenario:'
      desktopTitle: Desktop-versjon
      desktop1: Kjører lokalt på datamaskinen din, mer lettvektig
      desktop2: Ingen serverkonfigurasjon nødvendig, klar til bruk rett ut av esken
      desktop3: Egnet for individuelle utviklere og lette bruksscenarioer
      desktop4: Alle data fullstendig lokalisert
      containerTitle: Container-versjon
      container1: Kan distribueres på servere, støtter ekstern tilgang
      container2: Miljøisolasjon, påvirker ikke systemmiljøet
      container3: Bedre egnet for teamssamarbeid og produksjonsmiljøer
      container4: Støtter automatisert distribusjon og horisontal skalering
    q2:
      question: Hva er Docker Compose Builder?
      intro: 'Docker Compose Builder er vårt visuelle konfigurasjonsverktøy som hjelper deg med å:'
      point1: Konfigurere alle container-parametere gjennom et webgrensesnitt
      point2: Automatisk generere docker-compose.yml-filer
      point3: Innebygde beste praksiser og sikkerhetskonfigurasjoner
      point4: Ett-klikks nedlasting og start av tjenester
      note: Ingen behov for å manuelt skrive komplekse YAML-konfigurasjoner. Selv Docker-nybegynnere kan distribuere enkelt.
    q3:
      question: Hvilke systemarkitekturer støtter container-versjonen?
      answer: Hagicode container-bilder støtter for øyeblikket <strong>x86_64 (amd64)</strong>-arkitektur, egnet for de fleste servere og PC-er.
      note: Docker vil automatisk velge riktig arkitektur for ditt system ved pulling av bilder.
    q4:
      question: Hvordan oppdatere containeren?
      intro: 'Når du bruker Docker Compose-distribusjon, er oppdatering veldig enkelt:'
      code: |-
        docker-compose pull
        docker-compose up -d
      watchtower: Eller bruk Watchtower for automatiske oppdateringer.
    q5:
      question: Hvordan konfigurere datapersistens?
      intro: 'Docker Compose Builder konfigurerer automatisk datavolumer. Som standard vil dataene dine bli lagret i Docker Volumes, som sikrer:'
      point1: Data går ikke tapt når containere slettes
      point2: Data bevares under container-oppgraderinger
      point3: Enkel sikkerhetskopiering og gjenoppretting
    q6:
      question: Hva gjør jeg hvis container-oppstart feiler?
      intro: 'Trinn for å feilsøke container-oppstartsfeil:'
      step1:
        title: 'Sjekk container-status:'
        code: docker-compose ps
      step2:
        title: 'Sjekk container-logger:'
        code: docker-compose logs hagicode
      step3:
        title: 'Sjekk portbruk:'
        desc: 'Hvis tjenesteporten din er 3000, bruk denne kommandoen for å sjekke:'
        code: netstat -tlnp | grep 3000
        solution: 'Hvis porten er i bruk, kan du:'
        solution1: Stoppe prosessen som bruker porten
        solution2: Eller konfigurere en annen port i Docker Compose Builder
      help: Hvis problemet vedvarer, sjekk den detaljerte dokumentasjonen eller kontakt teknisk støtte.
  cta:
    title: Begynn å bruke Docker Compose Builder
    subtitle: Den enkleste og anbefalte container-distribusjonsmetoden
    button: Gå til distribusjonsguide
    github: GitHub-repositorium
