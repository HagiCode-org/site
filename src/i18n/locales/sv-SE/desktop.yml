desktop:
  title: Hagicode Desktop - Nedladdning
  description: Ladda ner Hagicode Desktop, en lokaliserad AI-kodassistent. Stöder Windows, macOS och Linux. Integritetsskydd, snabb respons.
  features:
    title: Huvudfunktioner
    local:
      title: Lokal Exekvering
      description: All data bearbetas lokalt utan uppladdning till molnet, vilket säkerställer kodintegritet och säkerhet
    privacy:
      title: Integritetsskydd
      description: Koden laddas aldrig upp, stöder offlineanvändning, skyddar din immateriella rättighet
    fast:
      title: Snabb Respons
      description: Responstid på millisekundnivå, inga nätverksbegäranden behövs, ökar utvecklingseffektiviteten
    crossPlatform:
      title: Multiplattformsstöd
      description: Stöder Windows, macOS och Linux för att möta olika utvecklingsmiljöbehov
    autoUpdate:
      title: Automatiska Uppdateringar
      description: Söker automatiskt efter uppdateringar och uppgraderar till den senaste versionen med ett klick
    multiLanguage:
      title: Flerspråkigt Stöd
      description: Inbyggt kinesiskt och engelskt gränssnitt, stöder internationellt teamsamarbete
  systemRequirements:
    title: Systemkrav
    windows: Windows
    macos: macOS
    linux: Linux
    os: Operativsystem
    processor: Processor
    memory: Minne
    diskSpace: Diskutrymme
    network: Nätverk
    windowsOs: Windows 10/11 (64-bitars)
    macosOs: macOS 12+ (Monterey eller högre)
    linuxOs: Ubuntu 20.04+ / Debian 11+ / Andra vanliga distributioner
    windowsProcessor: Intel Core i3 eller motsvarande processor
    macosProcessor: Apple Silicon (M1/M2/M3) eller Intel Core i3+
    linuxProcessor: Intel Core i3 eller motsvarande processor
    memoryRec: 4GB RAM (8GB rekommenderas)
    disk: 2GB tillgängligt utrymme
    networkDesc: Nätverksanslutning krävs för initial nedladdning (kan användas offline därefter)
  download:
    title: Nedladdningspaket
    windowsDesc: Stabila installationsprogram för Windows 10/11, inklusive setup- och portabla byggen.
    macosDesc: Inbyggda byggen för Apple Silicon- och Intel-Mac-datorer.
    linuxDesc: AppImage- och tarball-paket för vanliga x64- och ARM64 Linux-distributioner.
    note: Om paketlistan här misslyckas med att ladda, använd versionshistoriklänken i hero-området för att komma åt det kanoniska indexet.
    features:
      signed: Signerade paket
      autoUpdate: Automatisk uppdateringsdetektering
      multiLanguage: Flerspråkigt gränssnitt
  installation:
    title: Snabb Installation
    step1:
      number: '1'
      title: Ladda Ner Installationsprogram
      description: Välj lämpligt installationsprogram för ditt operativsystem
    step2:
      number: '2'
      title: Kör Installationsprogram
      description: Dubbelklicka på det nedladdade installationsprogrammet och följ instruktionerna för att slutföra installationen
    step3:
      number: '3'
      title: Starta Appen
      description: Vid första start guidar den dig genom den initiala konfigurationen
    step4:
      number: '4'
      title: Börja Använda
      description: Efter konfiguration kan du börja använda Hagicode Desktop
  faq:
    title: Vanliga Frågor
    q1:
      question: Vad är skillnaden mellan Desktop- och Server-versionerna?
      intro: 'Hagicode erbjuder två distributionsalternativ: Desktop-version och Server-version. Var och en har sina fördelar, men båda använder ett användarstyrt server- och datatillvägagångssätt, vilket ger bättre dataskydd.'
      desktopTitle: Desktopversion
      desktop1: Kör lokalt på din dator, mer lättviktig
      desktop2: Ingen serverkonfiguration behövs, redo att använda direkt
      desktop3: Lämplig för ensamma utvecklare och lättviktiga användningsscenarier
      desktop4: All data helt lokaliserad
      serverTitle: Serverversion
      server1: Kan distribueras på fjärrservrar
      server2: Stöder fjärråtkomst för flera användare
      server3: Bättre lämpad för teamsamarbete och skalning
      server4: Förbereder för framtida företagsfunktioner och synkronisering mellan flera enheter
      conclusion: Oavsett vilken version du väljer har du fullständig kontroll över din server och data, och njuter av bättre integritetsskydd och datasäkerhet.
    q2:
      question: Vad behöver jag göra efter installationen?
      intro: 'Hagicode Desktop är i grunden en launcher. Vid första start efter installationen guidar den dig genom dessa steg:'
      step1: '<strong>Ladda ner Hagicode Core:</strong> Desktop kommer automatiskt att upptäcka och uppmana dig att ladda ner Hagicodes kärnkomponenter'
      step2: '<strong>Installera Kärnkomponenter:</strong> Följ instruktionerna på skärmen för att slutföra installationen av kärnkomponenterna'
      step3: '<strong>Konfigurera din standard-Agent CLI:</strong> Välj en för närvarande stödd Agent CLI och slutför nödvändiga inloggnings-, auktoriserings- eller lokala installationssteg.'
      note: Desktop-gränssnittet guidar hela flödet. Håll nätverket tillgängligt vid första starten så att Hagicode Core kan laddas ner; vissa Agent CLI:er kräver fortfarande manuell installation eller autentisering, men de är fortfarande en del av det nuvarande stödet.
      done: Efter att ha slutfört dessa steg kan du använda alla Hagicode Desktop-funktioner normalt.
    q3:
      question: Hur kontrollerar jag efter uppdateringar?
      answer: Desktop kontrollerar automatiskt efter uppdateringar. När en ny version är tillgänglig visas en avisering i det övre högra hörnet av gränssnittet. Du kan också manuellt kontrollera efter uppdateringar i "Inställningar".
    q4:
      question: Vilka AI Agent CLI:er stöds?
      intro: 'Hagicode Desktop stöder för närvarande följande Agent CLI:er:'
      active: '<strong>För närvarande stödda:</strong> Claude Code, Codex, GitHub Copilot, OpenCode, Hermes, QoderCLI, Kiro, Kimi, Gemini, DeepAgents och Codebuddy'
      manual: '<strong>Manuell installation eller autentisering:</strong> Hermes, Gemini och DeepAgents kräver en lokal installation eller autentiseringssteg först; de andra CLI:erna erbjuder installationsstartpunkter med ett klick eller guidade installationsflöden.'
      legacy: '<strong>Endast bakåtkompatibilitet:</strong> IFlowCli finns kvar endast för historisk datakompatibilitet och är inte en del av det nuvarande aktiva stödet.'
      closing: Supportomfattning och installationsläge är separata frågor. En CLI som kräver manuell installation stöds fortfarande nu.
    q5:
      question: Stöder det offlineanvändning?
      intro: 'Ja! Hagicode Desktop stöder fullständig offlineanvändning:'
      point1: Nätverksanslutning krävs för initial installation och konfiguration (nedladdning av kärnkomponenter och AI-modeller)
      point2: Alla funktioner kan användas offline efter konfiguration
      point3: Din kod och data laddas aldrig upp till molnet
      point4: All AI-bearbetning slutförs lokalt
    q6:
      question: macOS säger att Hagicode.app är skadad eller inte kan öppnas. Vad ska jag göra?
      intro: Om Hagicode Desktop är installerat i standardsökvägen /Applications/Hagicode.app och macOS Gatekeeper blockerar den första starten, använd följande kommando för att ta bort karantänattributet från appen.
      cause: Detta händer eftersom macOS lägger till com.apple.quarantine-attributet till appar som laddats ner från internet. Det är ett macOS-säkerhetsisolationsproblem, inte ett fel i Hagicode-installationsprogrammet.
      command: sudo xattr -dr com.apple.quarantine /Applications/Hagicode.app
      note: Kör kommandot i Terminal med administratörsrättigheter och starta sedan om Hagicode Desktop.
    q7:
      question: Hur får man hjälp när man stöter på problem?
      intro: 'Om du stöter på problem när du använder Hagicode Desktop kan du få hjälp genom:'
      point1: '<strong>Teknisk Supportgrupp:</strong> Gå med i QQ-grupp 610394020'
      point2: '<strong>Onlinedokumentation:</strong> Se komplett användardokumentation och handledningar'
      point3: '<strong>GitHub Issues:</strong> Skicka in problerapporter i projektets repository'
