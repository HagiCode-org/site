container:
  title: Hagicode Container - Containerdistribution
  description: Distribuera Hagicode via Docker Compose Builder. Enkel konfiguration, redo att använda. Stöder flera bildkällor och automatiska uppdateringar.
  hero:
    badge: Container
    title: Hagicode Container
    tagline: Distribuera snabbt med Docker Compose Builder, enkel konfiguration, redo att använda
    value1: Visuell konfiguration, ingen kodning krävs
    value2: Miljöisolering, datasäkerhet
    value3: Enkelklicksdistribution, snabb uppstart
    ctaButton: Distribuera med Docker Compose Builder
    features:
      isolation: Miljöisolering
      oneClick: Enkelklicksdistribution
      fastStart: Snabb Uppstart
  features:
    title: Varför Välja Containerdistribution?
    isolation:
      title: Miljöisolering
      description: Containeriserad distribution undviker beroendekonflikter, påverkar inte systemmiljön, håller systemet rent
    simple:
      title: Enkel Konfiguration
      description: Använd Docker Compose Builder för visuell konfiguration, ingen behöver skriva komplexa skript
    crossPlatform:
      title: Multiplattformsstöd
      description: Stöder x86_64-arkitektur, lämplig för olika servrar och molnplattformar
    persistent:
      title: Datapersistens
      description: Stöder volymmontering, säker och pålitlig data, ingen dataförlust vid omstart av container
    autoUpdate:
      title: Automatiska Uppdateringar
      description: Stöder watchtower för automatiska uppdateringar, få enkelt den senaste versionen
    productionReady:
      title: Produktionsredo
      description: Designad för produktionsmiljöer, stöder hög tillgänglighet och horisontell skalning
  builder:
    title: Docker Compose Builder
    subtitle: Den enklaste och rekommenderade containerdistributionsmetoden
    visual:
      title: Visuell Konfiguration
      description: Konfigurera alla parametrar genom ett vänligt webbgränssnitt, ingen behöver manuellt redigera YAML-filer
    generate:
      title: Enkelklicks-konfigurationsgenerering
      description: Generera automatiskt kompletta docker-compose.yml-filer med bästa praxis-konfigurationer
    deploy:
      title: Snabb Distribution
      description: Enkelklicksnedladdning av konfigurationsfiler och start av tjänster, slutför distribution på minuter
    secure:
      title: Säker och Pålitlig
      description: Inbyggd säkerhet enligt bästa praxis, konfigurerar automatiskt datavolymer och omstartspolicyer
    ctaButton: Gå till Docker Compose Builder
  mirrors:
    title: Val av Bildkälla
    description: Välj den mest lämpliga bildkällan baserat på din nätverksmiljö och plats
    dockerHub: Docker Hub
    dockerHubDesc: Världens största register för containerbilder, lämplig för internationella nätverksanvändare
    dockerHubCmd: newbe36524/hagicode:0
    azure: Azure ACR
    azureDesc: Microsoft Azures bildtjänst, snabbare åtkomst från Kina
    azureCmd: hagicode.azurecr.io/hagicode:0
    aliyun: Aliyun ACR
    aliyunDesc: Aliyuns inhemska bildacceleration, rekommenderas för användare på fastlandet i Kina
    aliyunCmd: registry.cn-hangzhou.aliyuncs.com/hagicode/hagicode:0
  faq:
    title: Vanliga Frågor
    q1:
      question: Vad är skillnaden mellan Container- och Desktop-versionerna?
      intro: 'Båda versionerna har sina fördelar. Du kan välja baserat på ditt användningsscenario:'
      desktopTitle: Desktopversion
      desktop1: Kör lokalt på din dator, mer lättviktig
      desktop2: Ingen serverkonfiguration behövs, redo att använda direkt
      desktop3: Lämplig för ensamma utvecklare och lättviktiga användningsscenarier
      desktop4: All data helt lokaliserad
      containerTitle: Containerversion
      container1: Kan distribueras på servrar, stöder fjärråtkomst
      container2: Miljöisolering, påverkar inte systemmiljön
      container3: Bättre lämpad för teamsamarbete och produktionsmiljöer
      container4: Stöder automatiserad distribution och horisontell skalning
    q2:
      question: Vad är Docker Compose Builder?
      intro: 'Docker Compose Builder är vårt visuella konfigurationsverktyg som hjälper dig att:'
      point1: Konfigurera alla containerparametrar genom ett webbgränssnitt
      point2: Generera automatiskt docker-compose.yml-filer
      point3: Inbyggd bästa praxis och säkerhetskonfigurationer
      point4: Enkelklicksnedladdning och start av tjänster
      note: Ingen behöver manuellt skriva komplexa YAML-konfigurationer. Även Docker-nybörjare kan distribuera enkelt.
    q3:
      question: Vilka systemarkitekturer stöder containerversionen?
      answer: 'Hagicode containerbilder stöder för närvarande <strong>x86_64 (amd64)</strong>-arkitektur, lämplig för de flesta servrar och PC:er.'
      note: Docker kommer automatiskt att välja rätt arkitektur för ditt system när bilder dras.
    q4:
      question: Hur uppdaterar man containern?
      intro: 'När du använder Docker Compose-distribution är uppdatering mycket enkel:'
      code: |-
        docker-compose pull
        docker-compose up -d
      watchtower: Eller använd Watchtower för automatiska uppdateringar.
    q5:
      question: Hur konfigurerar man datapersistens?
      intro: 'Docker Compose Builder konfigurerar automatisk datavolymer. Som standard kommer din data att lagras i Docker-volymer, vilket säkerställer:'
      point1: Data går inte förlorad när containrar raderas
      point2: Data bevaras under containeruppdateringar
      point3: Enkel säkerhetskopiering och återställning
    q6:
      question: Vad ska man göra om containeruppstart misslyckas?
      intro: 'Steg för att felsöka misslyckad containeruppstart:'
      step1:
        title: 'Kontrollera containerstatus:'
        code: docker-compose ps
      step2:
        title: 'Kontrollera containerloggar:'
        code: docker-compose logs hagicode
      step3:
        title: 'Kontrollera portanvändning:'
        desc: 'Om din tjänsteport är 3000, använd detta kommando för att kontrollera:'
        code: netstat -tlnp | grep 3000
        solution: 'Om porten är upptagen kan du:'
        solution1: Stoppa processen som upptar porten
        solution2: Eller konfigurera en annan port i Docker Compose Builder
      help: Om problemet kvarstår, kontrollera den detaljerade dokumentationen eller kontakta teknisk support.
  cta:
    title: Börja Använda Docker Compose Builder
    subtitle: Den enklaste och rekommenderade containerdistributionsmetoden
    button: Gå till Distributionsguide
    github: GitHub-repository
