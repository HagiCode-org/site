features:
  showcase:
    title: Trois fonctionnalités clés
    subtitle: Redéfinissez votre expérience du coding IA
  smart:
    badge: INTELLIGENT
    title: Intelligent
    subtitle: Workflow OpenSpec, pour booster l'efficacité du coding IA
    efficiency: Gain d'efficacité
    traditional: Traditionnel
    hagicode: Hagicode
    description: Un workflow complet en 9 étapes, de l'idée à l'archivage, accompagné par l'IA à chaque phase. Votre efficacité de coding peut être multipliée par trois.
    workflow:
      review:
        label: Revue
        desc: Revue automatique
      scaffold:
        label: Scaffold
        desc: Choose a change-id and create proposal.md, tasks.md, and design.md when needed.
      spec:
        label: Spec
        desc: Translate the change into capability-level spec deltas with explicit requirements.
      design:
        label: Design
        desc: Capture architecture and trade-offs in design.md when the change spans systems.
      tasks:
        label: Tâches
        desc: Découpage des tâches
      validate:
        label: Validate
        desc: Run openspec validate in strict mode and clear every issue before execution.
      apply:
        label: Apply
        desc: Read proposal, design, and tasks, then implement in order while checking items off.
      archive:
        label: Archive
        desc: Archivage de la connaissance
    paused: En pause - cliquez sur un nœud pour basculer
  convenient:
    badge: EFFICACE
    title: Efficace
    subtitle: Une exécution multi-agent et multi-instance qui garde votre quota en mouvement
    traditional: Approche traditionnelle mono-agent / mono-instance
    multiThread: Matrice parallèle multi-agent
    boost: Gain de débit
    boostValue: 10x+ en parallèle
    description: Les Agent CLI actuellement pris en charge, comme Claude Code, Codex, GitHub Copilot, OpenCode et Hermes, peuvent travailler sur plusieurs instances en même temps, de sorte que propositions, correctifs et revues avancent en parallèle au lieu d'attendre dans une file sérielle.
    agentMatrix:
      title: Matrice d'exécution parallèle
      badge: Plusieurs agents / plusieurs instances
      status: Plusieurs agents pilotent actuellement plusieurs instances en parallèle
      agents:
        claude:
          name: Claude Code
          role: Proposition / revue
          instances:
            - Rédiger la spec
            - Vérifier le design
            - Revoir l'archive
        codex:
          name: Codex
          role: Implémentation / correctifs
          instances:
            - Construire la fonctionnalité A
            - Construire la fonctionnalité B
            - Corriger une régression
        router:
          name: Qwen · GLM
          role: Analyse / support
          instances:
            - Tracer un problème
            - Affiner le copywriting
            - Capturer des enseignements
      supportedNames:
        title: 13 Agent CLI actuellement pris en charge
        names:
          - Claude Code
          - Codex
          - GitHub Copilot
          - OpenCode
          - Hermes
          - QoderCLI
          - Kiro
          - Kimi
          - Gemini
          - Pi
          - Reasonix
          - DeepAgents
          - Codebuddy
    supportedProvidersNote: OpenCode peut charger le catalogue OmniRoute partagé dans les valeurs par défaut du modèle hero tout en laissant les identifiants de modèles bruts modifiables pour les workflows spécifiques à une branche.
  interesting:
    badge: LUDIQUE
    title: Ludique
    subtitle: Hero Dungeon rend la collaboration et la pratique sur le campus plus vivantes
    features:
      dungeons:
        label: Hero Dungeons
        desc: Transforme les ateliers de génération, d'exécution et de prompts en véritables runs de donjon
      captains:
        label: Roster des capitaines
        desc: Assignez le bon capitaine hero à chaque donjon
      battle:
        label: Rapports de bataille
        desc: Consultez XP, niveaux et résultats d'exécution après chaque push
    description: Le plaisir ne dépend plus seulement des badges d'accomplissement. Hero Dungeon, le roster des capitaines, les visuels de prompts et les rapports de bataille transforment la pratique quotidienne du coding IA en aventure coordonnée pour les labos et équipes étudiantes.
    dungeonCards:
      proposal:
        title: Donjon de proposition
        desc: OpenSpec generate / apply / archive
        status: Capitaine prêt
      autotask:
        title: Donjon AutoTask
        desc: Correctifs parallèles et automatisation par lots
        status: 2 instances actives
      prompt:
        title: Donjon de prompt
        desc: Prévisualisation des prompts et atelier de style
        status: Synchronisation visuelle prête
    roster:
      title: Roster actuel des capitaines
      heroes:
        strategist:
          name: Spec Strategist
          role: Capitaine des propositions
        runner:
          name: Patch Runner
          role: Capitaine de l'exécution
        artist:
          name: Prompt Artist
          role: Support visuel
    battleReport:
      title: Rapport de donjon du jour
      badge: Hero Battle
      metrics:
        dungeons:
          value: '4'
          label: Donjons poussés
        level:
          value: Lv.27
          label: Niveau du capitaine
        xp:
          value: 12.8M
          label: XP du jour
      note: Quand plusieurs donjons avancent en parallèle, ce rapport agrège expérience, niveaux et résultats d'exécution dans une seule lecture.
    gallery:
      dungeons:
        title: Carrousel des cartes de donjon
        subtitle: 10 visuels aléatoires issus de la collection actuelle de cartes de donjon et de prompts du frontend.
      heroes:
        title: Carrousel de la galerie des héros
        subtitle: 10 visuels aléatoires issus de la collection actuelle de héros du frontend.
