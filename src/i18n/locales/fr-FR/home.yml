features:
  showcase:
    title: "Conçu pour le vrai travail de développement"
    subtitle: "Les propositions gardent chaque changement vérifiable, les agents en parallèle font avancer le travail"
  smart:
    title: Intelligent
    subtitle: "D'abord proposer, ensuite exécuter : chaque changement laisse une trace"
    artifactsTitle: "Ce que chaque changement laisse derrière lui"
    description: "HagiCode ne se contente pas de discuter de votre code. Il examine l'état réel du projet, rédige une proposition et des deltas de spec, valide strictement, exécute les tâches dans l'ordre, puis archive ce qu'il a appris pour le changement suivant."
    workflow:
      review:
        label: "Revue"
        desc: "Examiner l'état du projet, les specs existantes et le code concerné avant de rédiger quoi que ce soit."
      scaffold:
        label: "Squelette"
        desc: "Choisir un change-id et créer proposal.md, tasks.md et, si besoin, design.md."
      spec:
        label: "Spec"
        desc: "Traduire le changement en deltas de spec par capability, avec des exigences explicites."
      design:
        label: "Conception"
        desc: "Consigner l'architecture et les compromis dans design.md quand le changement touche plusieurs systèmes."
      tasks:
        label: "Tâches"
        desc: "Découper le travail en petits éléments vérifiables, avec l'ordre et le parallélisme explicités."
      validate:
        label: "Validation"
        desc: "Lancer openspec validate en mode strict et lever tous les points avant l'exécution."
      apply:
        label: "Exécution"
        desc: "Lire proposal, design et tasks, puis implémenter dans l’ordre en cochant les éléments terminés."
      archive:
        label: "Archive"
        desc: "Archiver le changement terminé et réinjecter le résultat dans l'historique de spec à long terme."
    paused: En pause - cliquez sur un nœud pour basculer
  convenient:
    title: Efficace
    subtitle: "Plusieurs agents et instances en parallèle, pour que votre quota ne dorme jamais"
    traditional: "Un à la fois, en file d'attente"
    multiThread: "Côte à côte, sans s'attendre"
    description: "Claude Code, Codex, GitHub Copilot, OpenCode, Hermes et les autres Agent CLI pris en charge peuvent chacun exécuter plusieurs instances en même temps. Propositions, correctifs et revues ont chacun leur voie : un résultat lent ne bloque pas le reste."
    agentMatrix:
      title: Matrice d'exécution parallèle
      badge: "Exemple de configuration"
      status: "Illustration : chaque voie avance, aucune n'en bloque une autre"
      agents:
        claude:
          name: Claude Code
          role: Proposition / revue
          instances:
            - Rédiger la spec
            - Vérifier le design
            - Revoir l'archive
        codex:
          name: Codex
          role: Implémentation / correctifs
          instances:
            - Construire la fonctionnalité A
            - Construire la fonctionnalité B
            - Corriger une régression
        router:
          name: Qwen · GLM
          role: Analyse / support
          instances:
            - Tracer un problème
            - Affiner le copywriting
            - Capturer des enseignements
    cliBay:
      title: "Agent CLI équipables"
      hint: "Choisissez-en une pour voir comment elle se branche"
      chain:
        agent: "Agent"
        model: "Modèle compatible"
      labels:
        whatItIs: "Ce que c'est"
        models: "Modèles et connexion"
        runsOn: "Où il tourne"
        start: "Prise en main"
        questions: "Questions dans HagiCode"
        strengths: "Points forts"
        compare: "Lire la comparaison complète"
  interesting:
    title: Intéressant
    subtitle: "Chaque agent a un visage, une personnalité et un monde à lui"
    description: "Donnez à chaque agent un avatar, un Trait et une Soul, puis choisissez le vocabulaire de votre équipe. La même équipe se lit en héros et donjons, en ranch, en cour impériale ou en ruche, et niveaux et trophées récompensent le travail au fil de l'eau."
    worlds:
      title: "Une équipe, dix façons de la nommer"
      labels:
        agent: "Agent"
