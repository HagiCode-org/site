          - Prend en charge les Logos et titres personnalisés en haut à gauche
          - Inclut cinq packs d'avatars avec 10 avatars sélectionnables dans chaque pack
          - Prend en charge l'import d'avatars personnalisés
          - Permet aux équipes de personnaliser la signature AI Co-Authored-By pour les workflows de commit
          - Débloque le changement de texte et de formulation
          - Étend la limite maximale de propositions simultanées à 32
