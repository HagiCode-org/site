        category: Pack
        title: Hagicode Plus
        price: Steam
        description: Le bundle Steam officiel combine l'édition de base Hagicode avec le DLC Turbo Engine dans un seul parcours d'achat.
        bullets:
          - Regroupe l'édition Steam principale et le DLC Turbo Engine
          - Attache la mise à niveau à 32 propositions simultanées au parcours bundle
          - Offre l'entrée d'achat la plus claire pour obtenir toute la configuration Steam d'un coup
      sponsor:
        category: DLC supporter
        title: Hagicode - Sponsor Pack
        price: Steam
        description: Si vous pensez que Hagicode est vraiment excellent et souhaitez apporter un soutien financier direct, l'achat du Sponsor Pack donne plus d'élan au projet et nous aide à le maintenir sur le long terme.
