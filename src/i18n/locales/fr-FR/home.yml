        price: Steam
        description: Vous pouvez acheter ce DLC séparément pour augmenter la limite initiale de propositions simultanées, débloquer le changement de texte, ajouter cinq packs d'avatars avec 10 avatars autonomes chacun, activer l'import d'avatars personnalisés, personnaliser le Logo et le titre en haut à gauche, et aligner les trailers de commits générés par l'AI avec vos propres règles Co-Authored-By. Nous mettons généralement en avant l'option groupée Hagicode Plus afin de réduire le prix total. Consultez la page du store pour les dernières modifications.
