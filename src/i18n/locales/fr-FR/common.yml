      description: Watch throughput, recent API activity, and total usage in one metrics surface so cost and pacing stay controllable during parallel execution.
      alt: HagiCode token analytics screenshot showing throughput, recent API activity, and total usage
    workspaceManagement:
      title: Workspace and vault management
      description: Manage user vaults, system vaults, and code-server entry points from one control surface built for shared environments and fast maintenance.
      alt: HagiCode workspace management screenshot showing user vaults, system vaults, and code-server actions
    achievementProgress:
      title: Achievement and growth progress
      description: Daily progress, global growth, and lifecycle metrics roll into one dashboard so long-running adoption feels measurable instead of abstract.
      alt: HagiCode achievement dashboard screenshot showing daily progress, global growth, and lifecycle metrics
