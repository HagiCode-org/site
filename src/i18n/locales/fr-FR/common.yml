showcase:
  title: "HagiCode au travail"
  description: "Dix zones du produit, présentées dans l'interface sombre en anglais et cinq thèmes sombres : tableau de sessions, propositions, agents, compétences, vaults, consommation, succès, Git et plans planifiés."
  controls:
    previous: Precedent
    next: Suivant
    current: Vue mise en avant
    railLabel: Navigation des captures du produit
    selectPrefix: 'Basculer vers : '
    activeState: Affiche maintenant
    previewState: Apercu
    imageUnavailable: Image indisponible
    openFullscreen: 'Ouvrir en plein ecran : '
    openFullscreenHint: Cliquez pour agrandir
    zoomIn: "Afficher en taille réelle"
    zoomOut: "Ajuster à l'écran"
    closeFullscreen: Fermer le plein ecran
  screenshots:
    sessionBoard:
      title: "Tableau des sessions"
      description: "Propositions, agents en cours d'exécution et travaux archivés partagent un même tableau : on voit ce qui attend, ce qui tourne et ce qui est terminé."
      alt: "Tableau des sessions HagiCode avec les colonnes Proposition et revue, Exécution et Archivé à côté du panneau d'actions rapides du projet"
    proposalWorkflow:
      title: "Flux de proposition"
      description: "Chaque changement commence par une proposition : delta de spécification, tâches ordonnées et suivi des étapes, à relire avant toute exécution de code."
      alt: "Conversation de proposition HagiCode avec un tableau de delta de spécification, une liste de tâches et le suivi des étapes"
    agentRoster:
      title: "Équipe d'agents"
      description: "Donnez à chaque agent un avatar et un rôle, regroupés par l'Agent CLI qui l'anime, puis choisissez qui prend la prochaine tâche."
      alt: "Espace Agents de HagiCode listant douze agents regroupés par Claude Code, Codex, OpenCode, Gemini et Hermes"
    agentCli:
      title: "Gestion des Agent CLI"
      description: "Claude Code, Codex, GitHub Copilot, OpenCode et d'autres sont réunis avec leur version et leur contrôle de santé."
      alt: "Tableau de gestion AgentCLI de HagiCode avec la version et l'état de chaque Agent CLI pris en charge"
    skillsGallery:
      title: "Galerie de compétences"
      description: "Parcourez des sources de compétences fiables, comparez les installations et repérez d'un coup d'œil celles déjà présentes sur cette machine."
      alt: "Galerie de compétences HagiCode avec source, nombre d'installations et badge Installé localement"
    vault:
      title: "Vault"
      description: "Gardez playbooks d'équipe, contrats et références dans des vaults, puis parcourez et prévisualisez les fichiers sans quitter l'application."
      alt: "Navigateur de vault HagiCode avec liste des vaults, arborescence et aperçu Markdown d'une consigne de revue"
    tokenUsage:
      title: "Consommation de tokens"
      description: "Les tokens et le coût du jour restent dans la barre d'état, et une échelle de niveaux indique l'intensité de la journée."
      alt: "Barre d'état HagiCode avec le total de tokens et le coût du jour, et une infobulle listant les niveaux de Breath à Radiance"
    achievements:
      title: "Salle des succès"
      description: "Objectifs quotidiens, croissance en ligne et séries cumulées rendent visible une progression régulière."
      alt: "Salle des succès HagiCode avec le taux de réussite du jour, le butin du jour et la voie de croissance en ligne"
    gitManagement:
      title: "Gestion Git"
      description: "Contrôlez branche, synchronisation et modifications non validées de tous les dépôts d'un projet, puis validez, poussez ou tirez depuis un seul panneau."
      alt: "Onglet Git d'un projet HagiCode listant quatre dépôts avec branche, état de synchronisation et résumé du dépôt"
    scheduledPlans:
      title: "Plans planifiés"
      description: "Lancez propositions et HagiTasks depuis un calendrier : audits de nuit, brouillons hebdomadaires, préparation de version ponctuelle."
      alt: "Calendrier des plans planifiés de HagiCode en octobre avec plans nocturnes, hebdomadaires et ponctuels"
