      alt: Capture HagiCode de l'execution des propositions montrant les etapes du workflow, le resultat d'execution et le panneau lateral de session
    sessionBoard:
      title: Tableau des sessions et planification du donjon
      description: Les sessions en attente, en cours et archivees restent visibles a cote d'un panneau de taches fantasy afin que le travail parallele des agents soit lisible d'un coup d'oeil.
