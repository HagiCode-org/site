      title: Session board and dungeon planning
      description: Pending, in-progress, and archived sessions stay visible beside a fantasy task panel so parallel agent work is easy to scan at a glance.
      alt: HagiCode session board screenshot showing pending, in-progress, and archived columns beside a fantasy task panel
