    tokenAnalytics:
      title: Analyse des tokens en temps reel
      description: Surveillez le debit, l'activite recente de l'API et l'utilisation totale dans une seule vue de metriques afin de garder le cout et le rythme sous controle pendant l'execution parallele.
      alt: Capture de l'analyse des tokens HagiCode montrant le debit, l'activite recente de l'API et l'utilisation totale
    workspaceManagement:
      title: Gestion de l'espace de travail et des vaults
      description: Gerez les vaults utilisateur, les vaults systeme et les points d'entree code-server depuis une seule interface pensee pour les environnements partages et la maintenance rapide.
      alt: Capture de la gestion de l'espace de travail HagiCode montrant les vaults utilisateur, les vaults systeme et les actions code-server
    achievementProgress:
      title: Progression des succes et de la croissance
      description: La progression quotidienne, la croissance globale et les metriques de cycle de vie se regroupent dans un seul tableau de bord pour rendre l'adoption de long terme concretement mesurable.
