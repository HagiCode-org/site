desktop:
  title: Hagicode Desktop - Letöltés
  description: Töltsd le a Hagicode Desktopot, egy lokalizált AI kódasszisztenst. Windows, macOS és Linux támogatás. Adatvédelem, gyors válaszidő.
  features:
    title: Főbb funkciók
    local:
      title: Helyi végrehajtás
      description: Minden adat helyileg kerül feldolgozásra felhőbe töltés nélkül, biztosítva a kód adatvédelmét és biztonságát
    privacy:
      title: Adatvédelem
      description: A kód soha nem kerül feltöltésre, támogatja az offline használatot, védi szellemi tulajdonodat
    fast:
      title: Gyors válasz
      description: Ezredmásodperces válaszidő, nincs szükség hálózati kérésekre, növeli a fejlesztési hatékonyságot
    crossPlatform:
      title: Többplatformos támogatás
      description: Windows, macOS és Linux támogatás a különböző fejlesztői környezeti igények kielégítésére
    autoUpdate:
      title: Automatikus frissítések
      description: Automatikusan ellenőrzi a frissítéseket és egy kattintással frissít a legújabb verzióra
    multiLanguage:
      title: Többnyelvű támogatás
      description: Beépített kínai és angol felület, támogatja a nemzetközi csapatmunkát
  systemRequirements:
    title: Rendszerkövetelmények
    windows: Windows
    macos: macOS
    linux: Linux
    os: Operációs rendszer
    processor: Processzor
    memory: Memória
    diskSpace: Lemezterület
    network: Hálózat
    windowsOs: Windows 10/11 (64 bites)
    macosOs: macOS 12+ (Monterey vagy újabb)
    linuxOs: Ubuntu 20.04+ / Debian 11+ / Egyéb主流 disztribúciók
    windowsProcessor: Intel Core i3 vagy azzal egyenértékű processzor
    macosProcessor: Apple Silicon (M1/M2/M3) vagy Intel Core i3+
    linuxProcessor: Intel Core i3 vagy azzal egyenértékű processzor
    memoryRec: 4 GB RAM (8 GB ajánlott)
    disk: 2 GB szabad hely
    networkDesc: Hálózati kapcsolat szükséges a kezdeti letöltéshez (utána offline is használható)
  download:
    title: Letöltési csomagok
    windowsDesc: Stabil telepítők Windows 10/11 rendszerhez, telepítő és hordozható változatban.
    macosDesc: Natív buildek Apple Silicon és Intel Mac-ekhez.
    linuxDesc: AppImage és tarball csomagok a mainstream x64 és ARM64 Linux disztribúciókhoz.
    note: Ha a csomaglista itt nem tölt be, használd a hero területen lévő verziótörténet linket a kanonikus index eléréséhez.
    features:
      signed: Aláírt csomagok
      autoUpdate: Automatikus frissítés-érzékelés
      multiLanguage: Többnyelvű felület
  installation:
    title: Gyors telepítés
    step1:
      number: '1'
      title: Telepítő letöltése
      description: Válaszd ki az operációs rendszerednek megfelelő telepítőt
    step2:
      number: '2'
      title: Telepítő futtatása
      description: Kattints duplán a letöltött telepítőre, és kövesd az utasításokat a telepítés befejezéséhez
    step3:
      number: '3'
      title: Alkalmazás indítása
      description: Első indításkor végigvezet a kezdeti konfiguráción
    step4:
      number: '4'
      title: Használat megkezdése
      description: A konfiguráció után elkezdheted használni a Hagicode Desktopot
  faq:
    title: GYIK
    q1:
      question: Mi a különbség a Desktop és a Szerver verzió között?
      intro: 'A Hagicode két telepítési lehetőséget kínál: Desktop verziót és Szerver verziót. Mindkettőnek megvannak az előnyei, de mindkettő felhasználó által irányított szerver és adat megközelítést alkalmaz, jobb adatvédelmet biztosítva.'
      desktopTitle: Desktop verzió
      desktop1: Helyileg fut a számítógépeden, könnyebb
      desktop2: Nincs szükség szerverkonfigurációra, azonnal használható
      desktop3: Egyéni fejlesztőknek és könnyű használati esetekhez alkalmas
      desktop4: Minden adat teljesen helyi
      serverTitle: Szerver verzió
      server1: Távoli szervereken telepíthető
      server2: Támogatja a többfelhasználós távoli hozzáférést
      server3: Jobban alkalmas csapatmunkához és skálázáshoz
      server4: Felkészülés a jövőbeli vállalati funkciókra és több eszköz szinkronizálására
      conclusion: Bármelyik verziót is választod, teljes mértékben te irányítod a szerveredet és adataidat, élvezve a jobb adatvédelmet és adatbiztonságot.
    q2:
      question: Mit kell tennem a telepítés után?
      intro: 'A Hagicode Desktop lényegében egy indító. A telepítés utáni első indításkor végigvezet ezeken a lépéseken:'
      step1: '<strong>Hagicode Core letöltése:</strong> A Desktop automatikusan észleli és felkér, hogy töltsd le a Hagicode alapkomponenseket'
      step2: '<strong>Alapkomponensek telepítése:</strong> Kövesd a képernyőn megjelenő utasításokat az alapkomponensek telepítésének befejezéséhez'
      step3: '<strong>Alapértelmezett Agent CLI konfigurálása:</strong> Válassz egy jelenleg támogatott Agent CLI-t, és fejezd be a szükséges bejelentkezési, hitelesítési vagy helyi telepítési lépéseket.'
      note: A Desktop felület végigvezeti a teljes folyamaton. Tartsd elérhetővé a hálózatot az első indításkor, hogy a Hagicode Core letöltődhessen; néhány Agent CLI még mindig igényel manuális telepítést vagy hitelesítést, de továbbra is a jelenlegi támogatási kör részét képezik.
      done: Ezeknek a lépéseknek a befejezése után a Hagicode Desktop összes funkcióját normálisan használhatod.
    q3:
      question: Hogyan ellenőrizzem a frissítéseket?
      answer: A Desktop automatikusan ellenőrzi a frissítéseket. Amikor új verzió válik elérhetővé, egy értesítés jelenik meg a felület jobb felső sarkában. Manuálisan is ellenőrizheted a frissítéseket a "Beállítások"ban.
    q4:
      question: Milyen AI Agent CLI-eket támogat?
      intro: 'A Hagicode Desktop jelenleg a következő Agent CLI-eket támogatja:'
      active: '<strong>Jelenleg támogatottak:</strong> Claude Code, Codex, GitHub Copilot, OpenCode, Hermes, QoderCLI, Kiro, Kimi, Gemini, DeepAgents és Codebuddy'
      manual: '<strong>Manuális telepítés vagy hitelesítés:</strong> A Hermes, Gemini és DeepAgents helyi telepítést vagy hitelesítési lépést igényel először; a többi CLI egykattintásos telepítési belépési pontot vagy irányított telepítési folyamatot biztosít.'
      legacy: '<strong>Csak örökölt kompatibilitás:</strong> Az IFlowCli csak történelmi adatok kompatibilitása miatt maradt, és nem része a jelenlegi aktív támogatási körnek.'
      closing: A támogatási kör és a beállítási mód különálló kérdések. Egy CLI, amely manuális telepítést igényel, továbbra is támogatott.
    q5:
      question: Támogatja az offline használatot?
      intro: 'Igen! A Hagicode Desktop teljes offline használatot támogat:'
      point1: Hálózati kapcsolat szükséges a kezdeti telepítéshez és konfigurációhoz (alapkomponensek és AI modellek letöltése)
      point2: A konfiguráció után minden funkció offline használható
      point3: A kódod és adataid soha nem kerülnek feltöltésre a felhőbe
      point4: Minden AI feldolgozás helyileg történik
    q6:
      question: A macOS azt mondja, hogy a Hagicode.app sérült vagy nem nyitható meg. Mit tegyek?
      intro: Ha a Hagicode Desktop az alapértelmezett /Applications/Hagicode.app útvonalra van telepítve, és a macOS Gatekeeper blokkolja az első indítást, használd a következő parancsot az alkalmazás karantén attribútumának eltávolításához.
      cause: Ez azért történik, mert macOS hozzáadja a com.apple.quarantine attribútumot az internetről letöltött alkalmazásokhoz. Ez egy macOS biztonsági izolációs probléma, nem a Hagicode telepítő hibája.
      command: sudo xattr -dr com.apple.quarantine /Applications/Hagicode.app
      note: Futtasd a parancsot a Terminalban rendszergazdai jogosultságokkal, majd indítsd újra a Hagicode Desktopot.
    q7:
      question: Hogyan kaphatok segítséget, ha problémával találkozom?
      intro: 'Ha problémával találkozol a Hagicode Desktop használata során, a következő módokon kaphatsz segítséget:'
      point1: '<strong>Technikai támogató csoport:</strong> Csatlakozz a QQ csoporthoz 610394020'
      point2: '<strong>Online dokumentáció:</strong> Tekintsd meg a teljes használati dokumentációt és oktatóanyagokat'
      point3: '<strong>GitHub Issues:</strong> Küldj problémajelentést a projekt tárolójában'
