container:
  title: Hagicode Container - Konténer telepítés
  description: Telepítsd a Hagicode-ot Docker Compose Builderrel. Egyszerű konfiguráció, azonnal használható. Több lemezkép-forrás és automatikus frissítések támogatása.
  hero:
    badge: Konténer
    title: Hagicode Container
    tagline: Gyors telepítés Docker Compose Builderrel, egyszerű konfiguráció, azonnal használható
    value1: Vizuális konfiguráció, nincs szükség kódolásra
    value2: Környezeti izoláció, adatbiztonság
    value3: Egykattintásos telepítés, gyors indítás
    ctaButton: Telepítés Docker Compose Builderrel
    features:
      isolation: Környezeti izoláció
      oneClick: Egykattintásos telepítés
      fastStart: Gyors indítás
  features:
    title: Miért érdemes a konténer telepítést választani?
    isolation:
      title: Környezeti izoláció
      description: A konténerizált telepítés elkerüli a függőségi ütközéseket, nem befolyásolja a rendszerkörnyezetet, tisztán tartja a rendszert
    simple:
      title: Egyszerű konfiguráció
      description: Használd a Docker Compose Buildert vizuális konfigurációhoz, nem kell bonyolult szkripteket írni
    crossPlatform:
      title: Többplatformos támogatás
      description: x86_64 architektúra támogatás, különféle szerverekhez és felhőplatformokhoz alkalmas
    persistent:
      title: Adatmegőrzés
      description: Volume csatolás támogatása, biztonságos és megbízható adatok, nincs adatvesztés a konténer újraindításakor
    autoUpdate:
      title: Automatikus frissítések
      description: Watchtower támogatás automatikus frissítésekhez, könnyen hozzáférhetsz a legújabb verzióhoz
    productionReady:
      title: Termelésre kész
      description: Termelési környezetekhez tervezve, támogatja a magas rendelkezésre állást és a vízszintes skálázást
  builder:
    title: Docker Compose Builder
    subtitle: A legegyszerűbb és leginkább ajánlott konténer telepítési módszer
    visual:
      title: Vizuális konfiguráció
      description: Állíts be minden paramétert egy barátságos webes felületen keresztül, nem kell manuálisan szerkeszteni a YAML fájlokat
    generate:
      title: Egykattintásos konfiguráció generálás
      description: Automatikusan generál teljes docker-compose.yml fájlokat a legjobb gyakorlatok konfigurációival
    deploy:
      title: Gyors telepítés
      description: Egy kattintással töltsd le a konfigurációs fájlokat és indítsd el a szolgáltatásokat, végezd el a telepítést percek alatt
    secure:
      title: Biztonságos és megbízható
      description: Beépített biztonsági legjobb gyakorlatok, automatikusan konfigurálja az adatköteteket és az újraindítási szabályokat
    ctaButton: Ugrás a Docker Compose Builderhez
  mirrors:
    title: Lemezkép-forrás kiválasztása
    description: Válaszd a legmegfelelőbb lemezkép-forrást a hálózati környezeted és helyzeted alapján
    dockerHub: Docker Hub
    dockerHubDesc: A világ legnagyobb konténer lemezkép-nyilvántartója, nemzetközi hálózati felhasználóknak megfelelő
    dockerHubCmd: newbe36524/hagicode:0
    azure: Azure ACR
    azureDesc: Microsoft Azure lemezkép-szolgáltatás, Kínából gyorsabb hozzáféréssel
    azureCmd: hagicode.azurecr.io/hagicode:0
    aliyun: Aliyun ACR
    aliyunDesc: Aliyun belföldi lemezkép-gyorsítás, Kína szárazföldi felhasználóknak ajánlott
    aliyunCmd: registry.cn-hangzhou.aliyuncs.com/hagicode/hagicode:0
  faq:
    title: GYIK
    q1:
      question: Mi a különbség a konténer és az asztali verzió között?
      intro: 'Mindkét verziónak megvannak az előnyei. A használati eseted alapján választhatsz:'
      desktopTitle: Asztali verzió
      desktop1: Helyileg fut a számítógépeden, könnyebb
      desktop2: Nincs szükség szerverkonfigurációra, azonnal használható
      desktop3: Egyéni fejlesztőknek és könnyű használati esetekhez alkalmas
      desktop4: Minden adat teljesen helyi
      containerTitle: Konténer verzió
      container1: Szervereken telepíthető, támogatja a távoli hozzáférést
      container2: Környezeti izoláció, nem befolyásolja a rendszerkörnyezetet
      container3: Jobban alkalmas csapatmunkához és termelési környezetekhez
      container4: Támogatja az automatizált telepítést és vízszintes skálázást
    q2:
      question: Mi az a Docker Compose Builder?
      intro: 'A Docker Compose Builder a vizuális konfigurációs eszközünk, amely segít neked:'
      point1: Minden konténer paramétert beállítani egy webes felületen keresztül
      point2: Automatikusan docker-compose.yml fájlokat generálni
      point3: Beépített legjobb gyakorlatok és biztonsági konfigurációk
      point4: Egy kattintással letölteni és elindítani a szolgáltatásokat
      note: Nem kell manuálisan bonyolult YAML konfigurációkat írni. Még a Docker kezdők is könnyen telepíthetnek.
    q3:
      question: Milyen rendszerarchitektúrákat támogat a konténer verzió?
      answer: A Hagicode konténer lemezképek jelenleg az <strong>x86_64 (amd64)</strong> architektúrát támogatják, amely a legtöbb szerverhez és PC-hez megfelelő.
      note: A Docker automatikusan kiválasztja a megfelelő architektúrát a rendszerednek a lemezképek lekérésekor.
    q4:
      question: Hogyan frissíteni a konténert?
      intro: 'Amikor Docker Compose telepítést használsz, a frissítés nagyon egyszerű:'
      code: |-
        docker-compose pull
        docker-compose up -d
      watchtower: Vagy használj Watchtowert automatikus frissítésekhez.
    q5:
      question: Hogyan beállítani az adatmegőrzést?
      intro: 'A Docker Compose Builder automatikusan konfigurálja az adatköteteket. Alapértelmezés szerint az adataid Docker Volumes-ben lesznek tárolva, biztosítva:'
      point1: Az adatok nem vesznek el, ha a konténereket törlik
      point2: Az adatok megmaradnak a konténer frissítések során
      point3: Egyszerű biztonsági mentés és helyreállítás
    q6:
      question: Mit tegyünk, ha a konténer nem indul el?
      intro: 'Lépések a konténer indítási hiba elhárításához:'
      step1:
        title: 'Ellenőrizd a konténer állapotát:'
        code: docker-compose ps
      step2:
        title: 'Ellenőrizd a konténer naplóit:'
        code: docker-compose logs hagicode
      step3:
        title: 'Ellenőrizd a portfoglaltságot:'
        desc: 'Ha a szolgáltatás portja 3000, használd ezt a parancsot az ellenőrzéshez:'
        code: netstat -tlnp | grep 3000
        solution: 'Ha a port foglalt, akkor:'
        solution1: Állítsd le a portot foglaló folyamatot
        solution2: Vagy állíts be másik portot a Docker Compose Builderben
      help: Ha a probléma továbbra is fennáll, ellenőrizd a részletes dokumentációt, vagy vedd fel a kapcsolatot a technikai támogatással.
  cta:
    title: Kezdd el használni a Docker Compose Buildert
    subtitle: A legegyszerűbb és leginkább ajánlott konténer telepítési módszer
    button: Ugrás a telepítési útmutatóhoz
    github: GitHub tároló
