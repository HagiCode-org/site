    openFullscreenHint: Kattints a nagyításhoz
    closeFullscreen: Teljes képernyő bezárása
  screenshots:
    proposalWorkflow:
      title: Javaslati végrehajtás áttekintése
      description: Tartsd a munkafolyamat szakaszát, a végrehajtás eredményét és a munkamenet kontextusát egy képernyőn, hogy a csapatok pontosan lássák, hol tart egy változás, mielőtt továbblépnének.
      alt: HagiCode javaslati végrehajtás képernyőkép, amely a munkafolyamat szakaszait, a végrehajtás eredményét és a munkamenet oldalsávot mutatja
    sessionBoard:
      title: Munkamenet panel és dungeon tervezés
      description: A függőben lévő, folyamatban lévő és archivált munkamenetek láthatók maradnak egy fantasy feladatpanel mellett, így a párhuzamos ágensmunka egy pillantással áttekinthető.
      alt: HagiCode munkamenet panel képernyőkép, amely a függőben lévő, folyamatban lévő és archivált oszlopokat mutatja egy fantasy feladatpanel mellett
    tokenAnalytics:
      title: Valós idejű token analitika
      description: Figyeld az átviteli sebességet, a legutóbbi API-tevékenységet és a teljes használatot egy metrikafelületen, hogy a költségek és a tempó ellenőrizhetők maradjanak a párhuzamos végrehajtás során.
      alt: HagiCode token analitika képernyőkép, amely az átviteli sebességet, a legutóbbi API-tevékenységet és a teljes használatot mutatja
    workspaceManagement:
      title: Munkaterület és széf kezelés
      description: Kezeld a felhasználói széfeket, rendszer széfeket és code-server belépési pontokat egyetlen vezérlőfelületről, amely megosztott környezetekhez és gyors karbantartáshoz készült.
      alt: HagiCode munkaterület-kezelés képernyőkép, amely felhasználói széfeket, rendszer széfeket és code-server műveleteket mutat
    achievementProgress:
      title: Teljesítmény és növekedés nyomon követése
      description: A napi előrehaladás, a globális növekedés és az életciklus-metrikák egy irányítópultba kerülnek, így a hosszú távú adoptálás mérhetővé válik az absztrakt helyett.
      alt: HagiCode teljesítmény irányítópult képernyőkép, amely napi előrehaladást, globális növekedést és életciklus-metrikákat mutat
