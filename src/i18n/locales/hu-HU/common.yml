showcase:
  title: Legújabb terméknézetek
  description: A javaslati végrehajtástól és munkamenet-panelektől a token-analitikáig, munkaterület-kezelésig és teljesítmény-követésig a kezdőlap most a legújabb, válogatott képernyőképeket használja, amelyeket a dokumentációs oldallal együtt tartanak karban.
  controls:
    previous: Előző
    next: Következő
    current: Kiemelt nézet
    railLabel: Termék képernyőkép navigáció
    selectPrefix: 'Váltás: '
