desktop:
  title: Hagicode Desktop - Transferir
  description: Transfira o Hagicode Desktop, um assistente de código IA localizado. Suporta Windows, macOS e Linux. Proteção de privacidade, resposta rápida.
  features:
    title: Funcionalidades Principais
    local:
      title: Execução Local
      description: Todos os dados são processados localmente sem carregamento para a nuvem, garantindo a privacidade e segurança do código
    privacy:
      title: Proteção de Privacidade
      description: O código nunca é carregado, suporta utilização offline, protegendo a sua propriedade intelectual
    fast:
      title: Resposta Rápida
      description: Tempo de resposta em milissegundos, sem necessidade de pedidos de rede, aumentando a eficiência de desenvolvimento
    crossPlatform:
      title: Suporte Multiplataforma
      description: Suporta Windows, macOS e Linux para satisfazer diferentes necessidades de ambiente de desenvolvimento
    autoUpdate:
      title: Atualizações Automáticas
      description: Verifica automaticamente atualizações e atualiza para a versão mais recente com um clique
    multiLanguage:
      title: Suporte Multi-idioma
      description: Interface integrada em chinês e inglês, suportando colaboração em equipas internacionais
  systemRequirements:
    title: Requisitos do Sistema
    windows: Windows
    macos: macOS
    linux: Linux
    os: Sistema Operativo
    processor: Processador
    memory: Memória
    diskSpace: Espaço em Disco
    network: Rede
    windowsOs: Windows 10/11 (64-bit)
    macosOs: macOS 12+ (Monterey ou superior)
    linuxOs: Ubuntu 20.04+ / Debian 11+ / Outras distribuições principais
    windowsProcessor: Intel Core i3 ou processador equivalente
    macosProcessor: Apple Silicon (M1/M2/M3) ou Intel Core i3+
    linuxProcessor: Intel Core i3 ou processador equivalente
    memoryRec: 4GB RAM (8GB recomendado)
    disk: 2GB de espaço disponível
    networkDesc: Ligação de rede necessária para a transferência inicial (pode ser usado offline posteriormente)
  download:
    title: Pacotes de Transferência
    windowsDesc: Instaladores estáveis para Windows 10/11, incluindo versões de instalação e portáteis.
    macosDesc: Versões nativas para Macs Apple Silicon e Intel.
    linuxDesc: Pacotes AppImage e tarball para distribuições Linux principais x64 e ARM64.
    note: Se a lista de pacotes aqui falhar ao carregar, utilize o link do histórico de versões na área principal para aceder ao índice canónico.
    features:
      signed: Pacotes assinados
      autoUpdate: Deteção automática de atualizações
      multiLanguage: Interface multi-idioma
  installation:
    title: Instalação Rápida
    step1:
      number: '1'
      title: Transferir Instalador
      description: Selecione o instalador adequado para o seu sistema operativo
    step2:
      number: '2'
      title: Executar Instalador
      description: Clique duas vezes no instalador transferido e siga as instruções para completar a instalação
    step3:
      number: '3'
      title: Iniciar Aplicação
      description: Na primeira execução, será guiado pela configuração inicial
    step4:
      number: '4'
      title: Começar a Usar
      description: Após a configuração, pode começar a usar o Hagicode Desktop
  faq:
    title: FAQ
    q1:
      question: Qual é a diferença entre as versões Desktop e Servidor?
      intro: 'O Hagicode oferece duas opções de implementação: versão Desktop e versão Servidor. Cada uma tem as suas vantagens, mas ambas adotam uma abordagem de servidor e dados controlados pelo utilizador, proporcionando melhor proteção de dados.'
      desktopTitle: Versão Desktop
      desktop1: Corre localmente no seu computador, mais leve
      desktop2: Sem necessidade de configuração de servidor, pronto a usar de imediato
      desktop3: Adequado para programadores individuais e cenários de utilização leve
      desktop4: Todos os dados completamente localizados
      serverTitle: Versão Servidor
      server1: Pode ser implementada em servidores remotos
      server2: Suporta acesso remoto multiutilizador
      server3: Mais adequada para colaboração em equipa e escalabilidade
      server4: Prepara-se para futuras funcionalidades empresariais e sincronização multi-dispositivo
      conclusion: Independentemente da versão que escolher, tem controlo total sobre o seu servidor e dados, desfrutando de melhor proteção de privacidade e segurança de dados.
    q2:
      question: O que preciso de fazer após a instalação?
      intro: 'O Hagicode Desktop é essencialmente um launcher. Na primeira execução após a instalação, será guiado por estes passos:'
      step1: '<strong>Transferir Hagicode Core:</strong> O Desktop detetará automaticamente e solicitará a transferência dos componentes principais do Hagicode'
      step2: '<strong>Instalar Componentes Principais:</strong> Siga as instruções no ecrã para completar a instalação dos componentes principais'
      step3: '<strong>Configurar o seu Agent CLI predefinido:</strong> Escolha um Agent CLI atualmente suportado e complete os passos necessários de início de sessão, autorização ou instalação local.'
      note: A interface do Desktop guia todo o fluxo. Mantenha a rede disponível na primeira execução para que o Hagicode Core possa ser transferido; alguns Agent CLIs ainda requerem instalação manual ou autenticação, mas continuam a fazer parte do suporte atual.
      done: Após completar estes passos, pode usar todas as funcionalidades do Hagicode Desktop normalmente.
    q3:
      question: Como verifico se há atualizações?
      answer: O Desktop verifica automaticamente atualizações. Quando uma nova versão estiver disponível, aparecerá uma notificação no canto superior direito da interface. Também pode verificar manualmente atualizações nas "Definições".
    q4:
      question: Que Agent CLIs de IA são suportados?
      intro: 'O Hagicode Desktop suporta atualmente os seguintes Agent CLIs:'
      active: '<strong>Atualmente suportados:</strong> Claude Code, Codex, GitHub Copilot, OpenCode, Hermes, QoderCLI, Kiro, Kimi, Gemini, DeepAgents e Codebuddy'
      manual: '<strong>Instalação manual ou autenticação:</strong> Hermes, Gemini e DeepAgents requerem uma instalação local ou passo de autenticação primeiro; os outros CLIs fornecem pontos de entrada de instalação com um clique ou fluxos de instalação guiados.'
      legacy: '<strong>Apenas compatibilidade legada:</strong> IFlowCli permanece apenas para compatibilidade de dados históricos e não faz parte do suporte ativo atual.'
      closing: O âmbito de suporte e o modo de configuração são questões separadas. Um CLI que necessite de instalação manual continua a ser suportado agora.
    q5:
      question: Suporta utilização offline?
      intro: 'Sim! O Hagicode Desktop suporta utilização offline completa:'
      point1: Ligação de rede necessária para instalação e configuração inicial (transferência de componentes principais e modelos de IA)
      point2: Todas as funcionalidades podem ser usadas offline após a configuração
      point3: O seu código e dados nunca são carregados para a nuvem
      point4: Todo o processamento de IA é concluído localmente
    q6:
      question: O macOS diz que o Hagicode.app está danificado ou não pode ser aberto. O que devo fazer?
      intro: Se o Hagicode Desktop estiver instalado no caminho predefinido /Applications/Hagicode.app e o macOS Gatekeeper bloquear a primeira execução, utilize o seguinte comando para remover o atributo de quarentena da aplicação.
      cause: Isto acontece porque o macOS adiciona o atributo com.apple.quarantine a aplicações transferidas da internet. É um problema de isolamento de segurança do macOS, não uma falha no instalador do Hagicode.
      command: sudo xattr -dr com.apple.quarantine /Applications/Hagicode.app
      note: Execute o comando no Terminal com privilégios de administrador e reinicie o Hagicode Desktop.
    q7:
      question: Como obter ajuda ao encontrar problemas?
      intro: 'Se encontrar problemas ao usar o Hagicode Desktop, pode obter ajuda através de:'
      point1: '<strong>Grupo de Suporte Técnico:</strong> Junte-se ao Grupo QQ 610394020'
      point2: '<strong>Documentação Online:</strong> Consulte documentação completa de utilização e tutoriais'
      point3: '<strong>GitHub Issues:</strong> Submeta relatórios de problemas no repositório do projeto'
