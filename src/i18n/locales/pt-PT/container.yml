container:
  title: Contentor Hagicode - Implementação por Contentor
  description: Implemente o Hagicode via Docker Compose Builder. Configuração simples, pronto a usar. Suporta múltiplas origens de imagens e atualizações automáticas.
  hero:
    badge: Contentor
    title: Contentor Hagicode
    tagline: Implemente rapidamente com Docker Compose Builder, configuração simples, pronto a usar
    value1: Configuração visual, sem necessidade de programação
    value2: Isolamento de ambiente, segurança de dados
    value3: Implementação com um clique, arranque rápido
    ctaButton: Implementar com Docker Compose Builder
    features:
      isolation: Isolamento de Ambiente
      oneClick: Implementação com Um Clique
      fastStart: Arranque Rápido
  features:
    title: Porque Escolher a Implementação por Contentor?
    isolation:
      title: Isolamento de Ambiente
      description: A implementação contentorizada evita conflitos de dependências, não afeta o ambiente do sistema, mantém o sistema limpo
    simple:
      title: Configuração Simples
      description: Utilize o Docker Compose Builder para configuração visual, sem necessidade de escrever scripts complexos
    crossPlatform:
      title: Suporte Multiplataforma
      description: Suporta arquitetura x86_64, adequado para vários servidores e plataformas na nuvem
    persistent:
      title: Persistência de Dados
      description: Suporta montagem de Volumes, dados seguros e fiáveis, sem perda de dados ao reiniciar o contentor
    autoUpdate:
      title: Atualizações Automáticas
      description: Suporta watchtower para atualizações automáticas, obtenha facilmente a versão mais recente
    productionReady:
      title: Pronto para Produção
      description: Projetado para ambientes de produção, suporta alta disponibilidade e escalabilidade horizontal
  builder:
    title: Docker Compose Builder
    subtitle: O método de implementação por contentor mais simples e recomendado
    visual:
      title: Configuração Visual
      description: Configure todos os parâmetros através de uma interface Web amigável, sem necessidade de editar manualmente ficheiros YAML
    generate:
      title: Geração de Configuração com Um Clique
      description: Gere automaticamente ficheiros docker-compose.yml completos com configurações de boas práticas
    deploy:
      title: Implementação Rápida
      description: Transfira ficheiros de configuração com um clique e inicie serviços, complete a implementação em minutos
    secure:
      title: Seguro e Fiável
      description: Boas práticas de segurança integradas, configura automaticamente volumes de dados e políticas de reinício
    ctaButton: Ir para o Docker Compose Builder
  mirrors:
    title: Seleção de Origem de Imagem
    description: Escolha a origem de imagem mais adequada com base no seu ambiente de rede e localização
    dockerHub: Docker Hub
    dockerHubDesc: O maior registo de imagens de contentor do mundo, adequado para utilizadores de redes internacionais
    dockerHubCmd: newbe36524/hagicode:0
    azure: Azure ACR
    azureDesc: Serviço de imagens do Microsoft Azure, acesso mais rápido a partir da China
    azureCmd: hagicode.azurecr.io/hagicode:0
    aliyun: Aliyun ACR
    aliyunDesc: Aceleração de imagem nacional da Aliyun, recomendada para utilizadores na China continental
    aliyunCmd: registry.cn-hangzhou.aliyuncs.com/hagicode/hagicode:0
  faq:
    title: FAQ
    q1:
      question: Qual é a diferença entre as versões Contentor e Desktop?
      intro: 'Ambas as versões têm as suas vantagens. Pode escolher com base no seu cenário de utilização:'
      desktopTitle: Versão Desktop
      desktop1: Corre localmente no seu computador, mais leve
      desktop2: Sem necessidade de configuração de servidor, pronto a usar de imediato
      desktop3: Adequado para programadores individuais e cenários de utilização leve
      desktop4: Todos os dados completamente localizados
      containerTitle: Versão Contentor
      container1: Pode ser implementada em servidores, suporta acesso remoto
      container2: Isolamento de ambiente, não afeta o ambiente do sistema
      container3: Mais adequada para colaboração em equipa e ambientes de produção
      container4: Suporta implementação automatizada e escalabilidade horizontal
    q2:
      question: O que é o Docker Compose Builder?
      intro: 'O Docker Compose Builder é a nossa ferramenta de configuração visual que o ajuda a:'
      point1: Configurar todos os parâmetros do contentor através de uma interface Web
      point2: Gerar automaticamente ficheiros docker-compose.yml
      point3: Boas práticas e configurações de segurança integradas
      point4: Transferir e iniciar serviços com um clique
      note: Sem necessidade de escrever manualmente configurações YAML complexas. Mesmo principiantes em Docker podem implementar facilmente.
    q3:
      question: Que arquiteturas de sistema a versão contentor suporta?
      answer: 'As imagens do contentor Hagicode suportam atualmente a arquitetura <strong>x86_64 (amd64)</strong>, adequada para a maioria dos servidores e PCs.'
      note: O Docker selecionará automaticamente a arquitetura adequada para o seu sistema ao extrair imagens.
    q4:
      question: Como atualizar o contentor?
      intro: 'Ao utilizar a implementação Docker Compose, a atualização é muito simples:'
      code: |-
        docker-compose pull
        docker-compose up -d
      watchtower: Ou utilize o Watchtower para atualizações automáticas.
    q5:
      question: Como configurar a persistência de dados?
      intro: 'O Docker Compose Builder configura automaticamente volumes de dados. Por predefinição, os seus dados serão armazenados em Docker Volumes, garantindo:'
      point1: Os dados não são perdidos quando os contentores são eliminados
      point2: Os dados são preservados durante atualizações de contentores
      point3: Cópia de segurança e recuperação fáceis
    q6:
      question: O que fazer se o contentor não iniciar?
      intro: 'Passos para resolver falhas no arranque do contentor:'
      step1:
        title: 'Verificar estado do contentor:'
        code: docker-compose ps
      step2:
        title: 'Verificar registos do contentor:'
        code: docker-compose logs hagicode
      step3:
        title: 'Verificar ocupação da porta:'
        desc: 'Se a porta do seu serviço for a 3000, utilize este comando para verificar:'
        code: netstat -tlnp | grep 3000
        solution: 'Se a porta estiver ocupada, pode:'
        solution1: Parar o processo que ocupa a porta
        solution2: Ou configurar uma porta diferente no Docker Compose Builder
      help: Se o problema persistir, consulte a documentação detalhada ou contacte o suporte técnico.
  cta:
    title: Comece a Usar o Docker Compose Builder
    subtitle: O método de implementação por contentor mais simples e recomendado
    button: Ir para o Guia de Implementação
    github: Repositório GitHub
