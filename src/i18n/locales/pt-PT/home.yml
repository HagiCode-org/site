      turboEngine:
        category: DLC de Desempenho
        title: 'Hagicode: Turbo Engine DLC'
        price: Steam
        description: Pode comprar este DLC separadamente para expandir o limite original de concorrência de propostas, desbloquear a troca de cópia, adicionar cinco pacotes de avatares com 10 avatares individuais cada, ativar carregamentos de avatares personalizados, personalizar o logótipo e título no canto superior esquerdo e alinhar os trailers de commit gerados por IA com as suas próprias regras de nomenclatura Co-Authored-By. Normalmente destacaremos uma opção de compra em bundle chamada Hagicode Plus para que o preço geral de compra se mantenha mais baixo. Verifique a nossa página da loja para as alterações mais recentes.
        bullets:
          - Suporta logótipos e títulos personalizados no canto superior esquerdo
          - Inclui cinco pacotes de avatares com 10 avatares selecionáveis em cada pacote
          - Suporta carregamentos de avatares personalizados
          - Permite às equipas personalizar a assinatura Co-Authored-By da IA para fluxos de trabalho de commit
          - Desbloqueia o suporte de troca de cópia e redação
          - Expande o limite máximo de propostas concorrentes para 32
      hagicodePlus:
        category: Bundle
        title: Hagicode Plus
        price: Steam
        description: O bundle oficial Steam que combina a edição base do Hagicode com o Turbo Engine DLC num único caminho de compra.
        bullets:
          - Agrupa a edição Steam principal e o Turbo Engine DLC juntos
          - Mantém a atualização de concorrência de 32 propostas anexada ao caminho do bundle
          - Funciona como a entrada de compra mais clara quando deseja a configuração Steam completa de uma vez
      sponsor:
        category: DLC de Apoio
        title: Hagicode - Sponsor Pack
        price: Steam
        description: Se acha que o Hagicode é genuinamente excelente e quer fornecer apoio financeiro direto, comprar o Sponsor Pack dá ao projeto mais combustível e ajuda-nos a mantê-lo a funcionar a longo prazo.
        bullets:
          - Um tema escuro exclusivo
          - Um tema claro exclusivo
          - Uma conquista Steam exclusiva
