features:
  showcase:
    title: Três Funcionalidades Principais
    subtitle: Redefina a sua experiência de codificação IA
  smart:
    badge: INTELIGENTE
    title: Inteligente
    subtitle: Fluxo de trabalho OpenSpec, aumente a eficiência da codificação IA
    efficiency: Aumento de Eficiência
    traditional: Tradicional
    hagicode: Hagicode
    description: Um fluxo de trabalho completo de 9 estágios desde a ideia até ao arquivo, com assistência IA em todo o processo. Aumente a sua eficiência de codificação em 3x.
    workflow:
      idea:
        label: Ideia
        desc: Começar pela ideia
      proposal:
        label: Proposta
        desc: IA gera proposta
      review:
        label: Revisão
        desc: Revisão automática
      tasks:
        label: Tarefas
        desc: Decomposição de tarefas
      code:
        label: Código
        desc: Codificação inteligente
      test:
        label: Teste
        desc: Testes automáticos
      refactor:
        label: Refatoração
        desc: Refatoração de código
      docs:
        label: Docs
        desc: Geração de documentação
      archive:
        label: Arquivo
        desc: Arquivo de conhecimento
    paused: Em Pausa - Clique no nó para mudar
  convenient:
    badge: EFICIENTE
    title: Eficiente
    subtitle: Execução multi-agent, multi-instância que mantém a sua quota em movimento
    traditional: Agente único tradicional / instância única
    multiThread: Matriz paralela multi-agent
    boost: Aumento de Débito
    boostValue: 10x+ paralelo
    description: Os Agent CLIs atualmente suportados, como Claude Code, Codex, GitHub Copilot, OpenCode e Hermes, podem trabalhar em múltiplas instâncias ao mesmo tempo, para que propostas, correções e revisões avancem em paralelo em vez de esperarem numa fila serial.
    agentMatrix:
      title: Matriz de execução paralela
      badge: Múltiplos agentes / múltiplas instâncias
      status: Múltiplos agentes estão a gerir múltiplas instâncias agora mesmo
      agents:
        claude:
          name: Claude Code
          role: Proposta / revisão
          instances:
            - Rascunhar spec
            - Verificar design
            - Arquivar revisão
        codex:
          name: Codex
          role: Implementação / correções
          instances:
            - Construir funcionalidade A
            - Construir funcionalidade B
            - Correção de regressão
        router:
          name: Qwen · GLM
          role: Análise / suporte
          instances:
            - Rastrear problema
            - Polir texto
            - Capturar insights
      supportedNames:
        title: 11 Agent CLIs atualmente suportados
        names:
          - Claude Code
          - Codex
          - GitHub Copilot
          - OpenCode
          - Hermes
          - QoderCLI
          - Kiro
          - Kimi
          - Gemini
          - DeepAgents
          - Codebuddy
    supportedProvidersNote: O OpenCode pode carregar o catálogo partilhado OmniRoute nos modelos predefinidos de herói enquanto mantém identificadores de modelos brutos personalizados editáveis para fluxos de trabalho específicos de branch.
  interesting:
    badge: INTERESSANTE
    title: Divertido
    subtitle: O Hero Dungeon torna a colaboração e prática no campus mais dinâmicas
    features:
      dungeons:
        label: Hero Dungeons
        desc: Transforme geração, execução e workbenches de prompts em dungeon runs
      captains:
        label: Lista de Capitães
        desc: Atribua o capitão herói certo a cada dungeon
      battle:
        label: Relatórios de Batalha
        desc: Reveja XP, níveis e resultados de execução após cada push
    description: A diversão já não depende de emblemas de conquistas. Hero Dungeon, listas de capitães, visuais de prompts e relatórios de batalha transformam a prática diária de codificação IA num fluxo de trabalho que se parece mais com uma aventura coordenada para laboratórios de campus e equipas de estudantes.
    dungeonCards:
      proposal:
        title: Dungeon de Propostas
        desc: OpenSpec gerar / aplicar / arquivar
        status: Capitão pronto
      autotask:
        title: Dungeon de AutoTask
        desc: Correções paralelas e automatização em lote
        status: 2 instâncias ativas
      prompt:
        title: Dungeon de Prompts
        desc: Pré-visualização de prompts e workbench de estilos
        status: Sincronização visual pronta
    roster:
      title: Lista atual de capitães
      heroes:
        strategist:
          name: Estrategista de Specs
          role: Capitão de propostas
        runner:
          name: Patch Runner
          role: Capitão de execução
        artist:
          name: Artista de Prompts
          role: Suporte visual
    battleReport:
      title: Relatório de dungeon de hoje
      badge: Batalha de Heróis
      metrics:
        dungeons:
          value: '4'
          label: Dungeons concluídas
        level:
          value: Lv.27
          label: Nível do capitão
        xp:
          value: 12.8M
          label: XP hoje
      note: Quando várias dungeons avançam em paralelo, o relatório consolida experiência, níveis e resultados de execução num único resumo.
    gallery:
      dungeons:
        title: Carrossel do mapa de dungeons
        subtitle: 10 visuais aleatórios da dungeon frontend atual e da coleção de mapas de prompts.
      heroes:
        title: Carrossel da galeria de heróis
        subtitle: 10 visuais aleatórios de heróis da coleção frontend atual de heróis.
