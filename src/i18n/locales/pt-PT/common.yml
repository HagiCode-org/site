showcase:
  title: Últimas Vistas do Produto
  description: Desde a execução de propostas e painéis de sessão até à análise de tokens, gestão de espaços de trabalho e progresso de conquistas, a página inicial agora utiliza as capturas de ecrã mais recentes mantidas com o site de documentação.
  controls:
    previous: Anterior
    next: Seguinte
    current: Vista em destaque
    railLabel: Navegação de capturas de ecrã do produto
    selectPrefix: 'Mudar para: '
    activeState: A mostrar agora
    previewState: Pré-visualização
    imageUnavailable: Imagem indisponível
    openFullscreen: 'Abrir em ecrã inteiro: '
    openFullscreenHint: Clique para ampliar
    closeFullscreen: Fechar ecrã inteiro
  screenshots:
    proposalWorkflow:
      title: Visão geral da execução de propostas
      description: Mantenha o estágio do fluxo de trabalho, o resultado da execução e o contexto da sessão num só ecrã para que as equipas vejam exatamente onde uma alteração se encontra antes de avançar.
      alt: Captura de ecrã da execução de propostas do HagiCode mostrando estágios do fluxo de trabalho, resultado da execução e barra lateral da sessão
    sessionBoard:
      title: Painel de sessões e planeamento de dungeons
      description: Sessões pendentes, em progresso e arquivadas mantêm-se visíveis ao lado de um painel de tarefas fantasia para que o trabalho paralelo de agentes seja fácil de analisar de relance.
      alt: Captura de ecrã do painel de sessões do HagiCode mostrando colunas pendentes, em progresso e arquivadas ao lado de um painel de tarefas fantasia
    tokenAnalytics:
      title: Análise de tokens em tempo real
      description: Observe o débito, a atividade recente da API e o uso total numa superfície de métricas para que o custo e o ritmo se mantenham controláveis durante a execução paralela.
      alt: Captura de ecrã da análise de tokens do HagiCode mostrando débito, atividade recente da API e uso total
    workspaceManagement:
      title: Gestão de espaços de trabalho e cofres
      description: Gira cofres de utilizador, cofres de sistema e pontos de entrada do code-server a partir de uma superfície de controlo construída para ambientes partilhados e manutenção rápida.
      alt: Captura de ecrã da gestão de espaços de trabalho do HagiCode mostrando cofres de utilizador, cofres de sistema e ações do code-server
    achievementProgress:
      title: Progresso de conquistas e crescimento
      description: Progresso diário, crescimento global e métricas de ciclo de vida convergem num único painel para que a adoção de longa duração se sinta mensurável em vez de abstrata.
      alt: Captura de ecrã do painel de conquistas do HagiCode mostrando progresso diário, crescimento global e métricas de ciclo de vida
