container:
  title: Hagicode Container - Konttikerääminen
  description: Ota Hagicode käyttöön Docker Compose Builderilla. Yksinkertainen määritys, käyttövalmis. Tukee useita levykuvan lähteitä ja automaattisia päivityksiä.
  hero:
    badge: Kontti
    title: Hagicode Container
    tagline: Nopea käyttöönotto Docker Compose Builderilla, yksinkertainen määritys, käyttövalmis
    value1: Visuaalinen määritys, ei koodausta
    value2: Ympäristöeristys, tietoturva
    value3: Yhden klikkauksen käyttöönotto, nopea käynnistys
    ctaButton: Ota käyttöön Docker Compose Builderilla
    features:
      isolation: Ympäristöeristys
      oneClick: Yhden klikkauksen käyttöönotto
      fastStart: Nopee käynnistys
  features:
    title: Miksi valita konttikäyttöönotto?
    isolation:
      title: Ympäristöeristys
      description: Kontitettu käyttöönotto välttää riippuvuusristiriidat, ei vaikuta järjestelmäympäristöön, pitää järjestelmän puhtaana
    simple:
      title: Yksinkertainen määritys
      description: Käytä Docker Compose Builderia visuaaliseen määritykseen, ei tarvitse kirjoittaa monimutkaisia skriptejä
    crossPlatform:
      title: Monialustatuki
      description: Tukee x86_64-arkkitehtuuria, sopii erilaisille palvelimille ja pilvialustoille
    persistent:
      title: Tietojen pysyvyys
      description: Tukea Volume-liitoksia, turvalliset ja luotettavat tiedot, ei tietojen häviämistä kontin uudelleenkäynnistyksessä
    autoUpdate:
      title: Automaattiset päivitykset
      description: Tukee Watchtoweria automaattisiin päivityksiin, saat helposti uusimman version
    productionReady:
      title: Tuotantovalmis
      description: Suunniteltu tuotantoympäristöihin, tukee korkeaa saatavuutta ja vaakasuuntaista skaalausta
  builder:
    title: Docker Compose Builder
    subtitle: Yksinkertaisin ja suositelluin konttikäyttöönoton menetelmä
    visual:
      title: Visuaalinen määritys
      description: Määritä kaikki parametrit käyttäjäystävällisen Web-käyttöliittymän kautta, ei tarvitse muokata YAML-tiedostoja manuaalisesti
    generate:
      title: Yhden klikkauksen määrityksen luonti
      description: Luo automaattisesti täydelliset docker-compose.yml-tiedostot parhaiden käytäntöjen määrityksillä
    deploy:
      title: Nopea käyttöönotto
      description: Lataa määritystiedostot yhdellä klikkauksella ja käynnistä palvelut, suorita käyttöönotto minuuteissa
    secure:
      title: Turvallinen ja luotettava
      description: Sisäänrakennetut tietoturvan parhaat käytännöt, määrittää automaattisesti tietoasemat ja uudelleenkäynnistyskäytännöt
    ctaButton: Siirry Docker Compose Builderiin
  mirrors:
    title: Levykuvan lähteen valinta
    description: Valitse sopivin levykuvan lähde verkkoympäristösi ja sijaintisi perusteella
    dockerHub: Docker Hub
    dockerHubDesc: Maailman suurin konttilevykuvan rekisteri, sopii kansainvälisen verkon käyttäjille
    dockerHubCmd: newbe36524/hagicode:0
    azure: Azure ACR
    azureDesc: Microsoft Azuren levykuvaluonti, nopeampi pääsy Kiinasta
    azureCmd: hagicode.azurecr.io/hagicode:0
    aliyun: Aliyun ACR
    aliyunDesc: Aliyunin kotimainen levykuvan kiihdytys, suositeltu Manner-Kiinan käyttäjille
    aliyunCmd: registry.cn-hangzhou.aliyuncs.com/hagicode/hagicode:0
  faq:
    title: UKK
    q1:
      question: Mikä ero on kontti- ja työpöytäversioiden välillä?
      intro: 'Molemmilla versioilla on omat etunsa. Voit valita käyttötapahtumasi mukaan:'
      desktopTitle: Työpöytäversio
      desktop1: Suoritetaan paikallisesti tietokoneellasi, kevyempi
      desktop2: Ei palvelinmäärityksiä tarvita, käyttövalmis suoraan
      desktop3: Sopii yksittäisille kehittäjille ja kevyteen käyttöön
      desktop4: Kaikki tiedot täysin paikallisia
      containerTitle: Konttiversio
      container1: Voidaan ottaa käyttöön palvelimilla, tukee etäyhteyksiä
      container2: Ympäristöeristys, ei vaikuta järjestelmäympäristöön
      container3: Sopii paremmin tiimityöhön ja tuotantoympäristöihin
      container4: Tukee automatisoitua käyttöönottoa ja vaakasuuntaista skaalausta
    q2:
      question: Mikä on Docker Compose Builder?
      intro: 'Docker Compose Builder on visuaalinen määritystyökalumme, joka auttaa sinua:'
      point1: Määrittämään kaikki konttiparametrit Web-käyttöliittymän kautta
      point2: Generoimaan automaattisesti docker-compose.yml-tiedostoja
      point3: Sisäänrakennetut parhaat käytännöt ja tietoturvamääritykset
      point4: Lataamaan ja käynnistämään palvelut yhdellä klikkauksella
      note: Ei tarvitse kirjoittaa monimutkaisia YAML-määrityksiä manuaalisesti. Myös Dockerin aloittelijat voivat ottaa käyttöön helposti.
    q3:
      question: Mitä järjestelmäarkkitehtuureja konttiversio tukee?
      answer: Hagicode-konttilevykuvat tukevat tällä hetkellä <strong>x86_64 (amd64)</strong>-arkkitehtuuria, joka sopii useimmille palvelimille ja tietokoneille.
      note: Docker valitsee automaattisesti oikean arkkitehtuurin järjestelmällesi kuvia noudettaessa.
    q4:
      question: Kuinka päivittää kontti?
      intro: 'Kun käytät Docker Compose -käyttöönottoa, päivittäminen on hyvin yksinkertaista:'
      code: |-
        docker-compose pull
        docker-compose up -d
      watchtower: Tai käytä Watchtoweria automaattisiin päivityksiin.
    q5:
      question: Kuin määrittää tietojen pysyvyyden?
      intro: 'Docker Compose Builder määrittää automaattisesti tietoasemat. Oletuksena tietosi tallennetaan Docker Volumes -asemiin, varmistaen:'
      point1: Tiedot eivät katoa, kun kontit poistetaan
      point2: Tiedot säilyvät konttipäivitysten aikana
      point3: Helppo varmuuskopiointi ja palautus
    q6:
      question: Mitä tehdä, jos kontin käynnistys epäonnistuu?
      intro: 'Vaiheet kontin käynnistysongelman ratkaisemiseksi:'
      step1:
        title: 'Tarkista kontin tila:'
        code: docker-compose ps
      step2:
        title: 'Tarkista kontin lokit:'
        code: docker-compose logs hagicode
      step3:
        title: 'Tarkista portin käyttö:'
        desc: 'Jos palvelusi portti on 3000, käytä tätä komentoa tarkistaaksesi:'
        code: netstat -tlnp | grep 3000
        solution: 'Jos portti on varattu, voit:'
        solution1: Pysäyttää portin varaavan prosessin
        solution2: Tai määrittää eri portin Docker Compose Builderissa
      help: Jos ongelma jatkuu, tarkista yksityiskohtainen dokumentaatio tai ota yhteyttä tekniseen tukeen.
  cta:
    title: Aloita Docker Compose Builderin käyttö
    subtitle: Yksinkertaisin ja suositelluin konttikäyttöönoton menetelmä
    button: Siirry käyttöönotto-oppaaseen
    github: GitHub-repositorio
