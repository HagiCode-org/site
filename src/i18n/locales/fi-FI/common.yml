      title: Istuntotaulu ja dungeon-suunnittelu
      description: Odottavat, käynnissä olevat ja arkistoidut istunnot pysyvät näkyvillä fantasiatehtäväpaneelin vieressä, jolloin rinnakkainen agenttityö on helppo silmäillä kerralla.
      alt: HagiCode-istuntotaulun kuvakaappaus, joka näyttää odottavat, käynnissä olevat ja arkistoidut sarakkeet fantasiatehtäväpaneelin vieressä
    tokenAnalytics:
      title: Reaaliaikainen token-analytiikka
      description: Seuraa läpimenoa, viimeisintä API-toimintaa ja kokonaiskäyttöä yhdellä mittaripinnalla, jotta kustannukset ja tahti pysyvät hallittavina rinnakkaisen suorituksen aikana.
      alt: HagiCode-tokenanalytiikan kuvakaappaus, joka näyttää läpimenon, viimeisimmän API-toiminnan ja kokonaiskäytön
    workspaceManagement:
      title: Työtilan ja holvin hallinta
      description: Hallitse käyttäjän holveja, järjestelmän holveja ja code-serverin päätepisteitä yhdeltä hallintapinnalta, joka on suunniteltu jaettuihin ympäristöihin ja nopeaan ylläpitoon.
      alt: HagiCode-työtilanhallinnan kuvakaappaus, joka näyttää käyttäjän hollit, järjestelmän hollit ja code-server-toiminnot
    achievementProgress:
      title: Saavutusten ja kasvun edistyminen
      description: Päivittäinen edistyminen, globaali kasvu ja elinkaarimittarit kootaan yhteen kojelaudalle, jolloin pitkäaikainen käyttöönotto tuntuu mitattavalta abstraktin sijaan.
      alt: HagiCode-saavutuskojelaudan kuvakaappaus, joka näyttää päivittäisen edistymisen, globaalin kasvun ja elinkaarimittarit
