  container:
    title: Konttiversio
    description: Käyttöönotto palvelimilla, tukee etäyhteyksiä, sopii tiimityöhön
    features:
      - Tukee x86_64-arkkitehtuuria
      - Ympäristöeristys, ei vaikuta järjestelmään
      - Tukee Docker Compose Builderia
      - Tietojen pysyvyys, turvallinen ja luotettava
      - Sopii tuotantoympäristöihin
