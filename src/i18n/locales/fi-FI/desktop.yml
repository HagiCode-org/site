desktop:
  title: Hagicode Desktop - Lataa
  description: Lataa Hagicode Desktop, lokalisoitu tekoälykoodiavustaja. Tukee Windows-, macOS- ja Linux-käyttöjärjestelmiä. Yksityisyydensuoja, nopea vaste.
  features:
    title: Keskeiset ominaisuudet
    local:
      title: Paikallinen suoritus
      description: Kaikki tiedot käsitellään paikallisesti ilman pilveen lataamista, varmistaen koodin yksityisyyden ja turvallisuuden
    privacy:
      title: Yksityisyydensuoja
      description: Koodia ei koskaan ladata, tukee offline-käyttöä, suojaa immateriaalioikeuksiasi
    fast:
      title: Nopea vaste
      description: Millisekuntivasteaika, ei verkkopyyntöjä tarvita, tehostaa kehitystyötä
    crossPlatform:
      title: Monialustatuki
      description: Tukee Windows-, macOS- ja Linux-käyttöjärjestelmiä erilaisiin kehitysympäristötarpeisiin
    autoUpdate:
      title: Automaattiset päivitykset
      description: Tarkistaa automaattisesti päivitykset ja päivittää uusimpaan versioon yhdellä klikkauksella
    multiLanguage:
      title: Monikielituki
      description: Sisäänrakennettu kiinalainen ja englanninkielinen käyttöliittymä, tukee kansainvälisen tiimin yhteistyötä
  systemRequirements:
    title: Järjestelmävaatimukset
    windows: Windows
    macos: macOS
    linux: Linux
    os: Käyttöjärjestelmä
    processor: Suoritin
    memory: Muisti
    diskSpace: Levytila
    network: Verkko
    windowsOs: Windows 10/11 (64-bittinen)
    macosOs: macOS 12+ (Monterey tai uudempi)
    linuxOs: Ubuntu 20.04+ / Debian 11+ / Muut valtavirran jakelut
    windowsProcessor: Intel Core i3 tai vastaava suoritin
    macosProcessor: Apple Silicon (M1/M2/M3) tai Intel Core i3+
    linuxProcessor: Intel Core i3 tai vastaava suoritin
    memoryRec: 4 Gt RAM (8 Gt suositeltu)
    disk: 2 Gt vapaata tilaa
    networkDesc: Verkkoyhteys tarvitaan alkulataukseen (voidaan käyttää offline-tilassa tämän jälkeen)
  download:
    title: Latauspaketit
    windowsDesc: Vakaat asennusohjelmat Windows 10/11 -käyttöjärjestelmille, mukaan lukien asennus- ja kannettavat versiot.
    macosDesc: Natiivit versiot Apple Silicon- ja Intel-Maceille.
    linuxDesc: AppImage- ja tarball-paketit valtavirran x64- ja ARM64-Linux-jakeluille.
    note: Jos pakettiluettelo ei lataudu täällä, käytä hero-alueen versiohistorialinkkiä päästäksesi kanoniseen indeksiin.
    features:
      signed: Allekirjoitetut paketit
      autoUpdate: Automaattinen päivitysten tunnistus
      multiLanguage: Monikielinen käyttöliittymä
  installation:
    title: Pikaisennus
    step1:
      number: '1'
      title: Lataa asennusohjelma
      description: Valitse käyttöjärjestelmällesi sopiva asennusohjelma
    step2:
      number: '2'
      title: Suorita asennusohjelma
      description: Kaksoisklikkaa ladattua asennusohjelmaa ja seuraa ohjeita asennuksen viimeistelemiseksi
    step3:
      number: '3'
      title: Käynnistä sovellus
      description: Ensimmäisen käynnistyksen yhteydessä sovellus opastaa alkumäärityksessä
    step4:
      number: '4'
      title: Aloita käyttö
      description: Määrityksen jälkeen voit aloittaa Hagicode Desktopin käytön
  faq:
    title: UKK
    q1:
      question: Mikä ero on Desktop- ja Server-versioiden välillä?
      intro: 'Hagicode tarjoaa kaksi käyttöönottovaihtoehtoa: Desktop-version ja Server-version. Molemmissa on omat etunsa, mutta molemmat ottavat käyttöön käyttäjän hallitseman palvelimen ja tietolähestymistavan, tarjoten paremman tietosuojan.'
      desktopTitle: Desktop-versio
      desktop1: Suoritetaan paikallisesti tietokoneellasi, kevyempi
      desktop2: Ei palvelinmäärityksiä tarvita, käyttövalmis suoraan
      desktop3: Sopii yksittäisille kehittäjille ja kevyteen käyttöön
      desktop4: Kaikki tiedot täysin paikallisia
      serverTitle: Server-versio
      server1: Voidaan ottaa käyttöön etäpalvelimilla
      server2: Tukee monen käyttäjän etäyhteyksiä
      server3: Sopii paremmin tiimityöhön ja skaalaukseen
      server4: Valmistaa tulevaisuuden yritysominaisuuksia ja monilaitteiden synkronointia varten
      conclusion: Kumman version tahansa valitset, sinulla on täysi hallinta palvelimeesi ja tietoihisi, nauttien paremmasta yksityisyydensuojasta ja tietoturvasta.
    q2:
      question: Mitä minun täytyy tehdä asennuksen jälkeen?
      intro: 'Hagicode Desktop on pohjimmiltaan käynnistin. Asennuksen jälkeisellä ensimmäisellä käynnistyksellä se opastaa näissä vaiheissa:'
      step1: '<strong>Lataa Hagicode Core:</strong> Desktop tunnistaa automaattisesti ja kehottaa sinua lataamaan Hagicoden ydinmoduulit'
      step2: '<strong>Asenna ydinmoduulit:</strong> Seuraa näytön ohjeita ydinmoduulien asennuksen viimeistelemiseksi'
      step3: '<strong>Määritä oletus Agent CLI:</strong> Valitse tällä hetkellä tuettu Agent CLI ja suorita tarvittavat sisäänkirjautumis-, valtuutus- tai paikalliset asennusvaiheet.'
      note: Desktop-käyttöliittymä ohjaa koko prosessia. Pidä verkko saatavilla ensimmäisellä käynnistyksellä, jotta Hagicode Core voi latautua; jotkin Agent CLI:t vaativat edelleen manuaalista asennusta tai todennusta, mutta ne ovat yhä osa nykyistä tukialuetta.
      done: Kun olet suorittanut nämä vaiheet, voit käyttää kaikkia Hagicode Desktopin ominaisuuksia normaalisti.
    q3:
      question: Kuin tarkistan päivitykset?
      answer: Desktop tarkistaa päivitykset automaattisesti. Kun uusi versio on saatavilla, ilmoitus tulee näkyviin käyttöliittymän oikeassa yläkulmassa. Voit myös tarkistaa päivitykset manuaalisesti "Asetuksista".
    q4:
      question: Mitä tekoäly Agent CLI:iä tuetaan?
      intro: 'Hagicode Desktop tukee tällä hetkellä seuraavia Agent CLI:iä:'
      active: '<strong>Tällä hetkellä tuetut:</strong> Claude Code, Codex, GitHub Copilot, OpenCode, Hermes, QoderCLI, Kiro, Kimi, Gemini, DeepAgents ja Codebuddy'
      manual: '<strong>Manuaalinen asennus tai todennus:</strong> Hermes, Gemini ja DeepAgents vaativat paikallisen asennuksen tai todennusvaiheen ensin; muut CLI:t tarjoavat yhden klikkauksen asennuslinkin tai ohjatun asennuksen.'
      legacy: '<strong>Vain vanhan tietoyhteensopivuuden tuki:</strong> IFlowCli on säilytetty vain historiallista tietoyhteensopivuutta varten eikä kuulu nykyiseen aktiiviseen tukialueeseen.'
      closing: Tukialue ja asennustapa ovat erillisiä asioita. CLI, joka vaatii manuaalisen asennuksen, on edelleen tuettu.
    q5:
      question: Tukeeko offline-käyttöä?
      intro: 'Kyllä! Hagicode Desktop tukee täydellistä offline-käyttöä:'
      point1: Verkkoyhteys tarvitaan alkuperäiseen asennukseen ja määritykseen (ydinmoduulien ja tekoälymallien lataaminen)
      point2: Kaikkia ominaisuuksia voidaan käyttää offline-tilassa määrityksen jälkeen
      point3: Koodisi ja tietosi eivät koskaan siirry pilveen
      point4: Kaikki tekoälykäsittely tapahtuu paikallisesti
    q6:
      question: macOS sanoo, että Hagicode.app on vaurioitunut tai sitä ei voi avata. Mitä minun pitäisi tehdä?
      intro: Jos Hagicode Desktop on asennettu oletuspolkuun /Applications/Hagicode.app ja macOS Gatekeeper estää ensimmäisen käynnistyksen, käytä seuraavaa komentoa poistaaksesi sovelluksen karanteenimääritteen.
      cause: Tämä tapahtuu, koska macOS lisää com.apple.quarantine-määritteen Internetistä ladattuihin sovelluksiin. Kyseessä on macOS:n turvaeristysongelma, ei Hagicoden asennusohjelman vika.
      command: sudo xattr -dr com.apple.quarantine /Applications/Hagicode.app
      note: Suorita komento Terminalissa järjestelmänvalvojan oikeuksilla ja käynnistä sitten Hagicode Desktop uudelleen.
    q7:
      question: Kuinka saada apua, kun kohtaat ongelmia?
      intro: 'Jos kohtaat ongelmia Hagicode Desktopin käytössä, voit saada apua seuraavien kautta:'
      point1: '<strong>Tekninen tukiryhmä:</strong> Liity QQ-ryhmään 610394020'
      point2: '<strong>Verkkodokumentaatio:</strong> Katso täydellinen käyttödokumentaatio ja oppaat'
      point3: '<strong>GitHub Issues:</strong> Lähetä ongelmaraportteja projektin tietovarastossa'
