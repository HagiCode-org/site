showcase:
  title: Останні вигляди продукту
  description: Від виконання пропозицій та сесійних панелей до токен-аналітики, управління робочим простором та прогресу досягнень, головна сторінка тепер використовує найновіші кураторські знімки екрана, які підтримуються разом із сайтом документації.
  controls:
    previous: Попередній
    next: Наступний
    current: Рекомендований вигляд
    railLabel: Навігація знімками екрана продукту
    selectPrefix: 'Перемкнути на: '
    activeState: Зараз відображається
    previewState: Попередній перегляд
    imageUnavailable: Зображення недоступне
    openFullscreen: 'Відкрити повноекранний режим: '
    openFullscreenHint: Натисніть для збільшення
    closeFullscreen: Закрити повноекранний режим
  screenshots:
    proposalWorkflow:
      title: Огляд виконання пропозицій
      description: Зберігайте стадію робочого процесу, результат виконання та контекст сесії на одному екрані, щоб команди бачили, де саме знаходиться зміна перед продовженням.
      alt: Знімок екрана виконання пропозицій HagiCode, що показує стадії робочого процесу, результат виконання та бічну панель сесій
    sessionBoard:
      title: Панель сесій та планування підземель
      description: Очікувані, поточні та архівовані сесії залишаються видимими поруч із фентезі-панеллю завдань, тому паралельну роботу агентів легко переглядати з першого погляду.
      alt: Знімок екрана панелі сесій HagiCode, що показує колонки «очікувані», «поточні» та «архівовані» поруч із фентезі-панеллю завдань
    tokenAnalytics:
      title: Токен-аналітика в реальному часі
      description: Спостерігайте за пропускною здатністю, останньою активністю API та загальним використанням на одній метричній панелі, щоб вартість та темп залишалися контрольованими під час паралельного виконання.
      alt: Знімок екрана токен-аналітики HagiCode, що показує пропускну здатність, останню активність API та загальне використання
    workspaceManagement:
      title: Управління робочим простором та сховищем
      description: Керуйте сховищами користувачів, системними сховищами та точками входу code-server з однієї панелі управління, створеної для спільних середовищ та швидкого обслуговування.
      alt: Знімок екрана управління робочим простором HagiCode, що показує сховища користувачів, системні сховища та дії code-server
    achievementProgress:
      title: Прогрес досягнень та зростання
      description: Щоденний прогрес, глобальне зростання та метрики життєвого циклу об'єднуються в одну панель, тому довготривале впровадження відчувається вимірним, а не абстрактним.
      alt: Знімок екрана панелі досягнень HagiCode, що показує щоденний прогрес, глобальне зростання та метрики життєвого циклу
