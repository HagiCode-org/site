  container:
    title: Контейнерна версія
    description: Розгортання на серверах, підтримка віддаленого доступу, підходить для командної роботи
    features:
      - Підтримка архітектури x86_64
      - Ізоляція середовища, не впливає на систему
      - Підтримка Docker Compose Builder
      - Збереження даних, безпека та надійність
      - Підходить для виробничих середовищ
    ctaText: Керівництво з контейнерного розгортання
