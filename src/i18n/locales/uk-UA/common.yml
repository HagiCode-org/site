    description: Працює локально на вашому комп'ютері, легкий та зручний, готовий до використання одразу
    features:
      - Локальне виконання, повна конфіденційність даних
      - Підтримка Windows, macOS та Linux
      - Не потребує налаштування сервера
      - Автоматичні оновлення, завжди актуальна версія
      - Підходить для індивідуальних розробників
