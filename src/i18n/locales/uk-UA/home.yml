    boost: Підвищення пропускної здатності
    boostValue: 10x+ паралельно
    description: Такі підтримувані Agent CLI як Claude Code, Codex, GitHub Copilot, OpenCode та Hermes можуть працювати одночасно на кількох екземплярах, тому пропозиції, виправлення та огляди рухаються паралельно замість очікування в послідовній черзі.
