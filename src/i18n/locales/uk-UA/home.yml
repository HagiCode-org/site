      title: Матриця паралельного виконання
      badge: Кілька агентів / кілька екземплярів
      status: Кілька агентів зараз керують кількома екземплярами
      agents:
        claude:
          name: Claude Code
          role: Пропозиція / огляд
          instances:
            - Чернетка специфікації
            - Перевірка дизайну
            - Огляд архіву
        codex:
          name: Codex
          role: Реалізація / виправлення
          instances:
            - Побудувати функцію A
            - Побудувати функцію B
            - Виправлення регресії
        router:
          name: Qwen · GLM
          role: Аналіз / підтримка
          instances:
            - Відстеження проблеми
            - Редагування тексту
            - Фіксація висновків
      supportedNames:
        title: 11 підтримуваних Agent CLI
        names:
          - Claude Code
          - Codex
          - GitHub Copilot
          - OpenCode
          - Hermes
          - QoderCLI
          - Kiro
          - Kimi
          - Gemini
          - DeepAgents
          - Codebuddy
    supportedProvidersNote: OpenCode може завантажити спільний каталог OmniRoute у стандартні налаштування моделей героїв, зберігаючи можливість редагування власних ідентифікаторів сирих моделей для робочих процесів конкретних гілок.
  interesting:
    badge: ЦІКАВИЙ
    title: Цікаво
    subtitle: «Підземелля героїв» робить кампусну співпрацю та практику живими
    features:
      dungeons:
        label: Підземелля героїв
        desc: Перетворіть генерацію, виконання та робочі столи промптів на проходження підземель
      captains:
        label: Список капітанів
        desc: Призначте відповідного героя-капітана кожному підземеллю
      battle:
        label: Звіти про бої
        desc: Переглядайте XP, рівні та результати виконання після кожного push
    description: Цікавість більше не залежить від значків досягнень. «Підземелля героїв», списки капітанів, візуалізація промптів та звіти про бої перетворюють щоденну AI кодувальну практику на робочий процес, який більше нагадує узгоджену пригоду для кампусних лабораторій та студентських команд.
    dungeonCards:
      proposal:
        title: Підземелля пропозицій
        desc: OpenSpec генерування / застосування / архівування
        status: Капітан готовий
      autotask:
        title: Підземелля автозавдань
        desc: Паралельні виправлення та пакетна автоматизація
        status: 2 екземпляри активні
      prompt:
        title: Підземелля промптів
        desc: Попередній перегляд промптів та робочий стіл стилів
        status: Візуальна синхронізація готова
    roster:
      title: Поточний список капітанів
      heroes:
        strategist:
          name: Стратег специфікацій
          role: Капітан пропозицій
        runner:
          name: Бігун патчів
          role: Капітан виконання
        artist:
          name: Художник промптів
          role: Візуальна підтримка
    battleReport:
      title: Звіт про сьогоднішні підземелля
      badge: Геройський бій
      metrics:
        dungeons:
          value: '4'
          label: Пройдено підземель
        level:
          value: Lv.27
          label: Рівень капітана
        xp:
          value: 12.8M
          label: XP за сьогодні
      note: Коли кілька підземель рухаються паралельно, звіт об'єднує досвід, рівні та результати виконання в одне зведення.
    gallery:
      dungeons:
        title: Карусель карти підземель
        subtitle: 10 випадкових зображень з поточної колекції фронтенд-підземель та карт промптів.
      heroes:
        title: Карусель галереї героїв
        subtitle: 10 випадкових зображень героїв з поточної фронтенд-колекції героїв.
