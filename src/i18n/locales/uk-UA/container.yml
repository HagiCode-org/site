container:
  title: Контейнер Hagicode - Контейнерне розгортання
  description: Розгорніть Hagicode за допомогою Docker Compose Builder. Проста конфігурація, готово до використання. Підтримка кількох джерел образів та автоматичних оновлень.
  hero:
    badge: Контейнер
    title: Контейнер Hagicode
    tagline: Швидке розгортання з Docker Compose Builder, проста конфігурація, готово до використання
    value1: Візуальна конфігурація, без програмування
    value2: Ізоляція середовища, безпека даних
    value3: Розгортання в один клік, швидкий запуск
    ctaButton: Розгорнути з Docker Compose Builder
    features:
      isolation: Ізоляція середовища
      oneClick: Розгортання в один клік
      fastStart: Швидкий запуск
  features:
    title: Чому варто обрати контейнерне розгортання?
    isolation:
      title: Ізоляція середовища
      description: Контейнерне розгортання уникнення конфліктів залежностей, не впливає на системне середовище, зберігає систему чистою
    simple:
      title: Проста конфігурація
      description: Використовуйте Docker Compose Builder для візуальної конфігурації, не потрібно писати складні сценарії
    crossPlatform:
      title: Крос-платформна підтримка
      description: Підтримка архітектури x86_64, підходить для різних серверів та хмарних платформ
    persistent:
      title: Збереження даних
      description: Підтримка монтування Volume, безпечні та надійні дані, без втрати даних при перезапуску контейнера
    autoUpdate:
      title: Автоматичні оновлення
      description: Підтримка watchtower для автоматичних оновлень, легко отримуйте найновішу версію
    productionReady:
      title: Готовність до виробництва
      description: Розроблено для виробничих середовищ, підтримка високої доступності та горизонтального масштабування
  builder:
    title: Docker Compose Builder
    subtitle: Найпростіший і рекомендований спосіб контейнерного розгортання
    visual:
      title: Візуальна конфігурація
      description: Налаштуйте всі параметри через зручний веб-інтерфейс, не потрібно вручну редагувати YAML файли
    generate:
      title: Генерація конфігурації в один клік
      description: Автоматично генеруйте повні docker-compose.yml файли з конфігураціями найкращих практик
    deploy:
      title: Швидке розгортання
      description: Завантажте файли конфігурації та запустіть сервіси в один клік, завершіть розгортання за лічені хвилини
    secure:
      title: Безпека та надійність
      description: Вбудовані найкращі практики безпеки, автоматичне налаштування томів даних та політик перезапуску
    ctaButton: Перейти до Docker Compose Builder
  mirrors:
    title: Вибір джерела образів
    description: Виберіть найбільш підходящє джерело образів залежно від вашого мережевого середовища та місцезнаходження
    dockerHub: Docker Hub
    dockerHubDesc: Найбільший у світі реєстр контейнерних образів, підходить для користувачів міжнародної мережі
    dockerHubCmd: newbe36524/hagicode:0
    azure: Azure ACR
    azureDesc: Сервіс образів Microsoft Azure, швидший доступ з Китаю
    azureCmd: hagicode.azurecr.io/hagicode:0
    aliyun: Aliyun ACR
    aliyunDesc: Внутрішнє прискорення образів Aliyun, рекомендується для користувачів у материковому Китаї
    aliyunCmd: registry.cn-hangzhou.aliyuncs.com/hagicode/hagicode:0
  faq:
    title: ЧаПи
    q1:
      question: Яка різниця між контейнерною та настільною версіями?
      intro: 'Обидві версії мають свої переваги. Ви можете обрати залежно від вашого сценарію використання:'
      desktopTitle: Настільна версія
      desktop1: Працює локально на вашому комп'ютері, більш легка
      desktop2: Не потребує налаштування сервера, готова до використання одразу
      desktop3: Підходить для індивідуальних розробників та легких сценаріїв використання
      desktop4: Усі дані повністю локальні
      containerTitle: Контейнерна версія
      container1: Може розгортатися на серверах, підтримує віддалений доступ
      container2: Ізоляція середовища, не впливає на системне середовище
      container3: Краще підходить для командної роботи та виробничих середовищ
      container4: Підтримує автоматизоване розгортання та горизонтальне масштабування
    q2:
      question: Що таке Docker Compose Builder?
      intro: 'Docker Compose Builder — наш інструмент візуальної конфігурації, який допомагає вам:'
      point1: Налаштовувати всі параметри контейнера через веб-інтерфейс
      point2: Автоматично генерувати docker-compose.yml файли
      point3: Вбудовані найкращі практики та конфігурації безпеки
      point4: Завантажувати та запускати сервіси в один клік
      note: Не потрібно вручну писати складні YAML конфігурації. Навіть новачки Docker можуть легко розгортати.
    q3:
      question: Які системні архітектури підтримує контейнерна версія?
      answer: Контейнерні образи Hagicode наразі підтримують архітектуру <strong>x86_64 (amd64)</strong>, підходить для більшості серверів та ПК.
      note: Docker автоматично вибере відповідну архітектуру для вашої системи під час витягування образів.
    q4:
      question: Як оновити контейнер?
      intro: 'При використанні розгортання Docker Compose оновлення дуже просте:'
      code: |-
        docker-compose pull
        docker-compose up -d
      watchtower: Або використовуйте Watchtower для автоматичних оновлень.
    q5:
      question: Як налаштувати збереження даних?
      intro: 'Docker Compose Builder автоматично налаштовує томи даних. Типово ваші дані зберігатимуться в Docker Volumes, що забезпечує:'
      point1: Дані не втрачаються при видаленні контейнерів
      point2: Дані зберігаються під час оновлення контейнерів
      point3: Легке резервне копіювання та відновлення
    q6:
      question: Що робити, якщо не вдається запустити контейнер?
      intro: 'Кроки для вирішення проблеми запуску контейнера:'
      step1:
        title: 'Перевірте статус контейнера:'
        code: docker-compose ps
      step2:
        title: 'Перевірте логи контейнера:'
        code: docker-compose logs hagicode
      step3:
        title: 'Перевірте зайнятість порту:'
        desc: 'Якщо порт вашого сервісу 3000, використовуйте цю команду для перевірки:'
        code: netstat -tlnp | grep 3000
        solution: 'Якщо порт зайнятий, ви можете:'
        solution1: Зупинити процес, що займає порт
        solution2: Або налаштувати інший порт у Docker Compose Builder
      help: Якщо проблема не зникає, будь ласка, перевірте детальну документацію або зверніться до технічної підтримки.
  cta:
    title: Почніть використовувати Docker Compose Builder
    subtitle: Найпростіший і рекомендований спосіб контейнерного розгортання
    button: Перейти до керівництва з розгортання
    github: Репозиторій GitHub
