desktop:
  title: Hagicode для ПК - Завантажити
  description: Завантажте Hagicode для ПК — локального AI-асистента з коду. Підтримка Windows, macOS та Linux. Захист конфіденційності, швидка відповідь.
  features:
    title: Основні можливості
    local:
      title: Локальне виконання
      description: Усі дані обробляються локально без завантаження в хмару, забезпечуючи конфіденційність та безпеку коду
    privacy:
      title: Захист конфіденційності
      description: Код ніколи не завантажується, підтримує офлайн-використання, захищаючи вашу інтелектуальну власність
    fast:
      title: Швидка відповідь
      description: Час відповіді на рівні мілісекунд, без мережевих запитів, підвищує ефективність розробки
    crossPlatform:
      title: Крос-платформна підтримка
      description: Підтримка Windows, macOS та Linux для задоволення різних потреб середовища розробки
    autoUpdate:
      title: Автоматичні оновлення
      description: Автоматично перевіряє наявність оновлень та оновлює до останньої версії в один клік
    multiLanguage:
      title: Багатомовна підтримка
      description: Вбудований китайський та англійський інтерфейс, підтримка міжнародної командної роботи
  systemRequirements:
    title: Системні вимоги
    windows: Windows
    macos: macOS
    linux: Linux
    os: Операційна система
    processor: Процесор
    memory: Пам'ять
    diskSpace: Дисковий простір
    network: Мережа
    windowsOs: Windows 10/11 (64-bit)
    macosOs: macOS 12+ (Monterey або вище)
    linuxOs: Ubuntu 20.04+ / Debian 11+ / Інші основні дистрибутиви
    windowsProcessor: Intel Core i3 або еквівалентний процесор
    macosProcessor: Apple Silicon (M1/M2/M3) або Intel Core i3+
    linuxProcessor: Intel Core i3 або еквівалентний процесор
    memoryRec: 4GB RAM (8GB рекомендується)
    disk: 2GB вільного місця
    networkDesc: Для початкового завантаження потрібне мережеве з'єднання (після цього можна використовувати офлайн)
  download:
    title: Пакети для завантаження
    windowsDesc: Стабільні інсталятори для Windows 10/11, включаючи інсталяційні та портативні збірки.
    macosDesc: Нативні збірки для Apple Silicon та Intel Mac.
    linuxDesc: Пакети AppImage та tarball для основних дистрибутивів Linux x64 та ARM64.
    note: Якщо список пакетів тут не завантажується, використовуйте посилання на історію версій у області hero для доступу до канонічного індексу.
    features:
      signed: Підписані пакети
      autoUpdate: Автоматичне виявлення оновлень
      multiLanguage: Багатомовний інтерфейс
  installation:
    title: Швидке встановлення
    step1:
      number: '1'
      title: Завантажити інсталятор
      description: Виберіть відповідний інсталятор для вашої операційної системи
    step2:
      number: '2'
      title: Запустити інсталятор
      description: Двічі натисніть на завантажений інсталятор і дотримуйтесь інструкцій для завершення встановлення
    step3:
      number: '3'
      title: Запустити додаток
      description: При першому запуску він проведе вас через початкове налаштування
    step4:
      number: '4'
      title: Почати використання
      description: Після налаштування ви можете почати використовувати Hagicode для ПК
  faq:
    title: ЧаПи
    q1:
      question: Яка різниця між версіями для ПК та сервера?
      intro: 'Hagicode пропонує два варіанти розгортання: версію для ПК та серверну версію. Кожна має свої переваги, але обидві використовують підхід контрольованого користувачем сервера та даних, забезпечуючи кращий захист даних.'
      desktopTitle: Версія для ПК
      desktop1: Працює локально на вашому комп'ютері, більш легка
      desktop2: Не потребує налаштування сервера, готова до використання одразу
      desktop3: Підходить для індивідуальних розробників та легких сценаріїв використання
      desktop4: Усі дані повністю локальні
      serverTitle: Серверна версія
      server1: Може розгортатися на віддалених серверах
      server2: Підтримує багатокористувацький віддалений доступ
      server3: Краще підходить для командної роботи та масштабування
      server4: Готує до майбутніх корпоративних функцій та синхронізації між пристроями
      conclusion: Яку б версію ви не обрали, ви маєте повний контроль над своїм сервером та даними, насолоджуючись кращим захистом конфіденційності та безпекою даних.
    q2:
      question: Що потрібно зробити після встановлення?
      intro: 'Hagicode для ПК — це, по суті, програма запуску. При першому запуску після встановлення вона проведе вас через ці кроки:'
      step1: '<strong>Завантажити Hagicode Core:</strong> Додаток для ПК автоматично виявить та запропонує завантажити основні компоненти Hagicode'
      step2: '<strong>Встановити основні компоненти:</strong> Дотримуйтесь інструкцій на екрані для завершення встановлення основних компонентів'
      step3: '<strong>Налаштувати ваш типовий Agent CLI:</strong> Виберіть підтримуваний Agent CLI та завершіть необхідні кроки входу, авторизації або локального встановлення.'
      note: Інтерфейс додатку для ПК веде через весь процес. Збережіть мережу доступною при першому запуску, щоб Hagicode Core міг завантажитися; деякі Agent CLI все ще вимагають ручного встановлення або автентифікації, але вони залишаються частиною поточного діапазону підтримки.
      done: Після завершення цих кроків ви зможете нормально використовувати всі функції Hagicode для ПК.
    q3:
      question: Як перевірити наявність оновлень?
      answer: Додаток для ПК автоматично перевіряє наявність оновлень. Коли нова версія стає доступною, у правому верхньому куті інтерфейсу з'явиться сповіщення. Ви також можете вручну перевірити оновлення в «Налаштуваннях».
    q4:
      question: Які AI Agent CLI підтримуються?
      intro: 'Hagicode для ПК наразі підтримує наступні Agent CLI:'
      active: '<strong>Зараз підтримуються:</strong> Claude Code, Codex, GitHub Copilot, OpenCode, Hermes, QoderCLI, Kiro, Kimi, Gemini, DeepAgents та Codebuddy'
      manual: '<strong>Ручне встановлення або автентифікація:</strong> Hermes, Gemini та DeepAgents спочатку вимагають локального встановлення або кроку автентифікації; інші CLI надають точки входу для встановлення в один клік або керовані процеси встановлення.'
      legacy: '<strong>Тільки для старої сумісності:</strong> IFlowCli залишається лише для сумісності з історичними даними і не є частиною поточного активного діапазону підтримки.'
      closing: Область підтримки та режим налаштування — це окремі питання. CLI, який потребує ручного встановлення, все ще підтримується.
    q5:
      question: Чи підтримується офлайн-використання?
      intro: 'Так! Hagicode для ПК підтримує повне офлайн-використання:'
      point1: Для початкового встановлення та налаштування потрібне мережеве з'єднання (завантаження основних компонентів та AI моделей)
      point2: Після налаштування всі функції можна використовувати офлайн
      point3: Ваш код та дані ніколи не завантажуються в хмару
      point4: Вся обробка AI виконується локально
    q6:
      question: macOS каже, що Hagicode.app пошкоджено або не може бути відкрито. Що робити?
      intro: Якщо Hagicode для ПК встановлено за типовим шляхом /Applications/Hagicode.app і macOS Gatekeeper блокує перший запуск, використовуйте наступну команду для видалення атрибута карантину з додатку.
      cause: Це відбувається тому, що macOS додає атрибут com.apple.quarantine до додатків, завантажених з інтернету. Це проблема ізоляції безпеки macOS, а не збій у інсталяторі Hagicode.
      command: sudo xattr -dr com.apple.quarantine /Applications/Hagicode.app
      note: Виконайте команду в Terminal з правами адміністратора, потім перезапустіть Hagicode для ПК.
    q7:
      question: Як отримати допомогу при виникненні проблем?
      intro: 'Якщо ви зіткнетеся з проблемами під час використання Hagicode для ПК, ви можете отримати допомогу через:'
      point1: '<strong>Група технічної підтримки:</strong> Приєднайтеся до QQ групи 610394020'
      point2: '<strong>Онлайн документація:</strong> Перегляньте повну документацію з використання та навчальні матеріали'
      point3: '<strong>GitHub Issues:</strong> Подавайте звіти про проблеми в репозиторії проєкту'
