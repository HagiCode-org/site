container:
  title: Hagicode Container - Контейнерно внедряване
  description: Внедрете Hagicode чрез Docker Compose Builder. Проста конфигурация, готова за използване. Поддържа множество източници на изображения и автоматични актуализации.
  hero:
    badge: Контейнер
    title: Hagicode Container
    tagline: Бързо внедряване с Docker Compose Builder, проста конфигурация, готова за използване
    value1: Визуална конфигурация, не е необходимо кодиране
    value2: Изолация на средата, сигурност на данните
    value3: Внедряване с един клик, бърз старт
    ctaButton: Внедрете с Docker Compose Builder
    features:
      isolation: Изолация на средата
      oneClick: Внедряване с един клик
      fastStart: Бърз старт
  features:
    title: Защо да изберете контейнерно внедряване?
    isolation:
      title: Изолация на средата
      description: Контейнеризираното внедряване избягва конфликти на зависимости, не влияе на системната среда, поддържа системата чиста
    simple:
      title: Проста конфигурация
      description: Използвайте Docker Compose Builder за визуална конфигурация, не е необходимо да пишете сложни скриптове
    crossPlatform:
      title: Кросплатформена поддръжка
      description: Поддържа x86_64 архитектура, подходяща за различни сървъри и облачни платформи
    persistent:
      title: Постоянство на данните
      description: Поддържа монтиране на Volume, сигурни и надеждни данни, без загуба на данни при рестартиране на контейнера
    autoUpdate:
      title: Автоматични актуализации
      description: Поддържа watchtower за автоматични актуализации, лесно получаване на най-новата версия
    productionReady:
      title: Готово за производство
      description: Проектирано за производствени среди, поддържа висока наличност и хоризонтално мащабиране
  builder:
    title: Docker Compose Builder
    subtitle: Най-простият и препоръчителен метод за контейнерно внедряване
    visual:
      title: Визуална конфигурация
      description: Конфигурирайте всички параметри чрез приятелски уеб интерфейс, не е необходимо ръчно редактиране на YAML файлове
    generate:
      title: Генериране на конфигурация с един клик
      description: Автоматично генерирайте пълни docker-compose.yml файлове с конфигурации по най-добри практики
    deploy:
      title: Бързо внедряване
      description: Изтеглете конфигурационни файлове с един клик и стартирайте услуги, завършете внедряването за минути
    secure:
      title: Сигурно и надеждно
      description: Вградени най-добри практики за сигурност, автоматично конфигурира томове с данни и правила за рестартиране
    ctaButton: Отидете на Docker Compose Builder
  mirrors:
    title: Избор на източник на изображения
    description: Изберете най-подходящия източник на изображения въз основа на вашата мрежова среда и местоположение
    dockerHub: Docker Hub
    dockerHubDesc: Най-големият в света регистър за контейнерни изображения, подходящ за потребители с международна мрежа
    dockerHubCmd: newbe36524/hagicode:0
    azure: Azure ACR
    azureDesc: Услуга за изображения на Microsoft Azure, по-бърз достъп от Китай
    azureCmd: hagicode.azurecr.io/hagicode:0
    aliyun: Aliyun ACR
    aliyunDesc: Вътрешно ускорение на изображения на Aliyun, препоръчително за потребители в континентален Китай
    aliyunCmd: registry.cn-hangzhou.aliyuncs.com/hagicode/hagicode:0
  faq:
    title: ЧЗВ
    q1:
      question: Каква е разликата между контейнерната и десктоп версиите?
      intro: 'И двете версии имат своите предимства. Можете да изберете въз основа на вашия сценарий на използване:'
      desktopTitle: Десктоп версия
      desktop1: Работи локално на вашия компютър, по-лека
      desktop2: Не е необходима конфигурация на сървър, готова за използване веднага
      desktop3: Подходяща за индивидуални разработчици и леки сценарии на използване
      desktop4: Всички данни напълно локализирани
      containerTitle: Контейнерна версия
      container1: Може да се внедрява на сървъри, поддържа отдалечен достъп
      container2: Изолация на средата, не влияе на системната среда
      container3: По-подходяща за екипно сътрудничество и производствени среди
      container4: Поддържа автоматизирано внедряване и хоризонтално мащабиране
    q2:
      question: Какво е Docker Compose Builder?
      intro: 'Docker Compose Builder е нашият визуален конфигурационен инструмент, който ви помага:'
      point1: Да конфигурирате всички контейнерни параметри чрез уеб интерфейс
      point2: Да генерирате автоматично docker-compose.yml файлове
      point3: Вградени най-добри практики и конфигурации за сигурност
      point4: Изтегляне и стартиране на услуги с един клик
      note: Не е необходимо ръчно да пишете сложни YAML конфигурации. Дори начинаещите в Docker могат да внедрят лесно.
    q3:
      question: Кои системни архитектури поддържа контейнерната версия?
      answer: Контейнерните изображения на Hagicode в момента поддържат <strong>x86_64 (amd64)</strong> архитектура, подходяща за повечето сървъри и ПК.
      note: Docker автоматично ще избере подходящата архитектура за вашата система при изтегляне на изображения.
    q4:
      question: Как да актуализирам контейнера?
      intro: 'Когато използвате Docker Compose внедряване, актуализирането е много просто:'
      code: |-
        docker-compose pull
        docker-compose up -d
      watchtower: Или използвайте Watchtower за автоматични актуализации.
    q5:
      question: Как да конфигурирам постоянство на данните?
      intro: 'Docker Compose Builder автоматично конфигурира томове с данни. По подразбиране вашите данни ще се съхраняват в Docker Volumes, осигурявайки:'
      point1: Данните не се губят при изтриване на контейнерите
      point2: Данните се запазват при надграждане на контейнерите
      point3: Лесно архивиране и възстановяване
    q6:
      question: Какво да направя, ако стартът на контейнера не успее?
      intro: 'Стъпки за отстраняване на неизправности при старт на контейнер:'
      step1:
        title: 'Проверете състоянието на контейнера:'
        code: docker-compose ps
      step2:
        title: 'Проверете дневниците на контейнера:'
        code: docker-compose logs hagicode
      step3:
        title: 'Проверете заетостта на портовете:'
        desc: 'Ако портът на вашата услуга е 3000, използвайте тази команда за проверка:'
        code: netstat -tlnp | grep 3000
        solution: 'Ако портът е зает, можете:'
        solution1: Да спрете процеса, който заема порта
        solution2: Или да конфигурирате различен порт в Docker Compose Builder
      help: Ако проблемът продължава, моля, проверете подробната документация или се свържете с техническата поддръжка.
  cta:
    title: Започнете да използвате Docker Compose Builder
    subtitle: Най-простият и препоръчителен метод за контейнерно внедряване
    button: Отидете на ръководството за внедряване
    github: GitHub хранилище
