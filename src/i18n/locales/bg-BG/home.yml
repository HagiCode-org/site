        desc: Възложете правилния герой капитан на всяко подземие
      battle:
        label: Бойни доклади
        desc: Прегледайте XP, нива и резултати от изпълнението след всеки тласък
    description: Забавното вече не зависи от значки за постижения. Hero Dungeon, списъци с капитани, визуализации на промптове и бойни доклади превръщат ежедневната AI кодираща практика в работен процес, който се усеща повече като координирано приключение за кампусни лаборатории и студентски екипи.
