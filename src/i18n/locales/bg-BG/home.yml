        desc: Преглед на промптове и работен плот за стилове
        status: Визуална синхронизация готова
    roster:
      title: Текущ списък на капитаните
      heroes:
        strategist:
          name: Spec Strategist
          role: Капитан на предложенията
        runner:
          name: Patch Runner
          role: Капитан на изпълнението
        artist:
          name: Prompt Artist
          role: Визуална поддръжка
    battleReport:
      title: Днешният доклад за подземията
      badge: Битка на герои
      metrics:
        dungeons:
          value: '4'
          label: Завършени подземия
        level:
          value: Lv.27
          label: Ниво на капитана
        xp:
          value: 12.8M
