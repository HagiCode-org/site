showcase:
  title: Последни изгледи на продукта
  description: От изпълнение на предложения и сесийни панели до токен анализи, управление на работни пространства и напредък на постиженията, началната страница вече използва най-новите кураторски снимки, поддържани с документационния сайт.
  controls:
    previous: Предишен
    next: Следващ
    current: Представен изглед
    railLabel: Навигация по снимки на продукта
    selectPrefix: 'Превключване към: '
    activeState: Показва се сега
    previewState: Преглед
    imageUnavailable: Изображението не е налично
    openFullscreen: 'Отвори на цял екран: '
    openFullscreenHint: Кликнете за уголемяване
    closeFullscreen: Затвори цял екран
  screenshots:
    proposalWorkflow:
      title: Обзор на изпълнението на предложенията
      description: Дръжте етапа на работния процес, резултата от изпълнението и контекста на сесията на един екран, за да могат екипите да видят точно къде стои една промяна, преди да продължат.
      alt: Снимка на екрана на изпълнението на предложенията на HagiCode, показваща етапи на работния процес, резултат от изпълнението и странична лента на сесията
    sessionBoard:
      title: Сесиен панел и планиране на подземия
      description: Чакащи, текущи и архивирани сесии остават видими до фантастичен панел за задачи, така че паралелната агентна работа е лесна за сканиране с един поглед.
      alt: Снимка на екрана на сесийния панел на HagiCode, показваща чакащи, текущи и архивирани колони до фантастичен панел за задачи
    tokenAnalytics:
      title: Токен анализи в реално време
      description: Наблюдавайте пропускателната способност, скорошната API активност и общото използване на една метрична повърхност, за да останат разходите и темпото управляеми по време на паралелно изпълнение.
      alt: Снимка на екрана на токен аналитиката на HagiCode, показваща пропускателна способност, скорошна API активност и общо използване
    workspaceManagement:
      title: Управление на работни пространства и хранилища
      description: Управлявайте потребителски хранилища, системни хранилища и входни точки на code-server от една контролна повърхност, създадена за споделени среди и бърза поддръжка.
      alt: Снимка на екрана на управлението на работни пространства на HagiCode, показваща потребителски хранилища, системни хранилища и действия на code-server
    achievementProgress:
      title: Напредък на постиженията и растежа
      description: Дневен напредък, глобален растеж и метрики на жизнения цикъл се обединяват в едно табло, за да направят дългосрочното усвояване измеримо, вместо абстрактно.
      alt: Снимка на екрана на таблото за постижения на HagiCode, показващо дневен напредък, глобален растеж и метрики на жизнения цикъл
