desktop:
  title: Hagicode Desktop - Изтегляне
  description: Изтеглете Hagicode Desktop, локализиран AI асистент за код. Поддържа Windows, macOS и Linux. Защита на поверителността, бърз отговор.
  features:
    title: Ключови функции
    local:
      title: Локално изпълнение
      description: Всички данни се обработват локално, без качване в облака, осигурявайки поверителност и сигурност на кода
    privacy:
      title: Защита на поверителността
      description: Кодът никога не се качва, поддържа офлайн използване, защитавайки вашата интелектуална собственост
    fast:
      title: Бърз отговор
      description: Време за отговор на милисекундно ниво, не са необходими мрежови заявки, повишавайки ефективността на разработката
    crossPlatform:
      title: Кросплатформена поддръжка
      description: Поддържа Windows, macOS и Linux за задоволяване на различни нужди на среда за разработка
    autoUpdate:
      title: Автоматични актуализации
      description: Автоматично проверява за актуализации и надгражда до най-новата версия с един клик
    multiLanguage:
      title: Многоезична поддръжка
      description: Вграден китайски и английски интерфейс, поддържащ международно екипно сътрудничество
  systemRequirements:
    title: Системни изисквания
    windows: Windows
    macos: macOS
    linux: Linux
    os: Операционна система
    processor: Процесор
    memory: Памет
    diskSpace: Дисково пространство
    network: Мрежа
    windowsOs: Windows 10/11 (64-bit)
    macosOs: macOS 12+ (Monterey или по-нова)
    linuxOs: Ubuntu 20.04+ / Debian 11+ / Други основни дистрибуции
    windowsProcessor: Intel Core i3 или еквивалентен процесор
    macosProcessor: Apple Silicon (M1/M2/M3) или Intel Core i3+
    linuxProcessor: Intel Core i3 или еквивалентен процесор
    memoryRec: 4GB RAM (8GB препоръчително)
    disk: 2GB свободно пространство
    networkDesc: Необходима е мрежова връзка за първоначално изтегляне (може да се използва офлайн след това)
  download:
    title: Пакети за изтегляне
    windowsDesc: Стабилни инсталатори за Windows 10/11, включително инсталационни и портативни версии.
    macosDesc: Нативни версии за Apple Silicon и Intel Mac.
    linuxDesc: AppImage и tarball пакети за основни x64 и ARM64 Linux дистрибуции.
    note: Ако списъкът с пакети тук не успее да се зареди, използвайте връзката за история на версиите в hero зоната за достъп до каноничния индекс.
    features:
      signed: Подписани пакети
      autoUpdate: Автоматично откриване на актуализации
      multiLanguage: Многоезичен интерфейс
  installation:
    title: Бърза инсталация
    step1:
      number: '1'
      title: Изтеглете инсталатора
      description: Изберете подходящия инсталатор за вашата операционна система
    step2:
      number: '2'
      title: Стартирайте инсталатора
      description: Кликнете два пъти върху изтегления инсталатор и следвайте инструкциите за завършване на инсталацията
    step3:
      number: '3'
      title: Стартирайте приложението
      description: При първо стартиране то ще ви преведе през първоначалната конфигурация
    step4:
      number: '4'
      title: Започнете да използвате
      description: След конфигурацията можете да започнете да използвате Hagicode Desktop
  faq:
    title: ЧЗВ
    q1:
      question: Каква е разликата между десктоп и сървър версиите?
      intro: 'Hagicode предлага две опции за внедряване: десктоп версия и сървърна версия. Всяка има своите предимства, но и двете приемат подход с потребителски контролиран сървър и данни, осигурявайки по-добра защита на данните.'
      desktopTitle: Десктоп версия
      desktop1: Работи локално на вашия компютър, по-лека
      desktop2: Не е необходима конфигурация на сървър, готова за използване веднага
      desktop3: Подходяща за индивидуални разработчици и леки сценарии на използване
      desktop4: Всички данни напълно локализирани
      serverTitle: Сървърна версия
      server1: Може да се внедрява на отдалечени сървъри
      server2: Поддържа многопотребителски отдалечен достъп
      server3: По-подходяща за екипно сътрудничество и мащабиране
      server4: Подготвя за бъдещи корпоративни функции и синхронизация на множество устройства
      conclusion: Каквато и версия да изберете, имате пълен контрол върху вашия сървър и данни, наслаждавайки се на по-добра защита на поверителността и сигурност на данните.
    q2:
      question: Какво трябва да направя след инсталацията?
      intro: 'Hagicode Desktop е по същество стартер. При първо стартиране след инсталацията той ще ви преведе през следните стъпки:'
      step1: <strong>Изтеглете Hagicode Core:</strong> Desktop автоматично ще открие и ще ви подкани да изтеглите основните компоненти на Hagicode
      step2: <strong>Инсталирайте основните компоненти:</strong> Следвайте инструкциите на екрана за завършване на инсталацията на основните компоненти
      step3: <strong>Конфигурирайте вашия Agent CLI по подразбиране:</strong> Изберете текущо поддържан Agent CLI и завършете необходимите стъпки за влизане, оторизация или локална инсталация.
      note: Интерфейсът на Desktop ръководи целия процес. Поддържайте мрежата налична при първо стартиране, за да може Hagicode Core да се изтегли; някои Agent CLIs все още изискват ръчна инсталация или удостоверяване, но те все още са част от текущия обхват на поддръжка.
      done: След завършване на тези стъпки можете да използвате всички функции на Hagicode Desktop нормално.
    q3:
      question: Как да проверя за актуализации?
      answer: Desktop автоматично проверява за актуализации. Когато е налична нова версия, подканище се появи в горния десен ъгъл на интерфейса. Можете също ръчно да проверите за актуализации в "Настройки".
    q4:
      question: Кои AI Agent CLIs се поддържат?
      intro: 'Hagicode Desktop в момента поддържа следните Agent CLIs:'
      active: <strong>В момента поддържани:</strong> Claude Code, Codex, GitHub Copilot, OpenCode, Hermes, QoderCLI, Kiro, Kimi, Gemini, DeepAgents и Codebuddy
      manual: <strong>Ръчна инсталация или удостоверяване:</strong> Hermes, Gemini и DeepAgents изискват първо локална инсталация или стъпка за удостоверяване; останалите CLIs предоставят точки за инсталация с един клик или ръководени процеси за инсталация.
      legacy: <strong>Само за наследена съвместимост:</strong> IFlowCli остава само за съвместимост с исторически данни и не е част от текущия активен обхват на поддръжка.
      closing: Обхватът на поддръжка и режимът на настройка са отделни въпроси. CLI, който се нуждае от ръчна инсталация, все още се поддържа в момента.
    q5:
      question: Поддържа ли офлайн използване?
      intro: 'Да! Hagicode Desktop поддържа пълно офлайн използване:'
      point1: Необходима е мрежова връзка за първоначална инсталация и конфигурация (изтегляне на основни компоненти и AI модели)
      point2: Всички функции могат да се използват офлайн след конфигурацията
      point3: Вашият код и данни никога не се качват в облака
      point4: Цялата AI обработка се завършва локално
    q6:
      question: macOS казва, че Hagicode.app е повреден или не може да се отвори. Какво да направя?
      intro: Ако Hagicode Desktop е инсталиран в пътя по подразбиране /Applications/Hagicode.app и macOS Gatekeeper блокира първото стартиране, използвайте следната команда, за да премахнете карантина от приложението.
      cause: Това се случва, защото macOS добавя атрибута com.apple.quarantine към приложения, изтеглени от интернет. Това е проблем с изолацията на сигурността на macOS, а не повреда в инсталатора на Hagicode.
      command: sudo xattr -dr com.apple.quarantine /Applications/Hagicode.app
      note: Изпълнете командата в Terminal с администраторски привилегии, след което рестартирайте Hagicode Desktop.
    q7:
      question: Как да получите помощ при възникване на проблеми?
      intro: 'Ако срещнете проблеми при използването на Hagicode Desktop, можете да получите помощ чрез:'
      point1: <strong>Група за техническа поддръжка:</strong> Присъединете се към QQ Група 610394020
      point2: <strong>Онлайн документация:</strong> Преглед на пълна документация за употреба и уроци
      point3: <strong>GitHub Issues:</strong> Подаване на доклади за проблеми в хранилището на проекта
