showcase:
  title: "HagiCode の動きを見る"
  description: "製品の10領域を、英語のダークUIと5つのダークテーマで紹介します。セッションボード、提案、エージェント、スキル、Vault、使用量、実績、Git、スケジュール計画です。"
  controls:
    previous: 前へ
    next: 次へ
    current: 注目ビュー
    railLabel: 製品スクリーンショットナビゲーション
    selectPrefix: '切り替え先: '
    activeState: 表示中
    previewState: プレビュー
    imageUnavailable: 画像を表示できません
    openFullscreen: '全画面で開く: '
    openFullscreenHint: クリックして拡大
    zoomIn: "実寸で表示"
    zoomOut: "画面に合わせる"
    closeFullscreen: 全画面を閉じる
  screenshots:
    sessionBoard:
      title: "セッションボード"
      description: "提案、実行中のエージェント、アーカイブ済みの作業を1つのボードに集約。待機・実行・完了が一目で分かります。"
      alt: "提案とレビュー、実行、アーカイブの3レーンとプロジェクトのクイック操作パネルを並べた HagiCode のセッションボード"
    proposalWorkflow:
      title: "提案ワークフロー"
      description: "すべての変更は提案から始まります。仕様の差分、順序付きタスク、ステージの進行をコードの実行前にレビューできます。"
      alt: "仕様差分の表、タスクチェックリスト、提案ステージの進行を表示した HagiCode の提案会話"
    agentRoster:
      title: "エージェント一覧"
      description: "各エージェントにアバターと役割を与え、背後の Agent CLI ごとに整理。次のタスクを任せる相手を選べます。"
      alt: "Claude Code、Codex、OpenCode、Gemini、Hermes ごとに12のエージェントを並べた HagiCode のエージェント画面"
    agentCli:
      title: "Agent CLI 管理"
      description: "Claude Code、Codex、GitHub Copilot、OpenCode などをバージョンとヘルスチェックの結果とともに並べて管理します。"
      alt: "対応する各 Agent CLI のバージョンと正常状態を表示した HagiCode の AgentCLI 管理テーブル"
    skillsGallery:
      title: "スキルギャラリー"
      description: "信頼できるスキルの提供元を閲覧し、インストール数を比較し、このマシンに入っているスキルを一目で確認できます。"
      alt: "スキルの提供元、インストール数、ローカルにインストール済みのバッジを並べた HagiCode のスキルギャラリー"
    vault:
      title: "Vault"
      description: "チームのプレイブック、契約、参考資料を Vault にまとめ、アプリを離れずにファイルを参照・プレビューできます。"
      alt: "Vault 一覧、ファイルツリー、レビュー指針の Markdown プレビューを備えた HagiCode の Vault ブラウザー"
    tokenUsage:
      title: "トークン使用量"
      description: "今日のトークン数とコストをステータスバーに常時表示。レベルのはしごで、その日の使い込みが分かります。"
      alt: "今日のトークン合計とコストを表示するステータスバーと、Breath から Radiance までの使用レベルを並べたポップオーバー"
    achievements:
      title: "実績ホール"
      description: "デイリー目標、オンライン成長、通算トラックが、着実な前進を目に見える形にします。"
      alt: "デイリー達成率、今日の報酬、オンライン成長レーンを表示した HagiCode の実績ホール"
    gitManagement:
      title: "Git 管理"
      description: "プロジェクトの全リポジトリのブランチ、同期状態、未コミットの変更を確認し、1つのパネルからコミット・プッシュ・プルできます。"
      alt: "4つのリポジトリのブランチと同期状態、リポジトリ概要を表示した HagiCode のプロジェクト Git タブ"
    scheduledPlans:
      title: "スケジュール計画"
      description: "提案や HagiTask をカレンダーから起動。夜間の監査、毎週の下書き、単発のリリース準備に使えます。"
      alt: "夜間、毎週、単発の計画を並べた HagiCode の10月のスケジュール計画カレンダー"
