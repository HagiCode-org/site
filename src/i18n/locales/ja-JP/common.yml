      title: 提案実行の概要
      description: ワークフローステージ、実行結果、セッション文脈を 1 画面にまとめ、次へ進む前に変更の状態を正確に把握できます。
      alt: ワークフローステージ、実行結果、セッションサイドバーを示す HagiCode の提案実行スクリーンショット
    sessionBoard:
      title: セッションボードとダンジョン計画
      description: 保留中・進行中・アーカイブ済みのセッションをファンタジー風タスクパネル横に並べて、並列作業をひと目で把握できます。
      alt: ファンタジー風タスクパネル横に保留中・進行中・アーカイブ済み列を表示する HagiCode セッションボードのスクリーンショット
    tokenAnalytics:
      title: リアルタイムトークン分析
      description: スループット、最近の API アクティビティ、総使用量を 1 つの指標画面で確認し、並列実行中のコストとペースを制御できます。
      alt: スループット、最近の API アクティビティ、総使用量を表示する HagiCode トークン分析のスクリーンショット
    workspaceManagement:
      title: ワークスペースと Vault 管理
      description: 共有環境と迅速な保守を前提に、ユーザー Vault、システム Vault、code-server 入口を 1 つの画面で管理できます。
      alt: ユーザー Vault、システム Vault、code-server 操作を表示する HagiCode ワークスペース管理のスクリーンショット
    achievementProgress:
      title: 実績と成長の進捗
      description: 日次進捗、全体成長、ライフサイクル指標を 1 つのダッシュボードに集約し、長期導入の成果を具体的に確認できます。
      alt: 日次進捗、全体成長、ライフサイクル指標を表示する HagiCode 実績ダッシュボードのスクリーンショット
