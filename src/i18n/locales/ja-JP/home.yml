features:
  showcase:
    title: "実際の開発のために"
    subtitle: "提案がすべての変更をレビュー可能にし、並列エージェントが作業を前へ進めます"
    demoLabel: "動作イメージ · 実行中のタスクではありません"
    previewLabel: "実際の製品画面"
  smart:
    badge: スマート
    title: スマート
    subtitle: "意図を揃えてから、AI が実装。"
    efficiency: 効率向上
    traditional: 従来型
    hagicode: Hagicode
    description: "要件・設計・タスクを OpenSpec にまとめます。変更の根拠を明確にし、完了した仕事を再利用できる知識へ。"
    workflow:
      review:
        label: レビュー
        desc: 自動レビュー
      scaffold:
        label: Scaffold
        desc: Choose a change-id and create proposal.md, tasks.md, and design.md when needed.
      spec:
        label: Spec
        desc: Translate the change into capability-level spec deltas with explicit requirements.
      design:
        label: Design
        desc: Capture architecture and trade-offs in design.md when the change spans systems.
      tasks:
        label: タスク
        desc: タスク分解
      validate:
        label: Validate
        desc: Run openspec validate in strict mode and clear every issue before execution.
      apply:
        label: Apply
        desc: Read proposal, design, and tasks, then implement in order while checking items off.
      archive:
        label: アーカイブ
        desc: 知識を保存
    paused: 一時停止中 - ノードをクリックして切り替え
  convenient:
    badge: 効率的
    title: 効率的
    subtitle: "複数のタスクを、同時に前へ。"
    traditional: 従来の単一エージェント / 単一インスタンス
    multiThread: マルチエージェント並列マトリクス
    boost: スループット向上
    boostValue: 10 倍以上の並列
    description: "提案・実装・レビューを異なる Agent が同時に担当。複数インスタンスの並列実行で、順番待ちを減らします。"
    agentMatrix:
      title: 並列実行マトリクス
      badge: 複数エージェント / 複数インスタンス
      status: 複数のエージェントが複数インスタンスを同時に駆動中
      agents:
        claude:
          name: Claude Code（クロード・コード）
          role: 提案 / レビュー
          instances:
            - 仕様草案を作成
            - 設計を確認
            - アーカイブレビュー
        codex:
          name: Codex（コーデックス）
          role: 実装 / 修正
          instances:
            - 機能 A を実装
            - 機能 B を実装
            - リグレッション修正
        router:
          name: Qwen・GLM
          role: 分析 / サポート
          instances:
            - 問題を追跡
            - 文言を整える
            - 知見を記録
      supportedNames:
        title: 現在対応している 13 個の Agent CLI
        names:
          - Claude Code（クロード・コード）
          - Codex（コーデックス）
          - GitHub Copilot（ギットハブ・コパイロット）
          - OpenCode（オープンコード）
          - Hermes（ヘルメス）
          - QoderCLI（コーダー CLI）
          - Kiro（キロ）
          - Kimi（キミ）
          - Gemini（ジェミニ）
          - Pi（パイ）
          - Reasonix（リーズニクス）
          - DeepAgents（ディープエージェンツ）
          - Codebuddy（コードバディ）
    supportedProvidersNote: OpenCode は共有 OmniRoute カタログを Hero モデル既定値として読み込みつつ、ブランチ固有ワークフロー向けに生のモデル識別子を編集可能なまま維持できます。
  interesting:
    badge: 興味深い
    title: 興味深い
    subtitle: "豊富で便利なUI操作で、開発の流れがわかりやすく快適に。"
    features:
      planning:
        label: "計画"
        desc: "提案ビューでタスク一覧と実行結果を確認。"
      execution:
        label: "実行"
        desc: "セッションボードで複数 Agent の作業を把握。"
      workspace:
        label: "プロジェクト"
        desc: "ワークスペースで複数のプロジェクトを管理。"
    description: "豊富で便利なUI操作で、計画・エージェント実行・プロジェクト作業をわかりやすく進められます。"
    dungeonCards:
      proposal:
        title: 提案ダンジョン
        desc: OpenSpec の generate / apply / archive
        status: 隊長準備完了
      autotask:
        title: 自動タスクダンジョン
        desc: 並列修正とバッチ自動化
        status: 2 インスタンス稼働中
      prompt:
        title: プロンプトダンジョン
        desc: プロンプト確認とスタイル作業台
        status: ビジュアル同期準備完了
    roster:
      title: 現在の隊長編成
      heroes:
        strategist:
          name: スペック・ストラテジスト
          role: 提案隊長
        runner:
          name: パッチ・ランナー
          role: 実行隊長
        artist:
          name: プロンプト・アーティスト
          role: ビジュアル支援
    battleReport:
      title: 今日のダンジョンレポート
      badge: ヒーローバトル
      metrics:
        dungeons:
          value: '4'
          label: 進行したダンジョン
        level:
          value: Lv.27
          label: 隊長レベル
        xp:
          value: 12.8M
          label: 本日の XP
      note: 複数ダンジョンが並列で進むとき、このレポートが経験値、レベル、実行結果を 1 つにまとめます。
    gallery:
      dungeons:
        title: ダンジョンマップカルーセル
        subtitle: 現在のフロントエンド用ダンジョン / プロンプトマップ集からランダムに 10 枚表示します。
      heroes:
        title: ヒーローギャラリーカルーセル
        subtitle: 現在のフロントエンド用ヒーローコレクションからランダムに 10 枚表示します。
