features:
  showcase:
    title: "実際の開発のために"
    subtitle: "提案がすべての変更をレビュー可能にし、並列エージェントが作業を前へ進めます"
  smart:
    title: スマート
    subtitle: "まず提案、次に実行。すべての変更に根拠が残る"
    artifactsTitle: "変更ごとに残るもの"
    description: "HagiCode はコードとただ会話するのではありません。プロジェクトの実際の状態を確認し、提案と Spec の差分を書き、厳密に検証してからタスクを順に実行し、最後にアーカイブして次の変更へ知見を引き継ぎます。"
    workflow:
      review:
        label: "レビュー"
        desc: "何かを書く前に、プロジェクトの現状・既存の spec・関連コードを確認します。"
      scaffold:
        label: "雛形"
        desc: "change-id を決め、proposal.md・tasks.md・必要なら design.md を作成します。"
      spec:
        label: "Spec"
        desc: "変更を capability 単位の spec 差分に落とし、要件を明確にします。"
      design:
        label: "設計"
        desc: "複数システムにまたがる変更では、構成とトレードオフを design.md に残します。"
      tasks:
        label: "タスク"
        desc: "作業を、順序と並列可否が分かる小さく検証可能な項目に分けます。"
      validate:
        label: "検証"
        desc: "openspec validate を strict モードで実行し、実行前にすべての指摘を解消します。"
      apply:
        label: "実行"
        desc: "proposal・design・tasks を読み、順に実装しながら完了項目にチェックを入れます。"
      archive:
        label: "アーカイブ"
        desc: "完了した変更をアーカイブし、結果を長期的な spec の履歴へ還元します。"
    paused: 一時停止中 - ノードをクリックして切り替え
  convenient:
    title: 効率的
    subtitle: "複数の Agent・インスタンスを並列に動かし、クォータを遊ばせない"
    traditional: "1 つずつ順番待ち"
    multiThread: "並走して、互いに待たない"
    description: "Claude Code、Codex、GitHub Copilot、OpenCode、Hermes など対応済みの Agent CLI は、それぞれ複数のインスタンスを同時に動かせます。提案・修正・レビューが別々のレーンを走るので、遅い結果が全体を止めません。"
    agentMatrix:
      title: 並列実行マトリクス
      badge: "構成例"
      status: "イメージ：どのレーンも止まらず進み、互いにブロックしません"
      agents:
        claude:
          name: Claude Code（クロード・コード）
          role: 提案 / レビュー
          instances:
            - 仕様草案を作成
            - 設計を確認
            - アーカイブレビュー
        codex:
          name: Codex（コーデックス）
          role: 実装 / 修正
          instances:
            - 機能 A を実装
            - 機能 B を実装
            - リグレッション修正
        router:
          name: Qwen・GLM
          role: 分析 / サポート
          instances:
            - 問題を追跡
            - 文言を整える
            - 知見を記録
    cliBay:
      title: "装備できる Agent CLI"
      hint: "ひとつ選ぶと、つながり方が見えます"
      chain:
        agent: "エージェント"
        model: "対応モデル"
      labels:
        whatItIs: "概要"
        models: "モデルとサインイン"
        runsOn: "動作環境"
        start: "始め方"
        questions: "HagiCode での質問"
        strengths: "得意なこと"
        compare: "比較記事を読む"
  interesting:
    title: 興味深い
    subtitle: "どの Agent にも顔があり、性格があり、住む世界がある"
    description: "Agent ごとにアバター・Trait・Soul を与え、チームが使う言葉を選べます。同じ顔ぶれが、英雄とダンジョンにも、牧場にも、朝廷にも、ハチの巣にもなり、レベルとトロフィーが作業の進みをその場で返してくれます。"
    worlds:
