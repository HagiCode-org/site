workflowSteps:
  eyebrow: "しくみ"
  title: "すべての変更は、同じ 3 ステップで進みます"
  description: "終わりのないチャットではありません。変更はレビューできる提案、追跡できる実行、再利用できる知見になります。"
  loopLabel: "保存した内容が次の提案の起点になります"
  steps:
    proposal:
      label: "提案"
      description: "やりたい変更を伝えます。Hagicode がリポジトリを確認し、コードに触れる前に読んで直せる、仕様とタスク付きの提案を作成します。"
    execution:
      label: "実行"
      description: "計画を承認すると、エージェントがタスクごとに実行します。Claude Code、Codex、GitHub Copilot などで並列に進み、完了したタスクから順にチェックされます。"
    archive:
      label: "アーカイブ"
      description: "完了した変更は仕様へアーカイブされます。次の提案はその仕様を最初に読み込み、チームがすでに得た知見から始まります。"
