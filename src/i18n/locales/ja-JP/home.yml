  tagline: AI が支えるコーディングツールで開発効率を高める
  description: HagiCode は繰り返し作業ではなく、本当に重要なコードに集中できるようにします
  ctaButton: 使い始める
  taglines:
    smart: スマート・効率的・楽しい
    aiDriven: AI オーケストレーション・マルチエージェント並列
    openspec: OpenSpec・ワークフロー革命
    multiThread: マルチエージェント・マルチインスタンス
  lunarTaglines:
    happyNewYear: 明けましておめでとう・午年
    aiPowered: AI で前進・成功するコード
    smartCoding: スマートコーディング・幸運を
    openspecLuck: OpenSpec・繁栄と成功
    efficiency: 効率倍増・福を呼ぶ
  problem: 従来の AI コーディングツールには
  painPoint: 課題
  painPoints: ': コンテキスト不足、セッションの混乱、協業の弱さ。'
  solution: Hagicode は次の仕組みで AI コーディング体験を再定義します
  features:
    - OpenSpec ワークフロー
    - マルチエージェント・マルチインスタンス実行
    - Hero Dungeon のゲーム化
  redefine: ''
  valueCards:
    smart:
      title: スマート
      description: OpenSpec がアイデアをより早く実行へつなげます。
    efficient:
      title: 効率的
      description: マルチエージェント実行で待ち時間を処理量へ変えます。
    interesting:
      title: 楽しい
      description: Hero Dungeon がチーム作業と練習を冒険のようにします。
  buttons:
    desktopApp: デスクトップアプリをインストール
    containerApp: コンテナ版を導入
    learnMore: 詳しく見る
  techStack:
    poweredBy: 提供元
  qqGroup:
    title: 技術サポートグループに参加
    description: Hagicode 技術サポート QQ グループ
    joinButton: 今すぐ参加
  secondaryLine: Hagicode は主要な Agent をサポートし、並列管理効率を高め、OpenSpec で幻覚を減らします。
features:
  showcase:
    title: 3 つのコア機能
    subtitle: AI コーディング体験を再定義
  smart:
    badge: スマート
    title: スマート
    subtitle: OpenSpec ワークフローで AI コーディング効率を向上
    efficiency: 効率向上
    traditional: 従来型
    hagicode: Hagicode
    description: アイデアからアーカイブまでの 9 段階提案ワークフローを AI が伴走します。コーディング効率を 3 倍に高めます。
    workflow:
      review:
        label: レビュー
        desc: 自動レビュー
      scaffold:
        label: Scaffold
        desc: Choose a change-id and create proposal.md, tasks.md, and design.md when needed.
      spec:
        label: Spec
        desc: Translate the change into capability-level spec deltas with explicit requirements.
      design:
        label: Design
        desc: Capture architecture and trade-offs in design.md when the change spans systems.
      tasks:
        label: タスク
        desc: タスク分解
      validate:
        label: Validate
        desc: Run openspec validate in strict mode and clear every issue before execution.
      apply:
        label: Apply
        desc: Read proposal, design, and tasks, then implement in order while checking items off.
      archive:
        label: アーカイブ
        desc: 知識を保存
    paused: 一時停止中 - ノードをクリックして切り替え
  convenient:
    badge: 効率的
    title: 効率的
    subtitle: クォータを止めないマルチエージェント・マルチインスタンス実行
    traditional: 従来の単一エージェント / 単一インスタンス
    multiThread: マルチエージェント並列マトリクス
    boost: スループット向上
    boostValue: 10 倍以上の並列
    description: Claude Code、Codex、GitHub Copilot、OpenCode、Hermes などの対応 Agent CLI は複数インスタンスで同時に動作できるため、提案、修正、レビューが直列待ちではなく並列で進みます。
    agentMatrix:
      title: 並列実行マトリクス
      badge: 複数エージェント / 複数インスタンス
      status: 複数のエージェントが複数インスタンスを同時に駆動中
      agents:
        claude:
          name: Claude Code（クロード・コード）
          role: 提案 / レビュー
          instances:
            - 仕様草案を作成
            - 設計を確認
            - アーカイブレビュー
        codex:
          name: Codex（コーデックス）
          role: 実装 / 修正
          instances:
            - 機能 A を実装
            - 機能 B を実装
            - リグレッション修正
        router:
          name: Qwen・GLM
          role: 分析 / サポート
          instances:
            - 問題を追跡
            - 文言を整える
            - 知見を記録
      supportedNames:
        title: 現在対応している 13 個の Agent CLI
        names:
          - Claude Code（クロード・コード）
          - Codex（コーデックス）
          - GitHub Copilot（ギットハブ・コパイロット）
          - OpenCode（オープンコード）
          - Hermes（ヘルメス）
          - QoderCLI（コーダー CLI）
          - Kiro（キロ）
          - Kimi（キミ）
          - Gemini（ジェミニ）
          - Pi（パイ）
          - Reasonix（リーズニクス）
          - DeepAgents（ディープエージェンツ）
          - Codebuddy（コードバディ）
    supportedProvidersNote: OpenCode は共有 OmniRoute カタログを Hero モデル既定値として読み込みつつ、ブランチ固有ワークフロー向けに生のモデル識別子を編集可能なまま維持できます。
  interesting:
    badge: 楽しい
    title: 楽しい
    subtitle: Hero Dungeon が学内協業と実践をもっと生き生きさせる
    features:
      dungeons:
        label: ヒーローダンジョン
        desc: 生成、実行、プロンプト作業台をダンジョン攻略の流れに変える
      captains:
        label: 隊長編成
        desc: 各ダンジョンに最適なヒーロー隊長を割り当てる
      battle:
        label: 戦闘レポート
        desc: 実行後に XP、レベル、結果を確認
    description: 楽しさは実績バッジだけでは生まれません。Hero Dungeon、隊長編成、プロンプト演出、戦闘レポートが、日々の AI コーディングを学内ラボや学生チーム向けの協調的な冒険に変えます。
    dungeonCards:
      proposal:
        title: 提案ダンジョン
        desc: OpenSpec の generate / apply / archive
        status: 隊長準備完了
      autotask:
        title: 自動タスクダンジョン
        desc: 並列修正とバッチ自動化
        status: 2 インスタンス稼働中
      prompt:
        title: プロンプトダンジョン
        desc: プロンプト確認とスタイル作業台
        status: ビジュアル同期準備完了
    roster:
      title: 現在の隊長編成
      heroes:
        strategist:
          name: スペック・ストラテジスト
          role: 提案隊長
        runner:
          name: パッチ・ランナー
          role: 実行隊長
        artist:
          name: プロンプト・アーティスト
          role: ビジュアル支援
    battleReport:
      title: 今日のダンジョンレポート
      badge: ヒーローバトル
      metrics:
        dungeons:
          value: '4'
          label: 進行したダンジョン
        level:
          value: Lv.27
          label: 隊長レベル
        xp:
          value: 12.8M
          label: 本日の XP
      note: 複数ダンジョンが並列で進むとき、このレポートが経験値、レベル、実行結果を 1 つにまとめます。
    gallery:
      dungeons:
        title: ダンジョンマップカルーセル
        subtitle: 現在のフロントエンド用ダンジョン / プロンプトマップ集からランダムに 10 枚表示します。
      heroes:
        title: ヒーローギャラリーカルーセル
        subtitle: 現在のフロントエンド用ヒーローコレクションからランダムに 10 枚表示します。
