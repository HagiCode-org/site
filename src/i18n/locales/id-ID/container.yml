container:
  title: Hagicode Container - Penyebaran Kontainer
  description: Sebarkan Hagicode dengan Docker Compose Builder. Konfigurasi sederhana, siap digunakan. Mendukung berbagai sumber image dan pembaruan otomatis.
  hero:
    badge: Kontainer
    title: Hagicode Container
    tagline: Penyebaran cepat dengan Docker Compose Builder, konfigurasi sederhana, siap digunakan
    value1: Konfigurasi visual, tanpa pengkodean
    value2: Isolasi lingkungan, keamanan data
    value3: Penyebaran satu klik, mulai cepat
    ctaButton: Sebarkan dengan Docker Compose Builder
    features:
      isolation: Isolasi Lingkungan
      oneClick: Penyebaran Satu Klik
      fastStart: Mulai Cepat
  features:
    title: Mengapa Memilih Penyebaran Kontainer?
    isolation:
      title: Isolasi Lingkungan
      description: Penyebaran terkontainerisasi menghindari konflik dependensi, tidak memengaruhi lingkungan sistem, menjaga sistem tetap bersih
    simple:
      title: Konfigurasi Sederhana
      description: Gunakan Docker Compose Builder untuk konfigurasi visual, tidak perlu menulis skrip yang rumit
    crossPlatform:
      title: Dukungan Lintas Platform
      description: Mendukung arsitektur x86_64, cocok untuk berbagai server dan platform cloud
    persistent:
      title: Persistensi Data
      description: Mendukung pengaitan Volume, data aman dan andal, tidak ada kehilangan data saat kontainer dimulai ulang
    autoUpdate:
      title: Pembaruan Otomatis
      description: Mendukung Watchtower untuk pembaruan otomatis, dengan mudah mendapatkan versi terbaru
    productionReady:
      title: Siap Produksi
      description: Dirancang untuk lingkungan produksi, mendukung ketersediaan tinggi dan penskalaan horizontal
  builder:
    title: Docker Compose Builder
    subtitle: Metode penyebaran kontainer paling sederhana dan paling direkomendasikan
    visual:
      title: Konfigurasi Visual
      description: Konfigurasikan semua parameter melalui antarmuka Web yang ramah, tidak perlu mengedit file YAML secara manual
    generate:
      title: Pembuatan Konfigurasi Satu Klik
      description: Otomatis menghasilkan file docker-compose.yml lengkap dengan konfigurasi praktik terbaik
    deploy:
      title: Penyebaran Cepat
      description: Unduh file konfigurasi dengan satu klik dan mulai layanan, selesaikan penyebaran dalam hitungan menit
    secure:
      title: Aman dan Andal
      description: Praktik terbaik keamanan bawaan, otomatis mengonfigurasi volume data dan kebijakan mulai ulang
    ctaButton: Buka Docker Compose Builder
  mirrors:
    title: Pemilihan Sumber Image
    description: Pilih sumber image yang paling sesuai berdasarkan lingkungan jaringan dan lokasi Anda
    dockerHub: Docker Hub
    dockerHubDesc: Registri image kontainer terbesar di dunia, cocok untuk pengguna jaringan internasional
    dockerHubCmd: newbe36524/hagicode:0
    azure: Azure ACR
    azureDesc: Layanan image Microsoft Azure, akses lebih cepat dari Tiongkok
    azureCmd: hagicode.azurecr.io/hagicode:0
    aliyun: Aliyun ACR
    aliyunDesc: Akselerasi image domestik Aliyun, direkomendasikan untuk pengguna di Tiongkok daratan
    aliyunCmd: registry.cn-hangzhou.aliyuncs.com/hagicode/hagicode:0
  faq:
    title: FAQ
    q1:
      question: Apa perbedaan antara versi Kontainer dan Desktop?
      intro: 'Kedua versi memiliki keunggulannya masing-masing. Anda dapat memilih berdasarkan skenario penggunaan Anda:'
      desktopTitle: Versi Desktop
      desktop1: Berjalan secara lokal di komputer Anda, lebih ringan
      desktop2: Tidak perlu konfigurasi server, siap digunakan langsung
      desktop3: Cocok untuk pengembang individu dan skenario penggunaan ringan
      desktop4: Semua data sepenuhnya lokal
      containerTitle: Versi Kontainer
      container1: Dapat disebarkan di server, mendukung akses jarak jauh
      container2: Isolasi lingkungan, tidak memengaruhi lingkungan sistem
      container3: Lebih cocok untuk kolaborasi tim dan lingkungan produksi
      container4: Mendukung penyebaran otomatis dan penskalaan horizontal
    q2:
      question: Apa itu Docker Compose Builder?
      intro: 'Docker Compose Builder adalah alat konfigurasi visual kami yang membantu Anda:'
      point1: Mengonfigurasi semua parameter kontainer melalui antarmuka Web
      point2: Otomatis menghasilkan file docker-compose.yml
      point3: Praktik terbaik dan konfigurasi keamanan bawaan
      point4: Mengunduh dan memulai layanan dengan satu klik
      note: Tidak perlu menulis konfigurasi YAML yang rumit secara manual. Bahkan pemula Docker dapat menyebarkan dengan mudah.
    q3:
      question: Arsitektur sistem apa yang didukung oleh versi kontainer?
      answer: Image kontainer Hagicode saat ini mendukung arsitektur <strong>x86_64 (amd64)</strong>, cocok untuk sebagian besar server dan PC.
      note: Docker akan otomatis memilih arsitektur yang sesuai untuk sistem Anda saat menarik image.
    q4:
      question: Bagaimana cara memperbarui kontainer?
      intro: 'Saat menggunakan penyebaran Docker Compose, pembaruan sangat sederhana:'
      code: |-
        docker-compose pull
        docker-compose up -d
      watchtower: Atau gunakan Watchtower untuk pembaruan otomatis.
    q5:
      question: Bagaimana cara mengonfigurasi persistensi data?
      intro: 'Docker Compose Builder secara otomatis mengonfigurasi volume data. Secara bawaan, data Anda akan disimpan dalam Docker Volumes, memastikan:'
      point1: Data tidak hilang saat kontainer dihapus
      point2: Data dipertahankan selama peningkatan kontainer
      point3: Pencadangan dan pemulihan yang mudah
    q6:
      question: Apa yang harus dilakukan jika kontainer gagal dimulai?
      intro: 'Langkah-langkah untuk mengatasi kegagalan mulai kontainer:'
      step1:
        title: 'Periksa status kontainer:'
        code: docker-compose ps
      step2:
        title: 'Periksa log kontainer:'
        code: docker-compose logs hagicode
      step3:
        title: 'Periksa penggunaan port:'
        desc: 'Jika port layanan Anda adalah 3000, gunakan perintah ini untuk memeriksa:'
        code: netstat -tlnp | grep 3000
        solution: 'Jika port terpakai, Anda dapat:'
        solution1: Menghentikan proses yang menggunakan port
        solution2: Atau mengonfigurasi port yang berbeda di Docker Compose Builder
      help: Jika masalah berlanjut, silakan periksa dokumentasi terperinci atau hubungi dukungan teknis.
  cta:
    title: Mulai Menggunakan Docker Compose Builder
    subtitle: Metode penyebaran kontainer paling sederhana dan paling direkomendasikan
    button: Buka Panduan Penyebaran
    github: Repositori GitHub
