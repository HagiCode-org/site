desktop:
  title: Hagicode Desktop - Unduh
  description: Unduh Hagicode Desktop, asisten kode AI yang dilokalkan. Mendukung Windows, macOS, dan Linux. Perlindungan privasi, respons cepat.
  features:
    title: Fitur Utama
    local:
      title: Eksekusi Lokal
      description: Semua data diproses secara lokal tanpa diunggah ke cloud, memastikan privasi dan keamanan kode
    privacy:
      title: Perlindungan Privasi
      description: Kode tidak pernah diunggah, mendukung penggunaan offline, melindungi hak kekayaan intelektual Anda
    fast:
      title: Respons Cepat
      description: Waktu respons milidetik, tidak perlu permintaan jaringan, meningkatkan efisiensi pengembangan
    crossPlatform:
      title: Dukungan Lintas Platform
      description: Mendukung Windows, macOS, dan Linux untuk memenuhi kebutuhan lingkungan pengembangan yang berbeda
    autoUpdate:
      title: Pembaruan Otomatis
      description: Secara otomatis memeriksa pembaruan dan meningkatkan ke versi terbaru dengan satu klik
    multiLanguage:
      title: Dukungan Multibahasa
      description: Antarmuka bahasa Tionghoa dan Inggris bawaan, mendukung kolaborasi tim internasional
  systemRequirements:
    title: Persyaratan Sistem
    windows: Windows
    macos: macOS
    linux: Linux
    os: Sistem Operasi
    processor: Prosesor
    memory: Memori
    diskSpace: Ruang Disk
    network: Jaringan
    windowsOs: Windows 10/11 (64-bit)
    macosOs: macOS 12+ (Monterey atau lebih baru)
    linuxOs: Ubuntu 20.04+ / Debian 11+ / Distribusi mainstream lainnya
    windowsProcessor: Intel Core i3 atau prosesor setara
    macosProcessor: Apple Silicon (M1/M2/M3) atau Intel Core i3+
    linuxProcessor: Intel Core i3 atau prosesor setara
    memoryRec: RAM 4GB (8GB direkomendasikan)
    disk: Ruang tersedia 2GB
    networkDesc: Koneksi jaringan diperlukan untuk unduhan awal (dapat digunakan offline setelahnya)
  download:
    title: Paket Unduhan
    windowsDesc: Penginstal stabil untuk Windows 10/11, termasuk versi penginstalan dan portabel.
    macosDesc: Build natif untuk Mac Apple Silicon dan Intel.
    linuxDesc: Paket AppImage dan tarball untuk distribusi Linux x64 dan ARM64 mainstream.
    note: Jika daftar paket di sini gagal dimuat, gunakan tautan riwayat versi di area hero untuk mengakses indeks kanonik.
    features:
      signed: Paket yang ditandatangani
      autoUpdate: Deteksi pembaruan otomatis
      multiLanguage: Antarmuka multibahasa
  installation:
    title: Instalasi Cepat
    step1:
      number: '1'
      title: Unduh Penginstal
      description: Pilih penginstal yang sesuai untuk sistem operasi Anda
    step2:
      number: '2'
      title: Jalankan Penginstal
      description: Klik dua kali penginstal yang diunduh dan ikuti petunjuk untuk menyelesaikan instalasi
    step3:
      number: '3'
      title: Luncurkan Aplikasi
      description: Saat peluncuran pertama, aplikasi akan memandu Anda melalui konfigurasi awal
    step4:
      number: '4'
      title: Mulai Menggunakan
      description: Setelah konfigurasi, Anda dapat mulai menggunakan Hagicode Desktop
  faq:
    title: FAQ
    q1:
      question: Apa perbedaan antara versi Desktop dan Server?
      intro: 'Hagicode menawarkan dua opsi penyebaran: versi Desktop dan versi Server. Masing-masing memiliki keunggulannya, tetapi keduanya mengadopsi pendekatan server dan data yang dikendalikan pengguna, memberikan perlindungan data yang lebih baik.'
      desktopTitle: Versi Desktop
      desktop1: Berjalan secara lokal di komputer Anda, lebih ringan
      desktop2: Tidak perlu konfigurasi server, siap digunakan langsung
      desktop3: Cocok untuk pengembang individu dan skenario penggunaan ringan
      desktop4: Semua data sepenuhnya lokal
      serverTitle: Versi Server
      server1: Dapat disebarkan di server jarak jauh
      server2: Mendukung akses jarak jauh multi-pengguna
      server3: Lebih cocok untuk kolaborasi tim dan penskalaan
      server4: Mempersiapkan fitur perusahaan masa depan dan sinkronisasi multi-perangkat
      conclusion: Versi mana pun yang Anda pilih, Anda memiliki kendali penuh atas server dan data Anda, menikmati perlindungan privasi dan keamanan data yang lebih baik.
    q2:
      question: Apa yang perlu saya lakukan setelah instalasi?
      intro: 'Hagicode Desktop pada dasarnya adalah peluncur. Saat peluncuran pertama setelah instalasi, aplikasi akan memandu Anda melalui langkah-langkah berikut:'
      step1: '<strong>Unduh Hagicode Core:</strong> Desktop akan secara otomatis mendeteksi dan meminta Anda untuk mengunduh komponen inti Hagicode'
      step2: '<strong>Instal Komponen Inti:</strong> Ikuti petunjuk di layar untuk menyelesaikan instalasi komponen inti'
      step3: '<strong>Konfigurasikan Agent CLI default Anda:</strong> Pilih Agent CLI yang saat ini didukung dan selesaikan langkah masuk, otorisasi, atau instalasi lokal yang diperlukan.'
      note: Antarmuka Desktop memandu seluruh alur. Jaga jaringan tersedia saat peluncuran pertama agar Hagicode Core dapat diunduh; beberapa Agent CLI masih memerlukan instalasi manual atau autentikasi, tetapi tetap menjadi bagian dari cakupan dukungan saat ini.
      done: Setelah menyelesaikan langkah-langkah ini, Anda dapat menggunakan semua fitur Hagicode Desktop secara normal.
    q3:
      question: Bagaimana cara memeriksa pembaruan?
      answer: Desktop secara otomatis memeriksa pembaruan. Ketika versi baru tersedia, pemberitahuan akan muncul di sudut kanan atas antarmuka. Anda juga dapat memeriksa pembaruan secara manual di "Pengaturan".
    q4:
      question: Agent CLI AI apa saja yang didukung?
      intro: 'Hagicode Desktop saat ini mendukung Agent CLI berikut:'
      active: '<strong>Saat ini didukung:</strong> Claude Code, Codex, GitHub Copilot, OpenCode, Hermes, QoderCLI, Kiro, Kimi, Gemini, DeepAgents, dan Codebuddy'
      manual: '<strong>Instalasi manual atau autentikasi:</strong> Hermes, Gemini, dan DeepAgents memerlukan instalasi lokal atau langkah autentikasi terlebih dahulu; CLI lainnya menyediakan titik masuk instalasi satu klik atau alur instalasi terpandu.'
      legacy: '<strong>Hanya kompatibilitas lama:</strong> IFlowCli tetap ada hanya untuk kompatibilitas data historis dan bukan bagian dari cakupan dukungan aktif saat ini.'
      closing: Cakupan dukungan dan mode penyiapan adalah hal terpisah. CLI yang memerlukan instalasi manual tetap didukung saat ini.
    q5:
      question: Apakah mendukung penggunaan offline?
      intro: 'Ya! Hagicode Desktop mendukung penggunaan offline secara lengkap:'
      point1: Koneksi jaringan diperlukan untuk instalasi dan konfigurasi awal (mengunduh komponen inti dan model AI)
      point2: Semua fitur dapat digunakan offline setelah konfigurasi
      point3: Kode dan data Anda tidak pernah diunggah ke cloud
      point4: Semua pemrosesan AI diselesaikan secara lokal
    q6:
      question: macOS mengatakan Hagicode.app rusak atau tidak dapat dibuka. Apa yang harus saya lakukan?
      intro: Jika Hagicode Desktop diinstal di jalur default /Applications/Hagicode.app dan macOS Gatekeeper memblokir peluncuran pertama, gunakan perintah berikut untuk menghapus atribut karantina dari aplikasi.
      cause: Ini terjadi karena macOS menambahkan atribut com.apple.quarantine ke aplikasi yang diunduh dari internet. Ini adalah masalah isolasi keamanan macOS, bukan kegagalan dalam penginstal Hagicode.
      command: sudo xattr -dr com.apple.quarantine /Applications/Hagicode.app
      note: Jalankan perintah di Terminal dengan hak administrator, kemudian luncurkan kembali Hagicode Desktop.
    q7:
      question: Bagaimana cara mendapatkan bantuan saat mengalami masalah?
      intro: 'Jika Anda mengalami masalah saat menggunakan Hagicode Desktop, Anda bisa mendapatkan bantuan melalui:'
      point1: '<strong>Grup Dukungan Teknis:</strong> Bergabung dengan Grup QQ 610394020'
      point2: '<strong>Dokumentasi Online:</strong> Lihat dokumentasi penggunaan lengkap dan tutorial'
      point3: '<strong>GitHub Issues:</strong> Kirim laporan masalah di repositori proyek'
