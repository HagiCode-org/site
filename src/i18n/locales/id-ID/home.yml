        category: DLC Performa
        title: 'Hagicode: Turbo Engine DLC'
        price: Steam
        description: Anda dapat membeli DLC ini secara terpisah untuk memperluas batas konkurensi proposal asli, membuka pergantian salinan, menambahkan lima paket avatar dengan masing-masing 10 avatar mandiri, mengaktifkan unggahan avatar kustom, menyesuaikan logo dan judul kiri atas, dan menyelaraskan trailer commit yang dihasilkan AI dengan aturan penamaan Co-Authored-By Anda sendiri. Kami biasanya menyoroti opsi pembelian bundel bernama Hagicode Plus agar harga pembelian keseluruhan tetap lebih rendah. Silakan periksa halaman toko kami untuk perubahan terbaru.
        bullets:
          - Mendukung logo dan judul kustom di kiri atas
          - Termasuk lima paket avatar dengan 10 avatar yang dapat dipilih di setiap paket
          - Mendukung unggahan avatar kustom
          - Memungkinkan tim menyesuaikan tanda tangan AI Co-Authored-By untuk alur kerja commit
          - Memperluas batas maksimal proposal bersamaan menjadi 32
      hagicodePlus:
        category: Bundel
        title: Hagicode Plus
        price: Steam
        description: Bundel Steam resmi yang menggabungkan edisi dasar Hagicode dengan Turbo Engine DLC dalam satu jalur pembelian.
        bullets:
          - Menggabungkan edisi Steam utama dan Turbo Engine DLC bersama-sama
          - Mempertahankan peningkatan konkurensi 32 proposal yang lebih tinggi terpasang pada jalur bundel
          - Berfungsi sebagai titik masuk pembelian terjelas ketika Anda ingin pengaturan Steam lengkap sekaligus
      sponsor:
        category: DLC Pendukung
        title: Hagicode - Sponsor Pack
        price: Steam
        description: Jika Anda pikir Hagicode benar-benar luar biasa dan ingin memberikan dukungan keuangan langsung, membeli Sponsor Pack memberikan lebih banyak bahan bakar bagi proyek dan membantu kami menjaganya tetap berjalan dalam jangka panjang.
        bullets:
          - Satu tema gelap eksklusif
          - Satu tema terang eksklusif
          - Satu pencapaian Steam eksklusif
