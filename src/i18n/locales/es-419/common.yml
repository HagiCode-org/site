showcase:
  title: Últimas vistas del producto
  description: Desde la ejecución de propuestas y paneles de sesiones hasta análisis de tokens, gestión de espacios de trabajo y progreso de logros, la página de inicio ahora usa las capturas de pantalla más recientes y seleccionadas, mantenidas junto con el sitio de documentación.
