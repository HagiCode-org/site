    proposalWorkflow:
      title: Resumen de ejecución de propuestas
      description: Mantén la etapa del flujo de trabajo, el resultado de la ejecución y el contexto de la sesión en una sola pantalla para que los equipos puedan ver exactamente dónde se encuentra un cambio antes de continuar.
      alt: Captura de pantalla de ejecución de propuestas de HagiCode que muestra las etapas del flujo de trabajo, el resultado de la ejecución y la barra lateral de sesiones
    sessionBoard:
      title: Panel de sesiones y planificación de dungeons
      description: Las sesiones pendientes, en progreso y archivadas permanecen visibles junto a un panel de tareas de fantasía para que el trabajo paralelo de agentes sea fácil de revisar de un vistazo.
      alt: Captura de pantalla del panel de sesiones de HagiCode que muestra columnas pendientes, en progreso y archivadas junto a un panel de tareas de fantasía
    tokenAnalytics:
      title: Análisis de tokens en tiempo real
      description: Observa el rendimiento, la actividad reciente de la API y el uso total en una sola superficie de métricas para que el costo y el ritmo se mantengan controlables durante la ejecución paralela.
      alt: Captura de pantalla de análisis de tokens de HagiCode que muestra rendimiento, actividad reciente de la API y uso total
    workspaceManagement:
      title: Gestión de espacios de trabajo y bóvedas
      description: Gestiona bóvedas de usuario, bóvedas del sistema y puntos de entrada de code-server desde una sola superficie de control diseñada para entornos compartidos y mantenimiento rápido.
      alt: Captura de pantalla de gestión de espacios de trabajo de HagiCode que muestra bóvedas de usuario, bóvedas del sistema y acciones de code-server
    achievementProgress:
      title: Progreso de logros y crecimiento
      description: El progreso diario, el crecimiento global y las métricas de ciclo de vida se integran en un panel para que la adopción a largo plazo se sienta medible en lugar de abstracta.
      alt: Captura de pantalla del panel de logros de HagiCode que muestra progreso diario, crecimiento global y métricas de ciclo de vida
installOptions:
  sectionTitle: Elige tu método de instalación
  sectionDescription: Elige el método de instalación más adecuado según tu escenario de uso
  desktop:
    title: Aplicación de escritorio
    description: Se ejecuta localmente en tu computadora, liviana y conveniente, lista para usar desde el inicio
    features:
      - Ejecución local, privacidad completa de datos
      - Compatible con Windows, macOS y Linux
      - Sin necesidad de configurar servidor
      - Actualizaciones automáticas, siempre en la última versión
      - Ideal para desarrolladores individuales
    ctaText: Descargar aplicación de escritorio
  container:
    title: Versión en contenedor
    description: Despliega en servidores, soporta acceso remoto, ideal para colaboración en equipo
    features:
      - Compatible con arquitectura x86_64
      - Aislamiento de entorno, no afecta al sistema
      - Compatible con Docker Compose Builder
      - Persistencia de datos, seguro y confiable
      - Ideal para entornos de producción
    ctaText: Guía de despliegue en contenedor
