  smart:
    badge: INTELIGENTE
    title: Inteligente
    subtitle: Flujo de trabajo OpenSpec, aumenta la eficiencia de codificación con IA
    efficiency: Aumento de eficiencia
    traditional: Tradicional
    hagicode: Hagicode
    description: Un flujo de trabajo completo de 9 etapas desde la idea hasta el archivo, con asistencia de IA en todo momento. Aumenta tu eficiencia de codificación 3 veces.
    workflow:
      idea:
        label: Idea
