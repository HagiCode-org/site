        price: Steam
        description: Puedes comprar este DLC por separado para expandir el límite original de concurrencia de propuestas, desbloquear el cambio de copia, agregar cinco paquetes de avatares con 10 avatares independientes cada uno, habilitar cargas de avatares personalizados, personalizar el logo y título superior izquierdo, y alinear los trailers de commits generados por IA con tus propias reglas de nombres Co-Authored-By. Generalmente destacaremos una opción de compra en paquete llamada Hagicode Plus para que el precio total de compra sea menor. Por favor, verifica nuestra tienda para los últimos cambios.
