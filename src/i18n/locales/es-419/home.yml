        label: Docs
        desc: Generación de documentación
      archive:
        label: Archivo
        desc: Archivo de conocimiento
    paused: En pausa - Haz clic en un nodo para cambiar
  convenient:
    badge: EFICIENTE
    title: Eficiente
    subtitle: Ejecución multi-agente e multi-instancia que mantiene tu cuota en movimiento
    traditional: Agente único / instancia única tradicional
    multiThread: Matriz paralela multi-agente
    boost: Aumento de rendimiento
    boostValue: 10x+ paralelo
    description: Los Agent CLIs actualmente soportados como Claude Code, Codex, GitHub Copilot, OpenCode y Hermes pueden trabajar en múltiples instancias al mismo tiempo, para que las propuestas, correcciones y revisiones avancen en paralelo en lugar de esperar en una cola serial.
    agentMatrix:
      title: Matriz de ejecución paralela
      badge: Múltiples agentes / múltiples instancias
      status: Múltiples agentes están manejando múltiples instancias ahora mismo
      agents:
        claude:
          name: Claude Code
          role: Propuesta / revisión
          instances:
            - Borrador de especificación
            - Verificar diseño
            - Revisión de archivo
        codex:
          name: Codex
          role: Implementación / correcciones
          instances:
            - Construir función A
            - Construir función B
            - Corrección de regresión
        router:
          name: Qwen · GLM
          role: Análisis / soporte
          instances:
            - Rastrear problema
            - Pulir texto
            - Capturar ideas
      supportedNames:
        title: 11 Agent CLIs actualmente soportados
        names:
          - Claude Code
          - Codex
          - GitHub Copilot
          - OpenCode
          - Hermes
          - QoderCLI
          - Kiro
          - Kimi
          - Gemini
          - DeepAgents
          - Codebuddy
    supportedProvidersNote: OpenCode puede cargar el catálogo compartido de OmniRoute en los valores predeterminados del modelo de héroe mientras mantiene los identificadores de modelo sin procesar personalizados editables para flujos de trabajo específicos de rama.
  interesting:
    badge: DIVERTIDO
    title: Divertido
    subtitle: Hero Dungeon hace que la colaboración y práctica en equipo cobren vida
    features:
      dungeons:
        label: Hero Dungeons
        desc: Convierte la generación, ejecución y banco de trabajo de prompts en recorridos de dungeon
      captains:
        label: Lista de capitanes
        desc: Asigna el capitán héroe adecuado a cada dungeon
      battle:
        label: Informes de batalla
        desc: Revisa XP, niveles y resultados de ejecución después de cada push
    description: La diversión ya no depende de las insignias de logros. Hero Dungeon, listas de capitanes, visuales de prompts e informes de batalla convierten la práctica diaria de codificación con IA en un flujo de trabajo que se siente más como una aventura coordinada para laboratorios universitarios y equipos de estudiantes.
    dungeonCards:
      proposal:
        title: Dungeon de propuestas
        desc: OpenSpec generar / aplicar / archivar
        status: Capitán listo
      autotask:
        title: Dungeon de AutoTask
        desc: Correcciones paralelas y automatización por lotes
        status: 2 instancias activas
      prompt:
        title: Dungeon de Prompts
        desc: Vista previa de prompts y banco de trabajo de estilos
        status: Sincronización visual lista
    roster:
      title: Lista actual de capitanes
      heroes:
        strategist:
          name: Spec Strategist
          role: Capitán de propuestas
        runner:
          name: Patch Runner
          role: Capitán de ejecución
        artist:
          name: Prompt Artist
          role: Soporte visual
    battleReport:
      title: Informe de dungeon de hoy
      badge: Batalla de héroes
      metrics:
        dungeons:
          value: '4'
          label: Dungeons completados
        level:
          value: Lv.27
          label: Nivel de capitán
        xp:
          value: 12.8M
          label: XP hoy
      note: Cuando varios dungeons avanzan en paralelo, el informe consolida la experiencia, los niveles y los resultados de ejecución en una sola lectura.
    gallery:
      dungeons:
        title: Carrusel del mapa de dungeons
        subtitle: 10 imágenes aleatorias de la colección actual de mapas de dungeons y prompts del frontend.
      heroes:
        title: Carrusel de la galería de héroes
        subtitle: 10 imágenes aleatorias de la colección actual de héroes del frontend.
