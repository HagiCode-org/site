          - Soporta logos y títulos personalizados en la esquina superior izquierda
          - Incluye cinco paquetes de avatares con 10 avatares seleccionables en cada paquete
          - Soporta cargas de avatares personalizados
          - Permite a los equipos personalizar la firma AI Co-Authored-By para flujos de trabajo de commits
