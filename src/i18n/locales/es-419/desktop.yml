desktop:
  title: Hagicode Desktop - Descargar
  description: Descarga Hagicode Desktop, un asistente de código con IA localizado. Compatible con Windows, macOS y Linux. Protección de privacidad, respuesta rápida.
  features:
    title: Características principales
    local:
      title: Ejecución local
      description: Todos los datos se procesan localmente sin subirlos a la nube, garantizando la privacidad y seguridad del código
    privacy:
      title: Protección de privacidad
      description: El código nunca se sube, soporta uso sin conexión, protegiendo tu propiedad intelectual
    fast:
      title: Respuesta rápida
      description: Tiempo de respuesta en milisegundos, sin necesidad de solicitudes de red, mejorando la eficiencia de desarrollo
    crossPlatform:
      title: Soporte multiplataforma
      description: Compatible con Windows, macOS y Linux para satisfacer diferentes necesidades de entorno de desarrollo
    autoUpdate:
      title: Actualizaciones automáticas
      description: Verifica automáticamente actualizaciones y se actualiza a la última versión con un clic
    multiLanguage:
      title: Soporte multiidioma
      description: Interfaz en chino e inglés integrada, compatible con colaboración en equipos internacionales
  systemRequirements:
    title: Requisitos del sistema
    windows: Windows
    macos: macOS
    linux: Linux
    os: Sistema operativo
    processor: Procesador
    memory: Memoria
    diskSpace: Espacio en disco
    network: Red
    windowsOs: Windows 10/11 (64 bits)
    macosOs: macOS 12+ (Monterey o superior)
    linuxOs: Ubuntu 20.04+ / Debian 11+ / Otras distribuciones principales
    windowsProcessor: Intel Core i3 o procesador equivalente
    macosProcessor: Apple Silicon (M1/M2/M3) o Intel Core i3+
    linuxProcessor: Intel Core i3 o procesador equivalente
    memoryRec: 4 GB de RAM (8 GB recomendados)
    disk: 2 GB de espacio disponible
    networkDesc: Se requiere conexión a red para la descarga inicial (se puede usar sin conexión después)
  download:
    title: Paquetes de descarga
    windowsDesc: Instaladores estables para Windows 10/11, incluyendo versiones de instalación y portátiles.
    macosDesc: Versiones nativas para Mac con Apple Silicon e Intel.
    linuxDesc: Paquetes AppImage y tarball para distribuciones Linux x64 y ARM64 principales.
    note: Si la lista de paquetes aquí no se carga, usa el enlace del historial de versiones en la sección superior para acceder al índice canónico.
    features:
      signed: Paquetes firmados
      autoUpdate: Detección automática de actualizaciones
      multiLanguage: Interfaz multiidioma
  installation:
    title: Instalación rápida
    step1:
      number: '1'
      title: Descargar instalador
      description: Selecciona el instalador adecuado para tu sistema operativo
    step2:
      number: '2'
      title: Ejecutar instalador
      description: Haz doble clic en el instalador descargado y sigue las instrucciones para completar la instalación
    step3:
      number: '3'
      title: Iniciar aplicación
      description: En el primer inicio, te guiará a través de la configuración inicial
    step4:
      number: '4'
      title: Comenzar a usar
      description: Después de la configuración, puedes comenzar a usar Hagicode Desktop
  faq:
    title: FAQ
    q1:
      question: ¿Cuál es la diferencia entre la versión de escritorio y la de servidor?
      intro: 'Hagicode ofrece dos opciones de despliegue: versión de escritorio y versión de servidor. Cada una tiene sus ventajas, pero ambas adoptan un enfoque de servidor y datos controlados por el usuario, proporcionando mejor protección de datos.'
      desktopTitle: Versión de escritorio
      desktop1: Se ejecuta localmente en tu computadora, más liviana
      desktop2: Sin necesidad de configurar servidor, lista para usar desde el inicio
      desktop3: Adecuada para desarrolladores individuales y escenarios de uso ligero
      desktop4: Todos los datos completamente localizados
      serverTitle: Versión de servidor
      server1: Puede desplegarse en servidores remotos
      server2: Soporta acceso remoto multiusuario
      server3: Más adecuada para colaboración en equipo y escalado
      server4: Prepara futuras funcionalidades empresariales y sincronización multidispositivo
      conclusion: Sea cual sea la versión que elijas, tienes control total sobre tu servidor y datos, disfrutando de mejor protección de privacidad y seguridad de datos.
    q2:
      question: ¿Qué necesito hacer después de la instalación?
      intro: 'Hagicode Desktop es esencialmente un lanzador. En el primer inicio después de la instalación, te guiará a través de estos pasos:'
      step1: '<strong>Descargar Hagicode Core:</strong> Desktop detectará automáticamente y te pedirá que descargues los componentes principales de Hagicode'
      step2: '<strong>Instalar componentes principales:</strong> Sigue las instrucciones en pantalla para completar la instalación de los componentes principales'
      step3: '<strong>Configurar tu Agent CLI predeterminado:</strong> Elige un Agent CLI actualmente soportado y completa los pasos de inicio de sesión, autorización o instalación local necesarios.'
      note: La interfaz de Desktop guía todo el proceso. Mantén la red disponible en el primer inicio para que Hagicode Core pueda descargarse; algunos Agent CLIs aún requieren instalación manual o autenticación, pero siguen siendo parte del rango de soporte actual.
      done: Después de completar estos pasos, puedes usar todas las funciones de Hagicode Desktop normalmente.
    q3:
      question: ¿Cómo busco actualizaciones?
      answer: Desktop verifica actualizaciones automáticamente. Cuando haya una nueva versión disponible, aparecerá un aviso en la esquina superior derecha de la interfaz. También puedes buscar actualizaciones manualmente en "Configuración".
    q4:
      question: ¿Qué Agent CLIs de IA son soportados?
      intro: 'Hagicode Desktop actualmente soporta los siguientes Agent CLIs:'
      active: '<strong>Actualmente soportados:</strong> Claude Code, Codex, GitHub Copilot, OpenCode, Hermes, QoderCLI, Kiro, Kimi, Gemini, DeepAgents y Codebuddy'
      manual: '<strong>Instalación manual o autenticación:</strong> Hermes, Gemini y DeepAgents requieren una instalación local o paso de autenticación primero; los otros CLIs proporcionan puntos de entrada de instalación con un clic o flujos de instalación guiados.'
      legacy: '<strong>Solo compatibilidad heredada:</strong> IFlowCli permanece solo para compatibilidad de datos históricos y no es parte del rango de soporte activo actual.'
      closing: El alcance del soporte y el modo de configuración son cuestiones separadas. Un CLI que requiere instalación manual sigue siendo soportado actualmente.
    q5:
      question: ¿Soporta uso sin conexión?
      intro: '¡Sí! Hagicode Desktop soporta uso completamente sin conexión:'
      point1: Se requiere conexión a red para la instalación y configuración inicial (descarga de componentes principales y modelos de IA)
      point2: Todas las funciones se pueden usar sin conexión después de la configuración
      point3: Tu código y datos nunca se suben a la nube
      point4: Todo el procesamiento de IA se completa localmente
    q6:
      question: macOS dice que Hagicode.app está dañado o no se puede abrir. ¿Qué debo hacer?
      intro: Si Hagicode Desktop está instalado en la ruta predeterminada /Applications/Hagicode.app y macOS Gatekeeper bloquea el primer inicio, usa el siguiente comando para eliminar el atributo de cuarentena de la aplicación.
      cause: Esto ocurre porque macOS agrega el atributo com.apple.quarantine a las aplicaciones descargadas de Internet. Es un problema de aislamiento de seguridad de macOS, no un fallo en el instalador de Hagicode.
      command: sudo xattr -dr com.apple.quarantine /Applications/Hagicode.app
      note: Ejecuta el comando en Terminal con privilegios de administrador y luego reinicia Hagicode Desktop.
    q7:
      question: ¿Cómo obtener ayuda cuando se encuentran problemas?
      intro: 'Si encuentras problemas al usar Hagicode Desktop, puedes obtener ayuda a través de:'
      point1: '<strong>Grupo de soporte técnico:</strong> Únete al Grupo QQ 610394020'
      point2: '<strong>Documentación en línea:</strong> Consulta la documentación completa de uso y tutoriales'
      point3: '<strong>GitHub Issues:</strong> Envía reportes de problemas en el repositorio del proyecto'
