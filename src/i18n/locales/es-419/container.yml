container:
  title: Hagicode Container - Despliegue en contenedor
  description: Despliega Hagicode con Docker Compose Builder. Configuración sencilla, listo para usar. Compatible con múltiples fuentes de imágenes y actualizaciones automáticas.
  hero:
    badge: Contenedor
    title: Hagicode Container
    tagline: Despliegue rápido con Docker Compose Builder, configuración sencilla, listo para usar
    value1: Configuración visual, sin necesidad de programar
    value2: Aislamiento de entorno, seguridad de datos
    value3: Despliegue con un clic, inicio rápido
    ctaButton: Desplegar con Docker Compose Builder
    features:
      isolation: Aislamiento de entorno
      oneClick: Despliegue con un clic
      fastStart: Inicio rápido
  features:
    title: ¿Por qué elegir el despliegue en contenedor?
    isolation:
      title: Aislamiento de entorno
      description: El despliegue en contenedor evita conflictos de dependencias, no afecta el entorno del sistema, mantiene el sistema limpio
    simple:
      title: Configuración sencilla
      description: Usa Docker Compose Builder para configuración visual, sin necesidad de escribir scripts complejos
    crossPlatform:
      title: Soporte multiplataforma
      description: Compatible con arquitectura x86_64, adecuado para varios servidores y plataformas en la nube
    persistent:
      title: Persistencia de datos
      description: Soporta montaje de volúmenes, datos seguros y confiables, sin pérdida de datos al reiniciar el contenedor
    autoUpdate:
      title: Actualizaciones automáticas
      description: Soporta Watchtower para actualizaciones automáticas, obtén fácilmente la última versión
    productionReady:
      title: Listo para producción
      description: Diseñado para entornos de producción, soporta alta disponibilidad y escalado horizontal
  builder:
    title: Docker Compose Builder
    subtitle: El método de despliegue en contenedor más sencillo y recomendado
    visual:
      title: Configuración visual
      description: Configura todos los parámetros a través de una interfaz web amigable, sin necesidad de editar archivos YAML manualmente
    generate:
      title: Generación de configuración con un clic
      description: Genera automáticamente archivos docker-compose.yml completos con configuraciones de mejores prácticas
    deploy:
      title: Despliegue rápido
      description: Descarga con un clic los archivos de configuración e inicia servicios, completa el despliegue en minutos
    secure:
      title: Seguro y confiable
      description: Mejores prácticas de seguridad integradas, configura automáticamente volúmenes de datos y políticas de reinicio
    ctaButton: Ir a Docker Compose Builder
  mirrors:
    title: Selección de fuente de imágenes
    description: Elige la fuente de imágenes más adecuada según tu entorno de red y ubicación
    dockerHub: Docker Hub
    dockerHubDesc: El registro de imágenes de contenedor más grande del mundo, adecuado para usuarios con red internacional
    dockerHubCmd: newbe36524/hagicode:0
    azure: Azure ACR
    azureDesc: Servicio de imágenes de Microsoft Azure, acceso más rápido desde China
    azureCmd: hagicode.azurecr.io/hagicode:0
    aliyun: Aliyun ACR
    aliyunDesc: Aceleración de imágenes nacionales de Aliyun, recomendado para usuarios en China continental
    aliyunCmd: registry.cn-hangzhou.aliyuncs.com/hagicode/hagicode:0
  faq:
    title: FAQ
    q1:
      question: ¿Cuál es la diferencia entre la versión en contenedor y la de escritorio?
      intro: 'Ambas versiones tienen sus ventajas. Puedes elegir según tu escenario de uso:'
      desktopTitle: Versión de escritorio
      desktop1: Se ejecuta localmente en tu computadora, más liviana
      desktop2: Sin necesidad de configurar servidor, lista para usar desde el inicio
      desktop3: Adecuada para desarrolladores individuales y escenarios de uso ligero
      desktop4: Todos los datos completamente localizados
      containerTitle: Versión en contenedor
      container1: Puede desplegarse en servidores, soporta acceso remoto
      container2: Aislamiento de entorno, no afecta el entorno del sistema
      container3: Más adecuada para colaboración en equipo y entornos de producción
      container4: Soporta despliegue automatizado y escalado horizontal
    q2:
      question: ¿Qué es Docker Compose Builder?
      intro: 'Docker Compose Builder es nuestra herramienta de configuración visual que te ayuda a:'
      point1: Configurar todos los parámetros del contenedor a través de una interfaz web
      point2: Generar automáticamente archivos docker-compose.yml
      point3: Mejores prácticas y configuraciones de seguridad integradas
      point4: Descargar e iniciar servicios con un clic
      note: No es necesario escribir manualmente configuraciones YAML complejas. Incluso los principiantes en Docker pueden desplegar fácilmente.
    q3:
      question: ¿Qué arquitecturas de sistema soporta la versión en contenedor?
      answer: Las imágenes de contenedor de Hagicode actualmente soportan la arquitectura <strong>x86_64 (amd64)</strong>, adecuadas para la mayoría de servidores y PC.
      note: Docker seleccionará automáticamente la arquitectura adecuada para tu sistema al extraer las imágenes.
    q4:
      question: ¿Cómo actualizar el contenedor?
      intro: 'Al usar el despliegue con Docker Compose, la actualización es muy sencilla:'
      code: |-
        docker-compose pull
        docker-compose up -d
      watchtower: O usa Watchtower para actualizaciones automáticas.
    q5:
      question: ¿Cómo configurar la persistencia de datos?
      intro: 'Docker Compose Builder configura automáticamente los volúmenes de datos. Por defecto, tus datos se almacenarán en Docker Volumes, garantizando:'
      point1: Los datos no se pierden al eliminar contenedores
      point2: Los datos se preservan durante actualizaciones del contenedor
      point3: Fácil copia de seguridad y recuperación
    q6:
      question: ¿Qué hacer si el contenedor no se inicia?
      intro: 'Pasos para solucionar problemas de inicio del contenedor:'
      step1:
        title: 'Verificar el estado del contenedor:'
        code: docker-compose ps
      step2:
        title: 'Verificar los registros del contenedor:'
        code: docker-compose logs hagicode
      step3:
        title: 'Verificar la ocupación del puerto:'
        desc: 'Si el puerto de tu servicio es 3000, usa este comando para verificar:'
        code: netstat -tlnp | grep 3000
        solution: 'Si el puerto está ocupado, puedes:'
        solution1: Detener el proceso que ocupa el puerto
        solution2: O configurar un puerto diferente en Docker Compose Builder
      help: Si el problema persiste, consulta la documentación detallada o contacta al soporte técnico.
  cta:
    title: Comienza a usar Docker Compose Builder
    subtitle: El método de despliegue en contenedor más sencillo y recomendado
    button: Ir a la guía de despliegue
    github: Repositorio en GitHub
