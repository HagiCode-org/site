    description: Běží lokálně na vašem počítači, lehká a pohodlná, připravená k okamžitému použití
    features:
      - Lokální provádění, úplné soukromí dat
      - Podporuje Windows, macOS a Linux
      - Není nutná konfigurace serveru
      - Automatické aktualizace, vždy nejnovější verze
      - Vhodné pro individuální vývojáře
    ctaText: Stáhnout desktopovou aplikaci
  container:
    title: Kontejnerová verze
    description: Nasazení na serverech, podporuje vzdálený přístup, vhodné pro týmovou spolupráci
    features:
      - Podporuje architekturu x86_64
      - Izolace prostředí, neovlivňuje systém
      - Podporuje Docker Compose Builder
      - Perzistence dat, bezpečné a spolehlivé
      - Vhodné pro produkční prostředí
    ctaText: Průvodce nasazením kontejneru
