    openFullscreenHint: Klikněte pro zvětšení
    closeFullscreen: Zavřít celou obrazovku
  screenshots:
    proposalWorkflow:
      title: Přehled provádění návrhů
      description: Udržujte fázi pracovního postupu, výsledek provedení a kontext relace na jedné obrazovce, aby týmy přesně viděly, kde se nachází změna, než budou pokračovat.
      alt: Snímek obrazovky provádění návrhů HagiCode zobrazující fáze pracovního postupu, výsledek provedení a postranní panel relace
    sessionBoard:
      title: Panel relací a plánování kobek
      description: Čekající, probíhající a archivované relace zůstávají viditelné vedle fantasy panelu úkolů, takže paralelní práce agentů je snadno přehledná na první pohled.
      alt: Snímek obrazovky panelu relací HagiCode zobrazující čekající, probíhající a archivované sloupce vedle fantasy panelu úkolů
    tokenAnalytics:
      title: Analýza tokenů v reálném čase
      description: Sledujte propustnost, nedávnou API aktivitu a celkové využití na jedné metrické ploše, aby náklady a tempo zůstaly kontrolovatelné během paralelního provádění.
      alt: Snímek obrazovky tokenové analytiky HagiCode zobrazující propustnost, nedávnou API aktivitu a celkové využití
    workspaceManagement:
      title: Správa pracovních prostor a trezorů
      description: Spravujte uživatelské trezory, systémové trezory a vstupní body code-server z jedné řídicí plochy navržené pro sdílená prostředí a rychlou údržbu.
      alt: Snímek obrazovky správy pracovních prostor HagiCode zobrazující uživatelské trezory, systémové trezory a akce code-server
    achievementProgress:
      title: Postup úspěchů a růstu
      description: Denní postup, globální růst a metriky životního cyklu se spojují do jednoho panelu, takže dlouhodobé přijetí působí měřitelně místo abstraktně.
      alt: Snímek obrazovky panelu úspěchů HagiCode zobrazující denní postup, globální růst a metriky životního cyklu
