showcase:
  title: Nejnovější pohledy na produkt
  description: Od provádění návrhů a panelů relací přes tokenovou analytiku, správu pracovních prostor a postup v úspěších — domovská stránka nyní používá nejnovější kurátorsky vybrané snímky spravované společně s dokumentačním webem.
  controls:
    previous: Předchozí
    next: Další
    current: Představený pohled
    railLabel: Navigace snímků produktu
    selectPrefix: 'Přepnout na: '
