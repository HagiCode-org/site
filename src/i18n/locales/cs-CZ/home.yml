homepageVideos:
  overview:
    youtube:
      title: Přehled produktu Hagicode na YouTube
      description: Hlavní anglojazyčné představení pracovního postupu Hagicode, stylu multi-agent provádění a toho, proč se produkt zdá být širší než generická AI chatovací schránka pro kódování.
      ctaLabel: Otevřít na YouTube
    bilibili:
      title: Přehled produktu Hagicode na Bilibili
      description: Verze základního představení produktu hostovaná na Bilibili pro návštěvníky, jejichž prohlížeče signalizují předvolbu čínštiny nebo kteří preferují domácí cestu přehrávání.
      ctaLabel: Otevřít na Bilibili
  supporting:
    first:
      title: AI hraje hry při kódování
      description: Hravý podpůrný klip, který ukazuje asistenta, jak zůstává živý a překvapivý během skutečných kódovacích relací, místo aby působil jako suchý generátor kódu.
      ctaLabel: Otevřít na Bilibili
    second:
      title: 'GPT Codex v Hagicode: Živý test'
      description: Zaměřený validační test, který umožňuje potenciálním uživatelům posoudit, jak se GPT Codex chová uvnitř skutečného produktu poté, co viděli hlavní lokalizované představení.
      ctaLabel: Otevřít na Bilibili
