        description: Toto DLC si můžete zakoupit samostatně pro rozšíření původního limitu souběžnosti návrhů, odemčení přepínání kopií, přidání pěti balíčků avatarů s 10 samostatnými avatary v každém, povolení nahrávání vlastních avatarů, přizpůsobení loga a názvu vlevo nahoře a sladění AI generovaných commit zpráv s vašimi vlastními Co-Authored-By pravidly pojmenování. Obvykle zvýrazníme možnost balíčkového nákupu s názvem Hagicode Plus, aby celková kupní cena zůstala nižší. Zkontrolujte prosím naši obchodní stránku pro nejnovější změny.
        bullets:
          - Podporuje vlastní loga a názvy vlevo nahoře
          - Obsahuje pět balíčků avatarů s 10 volitelnými avatary v každém balíčku
          - Podporuje nahrávání vlastních avatarů
          - Umožňuje týmům přizpůsobit AI Co-Authored-By podpis pro commit pracovní postupy
          - Odemyká podporu přepínání kopií a znění
          - Rozšiřuje maximální limit souběžných návrhů na 32
