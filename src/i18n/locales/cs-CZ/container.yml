container:
  title: Hagicode Container - Nasazení kontejneru
  description: Nasaďte Hagicode pomocí Docker Compose Builder. Jednoduchá konfigurace, připraveno k použití. Podporuje více zdrojů obrazů a automatické aktualizace.
  hero:
    badge: Kontejner
    title: Hagicode Container
    tagline: Rychlé nasazení pomocí Docker Compose Builder, jednoduchá konfigurace, připraveno k použití
    value1: Vizuální konfigurace, není potřeba programování
    value2: Izolace prostředí, zabezpečení dat
    value3: Nasazení jedním kliknutím, rychlý start
    ctaButton: Nasadit pomocí Docker Compose Builder
    features:
      isolation: Izolace prostředí
      oneClick: Nasazení jedním kliknutím
      fastStart: Rychlý start
  features:
    title: Proč zvolit kontejnerové nasazení?
    isolation:
      title: Izolace prostředí
      description: Kontejnerové nasazení zabraňuje konfliktům závislostí, neovlivňuje systémové prostředí, udržuje systém čistý
    simple:
      title: Jednoduchá konfigurace
      description: Použijte Docker Compose Builder pro vizuální konfiguraci, není nutné psát složité skripty
    crossPlatform:
      title: Multiplatformní podpora
      description: Podporuje architekturu x86_64, vhodné pro různé servery a cloudové platformy
    persistent:
      title: Perzistence dat
      description: Podporuje připojení Volume, bezpečná a spolehlivá data, žádná ztráta dat při restartu kontejneru
    autoUpdate:
      title: Automatické aktualizace
      description: Podporuje watchtower pro automatické aktualizace, snadné získání nejnovější verze
    productionReady:
      title: Připraveno na produkci
      description: Navrženo pro produkční prostředí, podporuje vysokou dostupnost a horizontální škálování
  builder:
    title: Docker Compose Builder
    subtitle: Nejjednodušší a doporučovaná metoda kontejnerového nasazení
    visual:
      title: Vizuální konfigurace
      description: Nakonfigurujte všechny parametry prostřednictvím přátelského webového rozhraní, není nutné ručně upravovat YAML soubory
    generate:
      title: Generování konfigurace jedním kliknutím
      description: Automaticky generujte kompletní docker-compose.yml soubory s konfigurací podle osvědčených postupů
    deploy:
      title: Rychlé nasazení
      description: Stažení konfiguračních souborů a spuštění služeb jedním kliknutím, dokončení nasazení během minut
    secure:
      title: Bezpečné a spolehlivé
      description: Vestavěné osvědčené postupy zabezpečení, automaticky konfiguruje datové svazky a zásady restartování
    ctaButton: Přejít na Docker Compose Builder
  mirrors:
    title: Výběr zdroje obrazů
    description: Vyberte nejvhodnější zdroj obrazů na základě vašeho síťového prostředí a umístění
    dockerHub: Docker Hub
    dockerHubDesc: Největší světový registr obrazů kontejnerů, vhodný pro uživatele s mezinárodní sítí
    dockerHubCmd: newbe36524/hagicode:0
    azure: Azure ACR
    azureDesc: Služba obrazů Microsoft Azure, rychlejší přístup z Číny
    azureCmd: hagicode.azurecr.io/hagicode:0
    aliyun: Aliyun ACR
    aliyunDesc: Domácí akcelerace obrazů Aliyun, doporučeno pro uživatele v pevninské Číně
    aliyunCmd: registry.cn-hangzhou.aliyuncs.com/hagicode/hagicode:0
  faq:
    title: Často kladené dotazy
    q1:
      question: Jaký je rozdíl mezi kontejnerovou a desktopovou verzí?
      intro: 'Obě verze mají své výhody. Můžete si vybrat na základě vašeho scénáře použití:'
      desktopTitle: Desktopová verze
      desktop1: Běží lokálně na vašem počítači, odlehčenější
      desktop2: Není nutná konfigurace serveru, připraveno k okamžitému použití
      desktop3: Vhodné pro individuální vývojáře a nenáročné scénáře použití
      desktop4: Všechna data zcela lokalizována
      containerTitle: Kontejnerová verze
      container1: Lze nasadit na servery, podporuje vzdálený přístup
      container2: Izolace prostředí, neovlivňuje systémové prostředí
      container3: Lépe vhodná pro týmovou spolupráci a produkční prostředí
      container4: Podporuje automatizované nasazení a horizontální škálování
    q2:
      question: Co je Docker Compose Builder?
      intro: 'Docker Compose Builder je náš vizuální konfigurační nástroj, který vám pomůže:'
      point1: Nakonfigurovat všechny parametry kontejneru prostřednictvím webového rozhraní
      point2: Automaticky generovat docker-compose.yml soubory
      point3: Vestavěné osvědčené postupy a konfigurace zabezpečení
      point4: Stažení a spuštění služeb jedním kliknutím
      note: Není nutné ručně psát složité YAML konfigurace. I začátečníci s Dockerem mohou snadno nasadit.
    q3:
      question: Jaké systémové architektury kontejnerová verze podporuje?
      answer: Kontejnerové obrazy Hagicode v současnosti podporují architekturu <strong>x86_64 (amd64)</strong>, vhodnou pro většinu serverů a PC.
      note: Docker automaticky vybere vhodnou architekturu pro váš systém při stahování obrazů.
    q4:
      question: Jak aktualizovat kontejner?
      intro: 'Při použití nasazení Docker Compose je aktualizace velmi jednoduchá:'
      code: |-
        docker-compose pull
        docker-compose up -d
      watchtower: Nebo použijte Watchtower pro automatické aktualizace.
    q5:
      question: Jak nakonfigurovat perzistenci dat?
      intro: 'Docker Compose Builder automaticky konfiguruje datové svazky. Ve výchozím nastavení budou vaše data uložena v Docker Volumes, což zajišťuje:'
      point1: Data se neztratí při odstranění kontejnerů
      point2: Data jsou zachována při upgradu kontejnerů
      point3: Snadné zálohování a obnova
    q6:
      question: Co dělat, když se kontejner nespustí?
      intro: 'Kroky pro řešení potíží se spuštěním kontejneru:'
      step1:
        title: 'Zkontrolujte stav kontejneru:'
        code: docker-compose ps
      step2:
        title: 'Zkontrolujte logy kontejneru:'
        code: docker-compose logs hagicode
      step3:
        title: 'Zkontrolujte obsazenost portů:'
        desc: 'Pokud je port vaší služby 3000, použijte tento příkaz ke kontrole:'
        code: netstat -tlnp | grep 3000
        solution: 'Pokud je port obsazen, můžete:'
        solution1: Zastavit proces obsahující port
        solution2: Nebo nakonfigurovat jiný port v Docker Compose Builder
      help: Pokud problém přetrvává, zkontrolujte prosím podrobnou dokumentaci nebo kontaktujte technickou podporu.
  cta:
    title: Začněte používat Docker Compose Builder
    subtitle: Nejjednodušší a doporučovaná metoda kontejnerového nasazení
    button: Přejít na průvodce nasazením
    github: GitHub repozitář
