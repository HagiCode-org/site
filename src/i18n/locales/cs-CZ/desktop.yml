desktop:
  title: Hagicode Desktop - Stažení
  description: Stáhněte si Hagicode Desktop, lokalizovaného AI asistenta pro kódování. Podporuje Windows, macOS a Linux. Ochrana soukromí, rychlá odezva.
  features:
    title: Klíčové funkce
    local:
      title: Lokální provádění
      description: Všechna data se zpracovávají lokálně bez nahrávání do cloudu, což zajišťuje soukromí a bezpečnost kódu
    privacy:
      title: Ochrana soukromí
      description: Kód se nikdy nenahrává, podporuje offline použití, chrání vaše duševní vlastnictví
    fast:
      title: Rychlá odezva
      description: Doba odezvy na úrovni milisekund, nejsou potřeba síťové požadavky, zvyšuje efektivitu vývoje
    crossPlatform:
      title: Multiplatformní podpora
      description: Podporuje Windows, macOS a Linux pro uspokojení různých potřeb vývojových prostředí
    autoUpdate:
      title: Automatické aktualizace
      description: Automaticky kontroluje aktualizace a upgraduje na nejnovější verzi jedním kliknutím
    multiLanguage:
      title: Vícejazyčná podpora
      description: Vestavěné čínské a anglické rozhraní, podporuje mezinárodní týmovou spolupráci
  systemRequirements:
    title: Systémové požadavky
    windows: Windows
    macos: macOS
    linux: Linux
    os: Operační systém
    processor: Procesor
    memory: Paměť
    diskSpace: Místo na disku
    network: Síť
    windowsOs: Windows 10/11 (64-bit)
    macosOs: macOS 12+ (Monterey nebo novější)
    linuxOs: Ubuntu 20.04+ / Debian 11+ / Další běžné distribuce
    windowsProcessor: Intel Core i3 nebo ekvivalentní procesor
    macosProcessor: Apple Silicon (M1/M2/M3) nebo Intel Core i3+
    linuxProcessor: Intel Core i3 nebo ekvivalentní procesor
    memoryRec: 4GB RAM (8GB doporučeno)
    disk: 2GB volného prostoru
    networkDesc: Pro první stažení je vyžadováno síťové připojení (následně lze používat offline)
  download:
    title: Balíčky ke stažení
    windowsDesc: Stabilní instalační programy pro Windows 10/11, včetně instalačních a přenosných verzí.
    macosDesc: Nativní sestavení pro Apple Silicon a Intel Mac.
    linuxDesc: AppImage a tarball balíčky pro běžné x64 a ARM64 distribuce Linuxu.
    note: Pokud se seznam balíčků nepodaří načíst, použijte odkaz na historii verzí v oblasti hero pro přístup ke kanonickému indexu.
    features:
      signed: Podepsané balíčky
      autoUpdate: Automatická detekce aktualizací
      multiLanguage: Vícejazyčné rozhraní
  installation:
    title: Rychlá instalace
    step1:
      number: '1'
      title: Stáhnout instalační program
      description: Vyberte příslušný instalační program pro váš operační systém
    step2:
      number: '2'
      title: Spustit instalační program
      description: Dvakrát klikněte na stažený instalační program a postupujte podle pokynů k dokončení instalace
    step3:
      number: '3'
      title: Spustit aplikaci
      description: Při prvním spuštění vás provede počáteční konfigurací
    step4:
      number: '4'
      title: Začít používat
      description: Po konfiguraci můžete začít používat Hagicode Desktop
  faq:
    title: Často kladené dotazy
    q1:
      question: Jaký je rozdíl mezi desktopovou a serverovou verzí?
      intro: 'Hagicode nabízí dvě možnosti nasazení: desktopovou verzi a serverovou verzi. Každá má své výhody, ale obě přijímají přístup s uživatelsky řízeným serverem a daty, poskytující lepší ochranu dat.'
      desktopTitle: Desktopová verze
      desktop1: Běží lokálně na vašem počítači, odlehčenější
      desktop2: Není nutná konfigurace serveru, připraveno k okamžitému použití
      desktop3: Vhodné pro individuální vývojáře a nenáročné scénáře použití
      desktop4: Všechna data zcela lokalizována
      serverTitle: Serverová verze
      server1: Lze nasadit na vzdálené servery
      server2: Podporuje víceuživatelský vzdálený přístup
      server3: Lépe vhodná pro týmovou spolupráci a škálování
      server4: Připravuje na budoucí podnikové funkce a synchronizaci více zařízení
      conclusion: Ať si vyberete jakoukoliv verzi, máte plnou kontrolu nad svým serverem a daty a užíváte si lepší ochranu soukromí a zabezpečení dat.
    q2:
      question: Co musím udělat po instalaci?
      intro: 'Hagicode Desktop je v podstatě spouštěč. Při prvním spuštění po instalaci vás provede těmito kroky:'
      step1: <strong>Stáhnout Hagicode Core:</strong> Desktop automaticky detekuje a vyzve vás ke stažení základních komponent Hagicode
      step2: <strong>Nainstalovat základní komponenty:</strong> Postupujte podle pokynů na obrazovce pro dokončení instalace základních komponent
      step3: <strong>Konfigurovat výchozí Agent CLI:</strong> Vyberte aktuálně podporovaný Agent CLI a dokončete požadované kroky přihlášení, autorizace nebo lokální instalace.
      note: Rozhraní Desktop provádí celým procesem. Při prvním spuštění udržujte síť dostupnou, aby se mohl Hagicode Core stáhnout; některé Agent CLIs stále vyžadují ruční instalaci nebo ověření, ale jsou stále součástí současného rozsahu podpory.
      done: Po dokončení těchto kroků můžete normálně používat všechny funkce Hagicode Desktop.
    q3:
      question: Jak zkontroluji aktualizace?
      answer: Desktop automaticky kontroluje aktualizace. Jakmile je k dispozici nová verze, objeví se upozornění v pravém horním rohu rozhraní. Aktualizace můžete také ručně zkontrolovat v "Nastavení".
    q4:
      question: Které AI Agent CLIs jsou podporovány?
      intro: 'Hagicode Desktop v současnosti podporuje následující Agent CLIs:'
      active: <strong>Aktuálně podporované:</strong> Claude Code, Codex, GitHub Copilot, OpenCode, Hermes, QoderCLI, Kiro, Kimi, Gemini, DeepAgents a Codebuddy
      manual: <strong>Ruční instalace nebo ověření:</strong> Hermes, Gemini a DeepAgents vyžadují nejprve lokální instalaci nebo krok ověření; ostatní CLIs poskytují vstupní body pro instalaci jedním kliknutím nebo průvodce instalací.
      legacy: <strong>Pouze pro zpětnou kompatibilitu:</strong> IFlowCli zůstává pouze pro kompatibilitu s historickými daty a není součástí současného aktivního rozsahu podpory.
      closing: Rozsah podpory a režim nastavení jsou oddělené záležitosti. CLI vyžadující ruční instalaci je stále podporováno.
    q5:
      question: Podporuje offline použití?
      intro: 'Ano! Hagicode Desktop podporuje úplné offline použití:'
      point1: Pro první instalaci a konfiguraci je vyžadováno síťové připojení (stahování základních komponent a AI modelů)
      point2: Po konfiguraci lze všechny funkce používat offline
      point3: Váš kód a data se nikdy nenahrávají do cloudu
      point4: Veškeré zpracování AI se provádí lokálně
    q6:
      question: macOS říká, že Hagicode.app je poškozen nebo nelze otevřít. Co mám dělat?
      intro: Pokud je Hagicode Desktop nainstalován ve výchozí cestě /Applications/Hagicode.app a macOS Gatekeeper blokuje první spuštění, použijte následující příkaz k odstranění karanténního atributu z aplikace.
      cause: K tomu dochází, protože macOS přidává atribut com.apple.quarantine aplikacím staženým z internetu. Jde o problém izolace zabezpečení macOS, nikoli o selhání instalačního programu Hagicode.
      command: sudo xattr -dr com.apple.quarantine /Applications/Hagicode.app
      note: Spusťte příkaz v Terminálu s právy správce a poté znovu spusťte Hagicode Desktop.
    q7:
      question: Jak získat pomoc při problémech?
      intro: 'Pokud narazíte na problémy při používání Hagicode Desktop, můžete získat pomoc prostřednictvím:'
      point1: <strong>Skupina technické podpory:</strong> Připojte se ke QQ Skupině 610394020
      point2: <strong>Online dokumentace:</strong> Zobrazte kompletní dokumentaci k používání a návody
      point3: <strong>GitHub Issues:</strong> Nahlaste problémy v repozitáři projektu
