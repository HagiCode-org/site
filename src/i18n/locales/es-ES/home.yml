features:
  showcase:
    title: "Pensado para el trabajo de desarrollo real"
    subtitle: "Las propuestas mantienen cada cambio revisable; los agentes en paralelo mantienen el trabajo en marcha"
    demoLabel: "Flujo ilustrativo · sin tareas en vivo"
    previewLabel: "Interfaz real del producto"
  smart:
    badge: INTELIGENTE
    title: Inteligente
    subtitle: "Primero la intención. Luego la IA construye."
    efficiency: Mejora de eficiencia
    traditional: Tradicional
    hagicode: Hagicode
    description: "Reúne requisitos, diseño y tareas en OpenSpec. Cada cambio conserva su contexto y el trabajo terminado se convierte en conocimiento reutilizable."
    workflow:
      review:
        label: Revisión
        desc: Revisión automática
      scaffold:
        label: Scaffold
        desc: Choose a change-id and create proposal.md, tasks.md, and design.md when needed.
      spec:
        label: Spec
        desc: Translate the change into capability-level spec deltas with explicit requirements.
      design:
        label: Design
        desc: Capture architecture and trade-offs in design.md when the change spans systems.
      tasks:
        label: Tareas
        desc: Desglose de tareas
      validate:
        label: Validate
        desc: Run openspec validate in strict mode and clear every issue before execution.
      apply:
        label: Apply
        desc: Read proposal, design, and tasks, then implement in order while checking items off.
      archive:
        label: Archivo
        desc: Archivo de conocimiento
    paused: En pausa - haz clic en un nodo para cambiar
  convenient:
    badge: EFICIENTE
    title: Eficiente
    subtitle: "Más tareas avanzando a la vez."
    traditional: Enfoque tradicional de un solo Agent / una sola instancia
    multiThread: Matriz paralela multi-agent
    boost: Aumento de rendimiento
    boostValue: 10x+ en paralelo
    description: "Distintos agentes trabajan en propuestas, implementación y revisión al mismo tiempo. Varias instancias en paralelo reducen las esperas entre tareas."
    agentMatrix:
      title: Matriz de ejecución en paralelo
      badge: Varios agentes / varias instancias
      status: Varios agentes están impulsando varias instancias al mismo tiempo
      agents:
        claude:
          name: Claude Code
          role: Propuesta / revisión
          instances:
            - Redactar la spec
            - Revisar el diseño
            - Revisar el archivo
        codex:
          name: Codex
          role: Implementación / arreglos
          instances:
            - Construir la función A
            - Construir la función B
            - Corregir una regresión
        router:
          name: Qwen · GLM
          role: Análisis / soporte
          instances:
            - Rastrear un problema
            - Pulir textos
            - Capturar aprendizajes
      supportedNames:
        title: 13 Agent CLI compatibles actualmente
        names:
          - Claude Code
          - Codex
          - GitHub Copilot
          - OpenCode
          - Hermes
          - QoderCLI
          - Kiro
          - Kimi
          - Gemini
          - Pi
          - Reasonix
          - DeepAgents
          - Codebuddy
    supportedProvidersNote: OpenCode puede cargar el catálogo compartido de OmniRoute en los valores predeterminados del modelo hero y, al mismo tiempo, mantener editables los identificadores de modelo sin procesar para flujos específicos por rama.
  interesting:
    badge: INTERESANTE
    title: Interesante
    subtitle: "Un flujo claro y atractivo gracias a interacciones de interfaz ricas y prácticas."
    features:
      planning:
        label: "Planificar"
        desc: "Consulta tareas y resultados en la vista de propuestas."
      execution:
        label: "Ejecutar"
        desc: "Sigue el trabajo de varios agentes en el tablero de sesiones."
      workspace:
        label: "Proyectos"
        desc: "Consulta y gestiona distintos proyectos en el espacio de trabajo."
    description: "Las interacciones de interfaz, ricas y prácticas, facilitan la planificación, la ejecución de agentes y el trabajo en proyectos."
    dungeonCards:
      proposal:
        title: Mazmorra de propuestas
        desc: OpenSpec generate / apply / archive
        status: Capitán listo
      autotask:
        title: Mazmorra AutoTask
        desc: Arreglos en paralelo y automatización por lotes
        status: 2 instancias activas
      prompt:
        title: Mazmorra de prompts
        desc: Vista previa de prompts y banco de estilo
        status: Sincronización visual lista
    roster:
      title: Lista actual de capitanes
      heroes:
        strategist:
          name: Spec Strategist
          role: Capitán de propuestas
        runner:
          name: Patch Runner
          role: Capitán de ejecución
        artist:
          name: Prompt Artist
          role: Soporte visual
    battleReport:
      title: Informe de mazmorra de hoy
      badge: Hero Battle
      metrics:
        dungeons:
          value: '4'
          label: Mazmorras impulsadas
        level:
          value: Lv.27
          label: Nivel del capitán
        xp:
          value: 12.8M
          label: XP de hoy
      note: Cuando varias mazmorras avanzan en paralelo, este informe resume experiencia, niveles y resultados de ejecución en una sola lectura.
    gallery:
      dungeons:
        title: Carrusel del mapa de mazmorras
        subtitle: 10 visuales aleatorios de la colección actual de mapas de mazmorras y prompts del frontend.
      heroes:
        title: Carrusel de la galería de héroes
        subtitle: 10 visuales aleatorios de la colección actual de héroes del frontend.
