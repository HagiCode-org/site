workflowBoard:
  title: "Varios agentes, cada etapa, siempre en marcha"
  description: "Cada agente lleva su propia tarea por la idea, la propuesta, la ejecución y el archivo. Cuando una ejecución se archiva, empieza la siguiente, así que el trabajo avanza en todas las etapas a la vez."
  illustrative: "Ejemplo animado"
  diagramLabel: "{agents} llevan cada uno una tarea por estas etapas: {stages}."
  loopLabel: "El archivo alimenta la siguiente propuesta"
  pause: "Pausar la animación"
  play: "Reproducir la animación"
  headerSummary: "Agente / Tarea"
  tasks:
    - "Nuevo módulo CRUD"
    - "Revisión completa de código"
    - "Documentación de API"
    - "Paquete de pruebas"
  steps:
    - "Idear"
    - "Proponer"
    - "Ejecutar"
    - "Archivar"
  activeStates:
    - "Ideando"
    - "Proponiendo"
    - "Ejecutando"
    - "Archivando"
  completedState: "Completado"
workflowSteps:
  eyebrow: "Cómo funciona"
  title: "Cada cambio sigue los mismos tres pasos"
  description: "Nada de hilos de chat interminables. Cada cambio se convierte en una propuesta revisable, una ejecución trazable y conocimiento reutilizable."
  loopLabel: "El archivo alimenta la siguiente propuesta"
  steps:
    proposal:
      label: "Propuesta"
      description: "Describe el cambio. Hagicode revisa tu repositorio y redacta una propuesta con especificaciones y tareas que puedes leer y corregir antes de tocar código."
    execution:
      label: "Ejecución"
      description: "Aprueba el plan y los agentes lo ejecutan tarea por tarea, en paralelo con Claude Code, Codex, GitHub Copilot y más, marcando cada tarea al completarla."
    archive:
      label: "Archivo"
      description: "Los cambios terminados se archivan en tus especificaciones. La siguiente propuesta las lee primero, de modo que parte de lo que el equipo ya aprendió."
