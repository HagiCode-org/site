features:
  showcase:
    title: "Pensado para el trabajo de desarrollo real"
    subtitle: "Las propuestas mantienen cada cambio revisable; los agentes en paralelo mantienen el trabajo en marcha"
  smart:
    title: Inteligente
    subtitle: "Primero proponer, después ejecutar: cada cambio deja rastro"
    artifactsTitle: "Lo que deja cada cambio"
    description: "HagiCode no se limita a conversar sobre tu código. Revisa el estado real del proyecto, redacta una propuesta y deltas de spec, valida de forma estricta, ejecuta las tareas en orden y por último archiva lo aprendido para el siguiente cambio."
    workflow:
      review:
        label: "Revisión"
        desc: "Revisar el estado del proyecto, las specs existentes y el código relacionado antes de redactar nada."
      scaffold:
        label: "Andamiaje"
        desc: "Elegir un change-id y crear proposal.md, tasks.md y, si hace falta, design.md."
      spec:
        label: "Spec"
        desc: "Traducir el cambio en deltas de spec por capability, con requisitos explícitos."
      design:
        label: "Diseño"
        desc: "Dejar arquitectura y compromisos por escrito en design.md cuando el cambio afecta a varios sistemas."
      tasks:
        label: "Tareas"
        desc: "Dividir el trabajo en elementos pequeños y verificables, con orden y paralelismo claros."
      validate:
        label: "Validación"
        desc: "Ejecutar openspec validate en modo strict y resolver todo antes de ejecutar."
      apply:
        label: "Ejecución"
        desc: "Leer proposal, design y tasks e implementar en orden, marcando lo completado."
      archive:
        label: "Archivo"
        desc: "Archivar el cambio terminado y devolver el resultado al historial de specs a largo plazo."
    paused: En pausa - haz clic en un nodo para cambiar
  convenient:
    title: Eficiente
    subtitle: "Muchos agentes e instancias en paralelo para que tu cuota nunca se quede ociosa"
    traditional: "Uno tras otro, en cola"
    multiThread: "En paralelo, sin esperarse"
    description: "Claude Code, Codex, GitHub Copilot, OpenCode, Hermes y el resto de Agent CLI compatibles pueden ejecutar varias instancias a la vez. Propuestas, correcciones y revisiones tienen su propio carril, así que un resultado lento no frena al resto."
    agentMatrix:
      title: Matriz de ejecución en paralelo
      badge: "Configuración de ejemplo"
      status: "Ilustración: cada carril avanza, ninguno bloquea a otro"
      agents:
        claude:
          name: Claude Code
          role: Propuesta / revisión
          instances:
            - Redactar la spec
            - Revisar el diseño
            - Revisar el archivo
        codex:
          name: Codex
          role: Implementación / arreglos
          instances:
            - Construir la función A
            - Construir la función B
            - Corregir una regresión
        router:
          name: Qwen · GLM
          role: Análisis / soporte
          instances:
            - Rastrear un problema
            - Pulir textos
            - Capturar aprendizajes
    cliBay:
      title: "Agent CLI que puedes equipar"
      hint: "Elige una para ver cómo se conecta"
      chain:
        agent: "Agente"
        model: "Modelo compatible"
      labels:
        whatItIs: "Qué es"
        models: "Modelos e inicio de sesión"
        runsOn: "Dónde funciona"
        start: "Primeros pasos"
        questions: "Preguntas en HagiCode"
        strengths: "Destaca en"
        compare: "Leer la comparación completa"
  interesting:
    title: Interesante
    subtitle: "Cada agente tiene rostro, personalidad y un mundo propio"
    description: "Dale a cada agente un avatar, un Trait y un Soul, y elige el vocabulario de tu equipo. La misma alineación se lee como héroes y mazmorras, un rancho, una corte imperial o una colmena, y los niveles y trofeos premian el trabajo mientras ocurre."
    worlds:
      title: "Una alineación, diez formas de llamarla"
      labels:
        agent: "Agente"
        group: "Grupo"
        job: "Tarea"
        log: "Registro"
      items:
        agents:
          name: "Línea base AgentCLI"
          agent: "Agente"
          group: "Grupo de trabajo"
          job: "Trabajo"
          log: "Historial de actividad"
        fantasyAdventure:
