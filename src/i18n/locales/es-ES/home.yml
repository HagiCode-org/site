  storeRecommended: "Recomendado"
  storeNote: "Compra única · licencia permanente · desbloquea todas las funciones"
  tagline: Mejora la eficiencia de desarrollo con herramientas de código impulsadas por IA
  description: HagiCode ayuda a los desarrolladores a centrarse en el código y no en el trabajo repetitivo
  ctaButton: Empezar
  taglines:
    smart: Inteligente · Eficiente · Interesante
    aiDriven: Orquestado por IA · Multi-Agent en paralelo
    openspec: OpenSpec · Revolución del flujo de trabajo
    multiThread: Multi-Agent · Multiinstancia
  lunarTaglines:
    happyNewYear: Feliz año nuevo · Año del caballo
    aiPowered: IA como impulso · Código hacia el éxito
    smartCoding: Smart coding · Mejores deseos
