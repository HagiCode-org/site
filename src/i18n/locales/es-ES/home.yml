      title: IA jugando mientras programa
      description: Este clip complementario, más lúdico, muestra que el asistente sigue siendo vivo y sorprendente en sesiones reales de código, en lugar de parecer un generador de código rígido.
      ctaLabel: Abrir en Bilibili
    second:
      title: 'GPT Codex en Hagicode: prueba en vivo'
      description: Después de ver la presentación principal localizada, esta validación más enfocada ayuda a los posibles usuarios a juzgar cómo se comporta GPT Codex dentro del producto real.
