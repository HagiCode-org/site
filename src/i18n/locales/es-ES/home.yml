features:
  showcase:
    title: Tres funciones clave
    subtitle: Redefine tu experiencia de coding con IA
  smart:
    badge: INTELIGENTE
    title: Inteligente
    subtitle: Flujo OpenSpec para impulsar la eficiencia del coding con IA
    efficiency: Mejora de eficiencia
    traditional: Tradicional
    hagicode: Hagicode
    description: Un flujo completo de propuestas en 9 etapas, desde la idea hasta el archivo, con ayuda de IA durante todo el recorrido. Tu eficiencia de coding puede multiplicarse por tres.
    workflow:
      idea:
        label: Idea
        desc: Empezar desde la idea
      proposal:
        label: Propuesta
        desc: La IA genera la propuesta
      review:
        label: Revisión
        desc: Revisión automática
      tasks:
        label: Tareas
        desc: Desglose de tareas
      code:
        label: Código
        desc: Coding inteligente
      test:
        label: Prueba
        desc: Pruebas automáticas
      refactor:
        label: Refactor
        desc: Refactor de código
      docs:
        label: Docs
        desc: Generación de documentación
      archive:
        label: Archivo
        desc: Archivo de conocimiento
    paused: En pausa - haz clic en un nodo para cambiar
  convenient:
    badge: EFICIENTE
    title: Eficiente
    subtitle: Ejecución multi-agent y multiinstancia para mantener tu cuota en movimiento
    traditional: Enfoque tradicional de un solo Agent / una sola instancia
    multiThread: Matriz paralela multi-agent
    boost: Aumento de rendimiento
    boostValue: 10x+ en paralelo
    description: Los Agent CLI actualmente soportados, como Claude Code, Codex, GitHub Copilot, OpenCode y Hermes, pueden trabajar sobre varias instancias al mismo tiempo, así que propuestas, arreglos y revisiones avanzan en paralelo en lugar de esperar en una cola serial.
    agentMatrix:
      title: Matriz de ejecución en paralelo
      badge: Varios agentes / varias instancias
      status: Varios agentes están impulsando varias instancias al mismo tiempo
      agents:
        claude:
          name: Claude Code
          role: Propuesta / revisión
          instances:
            - Redactar la spec
            - Revisar el diseño
            - Revisar el archivo
        codex:
          name: Codex
          role: Implementación / arreglos
          instances:
            - Construir la función A
            - Construir la función B
            - Corregir una regresión
        router:
          name: Qwen · GLM
          role: Análisis / soporte
          instances:
            - Rastrear un problema
            - Pulir textos
            - Capturar aprendizajes
      supportedNames:
        title: 11 Agent CLI compatibles actualmente
        names:
          - Claude Code
          - Codex
          - GitHub Copilot
          - OpenCode
          - Hermes
          - QoderCLI
          - Kiro
          - Kimi
          - Gemini
          - DeepAgents
          - Codebuddy
    supportedProvidersNote: OpenCode puede cargar el catálogo compartido de OmniRoute en los valores predeterminados del modelo hero y, al mismo tiempo, mantener editables los identificadores de modelo sin procesar para flujos específicos por rama.
  interesting:
    badge: DIVERTIDO
    title: Divertido
    subtitle: Hero Dungeon hace que la colaboración y la práctica en el campus cobren vida
    features:
      dungeons:
        label: Hero Dungeons
        desc: Convierte la generación, la ejecución y los bancos de prompts en recorridos de mazmorra
      captains:
        label: Lista de capitanes
        desc: Asigna el capitán hero adecuado a cada mazmorra
      battle:
        label: Informes de batalla
        desc: Revisa XP, niveles y resultados de ejecución después de cada push
    description: La diversión ya no depende solo de los logros. Hero Dungeon, la lista de capitanes, los visuales de prompts y los informes de batalla convierten la práctica diaria de coding con IA en una aventura coordinada para laboratorios y equipos estudiantiles.
    dungeonCards:
      proposal:
        title: Mazmorra de propuestas
        desc: OpenSpec generate / apply / archive
        status: Capitán listo
      autotask:
        title: Mazmorra AutoTask
        desc: Arreglos en paralelo y automatización por lotes
        status: 2 instancias activas
      prompt:
        title: Mazmorra de prompts
        desc: Vista previa de prompts y banco de estilo
        status: Sincronización visual lista
    roster:
      title: Lista actual de capitanes
      heroes:
        strategist:
          name: Spec Strategist
          role: Capitán de propuestas
        runner:
          name: Patch Runner
          role: Capitán de ejecución
        artist:
          name: Prompt Artist
          role: Soporte visual
    battleReport:
      title: Informe de mazmorra de hoy
      badge: Hero Battle
      metrics:
        dungeons:
          value: '4'
          label: Mazmorras impulsadas
        level:
          value: Lv.27
          label: Nivel del capitán
        xp:
          value: 12.8M
          label: XP de hoy
      note: Cuando varias mazmorras avanzan en paralelo, este informe resume experiencia, niveles y resultados de ejecución en una sola lectura.
    gallery:
      dungeons:
        title: Carrusel del mapa de mazmorras
        subtitle: 10 visuales aleatorios de la colección actual de mapas de mazmorras y prompts del frontend.
      heroes:
        title: Carrusel de la galería de héroes
        subtitle: 10 visuales aleatorios de la colección actual de héroes del frontend.
