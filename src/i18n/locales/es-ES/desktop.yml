desktop:
  title: Hagicode Desktop - Descarga
  description: Descarga Hagicode Desktop, el asistente de código con IA localizado. Compatible con Windows, macOS y Linux, con privacidad protegida y respuesta rápida.
  features:
    title: Funciones principales
    local:
      title: Ejecución local
      description: Todos los datos se procesan localmente sin subirse a la nube, garantizando la privacidad y la seguridad del código
    privacy:
      title: Protección de la privacidad
      description: El código nunca se sube, admite uso sin conexión y protege tu propiedad intelectual
    fast:
      title: Respuesta rápida
      description: Tiempo de respuesta a nivel de milisegundos, sin esperas por red, para mejorar la eficiencia de desarrollo
    crossPlatform:
      title: Compatibilidad multiplataforma
      description: Compatible con Windows, macOS y Linux para adaptarse a distintos entornos de desarrollo
    autoUpdate:
      title: Actualizaciones automáticas
      description: Comprueba actualizaciones automáticamente y permite actualizar a la versión más reciente con un clic
    multiLanguage:
      title: Soporte multilingüe
      description: Interfaz integrada en chino e inglés, adecuada para la colaboración de equipos internacionales
  systemRequirements:
    title: Requisitos del sistema
    windows: Windows
    macos: macOS
    linux: Linux
    os: Sistema operativo
    processor: Procesador
    memory: Memoria
    diskSpace: Espacio en disco
    network: Red
    windowsOs: Windows 10/11 (64-bit)
    macosOs: macOS 12+ (Monterey o superior)
    linuxOs: Ubuntu 20.04+ / Debian 11+ / otras distribuciones principales
    windowsProcessor: Intel Core i3 o procesador equivalente
    macosProcessor: Apple Silicon (M1/M2/M3) o Intel Core i3+
    linuxProcessor: Intel Core i3 o procesador equivalente
    memoryRec: 4GB RAM (8GB recomendados)
    disk: 2GB de espacio disponible
    networkDesc: Se requiere conexión de red para la descarga inicial (después puede usarse sin conexión)
  download:
    title: Paquetes de descarga
    windowsDesc: Instaladores estables para Windows 10/11, con versión de instalación y versión portable.
    macosDesc: Builds nativas para Apple Silicon y para Mac Intel.
    linuxDesc: Paquetes AppImage y comprimidos para las principales distribuciones Linux x64 y ARM64.
    note: Si aquí no se puede cargar la lista de paquetes, usa el enlace al historial de versiones de la parte superior de la página para abrir el índice oficial.
    features:
      signed: Paquetes firmados
      autoUpdate: Detección automática de actualizaciones
      multiLanguage: Interfaz multilingüe
  installation:
    title: Instalación rápida
    step1:
      number: '1'
      title: Descargar el instalador
      description: Selecciona el instalador adecuado para tu sistema operativo
    step2:
      number: '2'
      title: Ejecutar el instalador
      description: Haz doble clic en el instalador descargado y sigue las indicaciones para completar la instalación
    step3:
      number: '3'
      title: Iniciar la app
      description: En el primer arranque se te guiará por la configuración inicial
    step4:
      number: '4'
      title: Empezar a usarla
      description: Cuando termine la configuración, ya podrás usar Hagicode Desktop
  faq:
    title: Preguntas frecuentes
    q1:
      question: ¿Cuál es la diferencia entre las versiones Desktop y Server?
      intro: 'Hagicode ofrece dos opciones de despliegue: la versión Desktop y la versión Server. Cada una tiene sus ventajas, pero ambas adoptan un enfoque en el que el usuario controla su servidor y sus datos, ofreciendo mejor protección.'
      desktopTitle: Versión Desktop
      desktop1: Se ejecuta localmente en tu equipo y es más ligera
      desktop2: No requiere configuración de servidor, lista para usar
      desktop3: Adecuada para desarrolladores individuales y escenarios de uso ligeros
      desktop4: Todos los datos permanecen completamente localizados
      serverTitle: Versión Server
      server1: Puede desplegarse en servidores remotos
      server2: Admite acceso remoto multiusuario
      server3: Está mejor preparada para colaboración en equipo y escalado
      server4: Deja el camino preparado para futuras funciones empresariales y sincronización multidispositivo
      conclusion: Elijas la versión que elijas, mantendrás el control total de tu servidor y tus datos, con mejor privacidad y seguridad.
    q2:
      question: ¿Qué debo hacer después de la instalación?
      intro: 'Hagicode Desktop es, en esencia, un lanzador. En el primer inicio tras instalarlo, te guiará por estos pasos:'
      step1: '<strong>Descargar Hagicode Core:</strong> Desktop detectará automáticamente que faltan los componentes principales y te pedirá descargarlos'
      step2: '<strong>Instalar los componentes principales:</strong> Sigue las indicaciones en pantalla para completar su instalación'
      step3: '<strong>Configurar tu Agent CLI predeterminado:</strong> Elige un Agent CLI actualmente compatible y completa los pasos necesarios de inicio de sesión, autorización o instalación local.'
      note: La interfaz de Desktop guía todo el proceso. Mantén la red disponible en el primer arranque para que Hagicode Core pueda descargarse; algunos Agent CLI siguen requiriendo instalación o autenticación manual, pero aun así forman parte del soporte actual.
      done: Cuando termines estos pasos, podrás usar con normalidad todas las funciones de Hagicode Desktop.
    q3:
      question: ¿Cómo compruebo las actualizaciones?
      answer: Desktop comprueba las actualizaciones automáticamente. Cuando haya una nueva versión disponible, aparecerá un aviso en la esquina superior derecha de la interfaz. También puedes comprobarlas manualmente en "Configuración".
    q4:
      question: ¿Qué AI Agent CLI son compatibles?
      intro: 'Hagicode Desktop ofrece soporte activo actualmente para los siguientes Agent CLI:'
      active: '<strong>Compatibles actualmente:</strong> Claude Code, Codex, GitHub Copilot, OpenCode, Hermes, QoderCLI, Kiro, Kimi, Gemini, DeepAgents y Codebuddy'
      manual: '<strong>Instalación o autenticación manual:</strong> Hermes, Gemini y DeepAgents requieren primero una instalación local o un paso de autenticación; los demás CLI ofrecen acceso de instalación en un clic o flujos guiados.'
      legacy: '<strong>Solo compatibilidad heredada:</strong> IFlowCli se mantiene únicamente para compatibilidad con datos antiguos y ya no forma parte del alcance activo actual.'
      closing: El alcance del soporte y el modo de configuración son asuntos distintos. Que un CLI necesite instalación manual no significa que no esté soportado.
    q5:
      question: ¿Se puede usar sin conexión?
      intro: 'Sí. Hagicode Desktop admite un uso completamente sin conexión:'
      point1: Se necesita red para la instalación y la configuración iniciales (descarga de componentes principales y modelos de IA)
      point2: Después de la configuración, todas las funciones pueden usarse sin conexión
      point3: Tu código y tus datos nunca se suben a la nube
      point4: Todo el procesamiento de IA se realiza localmente
    q6:
      question: macOS dice que Hagicode.app está dañada o que no se puede abrir. ¿Qué debo hacer?
      intro: Si Hagicode Desktop está instalado en la ruta predeterminada /Applications/Hagicode.app y macOS Gatekeeper bloquea el primer arranque, usa el siguiente comando para quitar el atributo de cuarentena de la app.
      cause: Esto ocurre porque macOS añade el atributo com.apple.quarantine a las apps descargadas de Internet. Es un mecanismo de aislamiento de seguridad de macOS, no un fallo del instalador de Hagicode.
      command: sudo xattr -dr com.apple.quarantine /Applications/Hagicode.app
      note: Ejecuta el comando en Terminal con privilegios de administrador y vuelve a iniciar Hagicode Desktop.
    q7:
      question: ¿Cómo obtengo ayuda si tengo problemas?
      intro: 'Si encuentras problemas al usar Hagicode Desktop, puedes obtener ayuda por estas vías:'
      point1: '<strong>Grupo de soporte técnico:</strong> Únete al grupo QQ 610394020'
      point2: '<strong>Documentación en línea:</strong> Consulta la documentación completa y los tutoriales'
      point3: '<strong>GitHub Issues:</strong> Envía informes de incidencias en el repositorio del proyecto'
