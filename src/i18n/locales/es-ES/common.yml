showcase:
  title: "HagiCode en acción"
  description: "Diez áreas del producto, mostradas en la interfaz oscura en inglés con cinco temas oscuros: tablero de sesiones, propuestas, agentes, habilidades, vaults, consumo, logros, Git y planes programados."
  controls:
    previous: Anterior
    next: Siguiente
    current: Vista destacada
    railLabel: Navegacion de capturas del producto
    selectPrefix: 'Cambiar a: '
    activeState: Mostrando ahora
    previewState: Vista previa
    imageUnavailable: Imagen no disponible
    openFullscreen: 'Abrir en pantalla completa: '
    openFullscreenHint: Haz clic para ampliar
    zoomIn: "Ver a tamaño real"
    zoomOut: "Ajustar a la pantalla"
    closeFullscreen: Cerrar pantalla completa
  screenshots:
    sessionBoard:
      title: "Tablero de sesiones"
      description: "Propuestas, agentes en ejecución y trabajo archivado comparten un tablero, así que ves de un vistazo qué espera, qué se ejecuta y qué está terminado."
      alt: "Tablero de sesiones de HagiCode con los carriles Propuesta y revisión, Ejecución y Archivado junto al panel de acciones rápidas del proyecto"
    proposalWorkflow:
      title: "Flujo de propuestas"
      description: "Cada cambio empieza como propuesta: delta de especificación, tareas ordenadas y seguimiento de etapas que revisas antes de ejecutar código."
      alt: "Conversación de propuesta de HagiCode con tabla de delta de especificación, lista de tareas y seguimiento de etapas"
    agentRoster:
      title: "Plantilla de agentes"
      description: "Da a cada agente un avatar y un trabajo, agrupados por el Agent CLI que lo impulsa, y elige quién se encarga de la siguiente tarea."
      alt: "Espacio de Agentes de HagiCode con doce agentes agrupados por Claude Code, Codex, OpenCode, Gemini y Hermes"
    agentCli:
      title: "Gestión de Agent CLI"
      description: "Claude Code, Codex, GitHub Copilot, OpenCode y más aparecen juntos, con su versión y la comprobación de estado."
      alt: "Tabla de gestión de AgentCLI de HagiCode con la versión y el estado de cada Agent CLI compatible"
    skillsGallery:
      title: "Galería de habilidades"
      description: "Explora fuentes de habilidades de confianza, compara instalaciones y reconoce de un vistazo cuáles ya están en esta máquina."
      alt: "Galería de habilidades de HagiCode con fuente, número de instalaciones e insignia Instalada localmente"
    vault:
      title: "Vault"
      description: "Guarda manuales de equipo, contratos y referencias en vaults, y explora y previsualiza los archivos sin salir de la aplicación."
      alt: "Explorador de vaults de HagiCode con lista de vaults, árbol de archivos y vista previa en Markdown de una guía de revisión"
    tokenUsage:
      title: "Consumo de tokens"
      description: "Los tokens y el coste de hoy viven en la barra de estado, y una escalera de niveles marca lo intenso que ha sido el día."
      alt: "Barra de estado de HagiCode con el total de tokens y el coste de hoy, y una ventana con los niveles de Breath a Radiance"
    achievements:
      title: "Sala de logros"
      description: "Objetivos diarios, crecimiento en línea y rachas acumuladas hacen visible el progreso constante."
      alt: "Sala de logros de HagiCode con la tasa de finalización diaria, el botín de hoy y el carril de crecimiento en línea"
    gitManagement:
      title: "Gestión de Git"
      description: "Revisa rama, sincronización y cambios sin confirmar de todos los repositorios de un proyecto, y confirma, empuja o trae desde un solo panel."
      alt: "Pestaña Git de un proyecto de HagiCode con cuatro repositorios, su rama, estado de sincronización y resumen"
    scheduledPlans:
      title: "Planes programados"
      description: "Lanza propuestas y HagiTasks desde un calendario: auditorías nocturnas, borradores semanales y preparación puntual de versiones."
      alt: "Calendario de planes programados de HagiCode en octubre con planes nocturnos, semanales y puntuales"
