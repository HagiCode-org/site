      title: Resumen de ejecucion de propuestas
      description: Mantiene la etapa del flujo, el resultado de la ejecucion y el contexto de la sesion en una sola pantalla para que el equipo vea exactamente en que punto esta un cambio antes de avanzar.
      alt: Captura de HagiCode de ejecucion de propuestas que muestra etapas del flujo, resultado de la ejecucion y barra lateral de la sesion
    sessionBoard:
      title: Tablero de sesiones y planificacion de dungeon
      description: Las sesiones pendientes, en curso y archivadas permanecen visibles junto a un panel de tareas de fantasia para que el trabajo paralelo de agentes se pueda revisar de un vistazo.
      alt: Captura del tablero de sesiones de HagiCode que muestra columnas de pendientes, en curso y archivadas junto a un panel de tareas de fantasia
    tokenAnalytics:
      title: Analisis de tokens en tiempo real
      description: Supervisa el rendimiento, la actividad reciente de la API y el uso total en una sola superficie de metricas para mantener bajo control el coste y el ritmo durante la ejecucion paralela.
      alt: Captura del analisis de tokens de HagiCode que muestra rendimiento, actividad reciente de la API y uso total
    workspaceManagement:
      title: Gestion del espacio de trabajo y de vaults
      description: Gestiona los vaults de usuario, los vaults del sistema y los accesos a code-server desde una unica consola pensada para entornos compartidos y mantenimiento rapido.
      alt: Captura de gestion del espacio de trabajo de HagiCode que muestra vaults de usuario, vaults del sistema y acciones de code-server
    achievementProgress:
      title: Progreso de logros y crecimiento
      description: El progreso diario, el crecimiento global y las metricas del ciclo de vida se reunen en un solo panel para que la adopcion a largo plazo resulte medible y no abstracta.
      alt: Captura del panel de logros de HagiCode que muestra progreso diario, crecimiento global y metricas del ciclo de vida
