container:
  title: Hagicode Container - Implementare Container
  description: Implementați Hagicode via Docker Compose Builder. Configurație simplă, gata de utilizare. Suportă surse multiple de imagini și actualizări automate.
  hero:
    badge: Container
    title: Hagicode Container
    tagline: Implementați rapid cu Docker Compose Builder, configurație simplă, gata de utilizare
    value1: Configurație vizuală, fără programare necesară
    value2: Izolare mediu, securitate date
    value3: Implementare cu un click, pornire rapidă
    ctaButton: Implementați cu Docker Compose Builder
    features:
      isolation: Izolare Mediu
      oneClick: Implementare cu Un Click
      fastStart: Pornire Rapidă
  features:
    title: De Ce Să Alegeți Implementarea prin Container?
    isolation:
      title: Izolare Mediu
      description: Implementarea containerizată evită conflictele de dependențe, nu afectează mediul sistemului, menține sistemul curat
    simple:
      title: Configurație Simplă
      description: Folosiți Docker Compose Builder pentru configurație vizuală, fără a scrie scripturi complexe
    crossPlatform:
      title: Suport Multiplataformă
      description: Suportă arhitectura x86_64, potrivită pentru diverse servere și platforme cloud
    persistent:
      title: Persistență Date
      description: Suportă montare Volume, date sigure și fiabile, fără pierderi de date la repornirea containerului
    autoUpdate:
      title: Actualizări Automate
      description: Suportă watchtower pentru actualizări automate, obțineți ușor cea mai recentă versiune
    productionReady:
      title: Gata pentru Producție
      description: Proiectat pentru medii de producție, suportă disponibilitate ridicată și scalare orizontală
  builder:
    title: Docker Compose Builder
    subtitle: Cea mai simplă și recomandată metodă de implementare prin container
    visual:
      title: Configurație Vizuală
      description: Configurați toți parametrii printr-o interfață Web prietenoasă, fără a edita manual fișiere YAML
    generate:
      title: Generare Configurație cu Un Click
      description: Generează automat fișiere docker-compose.yml complete cu configurații de bune practici
    deploy:
      title: Implementare Rapidă
      description: Descărcați fișiere de configurație cu un click și porniți serviciile, completați implementarea în minute
    secure:
      title: Sigur și Fiabil
      description: Bune practici de securitate integrate, configurează automat volume de date și politici de repornire
    ctaButton: Mergeți la Docker Compose Builder
  mirrors:
    title: Selecție Sursă Imagine
    description: Alegeți sursa de imagine cea mai potrivită în funcție de mediul de rețea și locația dumneavoastră
    dockerHub: Docker Hub
    dockerHubDesc: Cel mai mare registru de imagini de containere din lume, potrivit pentru utilizatorii de rețele internaționale
    dockerHubCmd: newbe36524/hagicode:0
    azure: Azure ACR
    azureDesc: Serviciul de imagini Microsoft Azure, acces mai rapid din China
    azureCmd: hagicode.azurecr.io/hagicode:0
    aliyun: Aliyun ACR
    aliyunDesc: Accelerare imagine internă Aliyun, recomandată pentru utilizatorii din China continentală
    aliyunCmd: registry.cn-hangzhou.aliyuncs.com/hagicode/hagicode:0
  faq:
    title: Întrebări Frecvente
    q1:
      question: Care este diferența dintre versiunile Container și Desktop?
      intro: 'Ambele versiuni au avantajele lor. Puteți alege în funcție de scenariul de utilizare:'
      desktopTitle: Versiunea Desktop
      desktop1: Rulează local pe calculator, mai ușoară
      desktop2: Nu necesită configurare server, gata de utilizare imediat
      desktop3: Potrivită pentru dezvoltatori individuali și scenarii de utilizare ușoară
      desktop4: Toate datele complet localizate
      containerTitle: Versiunea Container
      container1: Poate fi implementată pe servere, suportă acces de la distanță
      container2: Izolare mediu, nu afectează mediul sistemului
      container3: Mai potrivită pentru colaborare în echipă și medii de producție
      container4: Suportă implementare automatizată și scalare orizontală
    q2:
      question: Ce este Docker Compose Builder?
      intro: 'Docker Compose Builder este instrumentul nostru de configurație vizuală care vă ajută să:'
      point1: Configurați toți parametrii containerului printr-o interfață Web
      point2: Generați automat fișiere docker-compose.yml
      point3: Bune practici și configurații de securitate integrate
      point4: Descărcați și porniți serviciile cu un click
      note: Nu este necesar să scrieți manual configurații YAML complexe. Chiar și începătorii Docker pot implementa cu ușurință.
    q3:
      question: Ce arhitecturi de sistem suportă versiunea container?
      answer: 'Imaginile container Hagicode suportă în prezent arhitectura <strong>x86_64 (amd64)</strong>, potrivită pentru majoritatea serverelor și PC-urilor.'
      note: Docker va selecta automat arhitectura potrivită pentru sistemul dumneavoastră la tragerea imaginilor.
    q4:
      question: Cum se actualizează containerul?
      intro: 'Când folosiți implementarea Docker Compose, actualizarea este foarte simplă:'
      code: |-
        docker-compose pull
        docker-compose up -d
      watchtower: Sau folosiți Watchtower pentru actualizări automate.
    q5:
      question: Cum se configurează persistența datelor?
      intro: 'Docker Compose Builder configurează automat volumele de date. În mod implicit, datele dumneavoastră vor fi stocate în Docker Volumes, asigurând:'
      point1: Datele nu se pierd când containerele sunt șterse
      point2: Datele sunt păstrate în timpul actualizărilor containerelor
      point3: Copie de rezervă și recuperare ușoare
    q6:
      question: Ce să faceți dacă pornirea containerului eșuează?
      intro: 'Pași pentru depanarea eșecului la pornirea containerului:'
      step1:
        title: 'Verificați starea containerului:'
        code: docker-compose ps
      step2:
        title: 'Verificați jurnalele containerului:'
        code: docker-compose logs hagicode
      step3:
        title: 'Verificați ocuparea portului:'
        desc: 'Dacă portul serviciului dumneavoastră este 3000, folosiți această comandă pentru verificare:'
        code: netstat -tlnp | grep 3000
        solution: 'Dacă portul este ocupat, puteți:'
        solution1: Opri procesul care ocupă portul
        solution2: Sau configurați un port diferit în Docker Compose Builder
      help: Dacă problema persistă, verificați documentația detaliată sau contactați suportul tehnic.
  cta:
    title: Începeți Să Folosiți Docker Compose Builder
    subtitle: Cea mai simplă și recomandată metodă de implementare prin container
    button: Mergeți la Ghidul de Implementare
    github: Repository GitHub
