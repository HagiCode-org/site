desktop:
  title: Hagicode Desktop - Descărcare
  description: Descărcați Hagicode Desktop, un asistent cod AI localizat. Suportă Windows, macOS și Linux. Protecția confidențialității, răspuns rapid.
  features:
    title: Funcționalități Principale
    local:
      title: Execuție Locală
      description: Toate datele sunt procesate local fără a fi încărcate în cloud, asigurând confidențialitatea și securitatea codului
    privacy:
      title: Protecția Confidențialității
      description: Codul nu este niciodată încărcat, suportă utilizare offline, protejând proprietatea dumneavoastră intelectuală
    fast:
      title: Răspuns Rapid
      description: Timp de răspuns la nivel de milisecunde, fără necesitatea de cereri de rețea, sporind eficiența dezvoltării
    crossPlatform:
      title: Suport Multiplataformă
      description: Suportă Windows, macOS și Linux pentru a satisface diferite nevoi de mediu de dezvoltare
    autoUpdate:
      title: Actualizări Automate
      description: Verifică automat actualizările și actualizează la cea mai recentă versiune cu un click
    multiLanguage:
      title: Suport Multi-limbă
      description: Interfață integrată în chineză și engleză, susținând colaborarea în echipe internaționale
  systemRequirements:
    title: Cerințe de Sistem
    windows: Windows
    macos: macOS
    linux: Linux
    os: Sistem de Operare
    processor: Procesor
    memory: Memorie
    diskSpace: Spațiu pe Disc
    network: Rețea
    windowsOs: Windows 10/11 (64-bit)
    macosOs: macOS 12+ (Monterey sau superior)
    linuxOs: Ubuntu 20.04+ / Debian 11+ / Alte distribuții mainstream
    windowsProcessor: Intel Core i3 sau procesor echivalent
    macosProcessor: Apple Silicon (M1/M2/M3) sau Intel Core i3+
    linuxProcessor: Intel Core i3 sau procesor echivalent
    memoryRec: 4GB RAM (8GB recomandat)
    disk: 2GB spațiu disponibil
    networkDesc: Conexiune de rețea necesară pentru descărcarea inițială (poate fi folosit offline ulterior)
  download:
    title: Pachete de Descărcare
    windowsDesc: Instalatoare stabile pentru Windows 10/11, inclusiv versiuni de instalare și portabile.
    macosDesc: Versiuni native pentru Mac-uri Apple Silicon și Intel.
    linuxDesc: Pachete AppImage și tarball pentru distribuții Linux mainstream x64 și ARM64.
    note: Dacă lista de pachete de aici nu se încarcă, folosiți linkul istoricului de versiuni din zona hero pentru a accesa indexul canonic.
    features:
      signed: Pachete semnate
      autoUpdate: Detecție automată a actualizărilor
      multiLanguage: Interfață multi-limbă
  installation:
    title: Instalare Rapidă
    step1:
      number: '1'
      title: Descărcați Instalatorul
      description: Selectați instalatorul potrivit pentru sistemul de operare
    step2:
      number: '2'
      title: Rulați Instalatorul
      description: Faceți dublu click pe instalatorul descărcat și urmați instrucțiunile pentru a finaliza instalarea
    step3:
      number: '3'
      title: Lansați Aplicația
      description: La prima lansare, vă va ghida prin configurația inițială
    step4:
      number: '4'
      title: Începeți Să Folosiți
      description: După configurare, puteți începe să folosiți Hagicode Desktop
  faq:
    title: Întrebări Frecvente
    q1:
      question: Care este diferența dintre versiunile Desktop și Server?
      intro: 'Hagicode oferă două opțiuni de implementare: versiunea Desktop și versiunea Server. Fiecare are avantajele sale, dar ambele adoptă o abordare cu server și date controlate de utilizator, oferind o mai bună protecție a datelor.'
      desktopTitle: Versiunea Desktop
      desktop1: Rulează local pe calculatorul dumneavoastră, mai ușoară
      desktop2: Nu necesită configurare server, gata de utilizare imediat
      desktop3: Potrivită pentru dezvoltatori individuali și scenarii de utilizare ușoară
      desktop4: Toate datele complet localizate
      serverTitle: Versiunea Server
      server1: Poate fi implementată pe servere la distanță
      server2: Suportă acces de la distanță pentru mai mulți utilizatori
      server3: Mai potrivită pentru colaborare în echipă și scalare
      server4: Pregătește pentru viitoare funcționalități enterprise și sincronizare multi-dispozitiv
      conclusion: Indiferent de versiunea pe care o alegeți, aveți control complet asupra serverului și datelor dumneavoastră, beneficiind de o mai bună protecție a confidențialității și securitate a datelor.
    q2:
      question: Ce trebuie să fac după instalare?
      intro: 'Hagicode Desktop este în esență un launcher. La prima lansare după instalare, vă va ghida prin acești pași:'
      step1: '<strong>Descărcați Hagicode Core:</strong> Desktop-ul va detecta automat și vă va solicita să descărcați componentele principale Hagicode'
      step2: '<strong>Instalați Componentele Principale:</strong> Urmați instrucțiunile de pe ecran pentru a finaliza instalarea componentelor principale'
      step3: '<strong>Configurați Agent CLI implicit:</strong> Alegeți un Agent CLI actualmente suportat și finalizați pașii necesari de autentificare, autorizare sau instalare locală.'
      note: Interfața Desktop ghidează întregul flux. Mențineți rețeaua disponibilă la prima lansare pentru ca Hagicode Core să poată fi descărcat; unele Agent CLI necesită încă instalare manuală sau autentificare, dar fac încă parte din actualul suport.
      done: După finalizarea acestor pași, puteți folosi toate funcționalitățile Hagicode Desktop în mod normal.
    q3:
      question: Cum verific actualizările?
      answer: Desktop-ul verifică automat actualizările. Când o nouă versiune este disponibilă, o notificare va apărea în colțul din dreapta sus al interfeței. De asemenea, puteți verifica manual actualizările în "Setări".
    q4:
      question: Ce Agent CLI-uri AI sunt suportate?
      intro: 'Hagicode Desktop suportă în prezent următoarele Agent CLI-uri:'
      active: '<strong>Actualmente suportate:</strong> Claude Code, Codex, GitHub Copilot, OpenCode, Hermes, QoderCLI, Kiro, Kimi, Gemini, DeepAgents și Codebuddy'
      manual: '<strong>Instalare manuală sau autentificare:</strong> Hermes, Gemini și DeepAgents necesită mai întâi o instalare locală sau un pas de autentificare; celelalte CLI-uri oferă puncte de intrare de instalare cu un click sau fluxuri de instalare ghidate.'
      legacy: '<strong>Doar compatibilitate legacy:</strong> IFlowCli rămâne doar pentru compatibilitatea datelor istorice și nu face parte din actualul suport activ.'
      closing: Domeniul de suport și modul de configurare sunt preocupări separate. Un CLI care necesită instalare manuală este încă suportat acum.
    q5:
      question: Suportă utilizare offline?
      intro: 'Da! Hagicode Desktop suportă utilizare offline completă:'
      point1: Conexiune de rețea necesară pentru instalarea și configurarea inițială (descărcarea componentelor principale și modelelor AI)
      point2: Toate funcționalitățile pot fi folosite offline după configurare
      point3: Codul și datele dumneavoastră nu sunt niciodată încărcate în cloud
      point4: Tot procesarea AI este finalizată local
    q6:
      question: macOS spune că Hagicode.app este deteriorat sau nu poate fi deschis. Ce trebuie să fac?
      intro: Dacă Hagicode Desktop este instalat în calea implicită /Applications/Hagicode.app și macOS Gatekeeper blochează prima lansare, folosiți următoarea comandă pentru a elimina atributul de carantină al aplicației.
      cause: Acest lucru se întâmplă deoarece macOS adaugă atributul com.apple.quarantine aplicațiilor descărcate de pe internet. Este o problemă de izolare de securitate macOS, nu o defecțiune a instalatorului Hagicode.
      command: sudo xattr -dr com.apple.quarantine /Applications/Hagicode.app
      note: Rulați comanda în Terminal cu privilegii de administrator, apoi relansați Hagicode Desktop.
    q7:
      question: Cum obțineți ajutor când întâmpinați probleme?
      intro: 'Dacă întâmpinați probleme în timpul utilizării Hagicode Desktop, puteți obține ajutor prin:'
      point1: '<strong>Grup de Suport Tehnic:</strong> Alăturați-vă Grupului QQ 610394020'
      point2: '<strong>Documentație Online:</strong> Consultați documentația completă de utilizare și tutorialele'
      point3: '<strong>GitHub Issues:</strong> Trimiteți rapoarte de probleme în repository-ul proiectului'
