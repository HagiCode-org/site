    previous: Anterior
    next: Următor
    current: Vizualizare prezentată
    railLabel: Navigare capturi de ecran produs
    selectPrefix: 'Comută la: '
    activeState: Se afișează acum
    previewState: Previzualizare
    imageUnavailable: Imagine indisponibilă
    openFullscreen: 'Deschide ecran complet: '
    openFullscreenHint: Click pentru a mări
    closeFullscreen: Închide ecran complet
  screenshots:
    proposalWorkflow:
      title: Prezentare generală execuție propuneri
      description: Păstrează stadiul fluxului de lucru, rezultatul execuției și contextul sesiunii pe un singur ecran astfel încât echipele să vadă exact unde se află o modificare înainte de a continua.
      alt: Captură de ecran execuție propuneri HagiCode afișând stadiile fluxului de lucru, rezultatul execuției și bara laterală a sesiunii
    sessionBoard:
      title: Panou de sesiuni și planificare dungeon
      description: Sesiunile în așteptare, în desfășurare și arhivate rămân vizibile lângă un panou de sarcini fantasy astfel încât munca paralelă a agenților este ușor de scanat dintr-o privire.
      alt: Captură de ecran panou sesiuni HagiCode afișând coloane în așteptare, în desfășurare și arhivate lângă un panou de sarcini fantasy
    tokenAnalytics:
      title: Analiză token-uri în timp real
      description: Urmărește debitul, activitatea recentă API și utilizarea totală pe o suprafață de metrici astfel încât costul și ritmul rămân controlabile în timpul execuției paralele.
      alt: Captură de ecran analiză token-uri HagiCode afișând debitul, activitatea recentă API și utilizarea totală
    workspaceManagement:
      title: Gestionare spații de lucru și seifuri
      description: Gestionează seifuri utilizator, seifuri sistem și puncte de intrare code-server de pe o suprafață de control construită pentru medii partajate și mentenanță rapidă.
      alt: Captură de ecran gestionare spații de lucru HagiCode afișând seifuri utilizator, seifuri sistem și acțiuni code-server
    achievementProgress:
      title: Progresul realizărilor și creșterii
      description: Progresul zilnic, creșterea globală și metricile de ciclu de viață se adună într-un singur dashboard astfel încât adoptarea pe termen lung se simte măsurabilă în loc de abstractă.
      alt: Captură de ecran dashboard realizări HagiCode afișând progresul zilnic, creșterea globală și metricile de ciclu de viață
