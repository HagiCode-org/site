showcase:
  title: Cele Mai Recente Vizualizări ale Produsului
  description: De la execuția propunerilor și panouri de sesiuni până la analiza token-urilor, gestionarea spațiilor de lucru și progresul realizărilor, pagina principală folosește acum cele mai recente capturi de ecran curate menținute cu site-ul de documentație.
