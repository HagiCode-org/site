      archive:
        label: Arhivă
        desc: Arhivare cunoștințe
    paused: În Pauză - Click pe nod pentru a schimba
  convenient:
    badge: EFICIENT
    title: Eficient
    subtitle: Execuție multi-agent, multi-instanță care menține cota în mișcare
    traditional: Agent unic tradițional / instanță unică
    multiThread: Matrice paralelă multi-agent
    boost: Creștere Debit
    boostValue: 10x+ paralel
    description: Agent CLI-urile actualmente suportate precum Claude Code, Codex, GitHub Copilot, OpenCode și Hermes pot lucra pe mai multe instanțe în același timp, astfel încât propunerile, corecțiile și revizuirile avansează în paralel în loc să aștepte într-o coadă serială.
    agentMatrix:
      title: Matrice de execuție paralelă
      badge: Agenți multipli / instanțe multiple
      status: Agenți multipli conduc instanțe multiple chiar acum
      agents:
        claude:
          name: Claude Code
          role: Propunere / revizuire
          instances:
            - Schiță spec
            - Verificare design
            - Revizuire arhivă
        codex:
          name: Codex
          role: Implementare / corecții
          instances:
            - Construiește funcționalitatea A
            - Construiește funcționalitatea B
            - Corecție regresie
        router:
          name: Qwen · GLM
          role: Analiză / suport
          instances:
            - Urmărește problema
            - Rafinează text
            - Capturează insight-uri
      supportedNames:
        title: 11 Agent CLI-uri actualmente suportate
        names:
          - Claude Code
          - Codex
          - GitHub Copilot
          - OpenCode
          - Hermes
          - QoderCLI
          - Kiro
          - Kimi
          - Gemini
          - DeepAgents
          - Codebuddy
    supportedProvidersNote: OpenCode poate încărca catalogul partajat OmniRoute în valorile implicite ale modelelor erou menținând identificatorii de modele brute personalizate editabili pentru fluxuri de lucru specifice branch-ului.
  interesting:
    badge: INTERESANT
    title: Distractiv
    subtitle: Hero Dungeon face colaborarea și practica pe campus mai animate
    features:
      dungeons:
        label: Hero Dungeons
        desc: Transformă generarea, execuția și workbenches-urile de prompt-uri în dungeon runs
      captains:
        label: Listă Căpitani
        desc: Asignează căpitanul erou potrivit fiecărui dungeon
      battle:
        label: Rapoarte de Bătălie
        desc: Revizuiește XP, niveluri și rezultate de execuție după fiecare push
    description: Distracția nu mai depinde de insigne de realizări. Hero Dungeon, liste de căpitani, vizualizări de prompt-uri și rapoarte de luptă transformă practica zilnică de codare AI într-un flux de lucru care seamănă mai mult cu o aventură coordonată pentru laboratoare de campus și echipe de studenți.
    dungeonCards:
      proposal:
        title: Dungeon Propuneri
        desc: OpenSpec generează / aplică / arhivează
        status: Căpitan pregătit
      autotask:
        title: Dungeon AutoTask
        desc: Corecții paralele și automatizare în lot
        status: 2 instanțe active
      prompt:
        title: Dungeon Prompt-uri
        desc: Previzualizare prompt-uri și workbench de stil
        status: Sincronizare vizuală pregătită
    roster:
      title: Lista actuală a căpitanilor
      heroes:
        strategist:
          name: Strategist Spec
          role: Căpitan propuneri
        runner:
          name: Patch Runner
          role: Căpitan execuție
        artist:
          name: Artist Prompt
          role: Suport vizual
    battleReport:
      title: Raportul dungeon-ului de azi
      badge: Bătălie Eroi
      metrics:
        dungeons:
          value: '4'
          label: Dungeon-uri finalizate
        level:
          value: Lv.27
          label: Nivel căpitan
        xp:
          value: 12.8M
          label: XP azi
      note: Când mai multe dungeon-uri avansează în paralel, raportul consolidează experiența, nivelurile și rezultatele execuției într-un singur rezumat.
    gallery:
      dungeons:
        title: Caruselul hărții dungeon-urilor
        subtitle: 10 vizualizări aleatorii din dungeon-ul frontend curent și colecția de hărți de prompt-uri.
      heroes:
        title: Caruselul galeriei eroilor
        subtitle: 10 vizualizări aleatorii de eroi din colecția frontend curentă de eroi.
