      title: Prezentare Generală Produs Hagicode pe YouTube
      description: Introducerea principală în limba engleză a fluxului de lucru Hagicode, stilului de execuție multi-agent și motivul pentru care produsul pare mai amplu decât o casetă de chat AI generică.
      ctaLabel: Deschide pe YouTube
