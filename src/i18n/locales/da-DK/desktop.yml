      number: '4'
      title: Begynd at bruge
      description: Efter konfiguration kan du begynde at bruge Hagicode Desktop
  faq:
    title: Ofte stillede spørgsmål
    q1:
      question: Hvad er forskellen mellem desktop- og serverversionerne?
      intro: 'Hagicode tilbyder to udrulningsmuligheder: desktopversion og serverversion. Hver har sine fordele, men begge benytter en brugerstyret server- og datatilgang, der giver bedre databeskyttelse.'
      desktopTitle: Desktopversion
      desktop1: Kører lokalt på din computer, mere letvægt
      desktop2: Ingen serverkonfiguration nødvendig, klar til brug med det samme
      desktop3: Egnet til individuelle udviklere og lette brugsscenarier
      desktop4: Alle data fuldstændig lokaliseret
      serverTitle: Serverversion
      server1: Kan udrulles på fjernservere
      server2: Understøtter flerbruger fjernadgang
      server3: Bedre egnet til teamsamarbejde og skalering
      server4: Forbereder fremtidige enterprise-funktioner og synkronisering på flere enheder
      conclusion: Uanset hvilken version du vælger, har du fuld kontrol over din server og data og nyder bedre privatlivsbeskyttelse og datasikkerhed.
    q2:
      question: Hvad skal jeg gøre efter installationen?
      intro: 'Hagicode Desktop er i bund og grund en launcher. Ved første start efter installationen vil den guide dig gennem disse trin:'
      step1: <strong>Download Hagicode Core:</strong> Desktop vil automatisk registrere og bede dig om at downloade Hagicode-kernekomponenter
      step2: <strong>Installer kernekomponenter:</strong> Følg vejledningen på skærmen for at fuldføre installationen af kernekomponenter
      step3: <strong>Konfigurer din standard Agent CLI:</strong> Vælg en aktuelt understøttet Agent CLI og fuldfør de nødvendige login-, autorisations- eller lokale installationstrin.
      note: Desktop-grænsefladen guider gennem hele forløbet. Hold netværket tilgængeligt ved første start, så Hagicode Core kan downloades; nogle Agent CLIs kræver stadig manuel installation eller godkendelse, men de er stadig en del af det nuværende supportområde.
      done: Når du har fuldført disse trin, kan du bruge alle Hagicode Desktop-funktioner normalt.
    q3:
      question: Hvordan tjekker jeg for opdateringer?
      answer: Desktop tjekker automatisk for opdateringer. Når en ny version er tilgængelig, vil en meddelelse vises i øverste højre hjørne af grænsefladen. Du kan også manuelt tjekke for opdateringer i "Indstillinger".
    q4:
      question: Hvilke AI Agent CLIs understøttes?
      intro: 'Hagicode Desktop understøtter i øjeblikket følgende Agent CLIs:'
      active: <strong>Aktuelt understøttede:</strong> Claude Code, Codex, GitHub Copilot, OpenCode, Hermes, QoderCLI, Kiro, Kimi, Gemini, DeepAgents og Codebuddy
      manual: <strong>Manuel installation eller godkendelse:</strong> Hermes, Gemini og DeepAgents kræver en lokal installation eller godkendelsestrin først; de andre CLIs tilbyder installationsindgange med ét klik eller guidede installationsforløb.
      legacy: <strong>Kun for bagudkompatibilitet:</strong> IFlowCli er kun til historisk datakompatibilitet og er ikke en del af det nuværende aktive supportområde.
      closing: Supportområde og opsætningstilstand er separate forhold. En CLI, der kræver manuel installation, understøttes stadig.
    q5:
      question: Understøttes offline brug?
      intro: 'Ja! Hagicode Desktop understøtter fuldstændig offline brug:'
      point1: Netværksforbindelse kræves til første installation og konfiguration (download af kernekomponenter og AI-modeller)
      point2: Alle funktioner kan bruges offline efter konfiguration
      point3: Din kode og data uploades aldrig til skyen
      point4: Al AI-behandling fuldføres lokalt
    q6:
      question: macOS siger, at Hagicode.app er beskadiget eller ikke kan åbnes. Hvad skal jeg gøre?
      intro: Hvis Hagicode Desktop er installeret i standardstien /Applications/Hagicode.app og macOS Gatekeeper blokerer den første start, skal du bruge følgende kommando til at fjerne karantæneattributten fra appen.
      cause: Dette sker, fordi macOS tilføjer com.apple.quarantine-attributten til apps, der er downloadet fra internettet. Det er et macOS-sikkerhedsisolationsproblem, ikke en fejl i Hagicode-installatøren.
      command: sudo xattr -dr com.apple.quarantine /Applications/Hagicode.app
      note: Kør kommandoen i Terminal med administratorrettigheder, og start derefter Hagicode Desktop igen.
    q7:
      question: Hvordan får jeg hjælp, når jeg støder på problemer?
      intro: 'Hvis du støder på problemer under brug af Hagicode Desktop, kan du få hjælp via:'
      point1: <strong>Teknisk supportgruppe:</strong> Deltag i QQ Gruppe 610394020
      point2: <strong>Online dokumentation:</strong> Se fuld brugsdokumentation og vejledninger
      point3: <strong>GitHub Issues:</strong> Indsend problemrapporter i projektets repositorium
