container:
  title: Hagicode Container - Containerudrulning
  description: Udrul Hagicode via Docker Compose Builder. Simpel konfiguration, klar til brug. Understøtter flere billedkilder og automatiske opdateringer.
  hero:
    badge: Container
    title: Hagicode Container
    tagline: Udrul hurtigt med Docker Compose Builder, simpel konfiguration, klar til brug
    value1: Visuel konfiguration, ingen kodning nødvendig
    value2: Miljøisolation, datasikkerhed
    value3: Udrulning med ét klik, hurtig opstart
    ctaButton: Udrul med Docker Compose Builder
    features:
      isolation: Miljøisolation
      oneClick: Udrulning med ét klik
      fastStart: Hurtig opstart
  features:
    title: Hvorfor vælge containerudrulning?
    isolation:
      title: Miljøisolation
      description: Containeriseret udrulning undgår afhængighedskonflikter, påvirker ikke systemmiljøet, holder systemet rent
    simple:
      title: Simpel konfiguration
      description: Brug Docker Compose Builder til visuel konfiguration, ingen grund til at skrive komplekse scripts
    crossPlatform:
      title: Tværplatform-understøttelse
      description: Understøtter x86_64-arkitektur, egnet til forskellige servere og cloud-platforme
    persistent:
      title: Datapersistens
      description: Understøtter Volume-montering, sikre og pålidelige data, intet datatab ved genstart af container
    autoUpdate:
      title: Automatiske opdateringer
      description: Understøtter watchtower til automatiske opdateringer, nemt at få den nyeste version
    productionReady:
      title: Produktionsklar
      description: Designet til produktionsmiljøer, understøtter høj tilgængelighed og horisontal skalering
  builder:
    title: Docker Compose Builder
    subtitle: Den enkleste og anbefalede metode til containerudrulning
    visual:
      title: Visuel konfiguration
      description: Konfigurer alle parametre gennem en brugervenlig webgrænseflade, ingen grund til manuelt at redigere YAML-filer
    generate:
      title: Generering af konfiguration med ét klik
      description: Generer automatisk komplette docker-compose.yml-filer med konfiguration baseret på bedste praksis
    deploy:
      title: Hurtig udrulning
      description: Download konfigurationsfiler og start tjenester med ét klik, gennemfør udrulning på minutter
    secure:
      title: Sikkert og pålideligt
      description: Indbygget bedste praksis for sikkerhed, konfigurerer automatisk datavolumes og genstartspolitikker
    ctaButton: Gå til Docker Compose Builder
  mirrors:
    title: Valg af billedkilde
    description: Vælg den mest egnede billedkilde baseret på dit netværksmiljø og placering
    dockerHub: Docker Hub
    dockerHubDesc: Verdens største containerbilledregister, egnet til brugere med internationalt netværk
    dockerHubCmd: newbe36524/hagicode:0
    azure: Azure ACR
    azureDesc: Microsoft Azures billedtjeneste, hurtigere adgang fra Kina
    azureCmd: hagicode.azurecr.io/hagicode:0
    aliyun: Aliyun ACR
    aliyunDesc: Aliyuns indenlandske billedacceleration, anbefalet til brugere i fastlands-Kina
    aliyunCmd: registry.cn-hangzhou.aliyuncs.com/hagicode/hagicode:0
  faq:
    title: Ofte stillede spørgsmål
    q1:
      question: Hvad er forskellen mellem container- og desktopversionerne?
      intro: 'Begge versioner har deres fordele. Du kan vælge baseret på dit brugsscenarie:'
      desktopTitle: Desktopversion
      desktop1: Kører lokalt på din computer, mere letvægt
      desktop2: Ingen serverkonfiguration nødvendig, klar til brug med det samme
      desktop3: Egnet til individuelle udviklere og lette brugsscenarier
      desktop4: Alle data fuldstændig lokaliseret
      containerTitle: Containerversion
      container1: Kan udrulles på servere, understøtter fjernadgang
      container2: Miljøisolation, påvirker ikke systemmiljøet
      container3: Bedre egnet til teamsamarbejde og produktionsmiljøer
      container4: Understøtter automatiseret udrulning og horisontal skalering
    q2:
      question: Hvad er Docker Compose Builder?
      intro: 'Docker Compose Builder er vores visuelle konfigurationsværktøj, der hjælper dig med at:'
      point1: Konfigurere alle containerparametre gennem en webgrænseflade
      point2: Automatisk generere docker-compose.yml-filer
      point3: Indbygget bedste praksis og sikkerhedskonfigurationer
      point4: Download og start tjenester med ét klik
      note: Ingen grund til manuelt at skrive komplekse YAML-konfigurationer. Selv Docker-begyndere kan udrulle nemt.
    q3:
      question: Hvilke systemarkitekturer understøtter containerversionen?
      answer: Hagicode-containerbilleder understøtter i øjeblikket <strong>x86_64 (amd64)</strong>-arkitektur, egnet til de fleste servere og pc'er.
      note: Docker vil automatisk vælge den passende arkitektur til dit system ved trækning af billeder.
    q4:
      question: Hvordan opdaterer jeg containeren?
      intro: 'Når du bruger Docker Compose-udrulning, er opdatering meget simpel:'
      code: |-
        docker-compose pull
        docker-compose up -d
      watchtower: Eller brug Watchtower til automatiske opdateringer.
    q5:
      question: Hvordan konfigurerer jeg datapersistens?
      intro: 'Docker Compose Builder konfigurerer automatisk datavolumes. Som standard vil dine data blive gemt i Docker Volumes, hvilket sikrer:'
      point1: Data går ikke tabt, når containere slettes
      point2: Data bevares under containeropgraderinger
      point3: Nem backup og gendannelse
    q6:
      question: Hvad skal jeg gøre, hvis containeren ikke kan starte?
      intro: 'Trin til fejlfinding ved containeropstart:'
      step1:
        title: 'Tjek containerstatus:'
        code: docker-compose ps
      step2:
        title: 'Tjek containerlogs:'
        code: docker-compose logs hagicode
      step3:
        title: 'Tjek portbelægning:'
        desc: 'Hvis din serviceport er 3000, brug denne kommando til at tjekke:'
        code: netstat -tlnp | grep 3000
        solution: 'Hvis porten er belagt, kan du:'
        solution1: Stoppe processen, der belægger porten
        solution2: Eller konfigurere en anden port i Docker Compose Builder
      help: Hvis problemet fortsætter, skal du tjekke den detaljerede dokumentation eller kontakte teknisk support.
  cta:
    title: Begynd at bruge Docker Compose Builder
    subtitle: Den enkleste og anbefalede metode til containerudrulning
    button: Gå til udrulningsguide
    github: GitHub-repositorium
