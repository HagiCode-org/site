        title: 'Hagicode: Turbo Engine DLC'
        price: Steam
        description: Du kan købe dette DLC separat for at udvide den oprindelige grænse for forslagssamtidighed, låse op for kopiskift, tilføje fem avatar-pakker med 10 selvstændige avatarer i hver, aktivere upload af brugerdefinerede avatarer, tilpasse logo og titel øverst til venstre og tilpasse AI-genererede commit-meddelelser til dine egne Co-Authored-By-navngivningsregler. Vi vil normalt fremhæve en bundle-købmulighed kaldet Hagicode Plus, så den samlede købspris forbliver lavere. Tjek venligst vores butiksside for de seneste ændringer.
        bullets:
          - Understøtter brugerdefinerede logoer og titler øverst til venstre
          - Inkluderer fem avatar-pakker med 10 valgbare avatarer i hver pakke
          - Understøtter upload af brugerdefinerede avatarer
          - Lader teams tilpasse AI Co-Authored-By-signaturen for commit-arbejdsgange
          - Låser op for understøttelse af kopi- og formuleringskift
          - Udvider den maksimale grænse for samtidige forslag til 32
      hagicodePlus:
        category: Bundle
        title: Hagicode Plus
        price: Steam
        description: Den officielle Steam-bundle, der kombinerer Hagicode-basisudgaven med Turbo Engine DLC i én købsti.
        bullets:
          - Samler den primære Steam-udgave og Turbo Engine DLC sammen
          - Bevarer det højere 32-forslags samtidighedsopgradering knyttet til bundle-stien
          - Fungerer som den klareste købsindgang, når du vil have den fulde Steam-opsætning på én gang
      sponsor:
        category: Sponsor-DLC
        title: Hagicode - Sponsor Pack
        price: Steam
        description: Hvis du mener, at Hagicode er ægte fremragende, og du vil give direkte økonomisk støtte, giver køb af Sponsor Pack projektet mere brændstof og hjælper os med at holde det kørende på lang sigt.
