    openFullscreen: 'Åbn fuldskærm: '
    openFullscreenHint: Klik for at forstørre
    closeFullscreen: Luk fuldskærm
  screenshots:
    proposalWorkflow:
      title: Oversigt over forslagseksekvering
      description: Hold arbejdsgangsfasen, eksekveringsresultatet og sessionskonteksten på én skærm, så teams præcist kan se, hvor en ændring står, før de går videre.
      alt: Skærmbillede af HagiCode forslagseksekvering, der viser arbejdsgangsfaser, eksekveringsresultat og sessions-sidepanel
    sessionBoard:
      title: Sessionspanel og dungeon-planlægning
      description: Afventende, igangværende og arkiverede sessioner forbliver synlige ved siden af et fantasy-opgavepanel, så parallelt agent-arbejde er let at overskue ved et øjekast.
      alt: Skærmbillede af HagiCode sessionspanel, der viser afventende, igangværende og arkiverede kolonner ved siden af et fantasy-opgavepanel
    tokenAnalytics:
      title: Token-analyse i realtid
      description: Overvåg gennemstrømning, nylig API-aktivitet og samlet forbrug på én metrikflade, så omkostninger og tempo forbliver kontrollable under parallel eksekvering.
      alt: Skærmbillede af HagiCode token-analyse, der viser gennemstrømning, nylig API-aktivitet og samlet forbrug
    workspaceManagement:
      title: Styring af arbejdsområder og boks
      description: Administrer brugerbokse, systembokse og code-server-indgangspunkter fra én kontrolflade, bygget til delte miljøer og hurtig vedligeholdelse.
      alt: Skærmbillede af HagiCode arbejdsområdestyring, der viser brugerbokse, systembokse og code-server-handlinger
    achievementProgress:
      title: Fremgang for præstationer og vækst
      description: Daglig fremgang, global vækst og livscyklusmetrikker samles i ét dashboard, så langvarig adoption føles målelig frem for abstrakt.
      alt: Skærmbillede af HagiCode præstationsdashboard, der viser daglig fremgang, global vækst og livscyklusmetrikker
