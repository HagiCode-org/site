showcase:
  title: Seneste produktvisninger
  description: Fra forslagseksekvering og sessionspaneler til token-analyse, arbejdsområdestyring og fremgang i præstationer bruger hjemmesiden nu de seneste udvalgte skærmbilleder, der vedligeholdes sammen med dokumentationssitet.
  controls:
    previous: Forrige
    next: Næste
    current: Fremhævet visning
    railLabel: Navigation for produktskærmbilleder
    selectPrefix: 'Skift til: '
    activeState: Vises nu
