  faq:
    title: FAQ
    q1:
      question: What's the difference between Desktop and Server versions?
      intro: 'Hagicode offers two deployment options: Desktop version and Server version. Each has its advantages, but both adopt a user-controlled server and data approach, providing better data protection.'
      desktopTitle: Desktop Version
      desktop1: Runs locally on your computer, more lightweight
      desktop2: No server configuration needed, ready to use out of the box
      desktop3: Suitable for individual developers and light usage scenarios
      desktop4: All data completely localized
      serverTitle: Server Version
      server1: Can be deployed on remote servers
      server2: Supports multi-user remote access
      server3: Better suited for team collaboration and scaling
      server4: Prepares for future enterprise features and multi-device sync
      conclusion: Whichever version you choose, you have complete control over your server and data, enjoying better privacy protection and data security.
    q2:
      question: What do I need to do after installation?
      intro: 'Hagicode Desktop is essentially a launcher. On first launch after installation, it will guide you through these steps:'
      step1: <strong>Download Hagicode Core:</strong> Desktop will automatically detect and prompt you to download Hagicode core components
      step2: <strong>Install Core Components:</strong> Follow the on-screen prompts to complete core component installation
      step3: <strong>Configure your default Agent CLI:</strong> Choose a currently supported Agent CLI and finish the required sign-in, authorization, or local installation steps.
      note: The Desktop interface guides the whole flow. Keep the network available on first launch so Hagicode Core can download; some Agent CLIs still require manual installation or authentication, but they are still part of the current support range.
      done: After completing these steps, you can use all Hagicode Desktop features normally.
    q3:
      question: How do I check for updates?
      answer: Desktop automatically checks for updates. When a new version is available, a prompt will appear in the top right corner of the interface. You can also manually check for updates in "Settings".
    q4:
      question: Which AI Agent CLIs are supported?
      intro: 'Hagicode Desktop currently supports the following Agent CLIs:'
      active: <strong>Currently supported:</strong> Claude Code, Codex, GitHub Copilot, OpenCode, Hermes, QoderCLI, Kiro, Kimi, Gemini, DeepAgents, and Codebuddy
      manual: <strong>Manual installation or authentication:</strong> Hermes, Gemini, and DeepAgents require a local install or auth step first; the other CLIs provide one-click installation entry points or guided install flows.
      legacy: <strong>Legacy compatibility only:</strong> IFlowCli remains only for historical data compatibility and is not part of the current active support range.
      closing: Support scope and setup mode are separate concerns. A CLI that needs manual installation is still supported now.
    q5:
      question: Does it support offline usage?
      intro: 'Yes! Hagicode Desktop supports complete offline usage:'
      point1: Network connection required for initial installation and configuration (downloading core components and AI models)
      point2: All features can be used offline after configuration
      point3: Your code and data are never uploaded to the cloud
      point4: All AI processing is completed locally
    q6:
      question: macOS says Hagicode.app is damaged or can't be opened. What should I do?
      intro: If Hagicode Desktop is installed in the default path /Applications/Hagicode.app and macOS Gatekeeper blocks the first launch, use the following command to remove the quarantine attribute from the app.
      cause: This happens because macOS adds the com.apple.quarantine attribute to apps downloaded from the internet. It is a macOS security isolation issue, not a failure in the Hagicode installer.
      command: sudo xattr -dr com.apple.quarantine /Applications/Hagicode.app
      note: Run the command in Terminal with administrator privileges, then relaunch Hagicode Desktop.
    q7:
      question: How to get help when encountering issues?
      intro: 'If you encounter issues while using Hagicode Desktop, you can get help through:'
      point1: <strong>Technical Support Group:</strong> Join QQ Group 610394020
      point2: <strong>Online Documentation:</strong> View complete usage documentation and tutorials
      point3: <strong>GitHub Issues:</strong> Submit issue reports in the project repository
