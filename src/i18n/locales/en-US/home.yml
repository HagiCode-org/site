    subtitle: "Every agent gets a face, a personality and a world to live in"
    description: "Give each agent an avatar, Trait and Soul, then choose the vocabulary your team speaks. The same lineup reads as heroes and dungeons, a ranch, an imperial court or a hive, and levels and trophies reward the work as it happens."
