features:
  showcase:
    title: "Built for real development work"
    subtitle: "Proposals keep every change reviewable; parallel agents keep the work moving"
  smart:
    title: Smart
    subtitle: "Propose first, execute second: every change leaves a trail"
    artifactsTitle: "What each change leaves behind"
    description: "HagiCode doesn't just chat about your code. It reviews the real project state, writes a proposal and spec deltas, validates them strictly, runs the tasks in order, then archives what it learned for the next change."
    workflow:
      review:
        label: Review
        desc: Inspect the current project state, existing specs, and related code before drafting anything.
      scaffold:
        label: Scaffold
        desc: Choose a change-id and create proposal.md, tasks.md, and design.md when needed.
      spec:
        label: Spec
        desc: Translate the change into capability-level spec deltas with explicit requirements.
      design:
        label: Design
        desc: Capture architecture and trade-offs in design.md when the change spans systems.
      tasks:
        label: Tasks
        desc: Break the work into small, verifiable items with ordering and parallelism made clear.
      validate:
        label: Validate
        desc: Run openspec validate in strict mode and clear every issue before execution.
      apply:
        label: Apply
        desc: Read proposal, design, and tasks, then implement in order while checking items off.
      archive:
        label: Archive
        desc: Move the completed change into archive and feed the outcome back into the long-term spec history.
    paused: Paused - Click node to switch
  convenient:
    title: Efficient
    subtitle: "Run many agents and instances in parallel so your quota never sits idle"
    traditional: "One at a time, waiting in line"
    multiThread: "Side by side, none waiting on another"
    description: "Claude Code, Codex, GitHub Copilot, OpenCode, Hermes and the other supported Agent CLIs can each run several instances at once. Proposals, fixes and reviews get their own lane, so one slow result never stalls the rest."
    agentMatrix:
      title: Parallel execution matrix
      badge: "Example setup"
      status: "Illustrative: every lane keeps moving, none blocked by another"
      agents:
        claude:
          name: Claude Code
          role: Proposal / review
          instances:
            - Draft spec
            - Check design
            - Archive review
        codex:
          name: Codex
          role: Implementation / fixes
          instances:
            - Build feature A
            - Build feature B
            - Regression fix
        router:
          name: Qwen · GLM
          role: Analysis / support
          instances:
            - Trace issue
            - Polish copy
            - Capture insights
    cliBay:
      title: "Agent CLIs you can equip"
      hint: "Pick one to see how it plugs in"
      chain:
        agent: "Agent"
        model: "Compatible model"
      labels:
        whatItIs: "What it is"
        models: "Models and sign-in"
        runsOn: "Where it runs"
        start: "Getting started"
        questions: "Questions in HagiCode"
        strengths: "Known for"
        compare: "Read the full comparison"
