features:
  showcase:
    title: "Built for real development work"
    subtitle: "Proposals keep every change reviewable; parallel agents keep the work moving"
  smart:
    badge: SMART
    title: Smart
    subtitle: OpenSpec workflow, boost AI coding efficiency
    efficiency: Efficiency Boost
    traditional: Traditional
    hagicode: Hagicode
    description: "OpenSpec turns change delivery into a reusable path: review context, scaffold the proposal, draft spec deltas, validate strictly, apply ordered tasks, then archive the change."
    workflow:
      review:
        label: Review
        desc: Inspect the current project state, existing specs, and related code before drafting anything.
      scaffold:
        label: Scaffold
        desc: Choose a change-id and create proposal.md, tasks.md, and design.md when needed.
      spec:
        label: Spec
        desc: Translate the change into capability-level spec deltas with explicit requirements.
      design:
        label: Design
        desc: Capture architecture and trade-offs in design.md when the change spans systems.
      tasks:
        label: Tasks
        desc: Break the work into small, verifiable items with ordering and parallelism made clear.
      validate:
        label: Validate
        desc: Run openspec validate in strict mode and clear every issue before execution.
      apply:
        label: Apply
        desc: Read proposal, design, and tasks, then implement in order while checking items off.
      archive:
        label: Archive
        desc: Move the completed change into archive and feed the outcome back into the long-term spec history.
    paused: Paused - Click node to switch
  convenient:
    badge: EFFICIENT
    title: Efficient
    subtitle: Multi-agent, multi-instance execution that keeps your quota moving
    traditional: Traditional single-agent / single-instance
    multiThread: Multi-agent parallel matrix
    boost: Throughput Boost
    boostValue: 10x+ parallel
    description: Current supported Agent CLIs such as Claude Code, Codex, GitHub Copilot, OpenCode, and Hermes can work across multiple instances at the same time, so proposals, fixes, and reviews move in parallel instead of waiting in a serial queue.
    agentMatrix:
      title: Parallel execution matrix
      badge: Multiple agents / multiple instances
      status: Multiple agents are driving multiple instances right now
      agents:
        claude:
          name: Claude Code
          role: Proposal / review
          instances:
            - Draft spec
            - Check design
            - Archive review
        codex:
          name: Codex
          role: Implementation / fixes
          instances:
            - Build feature A
            - Build feature B
            - Regression fix
        router:
          name: Qwen · GLM
          role: Analysis / support
          instances:
            - Trace issue
            - Polish copy
            - Capture insights
      supportedNames:
        title: 13 currently supported Agent CLIs
        names:
          - Claude Code
          - Codex
          - GitHub Copilot
          - OpenCode
          - Hermes
          - QoderCLI
          - Kiro
          - Kimi
          - Gemini
          - Pi
          - Reasonix
          - DeepAgents
          - Codebuddy
    supportedProvidersNote: OpenCode can load the shared OmniRoute catalog into hero model defaults while keeping custom raw model identifiers editable for branch-specific workflows.
  interesting:
    badge: INTERESTING
    title: Fun
    subtitle: "Hero Dungeon turns everyday agent work into an adventure you can follow"
    features:
      dungeons:
        label: Hero Dungeons
        desc: Turn generation, execution, and prompt workbenches into dungeon runs
      captains:
        label: Captain Roster
        desc: Assign the right hero captain to each dungeon
      battle:
        label: Battle Reports
        desc: Review XP, levels, and execution results after each push
    description: "A game layer on top of the same proposal workflow: Hero Dungeon turns proposals, batch tasks, and prompt work into dungeons, assigns a captain to each, and reports XP and levels afterwards, so long-running agent work is easier to follow and more fun to keep doing."
    dungeonCards:
      proposal:
        title: Proposal Dungeon
        desc: OpenSpec generate / apply / archive
        status: Captain ready
      autotask:
        title: AutoTask Dungeon
        desc: Parallel fixes and batch automation
        status: 2 instances active
      prompt:
        title: Prompt Dungeon
        desc: Prompt preview and style workbench
        status: Visual sync ready
    roster:
      title: Current captain roster
      heroes:
        strategist:
          name: Spec Strategist
          role: Proposal captain
        runner:
          name: Patch Runner
          role: Execution captain
        artist:
          name: Prompt Artist
          role: Visual support
    battleReport:
      title: Today's dungeon report
      badge: Hero Battle
      metrics:
        dungeons:
          value: '4'
          label: Dungeons pushed
        level:
          value: Lv.27
          label: Captain level
        xp:
          value: 12.8M
          label: XP today
      note: When several dungeons move in parallel, the report rolls up experience, levels, and execution outcomes into one readout.
    gallery:
      dungeons:
        title: Dungeon map carousel
        subtitle: 10 random visuals from the current frontend dungeon and prompt map collection.
      heroes:
        title: Hero gallery carousel
        subtitle: 10 random hero visuals from the current frontend hero collection.
