    proposalWorkflow:
      title: Обзор выполнения предложения
      description: Этапы workflow, результат выполнения и контекст сессии остаются на одном экране, чтобы команда точно видела, на каком этапе находится изменение перед следующим шагом.
      alt: Скриншот выполнения предложения в HagiCode с этапами workflow, результатом выполнения и боковой панелью сессии
    sessionBoard:
      title: Доска сессий и планирование данжа
      description: Ожидающие, активные и архивные сессии остаются видимыми рядом с фэнтези-панелью задач, поэтому параллельную работу агентов легко оценить с первого взгляда.
      alt: Скриншот доски сессий HagiCode с колонками ожидающих, активных и архивных сессий рядом с фэнтези-панелью задач
    tokenAnalytics:
      title: Аналитика токенов в реальном времени
      description: Следите за пропускной способностью, недавней активностью API и общим расходом в одной метрике, чтобы контролировать стоимость и темп во время параллельного выполнения.
      alt: Скриншот аналитики токенов HagiCode с пропускной способностью, недавней активностью API и общим расходом
    workspaceManagement:
      title: Управление рабочими пространствами и Vault
      description: Управляйте пользовательскими Vault, системными Vault и точками входа code-server из единой панели, рассчитанной на общие среды и быстрое обслуживание.
      alt: Скриншот управления рабочими пространствами HagiCode с пользовательскими Vault, системными Vault и действиями code-server
    achievementProgress:
      title: Прогресс достижений и роста
      description: Ежедневный прогресс, глобальный рост и метрики жизненного цикла собираются в одной панели, чтобы долгосрочное использование ощущалось измеримым, а не абстрактным.
      alt: Скриншот панели достижений HagiCode с ежедневным прогрессом, глобальным ростом и метриками жизненного цикла
