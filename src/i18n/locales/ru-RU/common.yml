showcase:
  title: "HagiCode в работе"
  description: "Десять областей продукта в английском тёмном интерфейсе и пяти тёмных темах: доска сессий, предложения, агенты, навыки, Vault, расход токенов, достижения, Git и плановые запуски."
  controls:
    previous: Назад
    next: Далее
    current: Основной экран
    railLabel: Навигация по скриншотам продукта
    selectPrefix: 'Переключить на: '
    activeState: Показано сейчас
    previewState: Предпросмотр
    imageUnavailable: Изображение недоступно
    openFullscreen: 'Открыть на весь экран: '
    openFullscreenHint: Нажмите, чтобы увеличить
    zoomIn: "Показать в реальном размере"
    zoomOut: "Вписать в экран"
    closeFullscreen: Закрыть полноэкранный режим
  screenshots:
    sessionBoard:
      title: "Доска сессий"
      description: "Предложения, работающие агенты и архивные задачи собраны на одной доске, поэтому сразу видно, что ждёт, что выполняется и что готово."
      alt: "Доска сессий HagiCode с колонками «Предложение и проверка», «Выполнение» и «Архив» рядом с панелью быстрых действий проекта"
    proposalWorkflow:
      title: "Процесс предложений"
      description: "Любое изменение начинается с предложения: дельта спецификации, упорядоченные задачи и этапы, которые вы проверяете до запуска кода."
      alt: "Диалог предложения HagiCode с таблицей дельты спецификации, списком задач и индикатором этапов предложения"
    agentRoster:
      title: "Состав агентов"
      description: "Дайте каждому агенту аватар и роль, сгруппируйте их по Agent CLI и выберите, кто возьмёт следующую задачу."
      alt: "Рабочая область агентов HagiCode: двенадцать агентов, сгруппированных по Claude Code, Codex, OpenCode, Gemini и Hermes"
    agentCli:
      title: "Управление Agent CLI"
      description: "Claude Code, Codex, GitHub Copilot, OpenCode и другие собраны рядом, с версиями и проверкой состояния."
      alt: "Таблица управления AgentCLI в HagiCode с версией и состоянием каждого поддерживаемого Agent CLI"
    skillsGallery:
      title: "Галерея навыков"
      description: "Просматривайте надёжные источники навыков, сравнивайте число установок и сразу видьте, какие навыки уже есть на этом компьютере."
      alt: "Галерея навыков HagiCode с источником, числом установок и значком «Установлено локально»"
    vault:
      title: "Vault"
      description: "Храните командные регламенты, контракты и справочные материалы в Vault, просматривайте файлы и открывайте предпросмотр, не выходя из приложения."
      alt: "Обозреватель Vault в HagiCode со списком хранилищ, деревом файлов и Markdown-предпросмотром руководства по ревью"
    tokenUsage:
      title: "Расход токенов"
      description: "Токены и стоимость за сегодня всегда в строке состояния, а лестница уровней показывает, насколько насыщенным был день."
      alt: "Строка состояния HagiCode с суммой токенов и стоимостью за день и всплывающее окно с уровнями от Breath до Radiance"
    achievements:
      title: "Зал достижений"
      description: "Ежедневные цели, онлайн-рост и накопительные треки делают равномерный прогресс видимым."
      alt: "Зал достижений HagiCode с дневным процентом выполнения, сегодняшней добычей и дорожкой онлайн-роста"
    gitManagement:
      title: "Управление Git"
      description: "Проверяйте ветку, синхронизацию и незафиксированные изменения во всех репозиториях проекта и делайте коммит, push или pull в одной панели."
      alt: "Вкладка Git проекта HagiCode: четыре репозитория с веткой, состоянием синхронизации и сводкой"
    scheduledPlans:
      title: "Плановые запуски"
      description: "Запускайте предложения и HagiTask по календарю: ночные аудиты, еженедельные черновики и разовая подготовка релиза."
      alt: "Календарь плановых запусков HagiCode на октябрь с ночными, еженедельными и разовыми планами"
