desktop:
  title: Hagicode Desktop - Скачать
  description: Скачайте Hagicode Desktop, локализованный AI-ассистент для написания кода. Поддерживает Windows, macOS и Linux, обеспечивает защиту приватности и быстрый отклик.
  features:
    title: Ключевые возможности
    local:
      title: Локальное выполнение
      description: Все данные обрабатываются локально без отправки в облако, что обеспечивает конфиденциальность и безопасность кода
    privacy:
      title: Защита приватности
      description: Код никогда не загружается в сеть, поддерживается офлайн-использование, а ваша интеллектуальная собственность остается защищенной
    fast:
      title: Быстрый отклик
      description: Отклик на уровне миллисекунд без ожидания сетевых запросов повышает эффективность разработки
    crossPlatform:
      title: Кроссплатформенная поддержка
      description: Поддерживаются Windows, macOS и Linux, что подходит для разных сред разработки
    autoUpdate:
      title: Автоматические обновления
      description: Автоматически проверяет обновления и позволяет перейти на последнюю версию одним кликом
    multiLanguage:
      title: Многоязычная поддержка
      description: Встроенный интерфейс на китайском и английском подходит для совместной работы международных команд
  systemRequirements:
    title: Системные требования
    windows: Windows
    macos: macOS
    linux: Linux
    os: Операционная система
    processor: Процессор
    memory: Память
    diskSpace: Место на диске
    network: Сеть
    windowsOs: Windows 10/11 (64-bit)
    macosOs: macOS 12+ (Monterey или новее)
    linuxOs: Ubuntu 20.04+ / Debian 11+ / другие популярные дистрибутивы
    windowsProcessor: Intel Core i3 или эквивалентный процессор
    macosProcessor: Apple Silicon (M1/M2/M3) или Intel Core i3+
    linuxProcessor: Intel Core i3 или эквивалентный процессор
    memoryRec: 4GB RAM (рекомендуется 8GB)
    disk: 2GB свободного места
    networkDesc: Для первой загрузки требуется сетевое подключение (после этого можно работать офлайн)
  download:
    title: Пакеты для загрузки
    windowsDesc: Стабильные установщики для Windows 10/11, включая обычную и портативную сборки.
    macosDesc: Нативные сборки для Apple Silicon и Intel Mac.
    linuxDesc: Пакеты AppImage и архивы для популярных Linux-дистрибутивов x64 и ARM64.
    note: Если список пакетов здесь не загружается, воспользуйтесь ссылкой на историю версий в верхней части страницы, чтобы открыть официальный индекс.
    features:
      signed: Подписанные пакеты
      autoUpdate: Автоматическое обнаружение обновлений
      multiLanguage: Многоязычный интерфейс
  installation:
    title: Быстрая установка
    step1:
      number: '1'
      title: Скачать установщик
      description: Выберите установщик, подходящий для вашей операционной системы
    step2:
      number: '2'
      title: Запустить установщик
      description: Дважды щелкните по загруженному установщику и следуйте инструкциям для завершения установки
    step3:
      number: '3'
      title: Запустить приложение
      description: При первом запуске приложение проведет вас через начальную настройку
    step4:
      number: '4'
      title: Начать работу
      description: После завершения настройки вы сможете начать пользоваться Hagicode Desktop
  faq:
    title: FAQ
    q1:
      question: В чем разница между версиями Desktop и Server?
      intro: 'Hagicode предлагает два варианта развертывания: Desktop-версию и Server-версию. У каждой есть свои преимущества, но обе строятся на том, что пользователь сам контролирует сервер и данные, что дает лучшую защиту.'
      desktopTitle: Desktop-версия
      desktop1: Работает локально на вашем компьютере и остается более легковесной
      desktop2: Не требует настройки сервера и готова к работе сразу после установки
      desktop3: Подходит для индивидуальных разработчиков и легких сценариев использования
      desktop4: Все данные полностью остаются локально
      serverTitle: Server-версия
      server1: Может быть развернута на удаленных серверах
      server2: Поддерживает удаленный доступ для нескольких пользователей
      server3: Лучше подходит для командной работы и масштабирования
      server4: Готовит основу для будущих корпоративных функций и синхронизации между устройствами
      conclusion: Какую бы версию вы ни выбрали, полный контроль над сервером и данными остается у вас, а защита приватности и безопасность данных становятся выше.
    q2:
      question: Что нужно сделать после установки?
      intro: 'Hagicode Desktop по сути является лаунчером. При первом запуске после установки он проведет вас через следующие шаги:'
      step1: '<strong>Скачать Hagicode Core:</strong> Desktop автоматически обнаружит отсутствие основных компонентов и предложит их загрузить'
      step2: '<strong>Установить основные компоненты:</strong> Следуйте подсказкам на экране, чтобы завершить установку'
      step3: '<strong>Настроить Agent CLI по умолчанию:</strong> Выберите один из поддерживаемых Agent CLI и выполните необходимые шаги входа, авторизации или локальной установки.'
      note: Интерфейс Desktop ведет по всему процессу. Во время первого запуска оставьте сеть доступной, чтобы Hagicode Core мог загрузиться; некоторые Agent CLI по-прежнему требуют ручной установки или аутентификации, но все равно входят в текущий поддерживаемый набор.
      done: После этих шагов вы сможете полноценно пользоваться всеми возможностями Hagicode Desktop.
    q3:
      question: Как проверить обновления?
      answer: Desktop автоматически проверяет обновления. Когда доступна новая версия, в правом верхнем углу интерфейса появится уведомление. Вы также можете проверить обновления вручную в разделе «Настройки».
    q4:
      question: Какие AI Agent CLI поддерживаются?
      intro: 'Hagicode Desktop сейчас активно поддерживает следующие Agent CLI:'
      active: '<strong>Поддерживаются сейчас:</strong> Claude Code, Codex, GitHub Copilot, OpenCode, Hermes, QoderCLI, Kiro, Kimi, Gemini, Pi, Reasonix, DeepAgents и Codebuddy'
      manual: '<strong>Ручная установка или аутентификация:</strong> Hermes, Gemini и DeepAgents сначала требуют локальной установки или авторизации; для остальных CLI доступны точки входа для установки в один клик или пошаговые сценарии установки.'
      legacy: '<strong>Только устаревшая совместимость:</strong> IFlowCli сохранен лишь для совместимости с историческими данными и не входит в текущий активный набор поддержки.'
      closing: Поддержка и способ настройки — это разные вещи. Если CLI требует ручной установки, это не означает, что он сейчас не поддерживается.
    q5:
      question: Поддерживается ли офлайн-использование?
      intro: 'Да. Hagicode Desktop поддерживает полностью офлайн-использование:'
      point1: Сетевое подключение требуется только для первой установки и начальной настройки (загрузка основных компонентов и AI-моделей)
      point2: После настройки все функции можно использовать без сети
      point3: Ваш код и данные никогда не отправляются в облако
      point4: Вся AI-обработка выполняется локально
    q6:
      question: macOS сообщает, что Hagicode.app повреждено или не может быть открыто. Что делать?
      intro: Если Hagicode Desktop установлен по пути по умолчанию /Applications/Hagicode.app и macOS Gatekeeper блокирует первый запуск, используйте следующую команду, чтобы удалить у приложения атрибут карантина.
      cause: Это происходит потому, что macOS добавляет атрибут com.apple.quarantine к приложениям, загруженным из интернета. Это механизм защитной изоляции macOS, а не ошибка установщика Hagicode.
      command: sudo xattr -dr com.apple.quarantine /Applications/Hagicode.app
      note: Выполните команду в Terminal с правами администратора, затем снова запустите Hagicode Desktop.
    q7:
      question: Где получить помощь, если возникли проблемы?
      intro: 'Если при использовании Hagicode Desktop возникают проблемы, вы можете обратиться за помощью через:'
      point1: '<strong>Группа технической поддержки:</strong> вступите в QQ-группу 610394020'
      point2: '<strong>Онлайн-документация:</strong> просмотрите полную документацию и обучающие материалы'
      point3: '<strong>GitHub Issues:</strong> отправьте отчет о проблеме в репозитории проекта'
