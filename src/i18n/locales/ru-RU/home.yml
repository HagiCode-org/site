  description: "Каждый агент проводит свою задачу через идею, предложение, выполнение и архивацию. Как только один запуск архивирован, начинается следующий, и работа идёт на всех этапах одновременно."
  illustrative: "Пример в движении"
  diagramLabel: "{agents}: каждый ведёт свою задачу через этапы {stages}."
