features:
  showcase:
    title: Три ключевые возможности
    subtitle: Переосмыслите свой опыт AI-coding
  smart:
    badge: УМНО
    title: Умно
    subtitle: Workflow OpenSpec для роста эффективности AI-coding
    efficiency: Рост эффективности
    traditional: Традиционно
    hagicode: Hagicode
    description: Полноценный workflow предложений из 9 этапов, от идеи до архива, с поддержкой ИИ на каждом шаге. Это помогает увеличить эффективность coding в 3 раза.
    workflow:
      idea:
        label: Идея
        desc: Начать с идеи
      proposal:
        label: Предложение
        desc: ИИ генерирует предложение
      review:
        label: Ревью
        desc: Автоматическое ревью
      tasks:
        label: Задачи
        desc: Разбиение задач
      code:
        label: Код
        desc: Умный coding
      test:
        label: Тест
        desc: Автоматические тесты
      refactor:
        label: Refactor
        desc: Рефакторинг кода
      docs:
        label: Docs
        desc: Генерация документации
      archive:
        label: Архив
        desc: Архивация знаний
    paused: На паузе - нажмите на узел для переключения
  convenient:
    badge: ЭФФЕКТИВНО
    title: Эффективно
    subtitle: Multi-agent и multi-instance execution, которая не даёт вашей квоте простаивать
    traditional: Традиционный один Agent / одна инстанция
    multiThread: Multi-agent параллельная матрица
    boost: Рост пропускной способности
    boostValue: 10x+ параллельно
    description: Поддерживаемые сейчас Agent CLI, такие как Claude Code, Codex, GitHub Copilot, OpenCode и Hermes, могут работать сразу на нескольких инстанциях, поэтому предложения, исправления и ревью идут параллельно, а не ждут в последовательной очереди.
    agentMatrix:
      title: Матрица параллельного выполнения
      badge: Несколько агентов / несколько инстанций
      status: Несколько агентов прямо сейчас управляют несколькими инстанциями
      agents:
        claude:
          name: Claude Code
          role: Предложение / ревью
          instances:
            - Подготовить spec
            - Проверить дизайн
            - Проверить архив
        codex:
          name: Codex
          role: Реализация / исправления
          instances:
            - Сделать функцию A
            - Сделать функцию B
            - Исправить регрессию
        router:
          name: Qwen · GLM
          role: Анализ / поддержка
          instances:
            - Проследить проблему
            - Отшлифовать copy
            - Зафиксировать выводы
      supportedNames:
        title: 11 Agent CLI, поддерживаемых сейчас
        names:
          - Claude Code
          - Codex
          - GitHub Copilot
          - OpenCode
          - Hermes
          - QoderCLI
          - Kiro
          - Kimi
          - Gemini
          - DeepAgents
          - Codebuddy
    supportedProvidersNote: OpenCode может загружать общий каталог OmniRoute в значения по умолчанию для hero-модели и при этом сохранять возможность редактировать сырые идентификаторы моделей для branch-специфичных workflow.
  interesting:
    badge: ИНТЕРЕСНО
    title: С интересом
    subtitle: Hero Dungeon оживляет совместную работу и практику в кампусе
    features:
      dungeons:
        label: Hero Dungeons
        desc: Превращает генерацию, выполнение и prompt-верстаки в настоящие забеги по подземельям
      captains:
        label: Состав капитанов
        desc: Назначайте подходящего hero-капитана для каждого подземелья
      battle:
        label: Боевые отчёты
        desc: Просматривайте XP, уровни и результаты выполнения после каждого push
    description: Интерес больше не держится только на бейджах достижений. Hero Dungeon, состав капитанов, визуалы prompt и боевые отчёты превращают ежедневную практику AI-coding в скоординированное приключение для лабораторий и студенческих команд.
    dungeonCards:
      proposal:
        title: Подземелье предложений
        desc: OpenSpec generate / apply / archive
        status: Капитан готов
      autotask:
        title: Подземелье AutoTask
        desc: Параллельные исправления и пакетная автоматизация
        status: 2 инстанции активны
      prompt:
        title: Подземелье prompt
        desc: Предпросмотр prompt и верстак стиля
        status: Визуальная синхронизация готова
    roster:
      title: Текущий состав капитанов
      heroes:
        strategist:
          name: Spec Strategist
          role: Капитан предложений
        runner:
          name: Patch Runner
          role: Капитан исполнения
        artist:
          name: Prompt Artist
          role: Визуальная поддержка
    battleReport:
      title: Сегодняшний отчёт по подземельям
      badge: Hero Battle
      metrics:
        dungeons:
          value: '4'
          label: Продвинутые подземелья
        level:
          value: Lv.27
          label: Уровень капитана
        xp:
          value: 12.8M
          label: XP сегодня
      note: Когда несколько подземелий двигаются параллельно, этот отчёт сводит опыт, уровни и результаты выполнения в одну общую картину.
    gallery:
      dungeons:
        title: Карусель карт подземелий
        subtitle: 10 случайных визуалов из текущей коллекции dungeon и prompt-карт фронтенда.
      heroes:
        title: Карусель галереи героев
        subtitle: 10 случайных визуалов из текущей фронтенд-коллекции героев.
