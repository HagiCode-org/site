workflowSteps:
  eyebrow: "Как это работает"
  title: "Каждое изменение проходит одни и те же три шага"
  description: "Никаких бесконечных чатов. Каждое изменение становится предложением, которое можно проверить, выполнением, которое можно проследить, и знанием, которое можно использовать снова."
  loopLabel: "Архив питает следующее предложение"
  steps:
    proposal:
      label: "Предложение"
      description: "Опишите изменение. Hagicode изучит репозиторий и составит предложение со спецификациями и задачами — их можно прочитать и поправить до того, как будет тронута хоть одна строка кода."
    execution:
      label: "Выполнение"
      description: "Утвердите план, и агенты выполнят его задача за задачей — параллельно через Claude Code, Codex, GitHub Copilot и другие, отмечая каждую завершённую задачу."
    archive:
      label: "Архив"
      description: "Завершённые изменения архивируются обратно в ваши спецификации. Следующее предложение читает их первыми, поэтому начинается с того, что команда уже узнала."
