features:
  showcase:
    title: "Создано для реальной разработки"
    subtitle: "Предложения делают каждое изменение проверяемым, параллельные агенты не дают работе стоять"
    demoLabel: "Пример процесса · не текущие задачи"
    previewLabel: "Реальный интерфейс продукта"
  smart:
    badge: УМНО
    title: Умно
    subtitle: "Сначала замысел. Затем реализация с ИИ."
    efficiency: Рост эффективности
    traditional: Традиционно
    hagicode: Hagicode
    description: "Соберите требования, проектные решения и задачи в OpenSpec. Каждое изменение сохраняет контекст, а завершённая работа становится знанием для будущих задач."
    workflow:
      review:
        label: Ревью
        desc: Автоматическое ревью
      scaffold:
        label: Scaffold
        desc: Choose a change-id and create proposal.md, tasks.md, and design.md when needed.
      spec:
        label: Spec
        desc: Translate the change into capability-level spec deltas with explicit requirements.
      design:
        label: Design
        desc: Capture architecture and trade-offs in design.md when the change spans systems.
      tasks:
        label: Задачи
        desc: Разбиение задач
      validate:
        label: Validate
        desc: Run openspec validate in strict mode and clear every issue before execution.
      apply:
        label: Apply
        desc: Read proposal, design, and tasks, then implement in order while checking items off.
      archive:
        label: Архив
        desc: Архивация знаний
    paused: На паузе - нажмите на узел для переключения
  convenient:
    badge: ЭФФЕКТИВНО
    title: Эффективно
    subtitle: "Несколько задач движутся вперёд вместе."
    traditional: Традиционный один Agent / одна инстанция
    multiThread: Multi-agent параллельная матрица
    boost: Рост пропускной способности
    boostValue: 10x+ параллельно
    description: "Разные агенты одновременно готовят предложения, пишут код и проводят ревью. Параллельные экземпляры сокращают ожидание между задачами."
    agentMatrix:
      title: Матрица параллельного выполнения
      badge: Несколько агентов / несколько инстанций
      status: Несколько агентов прямо сейчас управляют несколькими инстанциями
      agents:
        claude:
          name: Claude Code
          role: Предложение / ревью
          instances:
            - Подготовить spec
            - Проверить дизайн
            - Проверить архив
        codex:
          name: Codex
          role: Реализация / исправления
          instances:
            - Сделать функцию A
            - Сделать функцию B
            - Исправить регрессию
        router:
          name: Qwen · GLM
          role: Анализ / поддержка
          instances:
            - Проследить проблему
            - Отшлифовать copy
            - Зафиксировать выводы
      supportedNames:
        title: 13 Agent CLI, поддерживаемых сейчас
        names:
          - Claude Code
          - Codex
          - GitHub Copilot
          - OpenCode
          - Hermes
          - QoderCLI
          - Kiro
          - Kimi
          - Gemini
          - Pi
          - Reasonix
          - DeepAgents
          - Codebuddy
    supportedProvidersNote: OpenCode может загружать общий каталог OmniRoute в значения по умолчанию для hero-модели и при этом сохранять возможность редактировать сырые идентификаторы моделей для branch-специфичных workflow.
  interesting:
    badge: ИНТЕРЕСНО
    title: Интересно
    subtitle: "Понятный и увлекательный процесс благодаря удобным и наглядным UI-взаимодействиям."
    features:
      planning:
        label: "План"
        desc: "Просматривайте задачи и результаты в представлении предложений."
      execution:
        label: "Выполнение"
        desc: "Следите за работой нескольких агентов на доске сессий."
      workspace:
        label: "Проекты"
        desc: "Просматривайте проекты и управляйте ими в рабочей области."
    description: "Удобные UI-взаимодействия упрощают планирование, запуск агентов и работу над проектами."
    dungeonCards:
      proposal:
        title: Подземелье предложений
        desc: OpenSpec generate / apply / archive
        status: Капитан готов
      autotask:
        title: Подземелье AutoTask
        desc: Параллельные исправления и пакетная автоматизация
        status: 2 инстанции активны
      prompt:
        title: Подземелье prompt
        desc: Предпросмотр prompt и верстак стиля
        status: Визуальная синхронизация готова
    roster:
      title: Текущий состав капитанов
      heroes:
        strategist:
          name: Spec Strategist
          role: Капитан предложений
        runner:
          name: Patch Runner
          role: Капитан исполнения
        artist:
          name: Prompt Artist
          role: Визуальная поддержка
    battleReport:
      title: Сегодняшний отчёт по подземельям
      badge: Hero Battle
      metrics:
        dungeons:
          value: '4'
          label: Продвинутые подземелья
        level:
          value: Lv.27
          label: Уровень капитана
        xp:
          value: 12.8M
          label: XP сегодня
      note: Когда несколько подземелий двигаются параллельно, этот отчёт сводит опыт, уровни и результаты выполнения в одну общую картину.
    gallery:
      dungeons:
        title: Карусель карт подземелий
        subtitle: 10 случайных визуалов из текущей коллекции dungeon и prompt-карт фронтенда.
      heroes:
        title: Карусель галереи героев
        subtitle: 10 случайных визуалов из текущей фронтенд-коллекции героев.
