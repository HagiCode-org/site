features:
  showcase:
    title: "Создано для реальной разработки"
    subtitle: "Предложения делают каждое изменение проверяемым, параллельные агенты не дают работе стоять"
  smart:
    title: Умно
    subtitle: "Сначала предложение, потом выполнение: у каждого изменения остаётся след"
    artifactsTitle: "Что остаётся после каждого изменения"
    description: "HagiCode не просто обсуждает ваш код. Он изучает реальное состояние проекта, пишет предложение и дельты спецификации, строго проверяет их, выполняет задачи по порядку и в конце архивирует накопленный опыт для следующего изменения."
    workflow:
      review:
        label: "Ревью"
        desc: "Изучить состояние проекта, действующие спецификации и связанный код, прежде чем что-либо писать."
      scaffold:
        label: "Каркас"
        desc: "Выбрать change-id и создать proposal.md, tasks.md и при необходимости design.md."
      spec:
        label: "Spec"
        desc: "Превратить изменение в дельты спецификации по capability с явными требованиями."
      design:
        label: "Дизайн"
        desc: "Зафиксировать архитектуру и компромиссы в design.md, если изменение затрагивает несколько систем."
      tasks:
        label: "Задачи"
        desc: "Разбить работу на небольшие проверяемые пункты с понятным порядком и параллелизмом."
      validate:
        label: "Проверка"
        desc: "Запустить openspec validate в строгом режиме и устранить все замечания до выполнения."
      apply:
        label: "Выполнение"
        desc: "Прочитать proposal, design и tasks и реализовать по порядку, отмечая выполненное."
      archive:
        label: "Архив"
        desc: "Заархивировать завершённое изменение и вернуть результат в долгосрочную историю спецификаций."
    paused: На паузе - нажмите на узел для переключения
  convenient:
    title: Эффективно
    subtitle: "Много агентов и экземпляров параллельно — чтобы ваша квота не простаивала"
    traditional: "По одному, в очереди"
    multiThread: "Бок о бок, никто никого не ждёт"
    description: "Claude Code, Codex, GitHub Copilot, OpenCode, Hermes и другие поддерживаемые Agent CLI могут запускать по несколько экземпляров одновременно. У предложений, исправлений и ревью — своя полоса, поэтому один медленный результат не тормозит остальное."
    agentMatrix:
      title: Матрица параллельного выполнения
      badge: "Пример конфигурации"
      status: "Иллюстрация: каждая полоса движется, ни одна не блокирует другую"
      agents:
        claude:
          name: Claude Code
          role: Предложение / ревью
          instances:
            - Подготовить spec
            - Проверить дизайн
            - Проверить архив
        codex:
          name: Codex
          role: Реализация / исправления
          instances:
            - Сделать функцию A
            - Сделать функцию B
            - Исправить регрессию
        router:
          name: Qwen · GLM
          role: Анализ / поддержка
          instances:
            - Проследить проблему
            - Отшлифовать copy
            - Зафиксировать выводы
    cliBay:
      title: "Agent CLI, которые можно экипировать"
      hint: "Выберите одну, чтобы увидеть, как она подключается"
      chain:
        agent: "Агент"
        model: "Совместимая модель"
      labels:
        whatItIs: "Что это"
        models: "Модели и вход"
        runsOn: "Где работает"
        start: "Начало работы"
        questions: "Вопросы в HagiCode"
        strengths: "Сильные стороны"
        compare: "Читать полное сравнение"
  interesting:
    title: Интересно
    subtitle: "У каждого агента есть лицо, характер и свой мир"
    description: "Дайте каждому агенту аватар, Trait и Soul и выберите лексику своей команды. Один и тот же состав читается как герои и подземелья, ранчо, императорский двор или улей, а уровни и трофеи награждают работу по мере её выполнения."
    worlds:
      title: "Один состав — десять названий"
      labels:
