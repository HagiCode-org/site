container:
  title: Hagicode Container - Контейнерное развертывание
  description: Разверните Hagicode через Docker Compose Builder. Простая настройка, готово к работе. Поддерживаются разные источники образов и автоматические обновления.
  hero:
    badge: Контейнер
    title: Hagicode Container
    tagline: Быстрое развертывание с Docker Compose Builder, простая настройка и готовность к работе
    value1: Визуальная настройка без программирования
    value2: Изоляция окружения и безопасность данных
    value3: Развертывание в один клик и быстрый запуск
    ctaButton: Развернуть через Docker Compose Builder
    features:
      isolation: Изоляция окружения
      oneClick: Развертывание в один клик
      fastStart: Быстрый запуск
  features:
    title: Почему стоит выбрать контейнерное развертывание?
    isolation:
      title: Изоляция окружения
      description: Контейнерное развертывание помогает избежать конфликтов зависимостей, не влияет на системное окружение и поддерживает чистоту системы
    simple:
      title: Простая настройка
      description: Используйте визуальную настройку Docker Compose Builder без необходимости писать сложные скрипты
    crossPlatform:
      title: Кроссплатформенная поддержка
      description: Поддерживается архитектура x86_64, подходящая для разных серверов и облачных платформ
    persistent:
      title: Сохранность данных
      description: Поддерживаются Docker Volumes, поэтому данные остаются безопасными и не теряются при перезапуске контейнера
    autoUpdate:
      title: Автоматические обновления
      description: Поддерживаются автоматические обновления через watchtower, чтобы без усилий оставаться на последней версии
    productionReady:
      title: Готово к production
      description: Решение спроектировано для production-среды и поддерживает высокую доступность и горизонтальное масштабирование
  builder:
    title: Docker Compose Builder
    subtitle: Самый простой и рекомендуемый способ контейнерного развертывания
    visual:
      title: Визуальная настройка
      description: Настраивайте все параметры через удобный Web-интерфейс без ручного редактирования YAML-файлов
    generate:
      title: Генерация конфигурации в один клик
      description: Автоматически создает полные файлы docker-compose.yml с настройками по лучшим практикам
    deploy:
      title: Быстрое развертывание
      description: Скачайте конфигурационные файлы одним кликом и запустите сервисы за считанные минуты
    secure:
      title: Безопасно и надежно
      description: Встроены лучшие практики безопасности, а также автоматически настраиваются тома данных и политики перезапуска
    ctaButton: Перейти в Docker Compose Builder
  mirrors:
    title: Выбор источника образа
    description: Выберите наиболее подходящий источник образа с учетом вашей сети и региона
    dockerHub: Docker Hub
    dockerHubDesc: Крупнейший в мире реестр контейнерных образов, подходящий для пользователей с международным сетевым доступом
    dockerHubCmd: newbe36524/hagicode:0
    azure: Azure ACR
    azureDesc: Сервис образов Microsoft Azure с более быстрым доступом из Китая
    azureCmd: hagicode.azurecr.io/hagicode:0
    aliyun: Aliyun ACR
    aliyunDesc: Ускоренный сервис образов Aliyun для материкового Китая, рекомендован пользователям из этого региона
    aliyunCmd: registry.cn-hangzhou.aliyuncs.com/hagicode/hagicode:0
  faq:
    title: FAQ
    q1:
      question: В чем разница между версиями Container и Desktop?
      intro: 'У обеих версий есть свои преимущества. Вы можете выбрать вариант в зависимости от сценария использования:'
      desktopTitle: Desktop-версия
      desktop1: Работает локально на вашем компьютере и остается более легковесной
      desktop2: Не требует настройки сервера и готова к работе сразу после установки
      desktop3: Подходит для индивидуальных разработчиков и легких сценариев использования
      desktop4: Все данные полностью остаются локально
      containerTitle: Container-версия
      container1: Может быть развернута на серверах и поддерживает удаленный доступ
      container2: Изолирует окружение без влияния на хост-систему
      container3: Лучше подходит для командной работы и production-среды
      container4: Поддерживает автоматизированное развертывание и горизонтальное масштабирование
    q2:
      question: Что такое Docker Compose Builder?
      intro: 'Docker Compose Builder — это наш инструмент визуальной настройки, который помогает вам:'
      point1: Настраивать все параметры контейнеров через Web-интерфейс
      point2: Автоматически генерировать файлы docker-compose.yml
      point3: Использовать встроенные лучшие практики и настройки безопасности
      point4: Скачивать конфигурацию и запускать сервисы одним кликом
      note: Вам не нужно вручную писать сложные YAML-конфигурации. Даже начинающие пользователи Docker смогут легко развернуть сервис.
    q3:
      question: Какие архитектуры систем поддерживает контейнерная версия?
      answer: Контейнерные образы Hagicode сейчас поддерживают архитектуру <strong>x86_64 (amd64)</strong>, подходящую для большинства серверов и ПК.
      note: Docker автоматически выберет подходящую архитектуру для вашей системы при загрузке образа.
    q4:
      question: Как обновить контейнер?
      intro: 'При использовании Docker Compose обновление очень простое:'
      code: |-
        docker-compose pull
        docker-compose up -d
      watchtower: Или используйте Watchtower для автоматических обновлений.
    q5:
      question: Как настроить сохранность данных?
      intro: 'Docker Compose Builder автоматически настраивает тома данных. По умолчанию ваши данные хранятся в Docker Volumes, что гарантирует:'
      point1: Данные не теряются при удалении контейнеров
      point2: Данные сохраняются во время обновления контейнеров
      point3: Простое резервное копирование и восстановление
    q6:
      question: Что делать, если контейнер не запускается?
      intro: 'Шаги для диагностики ошибки запуска контейнера:'
      step1:
        title: 'Проверить статус контейнера:'
        code: docker-compose ps
      step2:
        title: 'Проверить логи контейнера:'
        code: docker-compose logs hagicode
      step3:
        title: 'Проверить занятость порта:'
        desc: 'Если ваш сервис использует порт 3000, проверьте его этой командой:'
        code: netstat -tlnp | grep 3000
        solution: 'Если порт уже занят, вы можете:'
        solution1: Остановить процесс, который использует этот порт
        solution2: Или настроить другой порт в Docker Compose Builder
      help: Если проблема сохраняется, обратитесь к подробной документации или в техническую поддержку.
  cta:
    title: Начать работу с Docker Compose Builder
    subtitle: Самый простой и рекомендуемый способ контейнерного развертывания
    button: Перейти к руководству по развертыванию
    github: Репозиторий GitHub
