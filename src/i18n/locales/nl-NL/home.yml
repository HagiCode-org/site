    multiThread: Multi-agent parallelle matrix
    boost: Doorvoerverbetering
    boostValue: 10x+ parallel
    description: Momenteel ondersteunde Agent CLI's zoals Claude Code, Codex, GitHub Copilot, OpenCode en Hermes kunnen tegelijkertijd op meerdere instanties werken, zodat voorstellen, correcties en reviews parallel verlopen in plaats van te wachten in een seriële wachtrij.
    agentMatrix:
      title: Parallelle uitvoeringsmatrix
      badge: Meerdere agents / meerdere instanties
      status: Meerdere agents sturen momenteel meerdere instanties aan
      agents:
        claude:
          name: Claude Code
          role: Voorstel / review
          instances:
            - Concept specificatie
            - Design controleren
            - Archief-review
        codex:
          name: Codex
          role: Implementatie / correcties
          instances:
            - Bouw functie A
            - Bouw functie B
            - Regressie-correctie
        router:
          name: Qwen · GLM
          role: Analyse / ondersteuning
          instances:
            - Probleem traceren
            - Tekst verfijnen
            - Inzichten vastleggen
      supportedNames:
        title: 11 momenteel ondersteunde Agent CLI's
        names:
          - Claude Code
          - Codex
          - GitHub Copilot
          - OpenCode
          - Hermes
          - QoderCLI
          - Kiro
          - Kimi
          - Gemini
          - DeepAgents
          - Codebuddy
    supportedProvidersNote: OpenCode kan de gedeelde OmniRoute-catalogus laden in held-modelstandaarden terwijl aangepaste ruwe modelidentificatoren bewerkbaar blijven voor branch-specifieke workflows.
  interesting:
    badge: LEUK
    title: Leuk
    subtitle: Hero Dungeon maakt campussamenwerking en oefening levend
    features:
      dungeons:
        label: Hero Dungeons
        desc: Verander generatie, uitvoering en prompt-werkbanken in dungeon-runs
      captains:
        label: Kapiteinslijst
        desc: Wijs de juiste held-kapitein toe aan elke dungeon
      battle:
        label: Gevechtsrapporten
        desc: Bekijk XP, niveaus en uitvoeringsresultaten na elke push
    description: Plezier hangt niet langer af van prestatiebadges. Hero Dungeon, kapiteinslijsten, visuele prompts en gevechtsrapporten veranderen dagelijkse AI-codeeroefening in een workflow die meer voelt als een gecoördineerd avontuur voor campuslabs en studentteams.
    dungeonCards:
      proposal:
        title: Voorstel Dungeon
        desc: OpenSpec genereren / toepassen / archiveren
        status: Kapitein klaar
      autotask:
        title: AutoTask Dungeon
        desc: Parallelle correcties en batch-automatisering
        status: 2 instanties actief
      prompt:
        title: Prompt Dungeon
        desc: Prompt-voorbeeld en stijl-werkbank
        status: Visuele synchronisatie klaar
    roster:
      title: Huidige kapiteinslijst
      heroes:
        strategist:
          name: Spec Strategist
          role: Voorstelkapitein
        runner:
          name: Patch Runner
          role: Uitvoeringskapitein
        artist:
          name: Prompt Artist
          role: Visuele ondersteuning
    battleReport:
      title: Dungeon-rapport van vandaag
      badge: Heldengevecht
      metrics:
        dungeons:
          value: '4'
          label: Dungeons voltooid
        level:
          value: Lv.27
          label: Kapiteinsniveau
        xp:
          value: 12.8M
          label: XP vandaag
      note: Wanneer meerdere dungeons parallel lopen, rolt het rapport ervaring, niveaus en uitvoeringsresultaten op tot één aflezing.
    gallery:
