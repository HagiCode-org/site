        category: Prestatie-DLC
        title: 'Hagicode: Turbo Engine DLC'
        price: Steam
        description: U kunt deze DLC apart kopen om de oorspronkelijke voorstel-gelijktijdigheidslimiet uit te breiden, kopie-wissel te ontgrendelen, vijf avatar-pakketten toe te voegen met elk 10 zelfstandige avatars, aangepaste avatar-uploads in te schakelen, het logo en de titel linksboven aan te passen, en AI-gegenereerde commit-trailers af te stemmen op uw eigen Co-Authored-By-naamregels. We zullen meestal een gebundelde aankoopoptie genaamd Hagicode Plus uitlichten zodat de totale aankoopprijs lager blijft. Controleer onze winkelpagina voor de laatste wijzigingen.
        bullets:
          - Ondersteunt aangepaste logo's en titels linksboven
          - Bevat vijf avatar-pakketten met 10 selecteerbare avatars in elk pakket
          - Ondersteunt aangepaste avatar-uploads
          - Laat teams de AI Co-Authored-By-handtekening aanpassen voor commit-workflows
          - Ontgrendelt ondersteuning voor kopie- en bewoording-wissel
          - Breidt de maximale gelijktijdige voorstellimiet uit naar 32
      hagicodePlus:
        category: Bundle
        title: Hagicode Plus
        price: Steam
        description: De officiële Steam-bundle die de Hagicode-base-editie combineert met Turbo Engine DLC in één aankooproute.
        bullets:
          - Bundelt de belangrijkste Steam-editie en Turbo Engine DLC samen
          - Houdt de hogere 32-voorstel gelijktijdigheidsupgrade gekoppeld aan het bundelpad
          - Werkt als het duidelijkste aankoopinangspunt wanneer u de volledige Steam-setup in één keer wilt
      sponsor:
        category: Supporter DLC
        title: Hagicode - Sponsor Pack
        price: Steam
        description: Als u denkt dat Hagicode oprecht uitmuntend is en directe financiële steun wilt bieden, geeft het kopen van Sponsor Pack het project meer brandstof en helpt het ons het op de lange termijn draaiende te houden.
        bullets:
          - Eén exclusief donker thema
          - Eén exclusief licht thema
          - Eén exclusieve Steam-prestatie
