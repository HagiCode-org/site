      title: Realtime token-analyses
      description: Bekijk doorvoer, recente API-activiteit en totaal gebruik op één metriekvlak, zodat kosten en tempo beheersbaar blijven tijdens parallelle uitvoering.
      alt: HagiCode token-analyses schermafbeelding die doorvoer, recente API-activiteit en totaal gebruik toont
    workspaceManagement:
      title: Werkruimte en kluisbeheer
      description: Beheer gebruikerskluizen, systeemkluizen en code-server-toegangspunten vanaf één besturingsvlak gebouwd voor gedeelde omgevingen en snel onderhoud.
      alt: HagiCode werkruimtebeheer schermafbeelding die gebruikerskluizen, systeemkluizen en code-server-acties toont
    achievementProgress:
      title: Prestatie- en groeivoortgang
      description: Dagelijkse voortgang, wereldwijde groei en levenscyclusmetrieken rollen in één dashboard, zodat langetermijnadoptie meetbaar voelt in plaats van abstract.
