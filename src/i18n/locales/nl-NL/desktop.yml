desktop:
  title: Hagicode Desktop - Download
  description: Download Hagicode Desktop, een gelokaliseerde AI-codeassistent. Ondersteunt Windows, macOS en Linux. Privacybescherming, snelle reactie.
  features:
    title: Belangrijkste functies
    local:
      title: Lokale uitvoering
      description: Alle gegevens worden lokaal verwerkt zonder upload naar de cloud, wat code-privacy en beveiliging garandeert
    privacy:
      title: Privacybescherming
      description: Code wordt nooit geüpload, ondersteunt offline gebruik, beschermt uw intellectueel eigendom
    fast:
      title: Snelle respons
      description: Reactietijd op millisecondeniveau, geen netwerkverzoeken nodig, verhoogt ontwikkelingsefficiëntie
    crossPlatform:
      title: Kruisplatformondersteuning
      description: Ondersteunt Windows, macOS en Linux om aan verschillende ontwikkelomgevingsbehoeften te voldoen
    autoUpdate:
      title: Automatische updates
      description: Controleert automatisch op updates en upgradet naar de nieuwste versie met één klik
    multiLanguage:
      title: Meertalige ondersteuning
      description: Ingebouwde Chinese en Engelse interface, ondersteunt internationale teamsamenwerking
  systemRequirements:
    title: Systeemvereisten
    windows: Windows
    macos: macOS
    linux: Linux
    os: Besturingssysteem
    processor: Processor
    memory: Geheugen
    diskSpace: Schijfruimte
    network: Netwerk
    windowsOs: Windows 10/11 (64-bit)
    macosOs: macOS 12+ (Monterey of hoger)
    linuxOs: Ubuntu 20.04+ / Debian 11+ / Andere gangbare distributies
    windowsProcessor: Intel Core i3 of equivalente processor
    macosProcessor: Apple Silicon (M1/M2/M3) of Intel Core i3+
    linuxProcessor: Intel Core i3 of equivalente processor
    memoryRec: 4GB RAM (8GB aanbevolen)
    disk: 2GB beschikbare ruimte
    networkDesc: Netwerkverbinding vereist voor initiële download (kan daarna offline worden gebruikt)
  download:
    title: Downloadpakketten
    windowsDesc: Stabiele installatieprogramma's voor Windows 10/11, inclusief setup en portable versies.
    macosDesc: Native builds voor Apple Silicon en Intel Macs.
    linuxDesc: AppImage- en tarball-pakketten voor gangbare x64- en ARM64 Linux-distributies.
    note: Als de pakketlijst hier niet laadt, gebruik de versiegeschiedenislink in het hero-gebied om toegang te krijgen tot de canonieke index.
    features:
      signed: Ondertekende pakketten
      autoUpdate: Automatische update-detectie
      multiLanguage: Meertalige interface
  installation:
    title: Snelle installatie
    step1:
      number: '1'
      title: Installatieprogramma downloaden
      description: Selecteer het juiste installatieprogramma voor uw besturingssysteem
    step2:
      number: '2'
      title: Installatieprogramma uitvoeren
      description: Dubbelklik op het gedownloade installatieprogramma en volg de instructies om de installatie te voltooien
    step3:
      number: '3'
      title: App starten
      description: Bij de eerste start wordt u begeleid door de initiële configuratie
    step4:
      number: '4'
      title: Begin met gebruiken
      description: Na configuratie kunt u Hagicode Desktop gaan gebruiken
  faq:
    title: Veelgestelde vragen
    q1:
      question: Wat is het verschil tussen de Desktop- en Server-versies?
      intro: 'Hagicode biedt twee implementatieopties: Desktop-versie en Server-versie. Elke heeft zijn voordelen, maar beide gebruiken een door de gebruiker gecontroleerde server- en gegevensbenadering die betere gegevensbescherming biedt.'
      desktopTitle: Desktop-versie
      desktop1: Werkt lokaal op uw computer, lichter
      desktop2: Geen serverconfiguratie nodig, direct klaar voor gebruik
      desktop3: Geschikt voor individuele ontwikkelaars en licht gebruiksscenario's
      desktop4: Alle gegevens volledig gelokaliseerd
      serverTitle: Server-versie
      server1: Kan op externe servers worden geïmplementeerd
      server2: Ondersteunt multi-gebruiker externe toegang
      server3: Beter geschikt voor teamsamenwerking en schaling
      server4: Bereidt voor op toekomstige enterprise-functies en multi-apparaat synchronisatie
      conclusion: Welke versie u ook kiest, u heeft volledige controle over uw server en gegevens, met betere privacybescherming en gegevensbeveiliging.
    q2:
      question: Wat moet ik doen na de installatie?
      intro: 'Hagicode Desktop is in wezen een launcher. Bij de eerste start na installatie wordt u door deze stappen geleid:'
      step1: '<strong>Download Hagicode Core:</strong> Desktop detecteert automatisch en vraagt u Hagicode-kerncomponenten te downloaden'
      step2: '<strong>Installeer kerncomponenten:</strong> Volg de instructies op het scherm om de installatie van kerncomponenten te voltooien'
      step3: '<strong>Configureer uw standaard Agent CLI:</strong> Kies een momenteel ondersteunde Agent CLI en voltooi de vereiste inlog-, autorisatie- of lokale installatiestappen.'
      note: De Desktop-interface begeleidt de hele flow. Houd het netwerk beschikbaar bij de eerste start zodat Hagicode Core kan downloaden; sommige Agent CLI's vereisen nog steeds handmatige installatie of authenticatie, maar maken nog steeds deel uit van het huidige ondersteuningsbereik.
      done: Na het voltooien van deze stappen kunt u alle Hagicode Desktop-functies normaal gebruiken.
    q3:
      question: Hoe controleer ik op updates?
      answer: Desktop controleert automatisch op updates. Wanneer een nieuwe versie beschikbaar is, verschijnt er een melding in de rechterbovenhoek van de interface. U kunt ook handmatig controleren op updates in "Instellingen".
    q4:
      question: Welke AI Agent CLI's worden ondersteund?
      intro: 'Hagicode Desktop ondersteunt momenteel de volgende Agent CLI''s:'
      active: '<strong>Momenteel ondersteund:</strong> Claude Code, Codex, GitHub Copilot, OpenCode, Hermes, QoderCLI, Kiro, Kimi, Gemini, DeepAgents en Codebuddy'
      manual: '<strong>Handmatige installatie of authenticatie:</strong> Hermes, Gemini en DeepAgents vereisen eerst een lokale installatie of authenticatiestap; de andere CLI''s bieden installatie-ingangspunten met één klik of geleide installatieflows.'
      legacy: '<strong>Alleen legacy-compatibiliteit:</strong> IFlowCli blijft alleen voor historische datacompatibiliteit en maakt geen deel uit van het huidige actieve ondersteuningsbereik.'
      closing: Ondersteuningsbereik en installatiemodus zijn afzonderlijke zaken. Een CLI die handmatige installatie vereist wordt nog steeds ondersteund.
    q5:
      question: Wordt offline gebruik ondersteund?
      intro: 'Ja! Hagicode Desktop ondersteunt volledig offline gebruik:'
      point1: Netwerkverbinding vereist voor initiële installatie en configuratie (downloaden van kerncomponenten en AI-modellen)
      point2: Alle functies kunnen offline worden gebruikt na configuratie
      point3: Uw code en gegevens worden nooit geüpload naar de cloud
      point4: Alle AI-verwerking wordt lokaal voltooid
    q6:
      question: macOS zegt dat Hagicode.app beschadigd is of niet kan worden geopend. Wat moet ik doen?
      intro: Als Hagicode Desktop is geïnstalleerd op het standaardpad /Applications/Hagicode.app en macOS Gatekeeper de eerste start blokkeert, gebruik het volgende commando om het quarantaine-attribuut van de app te verwijderen.
      cause: Dit gebeurt omdat macOS het com.apple.quarantine-attribuut toevoegt aan apps die van internet zijn gedownload. Het is een macOS-beveiligingsisolatieprobleem, geen fout in het Hagicode-installatieprogramma.
      command: sudo xattr -dr com.apple.quarantine /Applications/Hagicode.app
      note: Voer het commando uit in Terminal met beheerdersrechten en start Hagicode Desktop vervolgens opnieuw.
    q7:
      question: Hoe krijg ik hulp bij problemen?
      intro: 'Als u problemen ondervindt bij het gebruik van Hagicode Desktop, kunt u hulp krijgen via:'
      point1: '<strong>Technische ondersteuningsgroep:</strong> Word lid van QQ-groep 610394020'
      point2: '<strong>Online documentatie:</strong> Bekijk complete gebruiksdocumentatie en tutorials'
      point3: '<strong>GitHub Issues:</strong> Dien probleemrapporten in in de projectrepository'
