container:
  title: Hagicode Container - Container-implementatie
  description: Implementeer Hagicode via Docker Compose Builder. Eenvoudige configuratie, direct klaar voor gebruik. Ondersteunt meerdere afbeeldingsbronnen en automatische updates.
  hero:
    badge: Container
    title: Hagicode Container
    tagline: Implementeer snel met Docker Compose Builder, eenvoudige configuratie, direct klaar voor gebruik
    value1: Visuele configuratie, geen programmeervaardigheden nodig
    value2: Omgevingsisolatie, gegevensbeveiliging
    value3: Implementatie met één klik, snelle opstart
    ctaButton: Implementeer met Docker Compose Builder
    features:
      isolation: Omgevingsisolatie
      oneClick: Implementatie met één klik
      fastStart: Snelle opstart
  features:
    title: Waarom kiezen voor container-implementatie?
    isolation:
      title: Omgevingsisolatie
      description: Gecontaineriseerde implementatie vermijdt afhankelijkheidsconflicten, beïnvloedt de systeemomgeving niet, houdt het systeem schoon
    simple:
      title: Eenvoudige configuratie
      description: Gebruik Docker Compose Builder voor visuele configuratie, geen behoefte aan complexe scripts
    crossPlatform:
      title: Kruisplatformondersteuning
      description: Ondersteunt x86_64-architectuur, geschikt voor diverse servers en cloudplatformen
    persistent:
      title: Gegevenspersistentie
      description: Ondersteunt Volume-mounting, veilige en betrouwbare gegevens, geen gegevensverlies bij container-herstart
    autoUpdate:
      title: Automatische updates
      description: Ondersteunt watchtower voor automatische updates, verkrijg eenvoudig de nieuwste versie
    productionReady:
      title: Productieklaar
      description: Ontworpen voor productieomgevingen, ondersteunt hoge beschikbaarheid en horizontale schaling
  builder:
    title: Docker Compose Builder
    subtitle: De eenvoudigste en aanbevolen container-implementatiemethode
    visual:
      title: Visuele configuratie
      description: Configureer alle parameters via een gebruiksvriendelijke webinterface, geen behoefte om YAML-bestanden handmatig te bewerken
    generate:
      title: Configuratiegeneratie met één klik
      description: Genereer automatisch complete docker-compose.yml-bestanden met best-practiceconfiguraties
    deploy:
      title: Snelle implementatie
      description: Download configuratiebestanden met één klik en start services, voltooi implementatie in enkele minuten
    secure:
      title: Veilig en betrouwbaar
      description: Ingebouwde best practices voor beveiliging, configureert automatisch gegevensvolumes en herstartbeleid
    ctaButton: Ga naar Docker Compose Builder
  mirrors:
    title: Afbeeldingsbronselectie
    description: Kies de meest geschikte afbeeldingsbron op basis van uw netwerkomgeving en locatie
    dockerHub: Docker Hub
    dockerHubDesc: "'s Werelds grootste container-afbeeldingsregister, geschikt voor internationale netwerkgebruikers"
    dockerHubCmd: 'newbe36524/hagicode:0'
    azure: Azure ACR
    azureDesc: Microsoft Azure's afbeeldingsservice, snellere toegang vanuit China
    azureCmd: 'hagicode.azurecr.io/hagicode:0'
    aliyun: Aliyun ACR
    aliyunDesc: Aliyun's binnenlandse afbeeldingsversnelling, aanbevolen voor gebruikers in het vasteland van China
    aliyunCmd: 'registry.cn-hangzhou.aliyuncs.com/hagicode/hagicode:0'
  faq:
    title: Veelgestelde vragen
    q1:
      question: Wat is het verschil tussen de Container- en Desktop-versies?
      intro: 'Beide versies hebben hun voordelen. U kunt kiezen op basis van uw gebruiksscenario:'
      desktopTitle: Desktop-versie
      desktop1: Werkt lokaal op uw computer, lichter
      desktop2: Geen serverconfiguratie nodig, direct klaar voor gebruik
      desktop3: Geschikt voor individuele ontwikkelaars en licht gebruiksscenario's
      desktop4: Alle gegevens volledig gelokaliseerd
      containerTitle: Container-versie
      container1: Kan op servers worden geïmplementeerd, ondersteunt externe toegang
      container2: Omgevingsisolatie, beïnvloedt de systeemomgeving niet
      container3: Beter geschikt voor teamsamenwerking en productieomgevingen
      container4: Ondersteunt geautomatiseerde implementatie en horizontale schaling
    q2:
      question: Wat is Docker Compose Builder?
      intro: 'Docker Compose Builder is onze visuele configuratietool die u helpt bij:'
      point1: Alle containerparameters configureren via een webinterface
      point2: Automatisch docker-compose.yml-bestanden genereren
      point3: Ingebouwde best practices en beveiligingsconfiguraties
      point4: Configuratiebestanden downloaden en services starten met één klik
      note: U hoeft niet handmatig complexe YAML-configuraties te schrijven. Zelfs Docker-beginners kunnen eenvoudig implementeren.
    q3:
      question: Welke systeemarchitecturen ondersteunt de container-versie?
      answer: Hagicode container-afbeeldingen ondersteunen momenteel de <strong>x86_64 (amd64)</strong>-architectuur, geschikt voor de meeste servers en pc's.
      note: Docker zal automatisch de juiste architectuur voor uw systeem selecteren bij het pullen van afbeeldingen.
    q4:
      question: Hoe de container bijwerken?
      intro: 'Bij gebruik van Docker Compose-implementatie is het bijwerken heel eenvoudig:'
      code: |-
        docker-compose pull
        docker-compose up -d
      watchtower: Of gebruik Watchtower voor automatische updates.
    q5:
      question: Hoe gegevenspersistentie configureren?
      intro: 'Docker Compose Builder configureert automatisch gegevensvolumes. Standaard worden uw gegevens opgeslagen in Docker Volumes, wat zorgt voor:'
      point1: Gegevens gaan niet verloren wanneer containers worden verwijderd
      point2: Gegevens blijven behouden tijdens container-upgrades
      point3: Eenvoudige back-up en herstel
    q6:
      question: Wat te doen bij container-opstartfout?
      intro: 'Stappen om container-opstartfouten op te lossen:'
      step1:
        title: 'Controleer containerstatus:'
        code: docker-compose ps
      step2:
        title: 'Controleer containerlogs:'
        code: docker-compose logs hagicode
      step3:
        title: 'Controleer poortbezetting:'
        desc: 'Als uw servicepoort 3000 is, gebruik dit commando om te controleren:'
        code: netstat -tlnp | grep 3000
        solution: 'Als de poort bezet is, kunt u:'
        solution1: Het proces stoppen dat de poort bezet
        solution2: Of een andere poort configureren in Docker Compose Builder
      help: Als het probleem aanhoudt, raadpleeg de gedetailleerde documentatie of neem contact op met technische ondersteuning.
  cta:
    title: Begin met Docker Compose Builder
    subtitle: De eenvoudigste en aanbevolen container-implementatiemethode
    button: Ga naar implementatiehandleiding
    github: GitHub-repository
