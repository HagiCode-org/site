container:
  title: Hagicode Container - Ανάπτυξη Container
  description: Αναπτύξτε το Hagicode μέσω Docker Compose Builder. Απλή διαμόρφωση, έτοιμο για χρήση. Υποστηρίζει πολλαπλές πηγές εικόνων και αυτόματες ενημερώσεις.
  hero:
    badge: Container
    title: Hagicode Container
    tagline: Γρήγη ανάπτυξη με Docker Compose Builder, απλή διαμόρφωση, έτοιμο για χρήση
    value1: Οπτική διαμόρφωση, δεν απαιτείται κώδικας
    value2: Απομόνωση περιβάλλοντος, ασφάλεια δεδομένων
    value3: Ανάπτυξη με ένα κλικ, γρήγορη εκκίνηση
    ctaButton: Ανάπτυξη με Docker Compose Builder
    features:
      isolation: Απομόνωση περιβάλλοντος
      oneClick: Ανάπτυξη με ένα κλικ
      fastStart: Γρήγορη εκκίνηση
  features:
    title: Γιατί να επιλέξετε ανάπτυξη Container;
    isolation:
      title: Απομόνωση περιβάλλοντος
      description: Η ανάπτυξη σε container αποφεύγει συγκρούσεις εξαρτήσεων, δεν επηρεάζει το περιβάλλον συστήματος, διατηρεί το σύστημα καθαρό
    simple:
      title: Απλή διαμόρφωση
      description: Χρησιμοποιήστε το Docker Compose Builder για οπτική διαμόρφωση, δεν χρειάζεται να γράψετε πολύπλοκα σενάρια
    crossPlatform:
      title: Υποστήριξη πολλαπλών πλατφορμών
      description: Υποστηρίζει αρχιτεκτονική x86_64, κατάλληλη για διάφορους διακομιστές και πλατφόρμες cloud
    persistent:
      title: Μονιμότητα δεδομένων
      description: Υποστηρίζει προσάρτηση Volume, ασφαλή και αξιόπιστα δεδομένα, χωρίς απώλεια δεδομένων κατά την επανεκκίνηση του container
    autoUpdate:
      title: Αυτόματες ενημερώσεις
      description: Υποστηρίζει watchtower για αυτόματες ενημερώσεις, εύκολη απόκτηση της πιο πρόσφατης έκδοσης
    productionReady:
      title: Έτοιμο για παραγωγή
      description: Σχεδιασμένο για περιβάλλοντα παραγωγής, υποστηρίζει υψηλή διαθεσιμότητα και οριζόντια κλιμάκωση
  builder:
    title: Docker Compose Builder
    subtitle: Η πιο απλή και προτεινόμενη μέθοδος ανάπτυξης container
    visual:
      title: Οπτική διαμόρφωση
      description: Διαμορφώστε όλες τις παραμέτρους μέσα από ένα φιλικό περιβάλλον ιστού, δεν χρειάζεται να επεξεργαστείτε μη αυτόματα αρχεία YAML
    generate:
      title: Δημιουργία διαμόρφωσης με ένα κλικ
      description: Δημιουργήστε αυτόματα πλήρη αρχεία docker-compose.yml με διαμορφώσεις βέλτιστων πρακτικών
    deploy:
      title: Γρήγη ανάπτυξη
      description: Λήψη αρχείων διαμόρφωσης και εκκίνηση υπηρεσιών με ένα κλικ, ολοκλήρωση ανάπτυξης σε λίγα λεπτά
    secure:
      title: Ασφαλές και αξιόπιστο
      description: Ενσωματωμένες βέλτιστες πρακτικές ασφάλειας, διαμορφώνει αυτόματα τόμους δεδομένων και πολιτικές επανεκκίνησης
    ctaButton: Μετάβαση στο Docker Compose Builder
  mirrors:
    title: Επιλογή πηγής εικόνων
    description: Επιλέξτε την πιο κατάλληλη πηγή εικόνων βάσει του περιβάλλοντος δικτύου και της τοποθεσίας σας
    dockerHub: Docker Hub
    dockerHubDesc: Το μεγαλύτερο μητρώο εικόνων container στον κόσμο, κατάλληλο για χρήστες με διεθνές δίκτυο
    dockerHubCmd: newbe36524/hagicode:0
    azure: Azure ACR
    azureDesc: Η υπηρεσία εικόνων του Microsoft Azure, ταχύτερη πρόσβαση από την Κίνα
    azureCmd: hagicode.azurecr.io/hagicode:0
    aliyun: Aliyun ACR
    aliyunDesc: Εγχώρια επιτάχυνση εικόνων Aliyun, συνιστάται για χρήστες στην ηπειρωτική Κίνα
    aliyunCmd: registry.cn-hangzhou.aliyuncs.com/hagicode/hagicode:0
  faq:
    title: Συχνές ερωτήσεις
    q1:
      question: Ποια είναι η διαφορά μεταξύ των εκδόσεων Container και Desktop;
      intro: 'Και οι δύο εκδόσεις έχουν τα πλεονεκτήματά τους. Μπορείτε να επιλέξετε με βάση το σενάριο χρήσης σας:'
      desktopTitle: Έκδοση Desktop
      desktop1: Εκτελείται τοπικά στον υπολογιστή σας, πιο ελαφριά
      desktop2: Δεν απαιτείται διαμόρφωση διακομιστή, έτοιμη για χρήση αμέσως
      desktop3: Κατάλληλη για μεμονωμένους προγραμματιστές και ελαφριά σενάρια χρήσης
      desktop4: Όλα τα δεδομένα πλήρως εντοπισμένα
      containerTitle: Έκδοση Container
      container1: Μπορεί να αναπτυχθεί σε διακομιστές, υποστηρίζει απομακρυσμένη πρόσβαση
      container2: Απομόνωση περιβάλλοντος, δεν επηρεάζει το περιβάλλον συστήματος
      container3: Πιο κατάλληλη για ομαδική συνεργασία και περιβάλλοντα παραγωγής
      container4: Υποστηρίζει αυτοματοποιημένη ανάπτυξη και οριζόντια κλιμάκωση
    q2:
      question: Τι είναι το Docker Compose Builder;
      intro: 'Το Docker Compose Builder είναι το οπτικό μας εργαλείο διαμόρφωσης που σας βοηθά:'
      point1: Να διαμορφώσετε όλες τις παραμέτρους container μέσω περιβάλλοντος ιστού
      point2: Να δημιουργήσετε αυτόματα αρχεία docker-compose.yml
      point3: Ενσωματωμένες βέλτιστες πρακτικές και διαμορφώσεις ασφάλειας
      point4: Λήψη και εκκίνηση υπηρεσιών με ένα κλικ
      note: Δεν χρειάζεται να γράψετε μη αυτόματα πολύπλοκες διαμορφώσεις YAML. Ακόμα και οι αρχάριοι στο Docker μπορούν να αναπτύξουν εύκολα.
    q3:
      question: Ποιες αρχιτεκτονικές συστήματος υποστηρίζει η έκδοση container;
      answer: Οι εικόνες container του Hagicode υποστηρίζουν προς το παρόν την αρχιτεκτονική <strong>x86_64 (amd64)</strong>, κατάλληλη για τους περισσότερους διακομιστές και υπολογιστές.
      note: Το Docker θα επιλέξει αυτόματα την κατάλληλη αρχιτεκτονική για το σύστημά σας κατά τη λήψη εικόνων.
    q4:
      question: Πώς να ενημερώσω το container;
      intro: 'Κατά τη χρήση ανάπτυξης Docker Compose, η ενημέρωση είναι πολύ απλή:'
      code: |-
        docker-compose pull
        docker-compose up -d
      watchtower: Ή χρησιμοποιήστε το Watchtower για αυτόματες ενημερώσεις.
    q5:
      question: Πώς να διαμορφώσω τη μονιμότητα δεδομένων;
      intro: 'Το Docker Compose Builder διαμορφώνει αυτόματα τόμους δεδομένων. Από προεπιλογή, τα δεδομένα σας θα αποθηκεύονται σε Docker Volumes, διασφαλίζοντας:'
      point1: Τα δεδομένα δεν χάνονται όταν διαγράφονται τα container
      point2: Τα δεδομένα διατηρούνται κατά τις αναβαθμίσεις container
      point3: Εύκολη δημιουργία αντιγράφων ασφαλείας και ανάκτηση
    q6:
      question: Τι να κάνω αν η εκκίνηση του container αποτύχει;
      intro: 'Βήματα αντιμετώπισης αποτυχίας εκκίνησης container:'
      step1:
        title: 'Έλεγχος κατάστασης container:'
        code: docker-compose ps
      step2:
        title: 'Έλεγχος καταγραφών container:'
        code: docker-compose logs hagicode
      step3:
        title: 'Έλεγχος κατάληψης θύρας:'
        desc: 'Αν η θύρα της υπηρεσίας σας είναι 3000, χρησιμοποιήστε αυτή την εντολή για έλεγχο:'
        code: netstat -tlnp | grep 3000
        solution: 'Αν η θύρα είναι κατειλημμένη, μπορείτε:'
        solution1: Να σταματήσετε τη διαδικασία που καταλαμβάνει τη θύρα
        solution2: Ή να διαμορφώσετε μια διαφορετική θύρα στο Docker Compose Builder
      help: Αν το πρόβλημα παραμένει, ελέγξτε την αναλυτική τεκμηρίωση ή επικοινωνήστε με την τεχνική υποστήριξη.
  cta:
    title: Ξεκινήστε να χρησιμοποιείτε το Docker Compose Builder
    subtitle: Η πιο απλή και προτεινόμενη μέθοδος ανάπτυξης container
    button: Μετάβαση στον οδηγό ανάπτυξης
    github: Αποθετήριο GitHub
