desktop:
  title: Hagicode Desktop - Λήψη
  description: Κατεβάστε το Hagicode Desktop, έναν εντοπισμένο βοηθό κώδικα AI. Υποστηρίζει Windows, macOS και Linux. Προστασία ιδιωτικότητας, γρήγορη απόκριση.
  features:
    title: Βασικά χαρακτηριστικά
    local:
      title: Τοπική εκτέλεση
      description: Όλα τα δεδομένα επεξεργάζονται τοπικά χωρίς μεταφόρτωση στο cloud, διασφαλίζοντας το ιδιωτικό και την ασφάλεια του κώδικα
    privacy:
      title: Προστασία ιδιωτικότητας
      description: Ο κώδικας δεν μεταφορτώνεται ποτέ, υποστηρίζει χρήση εκτός σύνδεσης, προστατεύοντας την πνευματική σας ιδιοκτησία
    fast:
      title: Γρήγορη απόκριση
      description: Χρόνος απόκρισης σε επίπεδο χιλιοστού του δευτερολέπτου, δεν απαιτούνται αιτήματα δικτύου, ενισχύοντας την αποδοτικότητα ανάπτυξης
    crossPlatform:
      title: Υποστήριξη πολλαπλών πλατφορμών
      description: Υποστηρίζει Windows, macOS και Linux για την ικανοποίηση διαφορετικών αναγκών αναπτυξιακού περιβάλλοντος
    autoUpdate:
      title: Αυτόματες ενημερώσεις
      description: Ελέγχει αυτόματα για ενημερώσεις και αναβαθμίζει στην πιο πρόσφατη έκδοση με ένα κλικ
    multiLanguage:
      title: Πολυγλωσσική υποστήριξη
      description: Ενσωματωμένη κινεζική και αγγλική διεπαφή, υποστηρίζοντας διεθνή ομαδική συνεργασία
  systemRequirements:
    title: Απαιτήσεις συστήματος
    windows: Windows
    macos: macOS
    linux: Linux
    os: Λειτουργικό σύστημα
    processor: Επεξεργαστής
    memory: Μνήμη
    diskSpace: Χώρος στον δίσκο
    network: Δίκτυο
    windowsOs: Windows 10/11 (64-bit)
    macosOs: macOS 12+ (Monterey ή νεότερο)
    linuxOs: Ubuntu 20.04+ / Debian 11+ / Άλλες κύριες διανομές
    windowsProcessor: Intel Core i3 ή ισοδύναμος επεξεργαστής
    macosProcessor: Apple Silicon (M1/M2/M3) ή Intel Core i3+
    linuxProcessor: Intel Core i3 ή ισοδύναμος επεξεργαστής
    memoryRec: 4GB RAM (8GB συνιστάται)
    disk: 2GB διαθέσιμος χώρος
    networkDesc: Απαιτείται σύνδεση δικτύου για την αρχική λήψη (μπορεί να χρησιμοποιηθεί εκτός σύνδεσης στη συνέχεια)
  download:
    title: Πακέτα λήψης
    windowsDesc: Σταθερά προγράμματα εγκατάστασης για Windows 10/11, συμπεριλαμβανομένων εκδόσεων εγκατάστασης και φορητών.
    macosDesc: Εγγενείς εκδόσεις για Apple Silicon και Intel Mac.
    linuxDesc: Πακέτα AppImage και tarball για κύριες διανομές Linux x64 και ARM64.
    note: Αν η λίστα πακέτων εδώ αποτύχει να φορτώσει, χρησιμοποιήστε τον σύνδεσμο ιστορικού εκδόσεων στην περιοχή hero για πρόσβαση στο κανονικό ευρετήριο.
    features:
      signed: Υπογεγραμμένα πακέτα
      autoUpdate: Αυτόματη ανίχνευση ενημερώσεων
      multiLanguage: Πολυγλωσσική διεπαφή
  installation:
    title: Γρήγορη εγκατάσταση
    step1:
      number: '1'
      title: Λήψη προγράμματος εγκατάστασης
      description: Επιλέξτε το κατάλληλο πρόγραμμα εγκατάστασης για το λειτουργικό σας σύστημα
    step2:
      number: '2'
      title: Εκτέλεση προγράμματος εγκατάστασης
      description: Κάντε διπλό κλικ στο ληφθέν πρόγραμμα εγκατάστασης και ακολουθήστε τις οδηγίες για να ολοκληρώσετε την εγκατάσταση
    step3:
      number: '3'
      title: Εκκίνηση εφαρμογής
      description: Κατά την πρώτη εκκίνηση, θα σας καθοδηγήσει στην αρχική διαμόρφωση
    step4:
      number: '4'
      title: Ξεκινήστε τη χρήση
      description: Μετά τη διαμόρφωση, μπορείτε να ξεκινήσετε να χρησιμοποιείτε το Hagicode Desktop
  faq:
    title: Συχνές ερωτήσεις
    q1:
      question: Ποια είναι η διαφορά μεταξύ των εκδόσεων Desktop και Server;
      intro: 'Το Hagicode προσφέρει δύο επιλογές ανάπτυξης: έκδοση Desktop και έκδοση Server. Καθεμία έχει τα πλεονεκτήματά της, αλλά και οι δύο υιοθετούν μια προσέγγιση ελεγχόμενου από τον χρήστη διακομιστή και δεδομένων, παρέχοντας καλύτερη προστασία δεδομένων.'
      desktopTitle: Έκδοση Desktop
      desktop1: Εκτελείται τοπικά στον υπολογιστή σας, πιο ελαφριά
      desktop2: Δεν απαιτείται διαμόρφωση διακομιστή, έτοιμη για χρήση αμέσως
      desktop3: Κατάλληλη για μεμονωμένους προγραμματιστές και ελαφριά σενάρια χρήσης
      desktop4: Όλα τα δεδομένα πλήρως εντοπισμένα
      serverTitle: Έκδοση Server
      server1: Μπορεί να αναπτυχθεί σε απομακρυσμένους διακομιστές
      server2: Υποστηρίζει πολυ-χρηστική απομακρυσμένη πρόσβαση
      server3: Πιο κατάλληλη για ομαδική συνεργασία και κλιμάκωση
      server4: Προετοιμάζει για μελλοντικές επιχειρηματικές λειτουργίες και συγχρονισμό πολλαπλών συσκευών
      conclusion: Όποια έκδοση κι αν επιλέξετε, έχετε πλήρη έλεγχο του διακομιστή και των δεδομένων σας, απολαμβάνοντας καλύτερη προστασία ιδιωτικότητας και ασφάλεια δεδομένων.
    q2:
      question: Τι πρέπει να κάνω μετά την εγκατάσταση;
      intro: 'Το Hagicode Desktop είναι ουσιαστικά ένας εκκινητής. Κατά την πρώτη εκκίνηση μετά την εγκατάσταση, θα σας καθοδηγήσει στα εξής βήματα:'
      step1: <strong>Λήψη Hagicode Core:</strong> Το Desktop θα ανιχνεύσει αυτόματα και θα σας προτρέψει να κατεβάσετε τα βασικά στοιχεία του Hagicode
      step2: <strong>Εγκατάσταση βασικών στοιχείων:</strong> Ακολουθήστε τις οδηγίες στην οθόνη για να ολοκληρώσετε την εγκατάσταση των βασικών στοιχείων
      step3: <strong>Διαμόρφωση του προεπιλεγμένου Agent CLI:</strong> Επιλέξτε ένα προς το παρόν υποστηριζόμενο Agent CLI και ολοκληρώστε τα απαιτούμενα βήματα σύνδεσης, εξουσιοδότησης ή τοπικής εγκατάστασης.
      note: Η διεπαφή του Desktop καθοδηγεί σε όλη τη ροή. Διατηρήστε το δίκτυο διαθέσιμο κατά την πρώτη εκκίνηση ώστε το Hagicode Core να μπορέσει να ληφθεί· ορισμένα Agent CLIs εξακολουθούν να απαιτούν μη αυτόματη εγκατάσταση ή ταυτοποίηση, αλλά αποτελούν ακόμα μέρος του τρέχοντος εύρους υποστήριξης.
      done: Αφού ολοκληρώσετε αυτά τα βήματα, μπορείτε να χρησιμοποιήσετε όλες τις λειτουργίες του Hagicode Desktop κανονικά.
    q3:
      question: Πώς ελέγχω για ενημερώσεις;
      answer: Το Desktop ελέγχει αυτόματα για ενημερώσεις. Όταν είναι διαθέσιμη μια νέα έκδοση, θα εμφανιστεί μια ειδοποίηση στην πάνω δεξιά γωνία της διεπαφής. Μπορείτε επίσης να ελέγξετε μη αυτόματα για ενημερώσεις στις "Ρυθμίσεις".
    q4:
      question: Ποια AI Agent CLIs υποστηρίζονται;
      intro: 'Το Hagicode Desktop υποστηρίζει προς το παρόν τα εξής Agent CLIs:'
      active: <strong>Προς το παρόν υποστηριζόμενα:</strong> Claude Code, Codex, GitHub Copilot, OpenCode, Hermes, QoderCLI, Kiro, Kimi, Gemini, DeepAgents και Codebuddy
      manual: <strong>Μη αυτόματη εγκατάσταση ή ταυτοποίηση:</strong> Τα Hermes, Gemini και DeepAgents απαιτούν πρώτα τοπική εγκατάσταση ή βήμα ταυτοποίησης· τα υπόλοιπα CLIs παρέχουν σημεία εισόδου εγκατάστασης με ένα κλικ ή καθοδηγούμενες ροές εγκατάστασης.
      legacy: <strong>Μόνο για συμβατότητα παλαιού τύπου:</strong> Το IFlowCli παραμένει μόνο για συμβατότητα ιστορικών δεδομένων και δεν αποτελεί μέρος του τρέχοντος ενεργού εύρους υποστήριξης.
      closing: Το εύρος υποστήριξης και η λειτουργία ρύθμισης είναι ξεχωριστά ζητήματα. Ένα CLI που χρειάζεται μη αυτόματη εγκατάσταση εξακολουθεί να υποστηρίζεται.
    q5:
      question: Υποστηρίζει χρήση εκτός σύνδεσης;
      intro: 'Ναι! Το Hagicode Desktop υποστηρίζει πλήρη χρήση εκτός σύνδεσης:'
      point1: Απαιτείται σύνδεση δικτύου για την αρχική εγκατάσταση και διαμόρφωση (λήψη βασικών στοιχείων και μοντέλων AI)
      point2: Όλες οι λειτουργίες μπορούν να χρησιμοποιηθούν εκτός σύνδεσης μετά τη διαμόρφωση
      point3: Ο κώδικας και τα δεδομένα σας δεν μεταφορτώνονται ποτέ στο cloud
      point4: Όλη η επεξεργασία AI ολοκληρώνεται τοπικά
    q6:
      question: Το macOS αναφέρει ότι το Hagicode.app είναι κατεστραμμένο ή δεν μπορεί να ανοιχτεί. Τι πρέπει να κάνω;
      intro: Αν το Hagicode Desktop είναι εγκατεστημένο στην προεπιλεγμένη διαδρομή /Applications/Hagicode.app και το macOS Gatekeeper αποτρέπει την πρώτη εκκίνηση, χρησιμοποιήστε την ακόλουθη εντολή για να καταργήσετε το χαρακτηριστικό καραντίνας από την εφαρμογή.
      cause: Αυτό συμβαίνει επειδή το macOS προσθέτει το χαρακτηριστικό com.apple.quarantine σε εφαρμογές που λήφθηκαν από το διαδίκτυο. Είναι ένα ζήτημα απομόνωσης ασφάλειας του macOS, όχι μια αποτυχία του εγκαταστάτη Hagicode.
      command: sudo xattr -dr com.apple.quarantine /Applications/Hagicode.app
      note: Εκτελέστε την εντολή στο Terminal με δικαιώματα διαχειριστή και, στη συνέχεια, επανεκκινήστε το Hagicode Desktop.
    q7:
      question: Πώς να λάβετε βοήθεια όταν αντιμετωπίζετε προβλήματα;
      intro: 'Αν αντιμετωπίσετε προβλήματα κατά τη χρήση του Hagicode Desktop, μπορείτε να λάβετε βοήθεια μέσω:'
      point1: <strong>Ομάδα τεχνικής υποστήριξης:</strong> Εγγραφείτε στην QQ Ομάδα 610394020
      point2: <strong>Ηλεκτρονική τεκμηρίωση:</strong> Προβολή πλήρους τεκμηρίωσης χρήσης και εκπαιδευτικών οδηγιών
      point3: <strong>GitHub Issues:</strong> Υποβολή αναφορών προβλημάτων στο αποθετήριο του έργου
