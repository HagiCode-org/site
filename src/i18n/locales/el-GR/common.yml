pageMeta:
  home:
    title: Hagicode - Έξυπνος · Αποδοτικός · Διασκεδαστικός Βοηθός Κώδικα AI
    description: Επαναπροσδιορίστε τον προγραμματισμό με AI. Οι ροές εργασίας OpenSpec, η εκτέλεση πολλαπλών πρακτόρων-πολλαπλών εμφανίσεων και το gameplay Hero Dungeon κάνουν την ανάπτυξη πιο γρήγορη και ελκυστική
  desktop:
    title: Hagicode Desktop - Λήψη
    description: Κατεβάστε το Hagicode Desktop, έναν εντοπισμένο βοηθό κώδικα AI. Υποστηρίζει Windows, macOS και Linux. Προστασία ιδιωτικότητας, γρήγορη απόκριση.
    runtimeFallbackLabel: Εναλλακτική
    runtimeFallbackCopy: 'Αν η φόρτωση πακέτων αποτύχει εδώ, αυτή η σελίδα ανακατευθύνει στο κανονικό ιστορικό εκδόσεων του Index Desktop:'
  container:
    title: Hagicode Container - Ανάπτυξη Docker
    description: Αναπτύξτε το Hagicode με Docker Compose Builder. Απλή διαμόρφωση, έτοιμο για χρήση. Υποστηρίζει πολλαπλές πηγές εικόνων και αυτόματες ενημερώσεις.
    faqHelp: Αν το πρόβλημα παραμένει, ελέγξτε την <a href="{{docsUrl}}" data-track-event="open-container-deployment-guide" data-track-source="container-faq-help">αναλυτική τεκμηρίωση</a> ή επικοινωνήστε με την τεχνική υποστήριξη.
