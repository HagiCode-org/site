showcase:
  title: Τελευταίες προβολές προϊόντος
  description: Από την εκτέλεση προτάσεων και τους πίνακες συνεδριών μέχρι την ανάλυση tokens, τη διαχείριση χώρων εργασίας και την πρόοδο επιτευγμάτων, η αρχική σελίδα χρησιμοποιεί πλέον τις πιο πρόσφατες επιμελημένες στιγμιότυποι που συντηρούνται με τον ιστοτόπο τεκμηρίωσης.
  controls:
    previous: Προηγούμενο
    next: Επόμενο
    current: Επιλεγμένη προβολή
    railLabel: Πλοήγηση στιγμιότυπων προϊόντος
    selectPrefix: 'Εναλλαγή σε: '
    activeState: Εμφανίζεται τώρα
    previewState: Προεπισκόπηση
    imageUnavailable: Η εικόνα δεν είναι διαθέσιμη
    openFullscreen: 'Άνοιγμα πλήρους οθόνης: '
    openFullscreenHint: Κλικ για μεγέθυνση
    closeFullscreen: Κλείσιμο πλήρους οθόνης
  screenshots:
    proposalWorkflow:
      title: Επισκόπηση εκτέλεσης προτάσεων
      description: Διατηρήστε το στάδιο ροής εργασίας, το αποτέλεσμα εκτέλεσης και το πλαίσιο συνεδρίας σε μια οθόνη ώστε οι ομάδες να βλέπουν ακριβώς πού βρίσκεται μια αλλαγή πριν προχωρήσουν.
      alt: Στιγμιότυπο οθόνης εκτέλεσης προτάσεων HagiCode που εμφανίζει στάδια ροής εργασίας, αποτέλεσμα εκτέλεσης και πλαϊνό πλαίσιο συνεδρίας
    sessionBoard:
      title: Πίνακας συνεδριών και σχεδιασμός dungeons
      description: Εκκρεμείς, σε εξέλιξη και αρχειοθετημένες συνεδρίες παραμένουν ορατές δίπλα σε έναν πίνακα φανταστικών εργασιών, ώστε η παράλληλη εργασία πρακτόρων να είναι εύκολα σαρωμένη με μια ματιά.
      alt: Στιγμιότυπο οθόνης πίνακα συνεδριών HagiCode που εμφανίζει εκκρεμείς, σε εξέλιξη και αρχειοθετημένες στήλες δίπλα σε έναν πίνακα φανταστικών εργασιών
    tokenAnalytics:
      title: Ανάλυση tokens σε πραγματικό χρόνο
      description: Παρακολουθήστε την απόδοση, την πρόσφατη δραστηριότητα API και τη συνολική χρήση σε μια επιφάνεια μετρικών ώστε το κόστος και ο ρυθμός να παραμένουν ελεγχόσιμα κατά την παράλληλη εκτέλεση.
      alt: Στιγμιότυπο οθόνης ανάλυσης tokens HagiCode που εμφανίζει απόδοση, πρόσφατη δραστηριότητα API και συνολική χρήση
    workspaceManagement:
      title: Διαχείριση χώρων εργασίας και θησαυροφυλακίων
      description: Διαχειριστείτε θησαυροφυλάκια χρηστών, συστημικά θησαυροφυλάκια και σημεία εισόδου code-server από μια επιφάνεια ελέγχου σχεδιασμένη για κοινόχρηστα περιβάλλοντα και γρήγη συντήρηση.
      alt: Στιγμιότυπο οθόνης διαχείρισης χώρων εργασίας HagiCode που εμφανίζει θησαυροφυλάκια χρηστών, συστημικά θησαυροφυλάκια και ενέργειες code-server
    achievementProgress:
      title: Πρόοδος επιτευγμάτων και ανάπτυξης
      description: Ημερήσια πρόοδος, παγκόσμια ανάπτυξη και μετρήσεις κύκλου ζωής συγκεντρώνονται σε έναν πίνακα ελέγχου ώστε η μακροχρόνια υιοθέτηση να αισθάνεται μετρήσιμη αντί για αφηρημένη.
      alt: Στιγμιότυπο οθόνης πίνακα επιτευγμάτων HagiCode που εμφανίζει ημερήσια πρόοδο, παγκόσμια ανάπτυξη και μετρήσεις κύκλου ζωής
installOptions:
  sectionTitle: Επιλέξτε τη μέθοδο εγκατάστασής σας
  sectionDescription: Επιλέξτε την πιο κατάλληλη μέθοδο εγκατάστασης βάσει του σεναρίου χρήσης σας
  desktop:
    title: Εφαρμογή Desktop
    description: Εκτελείται τοπικά στον υπολογιστή σας, ελαφριά και βολική, έτοιμη για χρήση αμέσως
    features:
      - Τοπική εκτέλεση, πλήρης ιδιωτικότητα δεδομένων
      - Υποστηρίζει Windows, macOS και Linux
      - Δεν απαιτείται διαμόρφωση διακομιστή
      - Αυτόματες ενημερώσεις, πάντα με την πιο πρόσφατη έκδοση
      - Κατάλληλη για μεμονωμένους προγραμματιστές
    ctaText: Λήψη εφαρμογής Desktop
  container:
    title: Έκδοση Container
    description: Ανάπτυξη σε διακομιστές, υποστηρίζει απομακρυσμένη πρόσβαση, κατάλληλη για ομαδική συνεργασία
    features:
      - Υποστηρίζει αρχιτεκτονική x86_64
      - Απομόνωση περιβάλλοντος, δεν επηρεάζει το σύστημα
      - Υποστηρίζει Docker Compose Builder
      - Μόνιμα δεδομένα, ασφαλή και αξιόπιστα
      - Κατάλληλη για περιβάλλοντα παραγωγής
    ctaText: Οδηγός ανάπτυξης container
  badge: Προτεινόμενο
