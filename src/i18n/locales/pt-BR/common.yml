showcase:
  title: Visoes mais recentes do produto
  description: Da execucao de propostas e dos quadros de sessao ate a analise de tokens, a gestao do workspace e o progresso de conquistas, a pagina inicial agora usa as capturas mais recentes selecionadas e mantidas junto com o site de docs.
