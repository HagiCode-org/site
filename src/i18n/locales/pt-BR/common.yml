    proposalWorkflow:
      title: Visao geral da execucao de propostas
      description: Mantem a etapa do fluxo, o resultado da execucao e o contexto da sessao em uma so tela para que a equipe veja exatamente em que ponto uma mudanca esta antes de seguir adiante.
      alt: Captura da execucao de propostas no HagiCode mostrando etapas do fluxo, resultado da execucao e barra lateral da sessao
    sessionBoard:
      title: Quadro de sessoes e planejamento de dungeon
      description: Sessoes pendentes, em andamento e arquivadas continuam visiveis ao lado de um painel de tarefas com tema fantasy, facilitando a leitura do trabalho paralelo dos agentes de relance.
      alt: Captura do quadro de sessoes do HagiCode mostrando colunas pendentes, em andamento e arquivadas ao lado de um painel de tarefas fantasy
    tokenAnalytics:
      title: Analise de tokens em tempo real
      description: Acompanhe throughput, atividade recente da API e uso total em uma unica superficie de metricas para manter custo e ritmo sob controle durante a execucao paralela.
      alt: Captura da analise de tokens do HagiCode mostrando throughput, atividade recente da API e uso total
    workspaceManagement:
      title: Gestao de workspace e vaults
      description: Gerencie vaults de usuario, vaults do sistema e pontos de entrada do code-server em uma unica superficie de controle pensada para ambientes compartilhados e manutencao rapida.
      alt: Captura da gestao de workspace do HagiCode mostrando vaults de usuario, vaults do sistema e acoes do code-server
    achievementProgress:
      title: Progresso de conquistas e crescimento
      description: Progresso diario, crescimento global e metricas de ciclo de vida se unem em um unico dashboard para que a adocao de longo prazo pareca mensuravel em vez de abstrata.
      alt: Captura do dashboard de conquistas do HagiCode mostrando progresso diario, crescimento global e metricas de ciclo de vida
