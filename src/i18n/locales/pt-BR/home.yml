workflowBoard:
  title: "Vários agentes, cada etapa, sempre em andamento"
  description: "Cada agente leva a própria tarefa pela ideia, proposta, execução e arquivamento. Quando uma execução é arquivada, a próxima começa, e o trabalho avança em todas as etapas ao mesmo tempo."
  illustrative: "Exemplo animado"
  diagramLabel: "{agents} levam, cada um, uma tarefa por estas etapas: {stages}."
  loopLabel: "O arquivo alimenta a próxima proposta"
  pause: "Pausar animação"
  play: "Reproduzir animação"
  headerSummary: "Agente / Tarefa"
  tasks:
    - "Novo módulo CRUD"
    - "Revisão completa de código"
    - "Documentação de API"
    - "Pacote de testes"
  steps:
    - "Idear"
    - "Propor"
    - "Executar"
    - "Arquivar"
  activeStates:
    - "Ideando"
    - "Propondo"
    - "Executando"
    - "Arquivando"
  completedState: "Concluído"
workflowSteps:
  eyebrow: "Como funciona"
  title: "Toda mudança segue os mesmos três passos"
  description: "Sem threads de chat intermináveis. Cada mudança vira uma proposta revisável, uma execução rastreável e conhecimento reutilizável."
  loopLabel: "O arquivo alimenta a próxima proposta"
  steps:
    proposal:
      label: "Proposta"
      description: "Descreva a mudança. O Hagicode examina seu repositório e redige uma proposta com especificações e tarefas que você pode ler e corrigir antes de qualquer código ser alterado."
    execution:
      label: "Execução"
      description: "Aprove o plano e os agentes o executam tarefa por tarefa, em paralelo com Claude Code, Codex, GitHub Copilot e mais, marcando cada tarefa ao concluí-la."
    archive:
      label: "Arquivo"
      description: "As mudanças concluídas são arquivadas nas suas especificações. A próxima proposta as lê primeiro, então parte do que a equipe já aprendeu."
