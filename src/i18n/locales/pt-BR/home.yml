    bilibili:
      title: Visão geral do produto Hagicode no Bilibili
      description: Uma versão hospedada no Bilibili da introdução principal do produto, voltada a visitantes cujo navegador sinaliza preferência por chinês ou que preferem a rota doméstica de reprodução.
      ctaLabel: Abrir no Bilibili
  supporting:
    first:
      title: IA jogando enquanto programa
      description: Este clipe complementar mais leve mostra que o assistente continua vivo e surpreendente em sessões reais de código, em vez de parecer apenas um gerador de código seco.
      ctaLabel: Abrir no Bilibili
    second:
      title: 'GPT Codex no Hagicode: teste ao vivo'
      description: Depois da apresentação principal localizada, esta validação mais focada ajuda possíveis usuários a avaliar como o GPT Codex se comporta dentro do produto real.
      ctaLabel: Abrir no Bilibili
