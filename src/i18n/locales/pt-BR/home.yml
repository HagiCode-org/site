features:
  showcase:
    title: "Feito para o trabalho real de desenvolvimento"
    subtitle: "As propostas mantêm cada mudança revisável; agentes em paralelo mantêm o trabalho andando"
  smart:
    title: Inteligente
    subtitle: "Primeiro propor, depois executar: cada mudança deixa um registro"
    artifactsTitle: "O que cada mudança deixa para trás"
    description: "O HagiCode não fica só conversando sobre o seu código. Ele revisa o estado real do projeto, escreve a proposta e os deltas de spec, valida com rigor, executa as tarefas em ordem e, por fim, arquiva o que aprendeu para a próxima mudança."
    workflow:
      review:
        label: "Revisão"
        desc: "Revisar o estado do projeto, as specs existentes e o código relacionado antes de escrever qualquer coisa."
      scaffold:
        label: "Estrutura"
        desc: "Escolher um change-id e criar proposal.md, tasks.md e, se preciso, design.md."
      spec:
        label: "Spec"
        desc: "Traduzir a mudança em deltas de spec por capability, com requisitos explícitos."
      design:
        label: "Design"
        desc: "Registrar arquitetura e trade-offs em design.md quando a mudança envolve vários sistemas."
      tasks:
        label: "Tarefas"
        desc: "Dividir o trabalho em itens pequenos e verificáveis, com ordem e paralelismo claros."
      validate:
        label: "Validação"
        desc: "Rodar openspec validate em modo strict e resolver tudo antes de executar."
      apply:
        label: "Execução"
        desc: "Ler proposal, design e tasks e implementar em ordem, marcando o que for concluído."
      archive:
        label: "Arquivo"
        desc: "Arquivar a mudança concluída e devolver o resultado ao histórico de specs de longo prazo."
    paused: Em pausa - clique no nó para alternar
  convenient:
    title: Eficiente
    subtitle: "Vários agentes e instâncias em paralelo, para sua cota nunca ficar ociosa"
    traditional: "Um de cada vez, em fila"
    multiThread: "Lado a lado, sem esperar um pelo outro"
    description: "Claude Code, Codex, GitHub Copilot, OpenCode, Hermes e os demais Agent CLIs compatíveis podem executar várias instâncias ao mesmo tempo. Propostas, correções e revisões ganham cada uma a sua faixa, então um resultado lento não trava o resto."
    agentMatrix:
      title: Matriz de execução paralela
      badge: "Exemplo de configuração"
      status: "Ilustração: cada faixa avança, nenhuma bloqueia a outra"
      agents:
        claude:
          name: Claude Code
          role: Proposta / revisão
          instances:
            - Rascunhar a spec
            - Conferir o design
            - Revisar o arquivo
        codex:
          name: Codex
          role: Implementação / correções
          instances:
            - Construir recurso A
            - Construir recurso B
            - Corrigir regressão
        router:
          name: Qwen · GLM
          role: Análise / suporte
          instances:
            - Rastrear problema
            - Refinar copy
            - Registrar insights
    cliBay:
      title: "Agent CLIs que você pode equipar"
      hint: "Escolha uma para ver como ela se conecta"
      chain:
        agent: "Agente"
        model: "Modelo compatível"
      labels:
        whatItIs: "O que é"
        models: "Modelos e login"
        runsOn: "Onde roda"
        start: "Primeiros passos"
        questions: "Perguntas no HagiCode"
        strengths: "Destaque"
        compare: "Ler a comparação completa"
  interesting:
    title: Interessante
    subtitle: "Cada agente ganha rosto, personalidade e um mundo próprio"
    description: "Dê a cada agente um avatar, um Trait e uma Soul e escolha o vocabulário da sua equipe. A mesma escalação vira heróis e dungeons, um rancho, uma corte imperial ou uma colmeia, e níveis e troféus recompensam o trabalho enquanto ele acontece."
    worlds:
      title: "Uma escalação, dez jeitos de chamá-la"
      labels:
        agent: "Agente"
