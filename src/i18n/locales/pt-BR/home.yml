features:
  showcase:
    title: Três recursos centrais
    subtitle: Redefina sua experiência de coding com IA
  smart:
    badge: INTELIGENTE
    title: Inteligente
    subtitle: Workflow OpenSpec para elevar a eficiência do coding com IA
    efficiency: Ganho de eficiência
    traditional: Tradicional
    hagicode: Hagicode
    description: Um workflow completo de propostas em 9 estágios, da ideia ao arquivo, com assistência de IA do começo ao fim. Sua eficiência de coding pode aumentar em 3x.
    workflow:
      review:
        label: Revisão
        desc: Revisão automática
      scaffold:
        label: Scaffold
        desc: Choose a change-id and create proposal.md, tasks.md, and design.md when needed.
      spec:
        label: Spec
        desc: Translate the change into capability-level spec deltas with explicit requirements.
      design:
        label: Design
        desc: Capture architecture and trade-offs in design.md when the change spans systems.
      tasks:
        label: Tarefas
        desc: Quebra de tarefas
      validate:
        label: Validate
        desc: Run openspec validate in strict mode and clear every issue before execution.
      apply:
        label: Apply
        desc: Read proposal, design, and tasks, then implement in order while checking items off.
      archive:
        label: Arquivo
        desc: Arquivo de conhecimento
    paused: Em pausa - clique no nó para alternar
  convenient:
    badge: EFICIENTE
    title: Eficiente
    subtitle: Execução multi-agent e multi-instância que mantém sua cota em movimento
    traditional: Fluxo tradicional de Agent único / instância única
    multiThread: Matriz paralela multi-agent
    boost: Ganho de vazão
    boostValue: 10x+ em paralelo
    description: Agent CLI atualmente suportados, como Claude Code, Codex, GitHub Copilot, OpenCode e Hermes, podem trabalhar em várias instâncias ao mesmo tempo, então propostas, correções e reviews avançam em paralelo em vez de esperar em uma fila serial.
    agentMatrix:
      title: Matriz de execução paralela
      badge: Vários agentes / várias instâncias
      status: Vários agentes estão conduzindo várias instâncias agora mesmo
      agents:
        claude:
          name: Claude Code
          role: Proposta / revisão
          instances:
            - Rascunhar a spec
            - Conferir o design
            - Revisar o arquivo
        codex:
          name: Codex
          role: Implementação / correções
          instances:
            - Construir recurso A
            - Construir recurso B
            - Corrigir regressão
        router:
          name: Qwen · GLM
          role: Análise / suporte
          instances:
            - Rastrear problema
            - Refinar copy
            - Registrar insights
      supportedNames:
        title: 11 Agent CLI atualmente suportados
        names:
          - Claude Code
          - Codex
          - GitHub Copilot
          - OpenCode
          - Hermes
          - QoderCLI
          - Kiro
          - Kimi
          - Gemini
          - DeepAgents
          - Codebuddy
    supportedProvidersNote: O OpenCode pode carregar o catálogo compartilhado do OmniRoute nos padrões do modelo hero e, ao mesmo tempo, manter editáveis os identificadores brutos de modelo para workflows específicos por branch.
  interesting:
    badge: DIVERTIDO
    title: Divertido
    subtitle: Hero Dungeon torna a colaboração e a prática no campus mais vivas
    features:
      dungeons:
        label: Hero Dungeons
        desc: Transforma geração, execução e bancadas de prompt em percursos de dungeon
      captains:
        label: Escalação de capitães
        desc: Atribua o capitão hero certo a cada dungeon
      battle:
        label: Relatórios de batalha
        desc: Revise XP, níveis e resultados de execução após cada push
    description: A diversão não depende mais só de badges de conquista. Hero Dungeon, escalações de capitães, visuais de prompt e relatórios de batalha transformam a prática diária de coding com IA em uma aventura coordenada para laboratórios e equipes estudantis.
    dungeonCards:
      proposal:
        title: Dungeon de proposta
        desc: OpenSpec generate / apply / archive
        status: Capitão pronto
      autotask:
        title: Dungeon AutoTask
        desc: Correções paralelas e automação em lote
        status: 2 instâncias ativas
      prompt:
        title: Dungeon de prompt
        desc: Prévia de prompt e bancada de estilo
        status: Sincronia visual pronta
    roster:
      title: Escalação atual de capitães
      heroes:
        strategist:
          name: Spec Strategist
          role: Capitão de proposta
        runner:
          name: Patch Runner
          role: Capitão de execução
        artist:
          name: Prompt Artist
          role: Suporte visual
    battleReport:
      title: Relatório de dungeon de hoje
      badge: Hero Battle
      metrics:
        dungeons:
          value: '4'
          label: Dungeons avançadas
        level:
          value: Lv.27
          label: Nível do capitão
        xp:
          value: 12.8M
          label: XP de hoje
      note: Quando várias dungeons avançam em paralelo, este relatório reúne experiência, níveis e resultados de execução em uma única leitura.
    gallery:
      dungeons:
        title: Carrossel de mapas de dungeon
        subtitle: 10 visuais aleatórios da coleção atual de mapas de dungeon e prompts do frontend.
      heroes:
        title: Carrossel da galeria de heróis
        subtitle: 10 visuais aleatórios da coleção atual de heróis do frontend.
