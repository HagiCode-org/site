      title: การวิเคราะห์โทเค็นแบบเรียลไทม์
      description: ดูปริมาณการถ่ายโอน กิจกรรม API ล่าสุด และการใช้งานทั้งหมดบนพื้นผิวเมตริก เพื่อให้ค่าใช้จ่ายและจังหวะควบคุมได้ระหว่างการดำเนินการแบบขนาน
      alt: ภาพหน้าจอการวิเคราะห์โทเค็น HagiCode แสดงปริมาณการถ่ายโอน กิจกรรม API ล่าสุด และการใช้งานทั้งหมด
    workspaceManagement:
      title: การจัดการพื้นที่ทำงานและตู้นิรภัย
      description: จัดการตู้นิรภัยผู้ใช้ ตู้นิรภัยระบบ และจุดเข้า code-server จากพื้นผิวควบคุมเดียวที่สร้างสำหรับสภาพแวดล้อมที่แชร์และการบำรุงรักษาที่รวดเร็ว
      alt: ภาพหน้าจอการจัดการพื้นที่ทำงาน HagiCode แสดงตู้นิรภัยผู้ใช้ ตู้นิรภัยระบบ และการดำเนินการ code-server
    achievementProgress:
      title: ความคืบหน้าของความสำเร็จและการเติบโต
      description: ความคืบหน้ารายวัน การเติบโตระดับโลก และเมตริกวงจรชีวิตรวมอยู่ในแดชบอร์ดเดียว เพื่อให้การนำไปใช้ในระยะยาวรู้สึกวัดผลได้แทนที่จะเป็นนามธรรม
      alt: ภาพหน้าจอแดชบอร์ดความสำเร็จ HagiCode แสดงความคืบหน้ารายวัน การเติบโตระดับโลก และเมตริกวงจรชีวิต
installOptions:
  sectionTitle: เลือกวิธีการติดตั้งของคุณ
  sectionDescription: เลือกวิธีการติดตั้งที่เหมาะสมที่สุดตามสถานการณ์การใช้งานของคุณ
  desktop:
    title: แอปเดสก์ท็อป
    description: ทำงานบนคอมพิวเตอร์ของคุณ เบาและสะดวก พร้อมใช้งานทันที
    features:
      - ทำงานในเครื่อง ข้อมูลเป็นส่วนตัวสมบูรณ์
      - รองรับ Windows, macOS และ Linux
      - ไม่ต้องตั้งค่าเซิร์ฟเวอร์
      - อัปเดตอัตโนมัติ อยู่กับเวอร์ชันล่าสุดเสมอ
      - เหมาะสำหรับนักพัฒนาที่ทำงานคนเดียว
    ctaText: ดาวน์โหลดแอปเดสก์ท็อป
  container:
    title: เวอร์ชันคอนเทนเนอร์
    description: ปรับใช้บนเซิร์ฟเวอร์ รองรับการเข้าถึงระยะไกล เหมาะสำหรับการทำงานร่วมกันในทีม
    features:
      - รองรับสถาปัตยกรรม x86_64
      - แยกสภาพแวดล้อม ไม่กระทบระบบ
      - รองรับ Docker Compose Builder
      - ข้อมูลคงอยู่ ปลอดภัยและเชื่อถือได้
      - เหมาะสำหรับสภาพแวดล้อมการผลิต
    ctaText: คู่มือการปรับใช้คอนเทนเนอร์
  badge: แนะนำ
