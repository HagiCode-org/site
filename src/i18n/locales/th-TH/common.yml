      title: แผงเซสชันและการวางแผน dungeon
      description: เซสชันที่รอดำเนินการ กำลังดำเนินการ และเก็บถาวรยังคงมองเห็นได้ข้างแผงงานแฟนตาซี เพื่อให้งาน agent แบบขนานตรวจสอบได้ง่าย
      alt: ภาพหน้าจอแผงเซสชัน HagiCode แสดงคอลัมน์รอดำเนินการ กำลังดำเนินการ และเก็บถาวรข้างแผงงานแฟนตาซี
