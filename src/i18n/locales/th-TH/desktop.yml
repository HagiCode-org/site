desktop:
  title: Hagicode Desktop - ดาวน์โหลด
  description: ดาวน์โหลด Hagicode Desktop ผู้ช่วยเขียนโค้ด AI แบบโลคัล รองรับ Windows, macOS และ Linux ปกป้องความเป็นส่วนตัว ตอบสนองเร็ว
  features:
    title: คุณสมบัติหลัก
    local:
      title: ทำงานในเครื่อง
      description: ข้อมูลทั้งหมดถูกประมวลผลในเครื่องโดยไม่อัปโหลดไปยังคลาวด์ รับประกันความเป็นส่วนตัวและความปลอดภัยของโค้ด
    privacy:
      title: ปกป้องความเป็นส่วนตัว
      description: โค้ดไม่ถูกอัปโหลด รองรับการใช้งานออฟไลน์ ปกป้องทรัพย์สินทางปัญญาของคุณ
    fast:
      title: ตอบสนองเร็ว
      description: เวลาตอบสนองระดับมิลลิวินาที ไม่ต้องร้องขอเครือข่าย เพิ่มประสิทธิภาพการพัฒนา
    crossPlatform:
      title: รองรับหลายแพลตฟอร์ม
      description: รองรับ Windows, macOS และ Linux เพื่อตอบสนองความต้องการสภาพแวดล้อมการพัฒนาที่แตกต่างกัน
    autoUpdate:
      title: อัปเดตอัตโนมัติ
      description: ตรวจสอบอัปเดตอัตโนมัติและอัปเกรดเป็นเวอร์ชันล่าสุดด้วยคลิกเดียว
    multiLanguage:
      title: รองรับหลายภาษา
      description: อินเทอร์เฟซภาษาจีนและอังกฤษในตัว รองรับการทำงานร่วมกันในทีมระหว่างประเทศ
  systemRequirements:
    title: ข้อกำหนดระบบ
    windows: Windows
    macos: macOS
    linux: Linux
    os: ระบบปฏิบัติการ
    processor: โปรเซสเซอร์
    memory: หน่วยความจำ
    diskSpace: พื้นที่ดิสก์
    network: เครือข่าย
    windowsOs: Windows 10/11 (64-bit)
    macosOs: macOS 12+ (Monterey หรือใหม่กว่า)
    linuxOs: Ubuntu 20.04+ / Debian 11+ / ดิสทริบิวชันหลักอื่นๆ
    windowsProcessor: Intel Core i3 หรือโปรเซสเซอร์ที่เทียบเท่า
    macosProcessor: Apple Silicon (M1/M2/M3) หรือ Intel Core i3+
    linuxProcessor: Intel Core i3 หรือโปรเซสเซอร์ที่เทียบเท่า
    memoryRec: 4GB RAM (แนะนำ 8GB)
    disk: พื้นที่ว่าง 2GB
    networkDesc: ต้องการการเชื่อมต่อเครือข่ายสำหรับดาวน์โหลดครั้งแรก (สามารถใช้แบบออฟไลน์ได้หลังจากนั้น)
  download:
    title: แพ็กเกจดาวน์โหลด
    windowsDesc: ตัวติดตั้งเสถียรสำหรับ Windows 10/11 รวมถึงเวอร์ชันติดตั้งและแบบพกพา
    macosDesc: บิลด์แบบเนทีฟสำหรับ Mac Apple Silicon และ Intel
    linuxDesc: แพ็กเกจ AppImage และ tarball สำหรับดิสทริบิวชัน Linux หลัก x64 และ ARM64
    note: หากรายการแพ็กเกจที่นี่โหลดไม่สำเร็จ ใช้ลิงก์ประวัติเวอร์ชันในพื้นที่ hero เพื่อเข้าถึงดัชนีหลัก
    features:
      signed: แพ็กเกจที่ลงนาม
      autoUpdate: ตรวจจับการอัปเดตอัตโนมัติ
      multiLanguage: อินเทอร์เฟซหลายภาษา
  installation:
    title: ติดตั้งด่วน
    step1:
      number: '1'
      title: ดาวน์โหลดตัวติดตั้ง
      description: เลือกตัวติดตั้งที่เหมาะสมสำหรับระบบปฏิบัติการของคุณ
    step2:
      number: '2'
      title: เรียกใช้ตัวติดตั้ง
      description: ดับเบิลคลิกที่ตัวติดตั้งที่ดาวน์โหลดและทำตามคำแนะนำเพื่อติดตั้งให้เสร็จสมบูรณ์
    step3:
      number: '3'
      title: เปิดแอป
      description: ในการเปิดครั้งแรก จะแนะนำคุณผ่านการตั้งค่าเริ่มต้น
    step4:
      number: '4'
      title: เริ่มใช้งาน
      description: หลังจากตั้งค่าแล้ว คุณสามารถเริ่มใช้ Hagicode Desktop ได้
  faq:
    title: คำถามที่พบบ่อย
    q1:
      question: ความแตกต่างระหว่างเวอร์ชันเดสก์ท็อปและเซิร์ฟเวอร์คืออะไร?
      intro: 'Hagicode เสนอตัวเลือกการปรับใช้สองแบบ: เวอร์ชันเดสก์ท็อปและเวอร์ชันเซิร์ฟเวอร์ แต่ละเวอร์ชันมีข้อดีของตัวเอง แต่ทั้งสองใช้แนวทางเซิร์ฟเวอร์และข้อมูลที่ผู้ใช้ควบคุม ให้การปกป้องข้อมูลที่ดีกว่า'
      desktopTitle: เวอร์ชันเดสก์ท็อป
      desktop1: ทำงานบนคอมพิวเตอร์ของคุณ เบากว่า
      desktop2: ไม่ต้องตั้งค่าเซิร์ฟเวอร์ พร้อมใช้งานทันที
      desktop3: เหมาะสำหรับนักพัฒนาที่ทำงานคนเดียวและสถานการณ์การใช้งานเบาๆ
      desktop4: ข้อมูลทั้งหมดอยู่ในเครื่องทั้งหมด
      serverTitle: เวอร์ชันเซิร์ฟเวอร์
      server1: สามารถปรับใช้บนเซิร์ฟเวอร์ระยะไกล
      server2: รองรับการเข้าถึงระยะไกลหลายผู้ใช้
      server3: เหมาะสำหรับการทำงานร่วมกันในทีมและการขยายมากกว่า
      server4: เตรียมพร้อมสำหรับฟีเจอร์องค์กรในอนาคตและการซิงค์หลายอุปกรณ์
      conclusion: ไม่ว่าคุณจะเลือกเวอร์ชันใด คุณมีการควบคุมเซิร์ฟเวอร์และข้อมูลของคุณอย่างสมบูรณ์ พร้อมการปกป้องความเป็นส่วนตัวและความปลอดภัยของข้อมูลที่ดีกว่า
    q2:
      question: ฉันต้องทำอะไรหลังจากติดตั้ง?
      intro: 'Hagicode Desktop เป็น launcher โดยพื้นฐาน ในการเปิดครั้งแรกหลังติดตั้ง จะแนะนำคุณผ่านขั้นตอนเหล่านี้:'
      step1: '<strong>ดาวน์โหลด Hagicode Core:</strong> Desktop จะตรวจจับอัตโนมัติและแจ้งให้คุณดาวน์โหลดส่วนประกอบหลักของ Hagicode'
      step2: '<strong>ติดตั้งส่วนประกอบหลัก:</strong> ทำตามคำแนะนำบนหน้าจอเพื่อติดตั้งส่วนประกอบหลักให้เสร็จสมบูรณ์'
      step3: '<strong>ตั้งค่า Agent CLI เริ่มต้นของคุณ:</strong> เลือก Agent CLI ที่รองรับในปัจจุบันและทำขั้นตอนการลงชื่อเข้าใช้ การอนุญาต หรือการติดตั้งในเครื่องที่จำเป็น'
      note: อินเทอร์เฟซ Desktop แนะนำขั้นตอนทั้งหมด เปิดใช้งานเครือข่ายในการเปิดครั้งแรกเพื่อให้ Hagicode Core สามารถดาวน์โหลดได้ Agent CLI บางตัวยังต้องการการติดตั้งหรือการยืนยันตัวตนด้วยตนเอง แต่ยังคงเป็นส่วนหนึ่งของการสนับสนุนในปัจจุบัน
      done: หลังจากทำขั้นตอนเหล่านี้เสร็จแล้ว คุณสามารถใช้ฟีเจอร์ Hagicode Desktop ทั้งหมดได้ตามปกติ
    q3:
      question: ฉันตรวจสอบอัปเดตได้อย่างไร?
      answer: Desktop ตรวจสอบอัปเดตอัตโนมัติ เมื่อมีเวอร์ชันใหม่ จะมีการแจ้งเตือนที่มุมขวาบนของอินเทอร์เฟซ คุณยังสามารถตรวจสอบอัปเดตด้วยตนเองใน "การตั้งค่า"
    q4:
      question: Agent CLI ของ AI ใดบ้างที่รองรับ?
      intro: 'Hagicode Desktop รองรับ Agent CLI ต่อไปนี้ในปัจจุบัน:'
      active: '<strong>รองรับในปัจจุบัน:</strong> Claude Code, Codex, GitHub Copilot, OpenCode, Hermes, QoderCLI, Kiro, Kimi, Gemini, DeepAgents และ Codebuddy'
      manual: '<strong>ติดตั้งหรือยืนยันตัวตนด้วยตนเอง:</strong> Hermes, Gemini และ DeepAgents ต้องการการติดตั้งในเครื่องหรือขั้นตอนยืนยันตัวตนก่อน CLI อื่นๆ มีจุดเข้าติดตั้งคลิกเดียวหรือขั้นตอนการติดตั้งแบบแนะนำ'
      legacy: '<strong>รองรับเฉพาะความเข้ากันได้แบบเดิม:</strong> IFlowCli ยังคงอยู่เฉพาะสำหรับความเข้ากันได้ของข้อมูลในอดีตและไม่ใช่ส่วนหนึ่งของการสนับสนุนที่ใช้งานอยู่ในปัจจุบัน'
      closing: ขอบเขตการสนับสนุนและโหมดการตั้งค่าเป็นเรื่องที่แยกจากกัน CLI ที่ต้องการการติดตั้งด้วยตนเองยังคงได้รับการสนับสนุนในปัจจุบัน
    q5:
      question: รองรับการใช้งานออฟไลน์หรือไม่?
      intro: 'ใช่! Hagicode Desktop รองรับการใช้งานออฟไลน์อย่างสมบูรณ์:'
      point1: ต้องการการเชื่อมต่อเครือข่ายสำหรับการติดตั้งและตั้งค่าเริ่มต้น (ดาวน์โหลดส่วนประกอบหลักและโมเดล AI)
      point2: ฟีเจอร์ทั้งหมดสามารถใช้แบบออฟไลน์ได้หลังจากตั้งค่าแล้ว
      point3: โค้ดและข้อมูลของคุณไม่ถูกอัปโหลดไปยังคลาวด์
      point4: การประมวลผล AI ทั้งหมดเสร็จสิ้นในเครื่อง
    q6:
      question: macOS บอกว่า Hagicode.app เสียหายหรือไม่สามารถเปิดได้ ฉันควรทำอย่างไร?
      intro: หาก Hagicode Desktop ติดตั้งในเส้นทางเริ่มต้น /Applications/Hagicode.app และ macOS Gatekeeper บล็อกการเปิดครั้งแรก ใช้คำสั่งต่อไปนี้เพื่อลบแอตทริบิวต์กักกันจากแอป
      cause: สิ่งนี้เกิดขึ้นเนื่องจาก macOS เพิ่มแอตทริบิวต์ com.apple.quarantine ให้กับแอปที่ดาวน์โหลดจากอินเทอร์เน็ต เป็นปัญหาการแยกความปลอดภัยของ macOS ไม่ใช่ความล้มเหลวของตัวติดตั้ง Hagicode
      command: sudo xattr -dr com.apple.quarantine /Applications/Hagicode.app
      note: เรียกใช้คำสั่งใน Terminal ด้วยสิทธิ์ผู้ดูแลระบบ จากนั้นเปิด Hagicode Desktop อีกครั้ง
    q7:
      question: จะขอความช่วยเหลือเมื่อพบปัญหาได้อย่างไร?
      intro: 'หากคุณพบปัญหาขณะใช้ Hagicode Desktop คุณสามารถขอความช่วยเหลือได้ผ่าน:'
      point1: '<strong>กลุ่มสนับสนุนทางเทคนิค:</strong> เข้าร่วมกลุ่ม QQ 610394020'
      point2: '<strong>เอกสารออนไลน์:</strong> ดูเอกสารการใช้งานและบทแนะนำที่สมบูรณ์'
      point3: '<strong>GitHub Issues:</strong> ส่งรายงานปัญหาใน repository ของโปรเจกต์'
