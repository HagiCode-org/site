container:
  title: Hagicode Container - Wdrożenie kontenerowe
  description: Wdróż Hagicode przez Docker Compose Builder. Prosta konfiguracja, gotowa do użycia. Obsługuje wiele źródeł obrazów i automatyczne aktualizacje.
  hero:
    badge: Kontener
    title: Hagicode Container
    tagline: Wdrażaj szybko z Docker Compose Builder, prosta konfiguracja, gotowa do użycia
    value1: Wizualna konfiguracja, brak konieczności kodowania
    value2: Izolacja środowiska, bezpieczeństwo danych
    value3: Wdrożenie jednym kliknięciem, szybki start
    ctaButton: Wdróż z Docker Compose Builder
    features:
      isolation: Izolacja środowiska
      oneClick: Wdrożenie jednym kliknięciem
      fastStart: Szybki start
  features:
    title: Dlaczego warto wybrać wdrożenie kontenerowe?
    isolation:
      title: Izolacja środowiska
      description: Konteneryzowane wdrożenie unika konfliktów zależności, nie wpływa na środowisko systemowe, utrzymuje system w czystości
    simple:
      title: Prosta konfiguracja
      description: Użyj Docker Compose Builder do konfiguracji wizualnej, bez konieczności pisania złożonych skryptów
    crossPlatform:
      title: Obsługa wieloplatformowa
      description: Obsługuje architekturę x86_64, odpowiednia dla różnych serwerów i platform chmurowych
    persistent:
      title: Trwałość danych
      description: Obsługuje montowanie Volume, bezpieczne i niezawodne dane, brak utraty danych przy restarcie kontenera
    autoUpdate:
      title: Automatyczne aktualizacje
      description: Obsługuje watchtower do automatycznych aktualizacji, łatwo uzyskaj najnowszą wersję
    productionReady:
      title: Gotowe na produkcję
      description: Zaprojektowane dla środowisk produkcyjnych, obsługuje wysoką dostępność i skalowanie horyzontalne
  builder:
    title: Docker Compose Builder
    subtitle: Najprostsza i zalecana metoda wdrożenia kontenerowego
    visual:
      title: Konfiguracja wizualna
      description: Konfiguruj wszystkie parametry przez przyjazny interfejs Web, bez konieczności ręcznej edycji plików YAML
    generate:
      title: Generowanie konfiguracji jednym kliknięciem
      description: Automatycznie generuj kompletne pliki docker-compose.yml z konfiguracjami najlepszych praktyk
    deploy:
      title: Szybkie wdrożenie
      description: Pobierz pliki konfiguracji jednym kliknięciem i uruchom usługi, zakończ wdrożenie w kilka minut
    secure:
      title: Bezpieczne i niezawodne
      description: Wbudowane najlepsze praktyki bezpieczeństwa, automatycznie konfiguruje wolumeny danych i zasady restartu
    ctaButton: Przejdź do Docker Compose Builder
  mirrors:
    title: Wybór źródła obrazu
    description: Wybierz najbardziej odpowiednie źródło obrazu w oparciu o Twoje środowisko sieciowe i lokalizację
    dockerHub: Docker Hub
    dockerHubDesc: Największy na świecie rejestr obrazów kontenerowych, odpowiedni dla użytkowników z międzynarodową siecią
    dockerHubCmd: newbe36524/hagicode:0
    azure: Azure ACR
    azureDesc: Usługa obrazów Microsoft Azure, szybszy dostęp z Chin
    azureCmd: hagicode.azurecr.io/hagicode:0
    aliyun: Aliyun ACR
    aliyunDesc: Krajowe przyspieszenie obrazów Aliyun, zalecane dla użytkowników w Chinach kontynentalnych
    aliyunCmd: registry.cn-hangzhou.aliyuncs.com/hagicode/hagicode:0
  faq:
    title: FAQ
    q1:
      question: Jaka jest różnica między wersjami Container i Desktop?
      intro: 'Obie wersje mają swoje zalety. Możesz wybrać na podstawie swojego scenariusza użycia:'
      desktopTitle: Wersja Desktop
      desktop1: Działa lokalnie na Twoim komputerze, bardziej lekka
      desktop2: Brak konieczności konfiguracji serwera, gotowa do użycia od razu
      desktop3: Odpowiednia dla indywidualnych programistów i lekkich scenariuszy użycia
      desktop4: Wszystkie dane całkowicie zlokalizowane
      containerTitle: Wersja kontenerowa
      container1: Może być wdrażana na serwerach, obsługuje zdalny dostęp
      container2: Izolacja środowiska, nie wpływa na środowisko systemowe
      container3: Lepiej dostosowana do współpracy zespołowej i środowisk produkcyjnych
      container4: Obsługuje zautomatyzowane wdrożenie i skalowanie horyzontalne
    q2:
      question: Co to jest Docker Compose Builder?
      intro: 'Docker Compose Builder to nasze wizualne narzędzie konfiguracyjne, które pomaga:'
      point1: Konfigurować wszystkie parametry kontenera przez interfejs Web
      point2: Automatycznie generować pliki docker-compose.yml
      point3: Wbudowane najlepsze praktyki i konfiguracje bezpieczeństwa
      point4: Pobierać i uruchamiać usługi jednym kliknięciem
      note: Nie ma potrzeby ręcznego pisania złożonych konfiguracji YAML. Nawet początkujący użytkownicy Docker mogą łatwo wdrażać.
    q3:
      question: Jakie architektury systemowe obsługuje wersja kontenerowa?
      answer: Obrazy kontenerowe Hagicode obecnie obsługują architekturę <strong>x86_64 (amd64)</strong>, odpowiednią dla większości serwerów i komputerów PC.
      note: Docker automatycznie wybierze odpowiednią architekturę dla Twojego systemu podczas pobierania obrazów.
    q4:
      question: Jak zaktualizować kontener?
      intro: 'Podczas korzystania z wdrożenia Docker Compose aktualizacja jest bardzo prosta:'
      code: |-
        docker-compose pull
        docker-compose up -d
      watchtower: Lub użyj Watchtower do automatycznych aktualizacji.
    q5:
      question: Jak skonfigurować trwałość danych?
      intro: 'Docker Compose Builder automatycznie konfiguruje wolumeny danych. Domyślnie Twoje dane będą przechowywane w Docker Volumes, co zapewnia:'
      point1: Dane nie są tracone po usunięciu kontenerów
      point2: Dane są zachowane podczas aktualizacji kontenerów
      point3: Łatwa kopia zapasowa i odzyskiwanie
    q6:
      question: Co zrobić gdy uruchomienie kontenera kończy się niepowodzeniem?
      intro: 'Kroki rozwiązywania problemów z uruchomieniem kontenera:'
      step1:
        title: 'Sprawdź status kontenera:'
        code: docker-compose ps
      step2:
        title: 'Sprawdź logi kontenera:'
        code: docker-compose logs hagicode
      step3:
        title: 'Sprawdź zajętość portu:'
        desc: 'Jeśli port Twojej usługi to 3000, użyj tego polecenia aby sprawdzić:'
        code: netstat -tlnp | grep 3000
        solution: 'Jeśli port jest zajęty, możesz:'
        solution1: Zatrzymać proces zajmujący port
        solution2: Lub skonfigurować inny port w Docker Compose Builder
      help: Jeśli problem utrzymuje się, sprawdź szczegółową dokumentację lub skontaktuj się ze wsparciem technicznym.
  cta:
    title: Zacznij używać Docker Compose Builder
    subtitle: Najprostsza i zalecana metoda wdrożenia kontenerowego
    button: Przejdź do przewodnika wdrażania
    github: Repozytorium GitHub
