desktop:
  title: Hagicode Desktop - Pobierz
  description: Pobierz Hagicode Desktop, zlokalizowanego asystenta kodu AI. Obsługuje Windows, macOS i Linux. Ochrona prywatności, szybka odpowiedź.
  features:
    title: Kluczowe funkcje
    local:
      title: Lokalne wykonanie
      description: Wszystkie dane są przetwarzane lokalnie bez przesyłania do chmury, zapewniając prywatność i bezpieczeństwo kodu
    privacy:
      title: Ochrona prywatności
      description: Kod nigdy nie jest przesyłany, obsługuje użycie offline, chroniąc Twoją własność intelektualną
    fast:
      title: Szybka odpowiedź
      description: Czas odpowiedzi na poziomie milisekund, brak wymogu żądań sieciowych, zwiększając wydajność programowania
    crossPlatform:
      title: Obsługa wieloplatformowa
      description: Obsługuje Windows, macOS i Linux aby spełnić różne potrzeby środowiska programistycznego
    autoUpdate:
      title: Automatyczne aktualizacje
      description: Automatycznie sprawdza aktualizacje i aktualizuje do najnowszej wersji jednym kliknięciem
    multiLanguage:
      title: Obsługa wielu języków
      description: Wbudowany chiński i angielski interfejs, wspierający międzynarodową współpracę zespołową
  systemRequirements:
    title: Wymagania systemowe
    windows: Windows
    macos: macOS
    linux: Linux
    os: System operacyjny
    processor: Procesor
    memory: Pamięć
    diskSpace: Miejsce na dysku
    network: Sieć
    windowsOs: Windows 10/11 (64-bit)
    macosOs: macOS 12+ (Monterey lub nowszy)
    linuxOs: Ubuntu 20.04+ / Debian 11+ / Inne główne dystrybucje
    windowsProcessor: Intel Core i3 lub równoważny procesor
    macosProcessor: Apple Silicon (M1/M2/M3) lub Intel Core i3+
    linuxProcessor: Intel Core i3 lub równoważny procesor
    memoryRec: 4GB RAM (8GB zalecane)
    disk: 2GB dostępnego miejsca
    networkDesc: Połączenie sieciowe wymagane do początkowego pobrania (może być używane offline po zakończeniu)
  download:
    title: Pakiety do pobrania
    windowsDesc: Stabilne instalatory dla Windows 10/11, w tym setup i wersje przenośne.
    macosDesc: Natywne kompilacje dla komputerów Mac Apple Silicon i Intel.
    linuxDesc: Pakiety AppImage i tarball dla głównych dystrybucji Linux x64 i ARM64.
    note: Jeśli lista pakietów tutaj nie ładuje się, użyj linku historii wersji w obszarze hero, aby uzyskać dostęp do kanonicznego indeksu.
    features:
      signed: Podpisane pakiety
      autoUpdate: Automatyczne wykrywanie aktualizacji
      multiLanguage: Wielojęzyczny interfejs
  installation:
    title: Szybka instalacja
    step1:
      number: '1'
      title: Pobierz instalator
      description: Wybierz odpowiedni instalator dla swojego systemu operacyjnego
    step2:
      number: '2'
      title: Uruchom instalator
      description: Kliknij dwukrotnie pobrany instalator i postępuj zgodnie z instrukcjami, aby zakończyć instalację
    step3:
      number: '3'
      title: Uruchom aplikację
      description: Przy pierwszym uruchomieniu przeprowadzi Cię przez początkową konfigurację
    step4:
      number: '4'
      title: Zacznij używać
      description: Po konfiguracji możesz zacząć używać Hagicode Desktop
  faq:
    title: FAQ
    q1:
      question: Jaka jest różnica między wersjami Desktop i Server?
      intro: 'Hagicode oferuje dwie opcje wdrożenia: wersję Desktop i wersję Server. Każda ma swoje zalety, ale obie przyjmują podejście kontrolowanego przez użytkownika serwera i danych, zapewniając lepszą ochronę danych.'
      desktopTitle: Wersja Desktop
      desktop1: Działa lokalnie na Twoim komputerze, bardziej lekka
      desktop2: Brak konieczności konfiguracji serwera, gotowa do użycia od razu
      desktop3: Odpowiednia dla indywidualnych programistów i lekkich scenariuszy użycia
      desktop4: Wszystkie dane całkowicie zlokalizowane
      serverTitle: Wersja Server
      server1: Może być wdrażana na zdalnych serwerach
      server2: Obsługuje zdalny dostęp wielu użytkowników
      server3: Lepiej dostosowana do współpracy zespołowej i skalowania
      server4: Przygotowuje na przyszłe funkcje enterprise i synchronizację wielu urządzeń
      conclusion: Niezależnie od wybranej wersji masz pełną kontrolę nad swoim serwerem i danymi, ciesząc się lepszą ochroną prywatności i bezpieczeństwem danych.
    q2:
      question: Co muszę zrobić po instalacji?
      intro: 'Hagicode Desktop to w zasadzie launcher. Przy pierwszym uruchomieniu po instalacji przeprowadzi Cię przez te kroki:'
      step1: '<strong>Pobierz Hagicode Core:</strong> Desktop automatycznie wykryje i poprosi Cię o pobranie komponentów rdzenia Hagicode'
      step2: '<strong>Zainstaluj komponenty rdzenia:</strong> Postępuj zgodnie z instrukcjami na ekranie, aby zakończyć instalację komponentów rdzenia'
      step3: '<strong>Skonfiguruj swój domyślny Agent CLI:</strong> Wybierz obecnie obsługiwany Agent CLI i wykonaj wymagane kroki logowania, autoryzacji lub lokalnej instalacji.'
      note: Interfejs Desktop prowadzi przez cały przepływ. Utrzymuj sieć dostępną przy pierwszym uruchomieniu, aby Hagicode Core mógł się pobrać; niektóre Agent CLI nadal wymagają ręcznej instalacji lub uwierzytelnienia, ale nadal są częścią bieżącego zakresu wsparcia.
      done: Po wykonaniu tych kroków możesz normalnie korzystać ze wszystkich funkcji Hagicode Desktop.
    q3:
      question: Jak sprawdzić aktualizacje?
      answer: Desktop automatycznie sprawdza aktualizacje. Gdy nowa wersja jest dostępna, pojawi się powiadomienie w prawym górnym rogu interfejsu. Możesz również ręcznie sprawdzić aktualizacje w "Ustawieniach".
    q4:
      question: Które Agent CLI AI są obsługiwane?
      intro: 'Hagicode Desktop obecnie obsługuje następujące Agent CLI:'
      active: '<strong>Obecnie obsługiwane:</strong> Claude Code, Codex, GitHub Copilot, OpenCode, Hermes, QoderCLI, Kiro, Kimi, Gemini, DeepAgents i Codebuddy'
      manual: '<strong>Ręczna instalacja lub uwierzytelnienie:</strong> Hermes, Gemini i DeepAgents wymagają najpierw lokalnej instalacji lub kroku uwierzytelnienia; pozostałe CLI oferują punkty wejścia instalacji jednym kliknięciem lub prowadzone przepływy instalacji.'
      legacy: '<strong>Tylko kompatybilność legacy:</strong> IFlowCli pozostaje tylko dla kompatybilności danych historycznych i nie jest częścią bieżącego aktywnego zakresu wsparcia.'
      closing: Zakres wsparcia i tryb konfiguracji to osobne kwestie. CLI wymagający ręcznej instalacji jest nadal obsługiwany.
    q5:
      question: Czy obsługiwane jest użycie offline?
      intro: 'Tak! Hagicode Desktop obsługuje pełne użycie offline:'
      point1: Połączenie sieciowe wymagane do początkowej instalacji i konfiguracji (pobieranie komponentów rdzenia i modeli AI)
      point2: Wszystkie funkcje mogą być używane offline po konfiguracji
      point3: Twój kod i dane nigdy nie są przesyłane do chmury
      point4: Całe przetwarzanie AI jest zakończone lokalnie
    q6:
      question: macOS mówi że Hagicode.app jest uszkodzony lub nie może zostać otwarty. Co powinienem zrobić?
      intro: Jeśli Hagicode Desktop jest zainstalowany w domyślnej ścieżce /Applications/Hagicode.app i macOS Gatekeeper blokuje pierwsze uruchomienie, użyj następującego polecenia, aby usunąć atrybut kwarantanny z aplikacji.
      cause: Dzieje się tak, ponieważ macOS dodaje atrybut com.apple.quarantine do aplikacji pobranych z internetu. Jest to problem izolacji bezpieczeństwa macOS, a nie awaria instalatora Hagicode.
      command: sudo xattr -dr com.apple.quarantine /Applications/Hagicode.app
      note: Uruchom polecenie w Terminalu z uprawnieniami administratora, a następnie uruchom ponownie Hagicode Desktop.
    q7:
      question: Jak uzyskać pomoc w przypadku problemów?
      intro: 'Jeśli napotkasz problemy podczas korzystania z Hagicode Desktop, możesz uzyskać pomoc poprzez:'
      point1: '<strong>Grupa wsparcia technicznego:</strong> Dołącz do grupy QQ 610394020'
      point2: '<strong>Dokumentacja online:</strong> Przeglądaj kompletną dokumentację użytkowania i samouczki'
      point3: '<strong>GitHub Issues:</strong> Zgłaszaj raporty o problemach w repozytorium projektu'
