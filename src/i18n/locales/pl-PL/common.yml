showcase:
  title: Najnowsze widoki produktu
  description: Od wykonania propozycji i tablic sesji po analizy tokenów, zarządzanie obszarem roboczym i postęp osiągnięć, strona główna używa teraz najnowszych wyselekcjonowanych zrzutów ekranu utrzymywanych wraz z witryną dokumentacji.
  controls:
    previous: Poprzedni
    next: Następny
    current: Wyróżniony widok
    railLabel: Nawigacja zrzutów ekranu produktu
    selectPrefix: 'Przełącz na: '
    activeState: Wyświetlane teraz
    previewState: Podgląd
    imageUnavailable: Obraz niedostępny
    openFullscreen: 'Otwórz pełny ekran: '
    openFullscreenHint: Kliknij aby powiększyć
    closeFullscreen: Zamknij pełny ekran
  screenshots:
    proposalWorkflow:
      title: Przegląd wykonania propozycji
      description: Utrzymuj etap przepływu pracy, wynik wykonania i kontekst sesji na jednym ekranie, aby zespoły mogły dokładnie zobaczyć, gdzie znajduje się zmiana przed przejściem dalej.
      alt: Zrzut ekranu wykonania propozycji HagiCode pokazujący etapy przepływu pracy, wynik wykonania i panel boczny sesji
    sessionBoard:
      title: Tablica sesji i planowanie lochów
      description: Oczekujące, trwające i zarchiwizowane sesje pozostają widoczne obok panelu zadań fantasy, aby praca równoległa agentów była łatwa do przeskanowania w jednym rzucie oka.
      alt: Zrzut ekranu tablicy sesji HagiCode pokazujący kolumny oczekujące, trwające i zarchiwizowane obok panelu zadań fantasy
    tokenAnalytics:
      title: Analizy tokenów w czasie rzeczywistym
      description: Obserwuj przepustowość, ostatnią aktywność API i całkowite użycie na jednej powierzchni metryk, aby koszty i tempo pozostały kontrolowane podczas równoległego wykonania.
      alt: Zrzut ekranu analiz tokenów HagiCode pokazujący przepustowość, ostatnią aktywność API i całkowite użycie
    workspaceManagement:
      title: Zarządzanie obszarem roboczym i skarbcem
      description: Zarządzaj skarbcami użytkowników, skarbcami systemowymi i punktami wejścia code-server z jednej powierzchni kontrolnej zbudowanej dla współdzielonych środowisk i szybkiej konserwacji.
      alt: Zrzut ekranu zarządzania obszarem roboczym HagiCode pokazujący skarbce użytkowników, skarbce systemowe i akcje code-server
    achievementProgress:
      title: Postęp osiągnięć i wzrostu
      description: Codzienny postęp, globalny wzrost i metryki cyklu życia zwijają się w jeden panel, aby długotrwała adopcja wydawała się mierzalna zamiast abstrakcyjna.
      alt: Zrzut ekranu panelu osiągnięć HagiCode pokazujący codzienny postęp, globalny wzrost i metryki cyklu życia
