features:
  showcase:
    title: "为真实开发工作而生"
    subtitle: "提案让每次改动可审阅，多 Agent 并行让工作持续推进"
  smart:
    badge: SMART
    title: 智能
    subtitle: OpenSpec 工作流，AI 编码效率提升
    efficiency: 效率提升
    traditional: 传统
    hagicode: Hagicode
    description: 从审阅上下文、脚手架提案、编写 Spec Delta，到严格校验、按任务执行与最终归档，OpenSpec 把需求推进路径固定成可复用流程。
    workflow:
      review:
        label: 审阅
        desc: 对照项目现状、现有 spec 与相关代码，先确认真实上下文。
      scaffold:
        label: 脚手架
        desc: 选择 change-id，并生成 proposal.md、tasks.md、design.md 草稿。
      spec:
        label: Spec
        desc: 把变更拆成 capability 与 spec delta，明确新增或修改的要求。
      design:
        label: 设计
        desc: 跨系统或有取舍时补充 design.md，提前写清结构与权衡。
      tasks:
        label: 任务
        desc: 将实施切成有顺序、可验证、可并行的任务列表。
      validate:
        label: 校验
        desc: 用 strict 模式运行 openspec validate，先把提案校验通过。
      apply:
        label: 执行
        desc: 读取 proposal、design、tasks，按顺序实施并持续勾选完成项。
      archive:
        label: 归档
        desc: 变更完成后归档 proposal 资产，把经验沉淀回长期规范。
    paused: 已暂停 - 点击节点切换
  convenient:
    badge: EFFICIENT
    title: 高效
    subtitle: 多 Agent 多实例并行，真正把额度跑满
    traditional: 传统单 Agent / 单实例
    multiThread: 多 Agent 并行矩阵
    boost: 吞吐提升
    boostValue: 并行 10x+
    description: Claude Code、Codex、GitHub Copilot、OpenCode、Hermes 等当前活跃支持的 Agent CLI 可以同时处理多个实例与任务，让提案、修复、评审并行推进，把额度利用率从串行等待转成持续输出。
    agentMatrix:
      title: 并行执行矩阵
      badge: 多个 Agent / 多个实例
      status: 多个 Agent 正在同时驱动多个实例
      agents:
        claude:
          name: Claude Code
          role: 提案 / 评审
          instances:
            - Spec 起草
            - 设计校对
            - 归档检查
        codex:
          name: Codex
          role: 实现 / 修复
          instances:
            - 实现 A
            - 实现 B
            - 回归修复
        router:
          name: Qwen · GLM
          role: 分析 / 补充
          instances:
            - 问题排查
            - 文案优化
            - 知识提炼
      supportedNames:
        title: 当前活跃支持的 13 个 Agent CLI
        names:
          - Claude Code
          - Codex
          - GitHub Copilot
          - OpenCode
          - Hermes
          - QoderCLI
          - Kiro
          - Kimi
          - Gemini
          - Pi
          - Reasonix
          - DeepAgents
          - Codebuddy
    supportedProvidersNote: OpenCode 现在可以把共享的 OmniRoute 目录投影到 Hero 的模型默认项里，同时继续允许分支级自定义原始模型标识。
  interesting:
    badge: INTERESTING
    title: 有趣
    subtitle: "Hero Dungeon 把日常的 Agent 工作变成看得见进度的冒险"
    features:
      dungeons:
        label: 英雄副本
        desc: 把生成、执行和 Prompt 工作台编成副本
      captains:
        label: 队长编组
        desc: 为不同副本指定最合适的 Hero 队长
      battle:
        label: 战报反馈
        desc: 用 XP、等级与执行数据回看推进结果
    description: "在同一套提案流程之上叠加一层游戏化：Hero Dungeon 把提案、批量任务和 Prompt 工作台编成副本，为每个副本指定队长，并在事后用 XP 和等级回看结果，让长时间运行的 Agent 工作更容易跟进，也更愿意持续做下去。"
    dungeonCards:
      proposal:
        title: 提案副本
        desc: OpenSpec 生成 / 执行 / 归档
        status: 队长就绪
      autotask:
        title: AutoTask 副本
        desc: 并行修复与批量自动任务
        status: 2 个实例运行中
      prompt:
        title: Prompt 副本
        desc: Prompt 预览与风格工作台
        status: 视觉预览已同步
    roster:
      title: 当前队长编组
      heroes:
        strategist:
          name: Spec Strategist
          role: 提案队长
        runner:
          name: Patch Runner
          role: 执行队长
        artist:
          name: Prompt Artist
          role: 视觉支援
    battleReport:
      title: 今日副本战报
      badge: Hero Battle
      metrics:
        dungeons:
          value: '4'
          label: 副本推进
        level:
          value: Lv.27
          label: 队长等级
        xp:
          value: 12.8M
          label: 今日 XP
      note: 多个副本并行推进时，战报会把经验、等级与执行结果聚合展示。
    gallery:
      dungeons:
        title: 副本地图轮播
        subtitle: 从当前前端副本视觉中随机选取 10 张，展示提案、副本与 Prompt 工作台的地图感画面。
      heroes:
        title: 英雄图鉴轮播
        subtitle: 从当前前端英雄图库中随机选取 10 张，展示不同队长与职业风格。
