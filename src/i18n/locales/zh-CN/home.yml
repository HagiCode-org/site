features:
  showcase:
    title: "为真实开发工作而生"
    subtitle: "提案让每次改动可审阅，多 Agent 并行让工作持续推进"
  smart:
    title: 智能
    subtitle: "先提案、再执行：每次改动都有据可查"
    artifactsTitle: "每次改动留下的东西"
    description: "HagiCode 不只是对着代码聊天：先审阅项目的真实现状，写下提案与 Spec 变更，严格校验后再按任务执行，最后归档，把这次的经验留给下一次改动。"
    workflow:
      review:
        label: 审阅
        desc: 对照项目现状、现有 spec 与相关代码，先确认真实上下文。
      scaffold:
        label: 脚手架
        desc: 选择 change-id，并生成 proposal.md、tasks.md、design.md 草稿。
      spec:
        label: Spec
        desc: 把变更拆成 capability 与 spec delta，明确新增或修改的要求。
      design:
        label: 设计
        desc: 跨系统或有取舍时补充 design.md，提前写清结构与权衡。
      tasks:
        label: 任务
        desc: 将实施切成有顺序、可验证、可并行的任务列表。
      validate:
        label: 校验
        desc: 用 strict 模式运行 openspec validate，先把提案校验通过。
      apply:
        label: 执行
        desc: 读取 proposal、design、tasks，按顺序实施并持续勾选完成项。
      archive:
        label: 归档
        desc: 变更完成后归档 proposal 资产，把经验沉淀回长期规范。
    paused: 已暂停 - 点击节点切换
  convenient:
    title: 高效
    subtitle: "多 Agent、多实例并行，让额度不再空等"
    traditional: "一个接一个排队"
    multiThread: "并排推进，互不等待"
    description: "Claude Code、Codex、GitHub Copilot、OpenCode、Hermes 等受支持的 Agent CLI 都能同时运行多个实例。提案、修复、评审各占一条车道，某个结果慢了，也不会拖住其余工作。"
    agentMatrix:
      title: 并行执行矩阵
      badge: "示例编排"
      status: "示意：每条车道都在推进，互不阻塞"
      agents:
        claude:
          name: Claude Code
          role: 提案 / 评审
          instances:
            - Spec 起草
            - 设计校对
            - 归档检查
        codex:
          name: Codex
          role: 实现 / 修复
          instances:
            - 实现 A
            - 实现 B
            - 回归修复
        router:
          name: Qwen · GLM
          role: 分析 / 补充
          instances:
            - 问题排查
            - 文案优化
            - 知识提炼
    cliBay:
      title: "可装备的 Agent CLI"
      hint: "点选一个，看它如何接入"
      chain:
        agent: "Agent"
        model: "兼容模型"
      labels:
        whatItIs: "它是什么"
        models: "模型与登录"
        runsOn: "运行位置"
        start: "上手方式"
        questions: "在 HagiCode 里提问"
        strengths: "擅长"
        compare: "阅读完整对比"
  interesting:
    title: 有趣
    subtitle: "每个 Agent 都有脸、有性格，还有一个属于它的世界"
    description: "给每个 Agent 配上头像、Trait 与 Soul，再选一套团队习惯的说法：同一支阵容，可以是英雄与副本，也可以是牧场、朝堂或蜂巢；等级与奖杯会随工作实时回馈。"
