      title: 提案执行总览
      description: 把 OpenSpec 提案从工作流阶段、执行结果到会话侧栏放在同一屏里，方便快速理解当前变更已经推进到哪里。
      alt: HagiCode 提案执行完成界面截图，展示工作流阶段、执行结果与会话侧栏
    sessionBoard:
      title: 会话看板与场景编排
      description: 待处理、进行中与已归档会话并排呈现，配合右侧场景任务卡，让多 Agent 推进状态一眼可见。
      alt: HagiCode 会话看板界面截图，展示待处理、进行中、已归档列与场景任务卡
    tokenAnalytics:
      title: 实时 Token 分析
      description: 在同一块面板里追踪吞吐速率、调用历史和累计用量，便于控制并行执行时的成本与节奏。
      alt: HagiCode Token 分析面板截图，展示吞吐速率、调用历史与累计用量
    workspaceManagement:
      title: 工作区与 Vault 管理
      description: 集中管理用户 Vault、系统 Vault 与 code-server 入口，让多人环境下的工作区维护更清楚。
      alt: HagiCode Vault 工作区管理界面截图，展示用户 Vault、系统 Vault 与 code-server 操作
    achievementProgress:
      title: 成就与成长进度
      description: 把每日与全局成长、生命周期指标和在线趋势合在一个仪表板里，让长期使用反馈更具持续性。
      alt: HagiCode 成就进度仪表板截图，展示每日与全局成长指标和趋势
