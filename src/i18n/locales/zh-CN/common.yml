showcase:
  title: "看看 HagiCode 如何工作"
  description: "十个产品区域，全部采用英文暗色界面，覆盖五套暗色主题：会话看板、提案、Agent、技能、Vault、用量、成就、Git 与定时计划。"
  controls:
    previous: 上一张
    next: 下一张
    current: 当前主图
    railLabel: 产品截图导航
    selectPrefix: 切换到：
    activeState: 当前展示
    previewState: 点击预览
    imageUnavailable: 图片暂不可用
    openFullscreen: 全屏查看：
    openFullscreenHint: 点击查看大图
    zoomIn: "查看原始大小"
    zoomOut: "适应屏幕"
    closeFullscreen: 关闭全屏
  screenshots:
    sessionBoard:
      title: "会话看板"
      description: "提案、运行中的 Agent 与已归档的工作放在同一块看板里，等待、执行、完成一目了然。"
      alt: "HagiCode 会话看板，包含提案与评审、执行、已归档三列，右侧是项目快捷操作面板"
    proposalWorkflow:
      title: "提案工作流"
      description: "每个变更都从提案开始：规格增量、有序任务和阶段进度，在代码运行之前先由你审阅。"
      alt: "HagiCode 提案对话，展示规格增量表格、任务清单和提案阶段进度"
    agentRoster:
      title: "Agent 阵容"
      description: "给每个 Agent 一个头像和一份职责，按背后的 Agent CLI 分组，再决定谁来接下一个任务。"
      alt: "HagiCode Agents 工作区，十二个 Agent 按 Claude Code、Codex、OpenCode、Gemini、Hermes 分组"
    agentCli:
      title: "Agent CLI 管理"
      description: "Claude Code、Codex、GitHub Copilot、OpenCode 等并排列出，附带版本号与健康检查结果。"
      alt: "HagiCode AgentCLI 管理表格，列出各个受支持的 Agent CLI 及其版本和健康状态"
    skillsGallery:
      title: "技能图库"
      description: "浏览可信的技能来源，对比安装量，并一眼看出哪些技能已经装在本机。"
      alt: "HagiCode 技能图库，列出技能的来源、安装量以及“已在本地安装”标记"
    vault:
      title: "Vault"
      description: "把团队手册、契约和参考资料放进 Vault，直接在应用内浏览文件并预览内容。"
      alt: "HagiCode Vault 浏览器，包含 Vault 列表、文件树和一份评审规范的 Markdown 预览"
    tokenUsage:
      title: "Token 用量"
      description: "今日 Token 与费用常驻状态栏，等级阶梯标示这一天用得有多满。"
      alt: "HagiCode 状态栏显示今日 Token 总量与费用，弹层列出从 Breath 到 Radiance 的用量等级"
    achievements:
      title: "成就大厅"
      description: "每日目标、在线成长和终身成就，把稳定的推进变成看得见的进度。"
      alt: "HagiCode 成就大厅，展示每日完成率、今日收益和在线成长栏"
    gitManagement:
      title: "Git 管理"
      description: "在一个面板里查看项目各仓库的分支、同步状态和未提交改动，并完成提交、推送或拉取。"
      alt: "HagiCode 项目 Git 标签页，列出四个仓库的分支与同步状态以及仓库简报"
    scheduledPlans:
      title: "定时计划"
      description: "用日历安排提案与 HagiTask：夜间审计、每周草稿、一次性的发布准备。"
      alt: "HagiCode 定时计划十月日历，包含每晚、每周和一次性计划"
