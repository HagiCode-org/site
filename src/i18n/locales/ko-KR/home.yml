features:
  showcase:
    title: 세 가지 핵심 기능
    subtitle: AI 코딩 경험을 다시 정의하세요
  smart:
    badge: 스마트
    title: 스마트
    subtitle: OpenSpec 워크플로로 AI 코딩 효율 향상
    efficiency: 효율 향상
    traditional: 기존 방식
    hagicode: Hagicode
    description: 아이디어에서 아카이브까지 이어지는 9단계 제안 워크플로를 AI가 전 과정에서 보조합니다. 코딩 효율을 3배까지 끌어올립니다.
    workflow:
      review:
        label: 검토
        desc: 자동 검토
      scaffold:
        label: Scaffold
        desc: Choose a change-id and create proposal.md, tasks.md, and design.md when needed.
      spec:
        label: Spec
        desc: Translate the change into capability-level spec deltas with explicit requirements.
      design:
        label: Design
        desc: Capture architecture and trade-offs in design.md when the change spans systems.
      tasks:
        label: 작업
        desc: 작업 분해
      validate:
        label: Validate
        desc: Run openspec validate in strict mode and clear every issue before execution.
      apply:
        label: Apply
        desc: Read proposal, design, and tasks, then implement in order while checking items off.
      archive:
        label: 아카이브
        desc: 지식 보관
    paused: 일시정지됨 - 노드를 클릭해 전환
  convenient:
    badge: 고효율
    title: 고효율
    subtitle: 멀티 Agent, 멀티 인스턴스 실행으로 사용 한도를 계속 움직이게 합니다
    traditional: 기존 단일 Agent / 단일 인스턴스
    multiThread: 멀티 Agent 병렬 매트릭스
    boost: 처리량 향상
    boostValue: 10배+ 병렬
    description: Claude Code, Codex, GitHub Copilot, OpenCode, Hermes 같은 현재 지원 Agent CLI는 여러 인스턴스를 동시에 돌릴 수 있어 제안, 수정, 리뷰가 직렬 대기 대신 병렬로 진행됩니다.
    agentMatrix:
      title: 병렬 실행 매트릭스
      badge: 여러 Agent / 여러 인스턴스
      status: 여러 Agent가 지금 여러 인스턴스를 동시에 구동 중입니다
      agents:
        claude:
          name: Claude Code
          role: 제안 / 리뷰
          instances:
            - 스펙 초안 작성
            - 설계 점검
            - 아카이브 검토
        codex:
          name: Codex
          role: 구현 / 수정
          instances:
            - 기능 A 구현
            - 기능 B 구현
            - 회귀 수정
        router:
          name: Qwen · GLM
          role: 분석 / 지원
          instances:
            - 이슈 추적
            - 문구 다듬기
            - 인사이트 정리
      supportedNames:
        title: 현재 활발히 지원하는 13개 Agent CLI
        names:
          - Claude Code
          - Codex
          - GitHub Copilot
          - OpenCode
          - Hermes
          - QoderCLI
          - Kiro
          - Kimi
          - Gemini
          - Pi
          - Reasonix
          - DeepAgents
          - Codebuddy
    supportedProvidersNote: OpenCode는 공유 OmniRoute 카탈로그를 hero 모델 기본값으로 불러오면서도, 브랜치별 워크플로에 맞춰 원시 모델 식별자를 계속 수정할 수 있습니다.
  interesting:
    badge: 재미
    title: 재미
    subtitle: Hero Dungeon은 캠퍼스 협업과 실습을 더 생동감 있게 만듭니다
    features:
      dungeons:
        label: Hero Dungeons
        desc: 생성, 실행, 프롬프트 작업대를 하나의 던전 진행처럼 바꿉니다
      captains:
        label: 캡틴 로스터
        desc: 각 던전에 가장 어울리는 hero 캡틴을 배치합니다
      battle:
        label: 전투 리포트
        desc: 각 푸시 이후 XP, 레벨, 실행 결과를 확인합니다
    description: 재미는 더 이상 업적 배지에만 의존하지 않습니다. Hero Dungeon, 캡틴 로스터, 프롬프트 비주얼, 전투 리포트가 일상의 AI 코딩 연습을 캠퍼스 연구실과 학생 팀을 위한 협동형 모험으로 바꿉니다.
    dungeonCards:
      proposal:
        title: 제안 던전
        desc: OpenSpec generate / apply / archive
        status: 캡틴 준비 완료
      autotask:
        title: AutoTask 던전
        desc: 병렬 수정과 배치 자동화
        status: 인스턴스 2개 활성
      prompt:
        title: 프롬프트 던전
        desc: 프롬프트 미리보기와 스타일 작업대
        status: 비주얼 동기화 준비 완료
    roster:
      title: 현재 캡틴 로스터
      heroes:
        strategist:
          name: Spec Strategist
          role: 제안 캡틴
        runner:
          name: Patch Runner
          role: 실행 캡틴
        artist:
          name: Prompt Artist
          role: 비주얼 지원
    battleReport:
      title: 오늘의 던전 리포트
      badge: Hero Battle
      metrics:
        dungeons:
          value: '4'
          label: 진행된 던전
        level:
          value: Lv.27
          label: 캡틴 레벨
        xp:
          value: 12.8M
          label: 오늘의 XP
      note: 여러 던전이 병렬로 진행될 때 이 리포트가 경험치, 레벨, 실행 결과를 하나로 묶어 보여줍니다.
    gallery:
      dungeons:
        title: 던전 맵 캐러셀
        subtitle: 현재 프런트엔드 던전 및 프롬프트 맵 컬렉션에서 무작위 비주얼 10개를 보여줍니다.
      heroes:
        title: 히어로 갤러리 캐러셀
        subtitle: 현재 프런트엔드 히어로 컬렉션에서 무작위 비주얼 10개를 보여줍니다.
