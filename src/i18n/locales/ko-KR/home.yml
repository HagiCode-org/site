features:
  showcase:
    title: "실제 개발 작업을 위해"
    subtitle: "제안이 모든 변경을 검토 가능하게 하고, 병렬 에이전트가 작업을 계속 진행시킵니다"
  smart:
    title: 스마트
    subtitle: "먼저 제안하고 그다음 실행합니다. 모든 변경에 근거가 남습니다"
    artifactsTitle: "변경마다 남는 것"
    description: "HagiCode는 코드와 대화만 하지 않습니다. 프로젝트의 실제 상태를 검토하고, 제안과 Spec 변경안을 작성하고, 엄격하게 검증한 뒤 작업을 순서대로 실행하고, 마지막으로 아카이브해 다음 변경에 경험을 넘깁니다."
    workflow:
      review:
        label: "검토"
        desc: "무엇이든 쓰기 전에 프로젝트 현황, 기존 spec, 관련 코드를 먼저 확인합니다."
      scaffold:
        label: "스캐폴드"
        desc: "change-id를 정하고 proposal.md, tasks.md, 필요하면 design.md를 만듭니다."
      spec:
        label: "Spec"
        desc: "변경을 capability 단위의 spec 델타로 옮겨 요구사항을 분명히 합니다."
      design:
        label: "설계"
        desc: "여러 시스템에 걸친 변경은 구조와 트레이드오프를 design.md에 남깁니다."
      tasks:
        label: "작업"
        desc: "작업을 순서와 병렬 가능 여부가 드러나는 작고 검증 가능한 항목으로 나눕니다."
      validate:
        label: "검증"
        desc: "openspec validate를 strict 모드로 실행해 실행 전에 모든 문제를 해결합니다."
      apply:
        label: "실행"
        desc: "proposal, design, tasks를 읽고 순서대로 구현하며 완료 항목을 체크합니다."
      archive:
        label: "아카이브"
        desc: "완료된 변경을 아카이브하고 결과를 장기 spec 이력에 되돌려 줍니다."
    paused: 일시정지됨 - 노드를 클릭해 전환
  convenient:
    title: 고효율
    subtitle: "여러 Agent와 인스턴스를 병렬로 돌려 할당량이 놀지 않게 합니다"
    traditional: "하나씩 줄 서서 대기"
    multiThread: "나란히 진행, 서로 기다리지 않음"
    description: "Claude Code, Codex, GitHub Copilot, OpenCode, Hermes 등 지원되는 Agent CLI는 각각 여러 인스턴스를 동시에 실행할 수 있습니다. 제안, 수정, 리뷰가 각자의 레인을 달리므로 느린 결과 하나가 전체를 멈추지 않습니다."
    agentMatrix:
      title: 병렬 실행 매트릭스
      badge: "구성 예시"
      status: "예시: 모든 레인이 멈추지 않고 진행되며 서로 막지 않음"
      agents:
        claude:
          name: Claude Code
          role: 제안 / 리뷰
          instances:
            - 스펙 초안 작성
            - 설계 점검
            - 아카이브 검토
        codex:
          name: Codex
          role: 구현 / 수정
          instances:
            - 기능 A 구현
            - 기능 B 구현
            - 회귀 수정
        router:
          name: Qwen · GLM
          role: 분석 / 지원
          instances:
            - 이슈 추적
            - 문구 다듬기
            - 인사이트 정리
    cliBay:
      title: "장착할 수 있는 Agent CLI"
      hint: "하나를 골라 연결 방식을 확인하세요"
      chain:
